<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoYTFX - 5A AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050816;
    --panel:rgba(15,23,42,.82);
    --panel2:rgba(30,41,59,.75);
    --border:rgba(255,255,255,.09);
    --text:#f8fafc;
    --muted:#94a3b8;
    --primary:#6366f1;
    --secondary:#3b82f6;
    --cyan:#06b6d4;
    --green:#22c55e;
    --red:#ef4444;
    --radius:20px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(99,102,241,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 15%,
            rgba(6,182,212,.12),
            transparent 28%
        ),
        var(--bg);

    color:var(--text);
    font-family:'Tajawal',sans-serif;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   BACKGROUND
========================= */

#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:-1;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    position:sticky;
    top:0;
    z-index:100;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5%;

    background:rgba(5,8,22,.75);
    border-bottom:1px solid var(--border);

    backdrop-filter:blur(20px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;

    color:white;
    text-decoration:none;

    font-size:1.15rem;
    font-weight:800;
}

.logo{
    width:42px;
    height:42px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary),
            var(--cyan)
        );

    box-shadow:
        0 0 25px rgba(99,102,241,.4);

    font-size:1.2rem;
}

.nav-right{
    display:flex;
    gap:8px;
}

/* =========================
   BUTTONS
========================= */

.btn{
    border:1px solid var(--border);

    color:white;

    background:rgba(255,255,255,.04);

    border-radius:12px;

    padding:10px 14px;

    transition:.2s;
}

.btn:hover{
    border-color:var(--primary);
    transform:translateY(-1px);
}

.btn.primary{
    border:0;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    font-weight:800;

    box-shadow:
        0 8px 25px rgba(99,102,241,.25);
}

.btn.primary:hover{
    box-shadow:
        0 12px 35px rgba(99,102,241,.4);
}

.btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

/* =========================
   MAIN
========================= */

.container{
    width:min(1100px,94%);
    margin:auto;

    padding:28px 0 50px;
}

/* =========================
   WELCOME
========================= */

.welcome{
    text-align:center;
    padding:45px 20px 30px;
}

.welcome h1{
    font-size:clamp(2rem,5vw,3.5rem);

    background:
        linear-gradient(
            90deg,
            #fff,
            #a78bfa,
            #67e8f9
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    margin-bottom:12px;
}

.welcome p{
    color:var(--muted);
    font-size:1rem;
}

/* =========================
   CHAT CARD
========================= */

.chat{
    height:calc(100vh - 150px);
    min-height:600px;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:var(--radius);

    backdrop-filter:blur(20px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.35);
}

/* =========================
   CHAT HEADER
========================= */

.chat-header{
    min-height:72px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    padding:13px 18px;

    border-bottom:1px solid var(--border);
}

.ai-info{
    display:flex;
    align-items:center;
    gap:11px;
}

.ai-icon{
    width:42px;
    height:42px;

    display:grid;
    place-items:center;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--cyan)
        );

    font-size:1.2rem;
}

.ai-name{
    font-weight:800;
}

.ai-status{
    display:flex;
    align-items:center;
    gap:6px;

    color:var(--green);

    font-size:.76rem;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 10px var(--green);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.model-select{
    background:#020617;

    color:white;

    border:1px solid var(--border);

    border-radius:10px;

    padding:8px 10px;

    outline:none;

    max-width:210px;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;

    overflow-y:auto;

    padding:22px;

    display:flex;
    flex-direction:column;

    gap:18px;
}

.messages::-webkit-scrollbar{
    width:7px;
}

.messages::-webkit-scrollbar-thumb{
    background:rgba(99,102,241,.35);
    border-radius:20px;
}

.message-row{
    display:flex;
    flex-direction:column;

    max-width:90%;
}

.message-row.user{
    align-self:flex-end;
    align-items:flex-end;
}

.message-row.ai{
    align-self:flex-start;
    align-items:flex-start;
}

.message{
    padding:14px 17px;

    border-radius:18px;

    line-height:1.8;

    word-break:break-word;

    font-size:.96rem;
}

.message.user{
    background:
        linear-gradient(
            135deg,
            #6366f1,
            #2563eb
        );

    border-bottom-left-radius:5px;
}

.message.ai{
    background:var(--panel2);

    border:1px solid var(--border);

    border-bottom-right-radius:5px;
}

.message pre{
    direction:ltr;
    text-align:left;

    background:#020617;

    border:1px solid var(--border);

    border-radius:12px;

    padding:14px;

    margin:12px 0;

    overflow:auto;
}

.message code{
    font-family:'Fira Code',monospace;
    font-size:.85rem;
}

.message p{
    margin-bottom:8px;
}

.message p:last-child{
    margin-bottom:0;
}

.message ul,
.message ol{
    padding-right:22px;
    margin:8px 0;
}

.message-tools{
    display:flex;
    gap:12px;

    margin-top:5px;
    padding:0 5px;
}

.tool{
    border:0;
    background:none;

    color:var(--muted);

    font-size:.75rem;
}

.tool:hover{
    color:white;
}

/* =========================
   TYPING
========================= */

.typing{
    display:flex;
    gap:5px;
    align-items:center;

    height:22px;
}

.typing span{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#a78bfa;

    animation:typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-4px);
    }

}

/* =========================
   QUICK ACTIONS
========================= */

.quick-actions{
    display:flex;
    gap:7px;

    overflow-x:auto;

    padding-bottom:8px;
}

.quick{
    white-space:nowrap;

    border:1px solid var(--border);

    background:rgba(255,255,255,.04);

    color:var(--muted);

    border-radius:10px;

    padding:7px 10px;

    font-size:.75rem;
}

.quick:hover{
    border-color:var(--primary);
    color:white;
}

/* =========================
   COMPOSER
========================= */

.composer{
    padding:13px;

    background:rgba(2,6,23,.65);

    border-top:1px solid var(--border);
}

.composer-row{
    display:flex;
    gap:8px;
}

.input{
    width:100%;

    background:#020617;

    color:white;

    border:1px solid var(--border);

    border-radius:13px;

    padding:13px 15px;

    outline:none;

    transition:.2s;
}

.input:focus{
    border-color:var(--primary);

    box-shadow:
        0 0 0 3px rgba(99,102,241,.1);
}

.chat-input{
    flex:1;
}

.icon-btn{
    min-width:48px;

    border:1px solid var(--border);

    border-radius:13px;

    background:rgba(255,255,255,.04);

    color:white;

    font-size:1.1rem;
}

.icon-btn:hover{
    border-color:var(--primary);
}

.icon-btn.recording{
    background:var(--red);
    border-color:var(--red);

    animation:pulse 1s infinite;
}

@keyframes pulse{

    50%{
        box-shadow:
            0 0 0 8px rgba(239,68,68,.1);
    }

}

.stop{
    display:none;

    background:rgba(239,68,68,.13);

    color:#fca5a5;

    border:1px solid rgba(239,68,68,.4);

    border-radius:12px;

    padding:0 14px;
}

.stop.show{
    display:block;
}

/* =========================
   SESSIONS
========================= */

.sessions-bar{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:15px;
}

.sessions{
    display:flex;

    gap:7px;

    overflow-x:auto;
}

.session{
    border:1px solid var(--border);

    background:var(--panel);

    color:var(--muted);

    border-radius:10px;

    padding:7px 11px;

    white-space:nowrap;
}

.session.active{
    color:white;

    border-color:var(--primary);

    background:
        rgba(99,102,241,.15);
}

/* =========================
   LIGHT MODE
========================= */

body.light{
    --bg:#eef2ff;
    --panel:rgba(255,255,255,.85);
    --panel2:rgba(241,245,249,.95);
    --border:rgba(15,23,42,.1);
    --text:#0f172a;
    --muted:#64748b;
}

body.light .navbar{
    background:rgba(255,255,255,.8);
}

body.light .input,
body.light .model-select{
    background:white;
    color:#0f172a;
}

body.light .message.ai{
    color:#0f172a;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .navbar{
        padding:0 3%;
    }

    .brand span{
        font-size:.9rem;
    }

    .welcome{
        padding:25px 10px;
    }

    .chat{
        height:calc(100vh - 115px);
        min-height:550px;
        border-radius:15px;
    }

    .chat-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .header-actions{
        width:100%;
    }

    .model-select{
        flex:1;
        max-width:none;
    }

    .message-row{
        max-width:95%;
    }

    .composer-row{
        flex-wrap:wrap;
    }

    .chat-input{
        flex-basis:100%;
        order:-1;
    }

    .stop{
        flex:1;
    }

    .send{
        flex:2;
    }

}

</style>
</head>

<body>

<script type="module">

/* =========================================================
   WEBLLM
========================================================= */

import {
    CreateMLCEngine
} from "https://esm.run/@mlc-ai/web-llm";


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   ELEMENTS
========================================================= */

const messagesEl =
    $("messages");

const input =
    $("chatInput");

const sendButton =
    $("sendButton");

const stopButton =
    $("stopButton");

const micButton =
    $("micButton");

const statusText =
    $("statusText");

const statusDot =
    $("statusDot");

const modelSelect =
    $("modelSelect");

const sessionsEl =
    $("sessions");


/* =========================================================
   STATE
========================================================= */

let engine = null;

let generating = false;

let controller = null;

let recognition = null;

let recording = false;

let currentSession = 0;

let sessions =
    JSON.parse(
        localStorage.getItem(
            "vytfx_sessions"
        ) || "[[]]"
    );


/* =========================================================
   SETTINGS
========================================================= */

const savedModel =
    localStorage.getItem(
        "vytfx_model"
    );

if(savedModel){

    const exists =
        [...modelSelect.options]
        .some(
            option =>
                option.value === savedModel
        );

    if(exists){

        modelSelect.value =
            savedModel;

    }

}


/* =========================================================
   SAFE MARKDOWN
========================================================= */

function escapeHTML(text){

    return text
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");

}

function renderText(text){

    let html =
        escapeHTML(text);

    /*
       Code blocks
    */

    html =
        html.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );

    /*
       Inline code
    */

    html =
        html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );

    /*
       Bold
    */

    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    /*
       Italic
    */

    html =
        html.replace(
            /\*(.*?)\*/g,
            "<em>$1</em>"
        );

    /*
       Line breaks
    */

    html =
        html.replace(
            /\n/g,
            "<br>"
        );

    return html;

}


/* =========================================================
   SAVE
========================================================= */

function saveSessions(){

    localStorage.setItem(
        "vytfx_sessions",
        JSON.stringify(sessions)
    );

}


/* =========================================================
   SESSIONS UI
========================================================= */

function renderSessions(){

    sessionsEl.innerHTML = "";

    sessions.forEach(
        (_,index)=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "session " +
                (
                    index === currentSession
                    ? "active"
                    : ""
                );

            button.textContent =
                `محادثة ${index + 1}`;

            button.onclick = ()=>{

                currentSession =
                    index;

                renderSessions();

                renderChat();

            };

            sessionsEl.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   NEW CHAT
========================================================= */

$("newChat").onclick = ()=>{

    sessions.push([]);

    currentSession =
        sessions.length - 1;

    saveSessions();

    renderSessions();

    renderChat();

};


/* =========================================================
   CLEAR
========================================================= */

$("clearChats").onclick = ()=>{

    if(
        !confirm(
            "حذف جميع المحادثات؟"
        )
    ){
        return;
    }

    sessions = [[]];

    currentSession = 0;

    saveSessions();

    renderSessions();

    renderChat();

};


/* =========================================================
   EXPORT
========================================================= */

$("exportChat").onclick = ()=>{

    const chat =
        sessions[currentSession];

    let text =
        "VideoYTFX - 5A AI\n\n";

    chat.forEach(
        item=>{

            text +=
                (
                    item.role === "user"
                    ? "المستخدم"
                    : "AI"
                ) +
                ":\n";

            text +=
                item.content +
                "\n\n";

        }
    );

    const blob =
        new Blob(
            [text],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `VideoYTFX-chat-${currentSession+1}.txt`;

    a.click();

    URL.revokeObjectURL(url);

};


/* =========================================================
   RENDER CHAT
========================================================= */

function renderChat(){

    messagesEl.innerHTML = "";

    const chat =
        sessions[currentSession];

    if(!chat.length){

        addAIMessage(
            "مرحباً! أنا مساعدك في VideoYTFX. اكتب لي ما تحتاجه وسأساعدك خطوة بخطوة."
        );

        return;

    }

    chat.forEach(
        message=>{

            if(
                message.role === "user"
            ){

                addUserMessage(
                    message.content,
                    false
                );

            }else{

                addAIMessage(
                    message.content,
                    false
                );

            }

        }
    );

    scrollBottom();

}


/* =========================================================
   USER MESSAGE
========================================================= */

function addUserMessage(
    text,
    save = true
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row user";

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message user";

    bubble.textContent =
        text;

    row.appendChild(
        bubble
    );

    messagesEl.appendChild(
        row
    );

    if(save){

        sessions[currentSession]
            .push({

                role:"user",

                content:text

            });

        saveSessions();

    }

    scrollBottom();

}


/* =========================================================
   AI MESSAGE
========================================================= */

function addAIMessage(
    text,
    save = true
){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row ai";

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message ai";

    bubble.innerHTML =
        renderText(text);

    row.appendChild(
        bubble
    );

    const tools =
        document.createElement(
            "div"
        );

    tools.className =
        "message-tools";

    const copy =
        document.createElement(
            "button"
        );

    copy.className =
        "tool";

    copy.textContent =
        "📋 نسخ";

    copy.onclick = async()=>{

        try{

            await navigator
                .clipboard
                .writeText(text);

            copy.textContent =
                "✅ تم";

            setTimeout(
                ()=>{
                    copy.textContent =
                        "📋 نسخ";
                },
                1200
            );

        }catch{}

    };


    const speak =
        document.createElement(
            "button"
        );

    speak.className =
        "tool";

    speak.textContent =
        "🔊 استماع";

    speak.onclick = ()=>{

        speakText(text);

    };


    tools.appendChild(copy);

    tools.appendChild(speak);

    row.appendChild(
        tools
    );

    messagesEl.appendChild(
        row
    );

    if(save){

        sessions[currentSession]
            .push({

                role:"assistant",

                content:text

            });

        saveSessions();

    }

    scrollBottom();

}

function createAIPlaceholder(){

/* =========================================================
   SYSTEM PROMPT
========================================================= */

أنت VideoYTFX AI، مساعد شخصي ذكي وطبيعي.

تحدث مع المستخدم بطريقة بشرية طبيعية وهادئة.

قواعد مهمة:

3. لا تستخدم مقدمات طويلة ومصطنعة.
4. لا تقل "بصفتي ذكاء اصطناعي" إلا إذا كان ذلك ضرورياً.
5. لا تخترع معلومات عندما لا تعرف.
6. إذا كان المستخدم مخطئاً، صحح له الخطأ باحترام ووضوح.
7. إذا طلب المستخدم كوداً، أعطه كوداً كاملاً وقابلاً للاستخدام.
8. اشرح الأشياء المعقدة بطريقة بسيطة.
9. استخدم لغة المستخدم نفسها.
10. اجعل إجابات المحادثة اليومية طبيعية وقصيرة.
11. لا تجعل كل إجابة على شكل قائمة.
12. لا تقل "يسعدني مساعدتك" أو عبارات آلية بشكل متكرر.
13. لا تكرر نفس الجملة.
14. إذا كانت الإجابة تحتاج خطوات، رتبها بوضوح.
15. إذا لم تكن متأكداً من معلومة، قل ذلك بدلاً من اختلاقها.

أسلوبك:

- ذكي
- مباشر
- ودود
- غير متكلف
- يفهم السياق السابق للمحادثة

أنت مساعد داخل المتصفح وتعمل محلياً.
لا تدّعي أنك استخدمت الإنترنت أو نفذت شيئاً خارج المتصفح ما لم يحدث ذلك فعلاً.
`;
}


/* =========================================================
   INITIALIZE AI
========================================================= */

async function initAI(){

    const model =
        modelSelect.value;

    try{

        if(
            !("gpu" in navigator)
        ){

            throw new Error(
                "WebGPU غير مدعوم"
            );

        }

        statusText.textContent =
            "تحميل النموذج...";

        statusDot.style.background =
            "#f59e0b";

        modelSelect.disabled = true;

        sendButton.disabled = true;

        /*
           CreateMLCEngine
           حسب WebLLM الرسمي
        */

        engine =
            await CreateMLCEngine(
                model,
                {

                    initProgressCallback:
                        progress=>{

                            if(
                                progress &&
                                progress.text
                            ){

                                statusText.textContent =
                                    progress.text;
                            }

                        }

                }
            );

        localStorage.setItem(
            "vytfx_model",
            model
        );

        statusText.textContent =
            "جاهز";

        statusDot.style.background =
            "#22c55e";

        sendButton.disabled = false;

    }catch(error){

        console.error(
            "WebLLM Error:",
            error
        );

        engine = null;

        statusDot.style.background =
            "#ef4444";

        if(
            !("gpu" in navigator)
        ){

            statusText.textContent =
                "WebGPU غير متاح";

        }else{

            statusText.textContent =
                "فشل تحميل النموذج";

        }

    }finally{

        modelSelect.disabled =
            false;

    }

}


/* =========================================================
   MODEL CHANGE
========================================================= */

modelSelect.addEventListener(
    "change",
    async()=>{

        if(generating)
            return;

        if(engine){

            try{

                await engine.unload();

            }catch{}

        }

        engine = null;

        localStorage.setItem(
            "vytfx_model",
            modelSelect.value
        );

        await initAI();

    }
);


/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

    if(generating)
        return;

    const text =
        input.value.trim();

    if(!text)
        return;

    /*
       لا يوجد AI؟
       لا نخترع إجابة.
    */

    if(!engine){

        await initAI();

        if(!engine){

            addAIMessage(
                "المحرك المحلي لم يبدأ. تأكد أن المتصفح يدعم WebGPU ثم أعد تحميل الصفحة."
            );

            return;

        }

    }

    addUserMessage(
        text,
        true
    );

    input.value = "";

    generating = true;

    sendButton.disabled =
        true;

    stopButton.classList.add(
        "show"
    );

    statusText.textContent =
        "يفكر...";

    controller =
        new AbortController();

    const placeholder =
        createAIPlaceholder();

    try{

        /*
           نأخذ المحادثة كاملة
           حتى يفهم السياق.
        */

        const history =
            sessions[currentSession]
            .map(
                message=>({

                    role:
                        message.role,

                    content:
                        message.content

                })
            );

        const aiMessages = [

            {
                role:"system",

                content:
                    buildSystemPrompt()
            },

            ...history

        ];


        const stream =
            await engine.chat.completions.create({

                messages:
                    aiMessages,

                temperature:
                    0.72,

                top_p:
                    0.9,

                repetition_penalty:
                    1.05,

                frequency_penalty:
                    0.05,

                presence_penalty:
                    0,

                max_tokens:
                    1200,

                stream:true

            });


        let answer = "";

        placeholder.bubble.innerHTML = "";


        for await(
            const chunk of stream
        ){

            if(
                controller.signal.aborted
            ){

                break;

            }

            const piece =
                chunk
                    .choices?.[0]
                    ?.delta
                    ?.content || "";

            if(!piece)
                continue;

            answer += piece;

            placeholder.bubble.innerHTML =
                renderText(answer);

            scrollBottom();

        }


        if(!answer.trim()){

            answer =
                "لم أستطع إنشاء رد هذه المرة.";

            placeholder.bubble.innerHTML =
                renderText(answer);

        }


        /*
           حفظ الرد
        */

        sessions[currentSession]
            .push({

                role:"assistant",

                content:answer

            });

        saveSessions();


        addToolsToExistingMessage(
            placeholder.row,
            answer
        );


    }catch(error){

        console.error(
            "Generation error:",
            error
        );

        /*
           لا يوجد fallback مزيف.
        */

        const errorText =
            "حدث خطأ أثناء تشغيل النموذج. جرّب إيقاف التوليد ثم إرسال الرسالة مرة أخرى.";

        placeholder.bubble.innerHTML =
            renderText(errorText);

    }finally{

        generating = false;

        controller = null;

        sendButton.disabled =
            false;

        stopButton.classList.remove(
            "show"
        );

        statusText.textContent =
            "جاهز";

        statusDot.style.background =
            "#22c55e";

        input.focus();

    }

}


/* =========================================================

========================================================= */

    row,
    text
){

    const old =
        row.querySelector(
            ".message-tools"
        );

    if(old)
        old.remove();

    const tools =
        document.createElement(
            "div"
        );

    tools.className =
        "message-tools";


    const copy =
        document.createElement(
            "button"
        );

    copy.className =
        "tool";

    copy.textContent =
        "📋 نسخ";

    copy.onclick = async()=>{

        try{

            await navigator
                .clipboard
                .writeText(text);

            copy.textContent =
                "✅ تم";

            setTimeout(
                ()=>{
                    copy.textContent =
                        "📋 نسخ";
                },
                1200
            );

        }catch{}

    };


    const speak =
        document.createElement(
            "button"
        );

    speak.className =
        "tool";

    speak.textContent =
        "🔊 استماع";

    speak.onclick = ()=>{

    };


    tools.appendChild(copy);

    tools.appendChild(speak);

}

/* =========================================================
   VOICE INPUT
========================================================= */

micButton.onclick = ()=>{

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
            "التعرف على الصوت غير متاح في هذا المتصفح."
        );

        return;

    }


    if(recording){

        recognition.stop();

        return;

    }


    recognition =
        new SpeechRecognition();

    recognition.lang =
        "ar-SA";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;


    recognition.onstart = ()=>{

        recording = true;

        micButton.classList.add(
            "recording"
        );

        statusText.textContent =
            "🎙️ استمع...";

    };


    recognition.onresult = event=>{

        let result = "";

        for(
            let i =
                event.resultIndex;

            i <
                event.results.length;

            i++
        ){

            result +=
                event
                    .results[i][0]
                    .transcript;

        }

        input.value =
            result;

    };


    recognition.onend = ()=>{

        recording = false;

        micButton.classList.remove(
            "recording"
        );

        statusText.textContent =
            "جاهز";

    };


    recognition.onerror = ()=>{

        recording = false;

        micButton.classList.remove(
            "recording"
        );

        statusText.textContent =
            "جاهز";

    };


    recognition.start();

};


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function speakText(text){

    if(
        !("speechSynthesis" in window)
    )
        return;

    speechSynthesis.cancel();

    const clean =
        text
            .replace(
                /```[\s\S]*?```/g,
                "كود"
            )
            .replace(
                /[*_#`]/g,
                ""
            );

    const voice =
        new SpeechSynthesisUtterance(
            clean
        );

    voice.lang =
        "ar-SA";

    voice.rate =
        .96;

    voice.pitch =
        1;

    speechSynthesis.speak(
        voice
    );

}

/* =========================================================
   PARTICLES
========================================================= */

const canvas =
    $("particles");

const ctx =
    canvas.getContext("2d");

let particles = [];


function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


for(
    let i=0;
    i<45;
    i++
){

    particles.push({

        x:
            Math.random() *
            window.innerWidth,

        y:
            Math.random() *
            window.innerHeight,

        vx:
            (Math.random()-.5)
            *.3,

        vy:
            (Math.random()-.5)
            *.3,

        r:
            Math.random()*1.5+.4

    });

}


function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(
        particle=>{

            particle.x +=
                particle.vx;

            particle.y +=
                particle.vy;


            if(
                particle.x < 0 ||
                particle.x > canvas.width
            ){

                particle.vx *= -1;

            }


            if(
                particle.y < 0 ||
                particle.y > canvas.height
            ){

                particle.vy *= -1;

            }


            ctx.beginPath();

            ctx.arc(
                particle.x,
                particle.y,
                particle.r,
                0,
                Math.PI*2
            );

            ctx.fillStyle =
                "rgba(129,140,248,.35)";

            ctx.fill();

        }
    );


    requestAnimationFrame(
        animate
    );

}

animate();


/* =========================================================
   START
========================================================= */

renderSessions();

renderChat();

setTimeout(
    ()=>{
        initAI();
    },
    500
);
