<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A5 AI</title>

    <meta
        name="description"
        content="A5 AI - Intelligent voice and vision assistant"
    >

    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {
            --bg: #070b14;
            --bg-secondary: #0c1220;
            --panel: rgba(15, 23, 42, 0.82);
            --panel-solid: #0f172a;
            --panel-hover: #162033;

            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.14);

            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #5b21b6;

            --user-message: #172554;
            --ai-message: #111827;

            --danger: #ef4444;
            --success: #22c55e;

            --shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);

            --radius: 20px;
        }

        body.light {
            --bg: #f1f5f9;
            --bg-secondary: #e2e8f0;
            --panel: rgba(255, 255, 255, 0.88);
            --panel-solid: #ffffff;
            --panel-hover: #f8fafc;

            --border: rgba(15, 23, 42, 0.08);
            --border-strong: rgba(15, 23, 42, 0.15);

            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;

            --user-message: #dbeafe;
            --ai-message: #ffffff;

            --shadow:
                0 20px 50px rgba(15, 23, 42, 0.12);
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100%;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(124, 58, 237, 0.18),
                    transparent 45%
                ),
                var(--bg);

            color: var(--text);

            overflow: hidden;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }

        button,
        textarea,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }


        /* =========================================================
           APP
        ========================================================= */

        .app {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            position: relative;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            height: 72px;
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                0 22px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7, 11, 20, 0.72);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            position: relative;
            z-index: 20;
        }

        body.light .header {
            background:
                rgba(255, 255, 255, 0.75);
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-avatar {
            width: 42px;
            height: 42px;

            border-radius: 14px;

            display: grid;
            place-items: center;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            box-shadow:
                0 8px 25px
                rgba(124, 58, 237, 0.35);
        }

        .brand-avatar svg {
            width: 24px;
            height: 24px;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.3px;
        }

        .brand-status {
            display: flex;
            align-items: center;
            gap: 6px;

            color: var(--text-secondary);
            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 10px
                rgba(34, 197, 94, 0.7);
        }


        /* =========================================================
           HEADER ACTIONS
        ========================================================= */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .icon-button {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            color: var(--text-secondary);
            background: transparent;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .icon-button:hover {
            color: var(--text);
            background: var(--panel-hover);
        }

        .icon-button:active {
            transform: scale(0.94);
        }

        .icon-button svg {
            width: 20px;
            height: 20px;
        }


        /* =========================================================
           CHAT AREA
        ========================================================= */

        .chat {
            flex: 1;

            width: 100%;

            overflow-y: auto;
            overflow-x: hidden;

            padding:
                35px 20px
                145px;

            scroll-behavior: smooth;
        }

        .chat::-webkit-scrollbar {
            width: 7px;
        }

        .chat::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat::-webkit-scrollbar-thumb {
            background:
                rgba(148, 163, 184, 0.18);

            border-radius: 99px;
        }

        .chat-inner {
            width: min(920px, 100%);
            margin: 0 auto;
        }


        /* =========================================================
           WELCOME
        ========================================================= */

        .welcome {
            min-height: 55vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            animation:
                fadeUp 0.45s ease;
        }

        .welcome-content {
            width: min(650px, 100%);
        }

        .welcome-logo {
            width: 78px;
            height: 78px;

            margin:
                0 auto 22px;

            display: grid;
            place-items: center;

            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            box-shadow:
                0 20px 60px
                rgba(124, 58, 237, 0.3);
        }

        .welcome-logo svg {
            width: 43px;
            height: 43px;
        }

        .welcome h1 {
            font-size:
                clamp(30px, 5vw, 46px);

            line-height: 1.1;

            margin-bottom: 12px;

            letter-spacing: -1.5px;
        }

        .welcome h1 span {
            background:
                linear-gradient(
                    90deg,
                    #a78bfa,
                    #818cf8
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .welcome p {
            color: var(--text-secondary);

            font-size: 15px;

            line-height: 1.8;

            max-width: 540px;

            margin: 0 auto 28px;
        }


        /* =========================================================
           SUGGESTIONS
        ========================================================= */

        .suggestions {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            width: min(620px, 100%);

            margin: 0 auto;
        }

        .suggestion {
            padding: 14px 16px;

            border:
                1px solid var(--border);

            border-radius: 16px;

            background:
                var(--panel);

            color: var(--text-secondary);

            text-align: start;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border 0.2s ease;
        }

        .suggestion:hover {
            transform: translateY(-2px);

            color: var(--text);

            background:
                var(--panel-hover);

            border-color:
                var(--border-strong);
        }


        /* =========================================================
           MESSAGE
        ========================================================= */

        .message-row {
            display: flex;

            gap: 12px;

            margin-bottom: 24px;

            animation:
                fadeUp 0.25s ease;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 34px;
            height: 34px;

            min-width: 34px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            margin-top: 2px;

            background:
                var(--panel-solid);

            border:
                1px solid var(--border);

            overflow: hidden;
        }

        .message-avatar.ai {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );
        }

        .message-avatar svg {
            width: 19px;
            height: 19px;
        }

        .message-content {
            max-width: min(760px, 82%);
        }

        .message-row.user .message-content {
            align-items: flex-end;
        }

        .message-bubble {
            padding:
                13px 16px;

            border-radius:
                18px;

            background:
                var(--ai-message);

            border:
                1px solid var(--border);

            color: var(--text);

            line-height: 1.75;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .message-row.user .message-bubble {
            background:
                var(--user-message);

            border-color:
                rgba(96, 165, 250, 0.12);
        }

        .message-image {
            display: block;

            max-width: min(420px, 100%);

            max-height: 420px;

            object-fit: contain;

            margin-bottom: 8px;

            border-radius: 15px;

            border:
                1px solid var(--border);
        }

        .message-actions {
            display: flex;

            align-items: center;

            gap: 5px;

            margin-top: 7px;

            opacity: 0.65;
        }

        .message-row.user
        .message-actions {
            justify-content: flex-end;
        }

        .mini-button {
            width: 31px;
            height: 31px;

            display: grid;
            place-items: center;

            border-radius: 9px;

            background: transparent;

            color: var(--text-muted);

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }

        .mini-button:hover {
            color: var(--text);
            background: var(--panel-hover);
        }

        .mini-button svg {
            width: 16px;
            height: 16px;
        }


        /* =========================================================
           TYPING
        ========================================================= */

        .typing {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding:
                5px 2px;
        }

        .typing span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--text-secondary);

            animation:
                typing 1.1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }


        /* =========================================================
           INPUT AREA
        ========================================================= */

        .composer-wrap {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 30;

            padding:
                16px 20px 20px;

            pointer-events: none;
        }

        .composer-container {
            width: min(900px, 100%);

            margin: 0 auto;

            pointer-events: auto;
        }

        .composer {
            position: relative;

            display: flex;
            flex-direction: column;

            background:
                var(--panel);

            border:
                1px solid var(--border-strong);

            border-radius:
                22px;

            box-shadow:
                var(--shadow);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

            overflow: hidden;
        }

        .preview-area {
            display: none;

            padding:
                12px 12px 0;
        }

        .preview-area.active {
            display: block;
        }

        .preview-box {
            position: relative;

            width: 105px;
            height: 105px;

            border-radius: 15px;

            overflow: hidden;

            border:
                1px solid var(--border);
        }

        .preview-box img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .remove-preview {
            position: absolute;

            top: 6px;
            right: 6px;

            width: 27px;
            height: 27px;

            display: grid;
            place-items: center;

            border-radius: 9px;

            background:
                rgba(0, 0, 0, 0.7);

            color: white;
        }

        .remove-preview svg {
            width: 15px;
            height: 15px;
        }

        .composer-main {
            display: flex;

            align-items: flex-end;

            gap: 8px;

            padding: 10px;
        }

        .text-input {
            flex: 1;

            min-height: 46px;
            max-height: 180px;

            resize: none;

            outline: none;

            border: 0;

            background: transparent;

            color: var(--text);

            padding:
                11px 7px;

            line-height: 1.55;

            overflow-y: auto;
        }

        .text-input::placeholder {
            color: var(--text-muted);
        }

        .text-input::-webkit-scrollbar {
            width: 5px;
        }

        .text-input::-webkit-scrollbar-thumb {
            background:
                rgba(148, 163, 184, 0.15);

            border-radius: 99px;
        }

        .composer-tools {
            display: flex;

            align-items: center;

            gap: 5px;
        }

        .tool-button {
            width: 43px;
            height: 43px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background: transparent;

            color: var(--text-secondary);

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .tool-button:hover {
            background:
                var(--panel-hover);

            color: var(--text);
        }

        .tool-button:active {
            transform: scale(0.93);
        }

        .tool-button svg {
            width: 21px;
            height: 21px;
        }

        .send-button {
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            color: white;

            box-shadow:
                0 7px 20px
                rgba(124, 58, 237, 0.28);
        }

        .send-button:hover {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #8b5cf6,
                    #6366f1
                );
        }

        .send-button.stop {
            background:
                var(--danger);
        }


        /* =========================================================
           RECORDING
        ========================================================= */

        .tool-button.recording {
            color: #fff;

            background:
                var(--danger);

            animation:
                recordingPulse 1.4s infinite;
        }


        /* =========================================================
           VOICE STATUS
        ========================================================= */

        .voice-status {
            position: fixed;

            left: 50%;
            bottom: 105px;

            transform:
                translateX(-50%)
                translateY(10px);

            opacity: 0;

            pointer-events: none;

            display: flex;
            align-items: center;
            gap: 8px;

            padding:
                9px 14px;

            border-radius: 999px;

            background:
                var(--panel-solid);

            border:
                1px solid var(--border-strong);

            box-shadow:
                var(--shadow);

            color: var(--text-secondary);

            font-size: 12px;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;

            z-index: 50;
        }

        .voice-status.active {
            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }

        .voice-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--danger);

            box-shadow:
                0 0 10px
                rgba(239, 68, 68, 0.8);

            animation:
                voicePulse 1s infinite;
        }


        /* =========================================================
           CAMERA MODAL
        ========================================================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.72);

            backdrop-filter:
                blur(10px);
        }

        .modal.active {
            display: flex;
        }

        .camera-card {
            width: min(680px, 100%);

            background:
                var(--panel-solid);

            border:
                1px solid var(--border-strong);

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.5);

            animation:
                modalIn 0.25s ease;
        }

        .camera-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            padding:
                15px 17px;

            border-bottom:
                1px solid var(--border);
        }

        .camera-title {
            font-weight: 700;
        }

        .camera-close {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            color: var(--text-secondary);

            background: transparent;
        }

        .camera-close:hover {
            color: var(--text);

            background:
                var(--panel-hover);
        }

        .camera-preview {
            width: 100%;

            aspect-ratio: 16 / 10;

            background: #000;

            position: relative;
        }

        .camera-preview video {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .camera-controls {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 16px;
        }

        .camera-control {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            background:
                var(--panel-hover);

            color: var(--text-secondary);
        }

        .camera-control:hover {
            color: var(--text);
        }

        .camera-capture {
            width: 58px;
            height: 58px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            color: white;

            display: grid;
            place-items: center;

            box-shadow:
                0 8px 25px
                rgba(124, 58, 237, 0.35);
        }

        .camera-capture svg {
            width: 25px;
            height: 25px;
        }


        /* =========================================================
           FILE INPUT
        ========================================================= */

        #imageInput {
            display: none;
        }


        /* =========================================================
           TOAST
        ========================================================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 30px;

            transform:
                translate(-50%, 15px);

            opacity: 0;

            pointer-events: none;

            z-index: 200;

            padding:
                11px 17px;

            border-radius: 12px;

            background:
                var(--panel-solid);

            border:
                1px solid var(--border-strong);

            box-shadow:
                var(--shadow);

            color: var(--text);

            font-size: 13px;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }


        /* =========================================================
           ANIMATIONS
        ========================================================= */

        @keyframes fadeUp {

            from {
                opacity: 0;
                transform:
                    translateY(8px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.45;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        @keyframes recordingPulse {

            0% {
                box-shadow:
                    0 0 0 0
                    rgba(239, 68, 68, 0.4);
            }

            70% {
                box-shadow:
                    0 0 0 10px
                    rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(239, 68, 68, 0);
            }
        }

        @keyframes voicePulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        @keyframes modalIn {

            from {
                opacity: 0;

                transform:
                    scale(0.96)
                    translateY(8px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            .header {
                height: 64px;
                min-height: 64px;

                padding:
                    0 13px;
            }

            .brand-avatar {
                width: 38px;
                height: 38px;

                border-radius: 12px;
            }

            .brand-name {
                font-size: 15px;
            }

            .chat {
                padding:
                    24px 12px
                    135px;
            }

            .message-content {
                max-width: 86%;
            }

            .message-bubble {
                padding:
                    11px 13px;

                border-radius:
                    16px;

                font-size: 14px;
            }

            .message-avatar {
                width: 31px;
                height: 31px;
                min-width: 31px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .welcome {
                min-height: 58vh;
            }

            .welcome-logo {
                width: 68px;
                height: 68px;

                border-radius: 22px;
            }

            .welcome h1 {
                font-size: 32px;
            }

            .welcome p {
                font-size: 14px;
            }

            .composer-wrap {
                padding:
                    10px 10px 12px;
            }

            .composer {
                border-radius: 19px;
            }

            .composer-main {
                gap: 4px;
                padding: 7px;
            }

            .tool-button {
                width: 39px;
                height: 39px;
            }

            .send-button {
                width: 42px;
                height: 42px;
            }

            .text-input {
                min-height: 42px;
                font-size: 14px;
            }

            .voice-status {
                bottom: 92px;
            }
        }

    </style>
</head>


<body>

    <div class="app">


        <!-- =====================================================
             HEADER
        ====================================================== -->

        <header class="header">

            <div class="brand">

                <div class="brand-avatar">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="white"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round">

                        <path
                            d="M12 3
                               C7.5 3 4 6.1 4 10
                               C4 12.2 5.3 14.2 7.3 15.5
                               L6 19
                               L10 17.1
                               C10.7 17.3 11.3 17.4 12 17.4
                               C16.5 17.4 20 14.1 20 10
                               C20 6.1 16.5 3 12 3Z">
                        </path>

                        <circle
                            cx="9"
                            cy="10"
                            r="1">
                        </circle>

                        <circle
                            cx="12"
                            cy="10"
                            r="1">
                        </circle>

                        <circle
                            cx="15"
                            cy="10"

        };


        function t(key) {

            return (
                translations[currentLanguage]?.[key]
                ||
                translations.ar[key]
                ||
                key
            );
        }


        function applyLanguage() {

            const isArabic =
                currentLanguage === "ar";

            document.documentElement.lang =
                currentLanguage;

            document.documentElement.dir =
                isArabic
                    ? "rtl"
                    : "ltr";

            textInput.placeholder =
                t("placeholder");

            document.getElementById(
                "statusText"
            ).textContent =
                t("online");

            document.getElementById(
                "welcomeTitle"
            ).textContent =
                t("welcome");

            document.getElementById(
                "welcomeDescription"
            ).textContent =
                t("description");

            document.getElementById(
                "cameraTitle"
            ).textContent =
                t("camera");

            voiceStatusText.textContent =
                t("listening");

            document.title =
                "A5 AI";

            localStorage.setItem(
                "a5-language",
                currentLanguage
            );
        }


        languageButton.addEventListener(
            "click",
            () => {

                currentLanguage =
                    currentLanguage === "ar"
                        ? "en"
                        : "ar";

                applyLanguage();

            }
        );


        /* =========================================================
           THEME
        ========================================================= */

        let currentTheme =
            localStorage.getItem(
                "a5-theme"
            ) || "dark";


        function applyTheme() {

            if (currentTheme === "light") {

                body.classList.add("light");

            } else {

                body.classList.remove("light");

            }

            localStorage.setItem(
                "a5-theme",
                currentTheme
            );
        }


        themeButton.addEventListener(
            "click",
            () => {

                currentTheme =
                    currentTheme === "dark"
                        ? "light"
                        : "dark";

                applyTheme();

            }
        );


        /* =========================================================
           TOAST
        ========================================================= */

        let toastTimer = null;


        function showToast(message) {

            toast.textContent =
                message;

            toast.classList.add(
                "show"
            );

            clearTimeout(
                toastTimer
            );

            toastTimer =
                setTimeout(
                    () => {

                        toast.classList.remove(
                            "show"
                        );

                    },
                    2200
                );
        }


        /* =========================================================
           STORAGE
        ========================================================= */

        const STORAGE_KEY =
            "a5-conversation";


        function saveConversation() {

            try {

                const safeMessages =
                    messages.map(
                        message => {

                            return {
                                role:
                                    message.role,

                                content:
                                    typeof message.content === "string"
                                        ? message.content
                                        : extractTextFromContent(
                                            message.content
                                        )
                            };

                        }
                    );

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(
                        safeMessages
                    )
                );

            } catch (error) {

                console.warn(
                    "Could not save conversation.",
                    error
                );
            }
        }


        function loadConversation() {

            try {

                const saved =
                    localStorage.getItem(
                        STORAGE_KEY
                    );

                if (!saved) {
                    return;
                }

                const parsed =
                    JSON.parse(saved);

                if (
                    !Array.isArray(parsed)
                ) {
                    return;
                }

                messages =
                    parsed;

                renderConversation();

            } catch (error) {

                console.warn(
                    "Could not load conversation.",
                    error
                );
            }
        }


        function extractTextFromContent(
            content
        ) {

            if (
                typeof content ===
                "string"
            ) {
                return content;
            }

            if (
                Array.isArray(content)
            ) {

                return content
                    .filter(
                        item =>
                            item &&
                            item.type ===
                            "text"
                    )
                    .map(
                        item =>
                            item.text || ""
                    )
                    .join("\n");

            }

            return "";
        }


        /* =========================================================
           RENDER
        ========================================================= */

        function renderConversation() {

            chatInner.innerHTML = "";

            if (
                messages.length === 0
            ) {

                chatInner.appendChild(
                    createWelcome()
                );

                return;
            }

            messages.forEach(
                message => {

                    addMessageToUI(
                        message.role,
                        extractTextFromContent(
                            message.content
                        )
                    );

                }
            );

            scrollToBottom();
        }

                                   C10.7 17.3 11.3 17.4 12 17.4

                                   C20 6.1 16.5 3 12 3Z">
                            </path>

                            <path
                                d="M8 10h.01">
                            </path>

                            <path
                                d="M12 10h.01">
                            </path>

                            <path
                                d="M16 10h.01">

                            <path
                                d="M9 14
                                   C10.7 15.1 13.3 15.1 15 14">
                            </path>

                        </svg>

                    </div>

                    <h1>
                        <span>A5</span>

                    </h1>

                        <button

                            data-prompt="ساعدني في كتابة موقع HTML احترافي">
                            💻 ساعدني في البرمجة

                            data-prompt="ما الأشياء التي تستطيع مساعدتي فيها؟">

            `;

            section

                )

                                textInput.value =
                                    button.dataset.prompt;

                                autoResize();

                                sendMessage();

                            }
                        );

                    }
                );

            return section;
        }

        function addTypingIndicator() {

            const row =
                document.createElement(

                "typingIndicator";

        function removeTypingIndicator() {

            document
                .getElementById(
                    "typingIndicator"
                )
                ?.remove();
        }


        function scrollToBottom() {

            requestAnimationFrame(
                () => {

                    chat.scrollTop =
                        chat.scrollHeight;

                }
            );
        }


        /* =========================================================
           SEND MESSAGE
        ========================================================= */

        async function sendMessage(
            forcedText = null,
            fromVoice = false
        ) {

            if (isGenerating) {
                return;
            }

            const text =
                (
                    forcedText !== null
                        ? forcedText
                        : textInput.value
                ).trim();


            if (
                !text &&
                !currentImage
            ) {

                showToast(
                    t("empty")
                );

                return;
            }


            const image =
                currentImage;


            const userContent = [];


            if (text) {

                userContent.push({
                    type: "text",
                    text
                });
            }


            if (image) {

                userContent.push({
                    type: "image_url",

                    image_url: {
                        url: image
                    }
                });
            }


            const userMessage = {

                role: "user",

                content:
                    userContent

            };


            messages.push(
                userMessage
            );


            saveConversation();


            welcome?.remove();


            addMessageToUI(
                "user",
                text,
                image
            );


            textInput.value = "";

            autoResize();

            clearImage();


            addTypingIndicator();


            isGenerating = true;

            updateSendButton();


            currentController =
                new AbortController();


            try {

                const requestMessages = [

                    {
                        role: "system",
                        content:
                            SYSTEM_PROMPT
                    },

                    ...messages

                ];


                const response =
                    await fetch(
                        API_URL,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    model:
                                        MODEL,

                                    messages:
                                        requestMessages,

                                    temperature:
                                        0.7,

                                    max_tokens:
                                        2500

                                }),

                            signal:
                                currentController.signal

                        }
                    );


                let data;

                try {

                    data =
                        await response.json();

                } catch {

                    throw new Error(
                        "Invalid server response."
                    );
                }


                if (!response.ok) {

                    throw new Error(
                        data?.error?.message
                        ||
                        `HTTP ${response.status}`
                    );
                }


                const aiText =
                    data
                        ?.choices?.[0]
                        ?.message
                        ?.content;


                if (!aiText) {

                    throw new Error(
                        "A5 returned an empty response."
                    );
                }


                removeTypingIndicator();


                messages.push({

                    role:
                        "assistant",

                    content:
                        aiText

                });


                saveConversation();


                addMessageToUI(
                    "assistant",
                    aiText
                );


                if (
                    fromVoice ||
                    voiceMode
                ) {

                    speakText(
                        aiText
                    );
                }


            } catch (error) {

                removeTypingIndicator();


                if (
                    error.name ===
                    "AbortError"
                ) {

                    showToast(
                        t("stopped")
                    );

                } else {

                    console.error(
                        "A5 Error:",
                        error
                    );


                    addMessageToUI(
                        "assistant",
                        `${t("aiError")}\n\n${error.message || t("connectionError")}`
                    );

                }

            } finally {

                currentController =
                    null;

                isGenerating =
                    false;

                updateSendButton();

            }
        }


        /* =========================================================
           SEND / STOP
        ========================================================= */

        sendButton.addEventListener(
            "click",
            () => {

                if (isGenerating) {

                    stopGeneration();

                } else {

                    sendMessage();

                }

            }
        );


        function stopGeneration() {

            if (
                currentController
            ) {

                currentController.abort();

            }

            isGenerating = false;

            updateSendButton();
        }


        function updateSendButton() {

            if (isGenerating) {

                sendButton.classList.add(
                    "stop"
                );

                sendButton.title =
                    "Stop";


                sendIcon.innerHTML = `

                    <rect
                        x="6"
                        y="6"
                        width="12"
                        height="12"
                        rx="2">
                    </rect>

                `;

            } else {

                sendButton.classList.remove(
                    "stop"
                );

                sendButton.title =
                    "Send";


                sendIcon.innerHTML = `

                    <path
                        d="M22 2
                           L11 13">
                    </path>

                    <path
                        d="M22 2
                           L15 22
                           L11 13
                           L2 9
                           Z">
                    </path>

                `;
            }
        }


        /* =========================================================
           TEXTAREA
        ========================================================= */

        textInput.addEventListener(
            "input",
            autoResize
        );


        function autoResize() {

            textInput.style.height =
                "auto";

            textInput.style.height =
                Math.min(
                    textInput.scrollHeight,
                    180
                ) + "px";
        }


        textInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        /* =========================================================
           IMAGE UPLOAD
        ========================================================= */

        imageButton.addEventListener(
            "click",
            () => {

                imageInput.click();

            }
        );


        imageInput.addEventListener(
            "change",
            event => {

                const file =
                    event.target.files?.[0];

                if (!file) {
                    return;
                }

                handleImageFile(
                    file
                );

            }
        );


        function handleImageFile(file) {

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                showToast(
                    "Please select an image."
                );

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                event => {

                    currentImage =
                        event.target.result;

                    currentImageName =
                        file.name;

                    previewImage.src =
                        currentImage;

                    previewArea.classList.add(
                        "active"
                    );

                    showToast(
                        t("imageAdded")
                    );

                };


            reader.readAsDataURL(
                file
            );
        }


        removePreview.addEventListener(
            "click",
            clearImage
        );


        function clearImage() {

            currentImage =
                null;

            currentImageName =
                "";

            previewImage.src =
                "";

            previewArea.classList.remove(
                "active"
            );

            imageInput.value =
                "";

        }


        /* =========================================================
           PASTE IMAGE
        ========================================================= */

        document.addEventListener(
            "paste",
            event => {

                const items =
                    event.clipboardData?.items;

                if (!items) {
                    return;
                }


                for (
                    const item of items
                ) {

                    if (
                        item.type.startsWith(
                            "image/"
                        )
                    ) {

                        const file =
                            item.getAsFile();

                        if (file) {

                            handleImageFile(
                                file
                            );

                        }

                        break;
                    }

                }

            }
        );


        /* =========================================================
           DRAG & DROP
        ========================================================= */

        const composer =
            document.getElementById(
                "composer"
            );


        composer.addEventListener(
            "dragover",
            event => {

                event.preventDefault();

                composer.style.borderColor =
                    "rgba(124,58,237,0.55)";
            }
        );


        composer.addEventListener(
            "dragleave",
            () => {

                composer.style.borderColor =
                    "";
            }
        );


        composer.addEventListener(
            "drop",
            event => {

                event.preventDefault();

                composer.style.borderColor =
                    "";

                const file =
                    event.dataTransfer
                        ?.files?.[0];

                if (file) {

                    handleImageFile(
                        file
                    );
                }
            }
        );


        /* =========================================================
           CAMERA
        ========================================================= */

        cameraButton.addEventListener(
            "click",
            openCamera
        );


        async function openCamera() {

            try {

                stopCamera();


                cameraStream =
                    await navigator.mediaDevices.getUserMedia(
                        {
                            video: {
                                facingMode:
                                    currentFacingMode
                            },

                            audio: false
                        }
                    );


                cameraVideo.srcObject =
                    cameraStream;


                cameraModal.classList.add(
                    "active"
                );


            } catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                showToast(
                    t("cameraError")
                );
            }
        }


        function stopCamera() {

            if (
                cameraStream
            ) {

                cameraStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                cameraStream =
                    null;
            }


            cameraVideo.srcObject =
                null;
        }


        cameraClose.addEventListener(
            "click",
            closeCamera
        );


        cameraStop.addEventListener(
            "click",
            closeCamera
        );


        cameraModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    cameraModal
                ) {

                    closeCamera();

                }

            }
        );


        function closeCamera() {

            stopCamera();

            cameraModal.classList.remove(
                "active"
            );
        }


        switchCamera.addEventListener(
            "click",
            async () => {

                currentFacingMode =
                    currentFacingMode ===
                    "environment"
                        ? "user"
                        : "environment";

                await openCamera();

            }
        );


        captureButton.addEventListener(
            "click",
            () => {

                if (
                    !cameraVideo.videoWidth
                ) {
                    return;
                }


                const canvas =
                    document.createElement(
                        "canvas"
                    );


                canvas.width =
                    cameraVideo.videoWidth;

                canvas.height =
                    cameraVideo.videoHeight;


                const context =
                    canvas.getContext(
                        "2d"
                    );


                if (
                    currentFacingMode ===
                    "user"
                ) {

                    context.translate(
                        canvas.width,
                        0
                    );

                    context.scale(
                        -1,
                        1
                    );
                }


                context.drawImage(
                    cameraVideo,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                currentImage =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.88
                    );

                currentImageName =
                    "camera.jpg";


                previewImage.src =
                    currentImage;

                previewArea.classList.add(
                    "active"
                );


                closeCamera();

                showToast(
                    t("imageAdded")
                );

            }
        );


        /* =========================================================
           VOICE RECOGNITION
        ========================================================= */

        micButton.addEventListener(
            "click",
            () => {

                if (isListening) {

                    stopVoice();

                } else {

                    startVoice();

                }

            }
        );


        function getSpeechRecognition() {

            return (
                window.SpeechRecognition ||
                window.webkitSpeechRecognition
            );
        }


        function startVoice() {

            const SpeechRecognition =
                getSpeechRecognition();


            if (!SpeechRecognition) {

                showToast(
                    t("voiceUnavailable")
                );

                return;
            }


            if (isListening) {
                return;
            }


            recognition =
                new SpeechRecognition();


            recognition.continuous =
                true;

            recognition.interimResults =
                true;


            recognition.lang =
                currentLanguage === "ar"
                    ? "ar-SA"
                    : "en-US";


            voiceBuffer = "";

            isListening = true;

            voiceMode = true;


            micButton.classList.add(
                "recording"
            );


            voiceStatus.classList.add(
                "active"
            );


            voiceStatusText.textContent =
                t("listening");


            try {

                recognition.start();

            } catch (error) {

                console.warn(
                    "Recognition start:",
                    error
                );
            }


            recognition.onresult =
                event => {

                    let finalText =
                        "";


                    for (
                        let i =
                            event.resultIndex;

                        i <
                            event.results.length;

                        i++
                    ) {

                        const result =
                            event.results[i];

                        const text =
                            result[0]
                                .transcript;


                        if (
                            result.isFinal
                        ) {

                            finalText +=
                                text;
                        }
                    }


                    if (
                        finalText.trim()
                    ) {

                        voiceBuffer +=
                            " " +
                            finalText.trim();

                    }

                };


            recognition.onerror =
                event => {

                    console.error(
                        "Speech recognition:",
                        event.error
                    );


                    if (
                        event.error ===
                        "not-allowed"
                    ) {

                        showToast(
                            t("permissionDenied")
                        );

                        stopVoice();

                    }

                };


            recognition.onend =
                () => {

                    if (
                        !isListening
                    ) {
                        return;
                    }


                    if (
                        voiceBuffer.trim()
                    ) {

                        const spokenText =
                            voiceBuffer.trim();

                        voiceBuffer = "";


                        sendMessage(
                            spokenText,
                            true
                        );
                    }


                    try {

                        recognition.start();

                    } catch {

                        // Browser may already be restarting.
                    }

                };

        }


        function stopVoice() {

            isListening = false;

            voiceMode = false;


            micButton.classList.remove(
                "recording"
            );


            voiceStatus.classList.remove(
                "active"
            );


            if (
                recognition
            ) {

                try {

                    recognition.stop();

                } catch {

                    // Already stopped.
                }

                recognition =
                    null;
            }

        }


        /* =========================================================
           SPEECH SYNTHESIS
        ========================================================= */

        function speakText(text) {

            if (
                !("speechSynthesis" in window)
            ) {
                return;
            }


            speechSynthesis.cancel();


            const cleanText =
                text
                    .replace(
                        /[*_`#]/g,
                        ""
                    )
                    .trim();


            if (!cleanText) {
                return;
            }


            const utterance =
                new SpeechSynthesisUtterance(
                    cleanText
                );


            const isArabic =
                /[\u0600-\u06FF]/.test(
                    cleanText
                );


            utterance.lang =
                isArabic
                    ? "ar-SA"
                    : "en-US";


            utterance.rate =
                1;

            utterance.pitch =
                1;


            speechSynthesis.speak(
                utterance
            );
        }


        /* =========================================================
           CLEAR CHAT
        ========================================================= */

        clearButton.addEventListener(
            "click",
            () => {

                if (
                    isGenerating
                ) {

                    stopGeneration();

                }


                messages = [];


                localStorage.removeItem(
                    STORAGE_KEY
                );


                renderConversation();


                showToast(
                    t("cleared")
                );

            }
        );


        /* =========================================================
           ESCAPE HTML
        ========================================================= */

        function escapeHTML(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value;

            return div.innerHTML;
        }


        /* =========================================================
           INITIALIZE
        ========================================================= */

        applyTheme();

        applyLanguage();

        loadConversation();

        autoResize();

        updateSendButton();


        /* =========================================================
           BEFORE UNLOAD
        ========================================================= */

        window.addEventListener(
            "beforeunload",
            () => {

                stopCamera();

                stopVoice();

                speechSynthesis.cancel();

            }
        );


        /* =========================================================
           CAMERA ESC
        ========================================================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    if (
                        cameraModal.classList.contains(
                            "active"
                        )
                    ) {

                        closeCamera();

                    }

                }

            }
        );


        /* =========================================================
           ONLINE / OFFLINE
        ========================================================= */

        window.addEventListener(
            "online",
            () => {

                document.getElementById(
                    "statusText"
                ).textContent =
                    t("online");

            }
        );


        window.addEventListener(
            "offline",
            () => {

                document.getElementById(
                    "statusText"
                ).textContent =
                    "Offline";

            }
        );

    </script>
