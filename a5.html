<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoYTFX - Advanced Ultra-Fast AI Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: rgba(17, 24, 39, 0.75);
            --bg-surface-hover: rgba(31, 41, 55, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(139, 92, 246, 0.5);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --gold: #f59e0b;
            --font-ar: 'Tajawal', sans-serif;
            --radius-lg: 24px;
            --radius-md: 14px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: var(--font-ar);
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: -1;
            opacity: 0.35;
        }

        .glow-1 { top: -100px; right: -100px; background: radial-gradient(circle, var(--accent), transparent 70%); }
        .glow-2 { bottom: -100px; left: -100px; background: radial-gradient(circle, var(--primary), transparent 70%); }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 8%;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 800;
            text-decoration: none;
            color: inherit;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: #fff;
            font-weight: 800;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .pro-nav-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: var(--transition);
        }

        .pro-nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }

        .container {
            width: 100%;
            max-width: 950px;
            padding: 30px 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .welcome-title {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #a7f3d0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .persona-select {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .tool-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
        }

        .tool-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .chat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            height: 520px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
        }

        .status-indicator {
            font-size: 0.85rem;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bg-surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-right-radius: 4px;
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: #fff;
            border-bottom-left-radius: 4px;
        }

        .msg-tools {
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .msg-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .msg-btn:hover {
            color: var(--accent);
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background: rgba(3, 7, 18, 0.4);
        }

        .chat-input {
            flex: 1;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            outline: none;
            font-family: inherit;
            transition: var(--transition);
        }

        .chat-input:focus {
            border-color: var(--border-hover);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        .mic-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
        }

        .mic-btn.active {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--accent);
            transform: translateX(4px);
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            background: var(--bg-surface);
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <nav class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-icon">⚡</div>
            <span>VideoYTFX AI</span>
        </a>

        <!-- زر الانتقال للنسخة الأقوى -->
        <a href="downloads.html" class="pro-nav-btn">
            👑 الترقية للنسخة الأقوى (PRO)
        </a>
    </nav>

    <div class="container">
        <div class="header-section">
            <div class="ai-badge">
                <span>🚀</span> <span>محرك ذكي فائق الأداء</span>
            </div>
            <!-- نص الترحيب بالمستخدم المتغير تلقائياً -->
            <h1 class="welcome-title" id="greetingText">مرحباً بك في استوديو الذكاء الاصطناعي</h1>
            <p class="subtitle" id="greetingSub">المساعد الشخصي الذكي لإدارة وتنزيل وتحليل الفيديوهات والمحتوى.</p>
        </div>

        <div class="controls-bar">
            <div>
                <label style="font-size: 0.85rem; color: var(--text-muted);">الشخصية: </label>
                <select id="personaSelect" class="persona-select" onchange="updatePersona()">
                    <option value="friendly">صديق بشري ودود</option>
                    <option value="expert">مطور وخبير تقني</option>
                    <option value="editor">صانع محتوى إبداعي</option>
                </select>
            </div>

            <div class="action-btns">
                <button class="tool-btn" onclick="exportChatHistory()">تحميل السجل 📥</button>
                <button class="tool-btn" onclick="clearChat()">مسح المحادثة 🗑️</button>
            </div>
        </div>

        <div class="chat-card">
            <div class="chat-header">
                <span>💬 المحادثة التفاعلية</span>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>متصل وجاهز</span>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- الرسائل يتم تحميلها وحفظها هنا -->
            </div>
            <div class="chat-input-area">
                <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()" title="تسجيل صوتي">🎙️</button>
                <input type="text" id="userInput" class="chat-input" placeholder="اكتب سؤالك أو تحسينك هنا..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <span>إرسال</span> ⚡
                </button>
            </div>
        </div>

        <a class="back-link" href="index.html">
            → العودة للرئيسية
        </a>
    </div>

    <footer>
        © 2026 VideoYTFX AI Studio. جميع الحقوق محفوظة.
    </footer>

    <script type="module">
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const greetingText = document.getElementById('greetingText');
        const greetingSub = document.getElementById('greetingSub');
        const personaSelect = document.getElementById('personaSelect');
        const micBtn = document.getElementById('micBtn');

        let isRecording = false;
        let recognition = null;

        // إعداد الترحيب الذكي بطلب اسم المستخدم
        function setupSmartGreeting() {
            let userName = localStorage.getItem('user_name');
            if (!userName) {
                userName = prompt("مرحباً بك! ما هو اسمك الكريم؟") || "صديقنا العزيز";
                localStorage.setItem('user_name', userName);
            }

            const hour = new Date().getHours();
            let timeGreeting = "أهلاً وسهلاً";
            if (hour >= 5 && hour < 12) timeGreeting = "صباح الخير";
            else if (hour >= 12 && hour < 18) timeGreeting = "مساء الخير";
            else timeGreeting = "مساء النور والسرور";

            greetingText.textContent = `${timeGreeting}، ${userName}! 👋`;
            greetingSub.textContent = `مرحباً بك في استوديو VideoYTFX. أنا هنا لمساعدتك في كل ما تحتاجه.`;
        }

        // حفظ وتحميل المحادثة من ذاكرة الجهاز (LocalStorage)
        function loadChatHistory() {
            const savedHistory = localStorage.getItem('chat_history');
            if (savedHistory) {
                chatMessages.innerHTML = savedHistory;
            } else {
                const userName = localStorage.getItem('user_name') || 'صديقي';
                appendBotMessage(`يا مرحباً بك يا ${userName}! كيف يمكنني مساعدتك اليوم؟ يمكنك اختباري في البرمجة، الفيديوهات، أو صياغة الأفكار!`);
            }
        }

        function saveChatHistory() {
            localStorage.setItem('chat_history', chatMessages.innerHTML);
        }

        window.clearChat = function() {
            localStorage.removeItem('chat_history');
            chatMessages.innerHTML = '';
            const userName = localStorage.getItem('user_name') || 'صديقي';
            appendBotMessage(`تم مسح السجل بنجاح! أهلاً بك مجدداً يا ${userName}، كيف أستطيع مساعدتك الآن؟`);
            saveChatHistory();
        };

        // تصدير المحادثة كملف نصي
        window.exportChatHistory = function() {
            const messages = document.querySelectorAll('.msg');
            let content = "--- سجل محادثة VideoYTFX AI ---\n\n";
            messages.forEach(msg => {
                const isUser = msg.classList.contains('user');
                content += `${isUser ? 'المستخدم' : 'الذكاء الاصطناعي'}: ${msg.textContent.trim()}\n\n`;
            });

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'chat-history.txt';
            link.click();
        };

        // الرد الآلي السريع بأسلوب إنساني متطور
        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text) return;

            appendUserMessage(text);
            userInput.value = '';
            sendBtn.disabled = true;

            const { botMsgDiv, wrapper } = createBotMessagePlaceholder();

            // سرعة الاستجابة بالتدفق
            await streamFastResponse(botMsgDiv, wrapper, text);

            sendBtn.disabled = false;
            saveChatHistory();
        };

        async function streamFastResponse(botMsgDiv, wrapper, userText) {
            const response = getSmartResponse(userText);
            botMsgDiv.textContent = "";

            const words = response.split(" ");
            let current = "";

            for (let i = 0; i < words.length; i++) {
                current += words[i] + " ";
                botMsgDiv.textContent = current;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                await new Promise(r => setTimeout(r, 30));
            }

            addToolsToMessage(wrapper, response);
        }

        function getSmartResponse(input) {
            const userName = localStorage.getItem('user_name') || 'صديقي';
            const lower = input.toLowerCase();

            if (lower.includes("اقوى") || lower.includes("نسخه") || lower.includes("تحديث") || lower.includes("تحميل")) {
                return `يا ${userName}، للحصول على النسخة الأقوى والأحدث مع الميزات المتقدمة كاملة، اضغط على زر "👑 الترقية للنسخة الأقوى (PRO)" الموجود في أعلى الصفحة لتنقلك مباشرة لصفحة التحميلات المباشرة!`;
            }
            if (lower.includes("هلا") || lower.includes("مرحبا") || lower.includes("السلام")) {
                return `أهلاً وسهلاً بك يا ${userName}! يسعدني جداً التحدث معك. أستطيع مساعدتك في تنزيل الفيديوهات، صياغة النصوص، والذكاء الاصطناعي.`;
            }
            return `عزيزي ${userName}، بالنسبة لطلبك بخصوص "${input}"، يسعدني أن أوضح لك أن النظام يقدم لك أدوات متطورة لمعالجة ذلك وسرعة فائقة بمرونة تامة!`;
        }

        function appendUserMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            wrapper.innerHTML = `<div class="msg user">${text}</div>`;
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendBotMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            wrapper.innerHTML = `<div class="msg bot">${text}</div>`;
            chatMessages.appendChild(wrapper);
            addToolsToMessage(wrapper, text);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function createBotMessagePlaceholder() {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            const botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'msg bot';
            botMsgDiv.textContent = "يكتب الآن...";
            wrapper.appendChild(botMsgDiv);
            chatMessages.appendChild(wrapper);
            return { botMsgDiv, wrapper };
        }

        function addToolsToMessage(wrapper, text) {
            const toolsDiv = document.createElement('div');
            toolsDiv.className = 'msg-tools';

            const speakBtn = document.createElement('button');
            speakBtn.className = 'msg-btn';
            speakBtn.innerHTML = '🔊 استماع';
            speakBtn.onclick = () => speakText(text);

            const copyBtn = document.createElement('button');
            copyBtn.className = 'msg-btn';
            copyBtn.innerHTML = '📋 نسخ';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(text);
                copyBtn.innerHTML = '✅ تم النسخ';
                setTimeout(() => copyBtn.innerHTML = '📋 نسخ', 2000);
            };

            toolsDiv.appendChild(speakBtn);
            toolsDiv.appendChild(copyBtn);
            wrapper.appendChild(toolsDiv);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                window.speechSynthesis.speak(utterance);
            }
        }

        // ميزة التسجيل الصوتي
        window.toggleVoiceInput = function() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("التسجيل الصوتي غير مدعوم في متصفحك حالياً.");
                return;
            }

            if (isRecording) {
                recognition.stop();
                isRecording = false;
                micBtn.classList.remove('active');
            } else {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'ar-SA';
                recognition.onstart = () => {
                    isRecording = true;
                    micBtn.classList.add('active');
                };
                recognition.onresult = (event) => {
                    userInput.value = event.results[0][0].transcript;
                };
                recognition.onend = () => {
                    isRecording = false;
                    micBtn.classList.remove('active');
                };
                recognition.start();
            }
        };

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') window.sendMessage();
        };

        // البدء والتنفيذ
        setupSmartGreeting();
        loadChatHistory();
    </script>
</body>

</html>
