<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A5 AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap"
rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --bg:#070a12;
    --bg2:#0b1020;

    --sidebar:#0a0e18;

    --card:rgba(17,24,39,.72);

    --card2:rgba(20,29,48,.72);

    --input:#0c1220;

    --border:rgba(255,255,255,.08);

    --border-hover:rgba(129,140,248,.4);

    --text:#f8fafc;

    --muted:#8b98ad;

    --muted2:#64748b;

    --primary:#6366f1;

    --primary2:#8b5cf6;

    --blue:#3b82f6;

    --cyan:#06b6d4;

    --green:#22c55e;

    --red:#ef4444;

    --orange:#f59e0b;

    --shadow:0 25px 80px rgba(0,0,0,.35);

    --radius:18px;

}


/* =========================================================
   LIGHT
========================================================= */

body.light{

    --bg:#f5f7fb;

    --bg2:#eef2ff;

    --sidebar:#ffffff;

    --card:rgba(255,255,255,.82);

    --card2:#f8fafc;

    --input:#ffffff;

    --border:rgba(15,23,42,.09);

    --border-hover:rgba(79,70,229,.35);

    --text:#111827;

    --muted:#64748b;

    --muted2:#94a3b8;

    --shadow:0 20px 60px rgba(15,23,42,.08);

}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    height:100%;
}

body{

    min-height:100%;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(99,102,241,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(6,182,212,.09),
            transparent 25%
        ),
        var(--bg);

    color:var(--text);

    font-family:"Tajawal",sans-serif;

    overflow:hidden;

    transition:
        background .3s,
        color .3s;

}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:-2;

}

.glow{

    position:absolute;

    width:450px;

    height:450px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.12;

}

.glow.one{

    background:#6366f1;

    top:-250px;

    right:-120px;

}

.glow.two{

    background:#06b6d4;

    bottom:-280px;

    left:-150px;

}


/* =========================================================
   APP
========================================================= */

.app{

    height:100vh;

    display:flex;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

    width:270px;

    height:100vh;

    flex-shrink:0;

    background:rgba(8,12,21,.72);

    border-left:1px solid var(--border);

    backdrop-filter:blur(25px);

    display:flex;

    flex-direction:column;

    padding:18px;

    transition:.3s;

}

body.light .sidebar{
    background:rgba(255,255,255,.75);
}


/* LOGO */

.logo-area{

    display:flex;

    align-items:center;

    gap:11px;

    margin-bottom:22px;

}

.logo{

    width:43px;

    height:43px;

    border-radius:14px;

    display:grid;

    place-items:center;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6,
            #06b6d4
        );

    box-shadow:
        0 8px 30px rgba(99,102,241,.28);

    font-size:20px;

}

.logo-text strong{

    display:block;

    font-size:17px;

}

.logo-text span{

    color:var(--muted);

    font-size:11px;

}


/* NEW CHAT */

.new-chat{

    width:100%;

    border:1px solid rgba(129,140,248,.3);

    background:
        linear-gradient(
            135deg,
            rgba(99,102,241,.18),
            rgba(59,130,246,.1)
        );

    color:var(--text);

    border-radius:13px;

    padding:12px;

    font-weight:700;

    transition:.2s;

    margin-bottom:20px;

}

.new-chat:hover{

    border-color:var(--border-hover);

    transform:translateY(-1px);

}


/* SEARCH */

.search-box{

    position:relative;

    margin-bottom:15px;

}

.search-box input{

    width:100%;

    border:1px solid var(--border);

    background:var(--input);

    color:var(--text);

    border-radius:11px;

    padding:10px 38px 10px 12px;

    outline:none;

    font-size:13px;

}

.search-icon{

    position:absolute;

    right:12px;

    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

}


/* SESSIONS */

.session-title{

    color:var(--muted2);

    font-size:11px;

    margin:5px 5px 8px;

}

.sessions{

    flex:1;

    overflow-y:auto;

}

.sessions::-webkit-scrollbar{
    width:4px;
}

.sessions::-webkit-scrollbar-thumb{

    background:rgba(148,163,184,.2);

    border-radius:20px;

}

.session{

    width:100%;

    border:1px solid transparent;

    background:transparent;

    color:var(--muted);

    padding:11px;

    border-radius:11px;

    display:flex;

    align-items:center;

    gap:9px;

    text-align:right;

    margin-bottom:4px;

    transition:.2s;

}

.session:hover{

    background:rgba(255,255,255,.04);

    color:var(--text);

}

.session.active{

    background:rgba(99,102,241,.12);

    border-color:rgba(99,102,241,.18);

    color:var(--text);

}

.session-icon{

    width:27px;

    height:27px;

    display:grid;

    place-items:center;

    background:rgba(255,255,255,.04);

    border-radius:8px;

    flex-shrink:0;

}

.session-name{

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    flex:1;

    font-size:13px;

}


/* SIDEBAR BOTTOM */

.sidebar-bottom{

    border-top:1px solid var(--border);

    padding-top:13px;

}

.side-button{

    width:100%;

    border:0;

    background:transparent;

    color:var(--muted);

    padding:10px;

    border-radius:10px;

    text-align:right;

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:3px;

}

.side-button:hover{

    background:rgba(255,255,255,.05);

    color:var(--text);

}


/* =========================================================
   MAIN
========================================================= */

.main{

    flex:1;

    min-width:0;

    height:100vh;

    display:flex;

    flex-direction:column;

}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{

    height:68px;

    flex-shrink:0;

    border-bottom:1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    background:rgba(7,10,18,.45);

    backdrop-filter:blur(20px);

}

body.light .topbar{
    background:rgba(255,255,255,.45);
}

.top-title{

    display:flex;

    align-items:center;

    gap:10px;

}

.top-title-icon{

    width:35px;

    height:35px;

    display:grid;

    place-items:center;

    border-radius:10px;

    background:linear-gradient(
        135deg,
        rgba(99,102,241,.2),
        rgba(6,182,212,.12)
    );

}

.top-title strong{

    font-size:15px;

}

.top-title span{

    display:block;

    color:var(--muted);

    font-size:10px;

}


.top-actions{

    display:flex;

    gap:7px;

}

.top-button{

    width:38px;

    height:38px;

    border:1px solid var(--border);

    background:rgba(255,255,255,.03);

    color:var(--text);

    border-radius:10px;

}

.top-button:hover{

    border-color:var(--border-hover);

}


/* =========================================================
   CHAT AREA
========================================================= */

.chat-area{

    flex:1;

    min-height:0;

    display:flex;

    flex-direction:column;

}


/* =========================================================
   WELCOME
========================================================= */

.welcome{

    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:40px;

}

.welcome-inner{

    max-width:650px;

}

.welcome-logo{

    width:70px;

    height:70px;

    margin:0 auto 22px;

    display:grid;

    place-items:center;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6,
            #06b6d4
        );

    font-size:30px;

    box-shadow:
        0 20px 60px rgba(99,102,241,.25);

}

.welcome h1{

    font-size:clamp(30px,5vw,52px);

    line-height:1.1;

    margin-bottom:13px;

    background:
        linear-gradient(
            90deg,
            var(--text),
            #a78bfa,
            #67e8f9
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}

.welcome p{

    color:var(--muted);

    font-size:15px;

    line-height:1.8;

}


/* QUICK */

.quick-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    margin-top:28px;

}

.quick-card{

    border:1px solid var(--border);

    background:rgba(255,255,255,.025);

    color:var(--text);

    border-radius:13px;

    padding:15px 10px;

    text-align:center;

    transition:.2s;

}

.quick-card:hover{

    border-color:var(--border-hover);

    background:rgba(99,102,241,.07);

    transform:translateY(-2px);

}

.quick-card .icon{

    font-size:20px;

    display:block;

    margin-bottom:7px;

}

.quick-card span{

    color:var(--muted);

    font-size:11px;

}


/* =========================================================
   MESSAGES
========================================================= */

.messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:35px max(25px,calc((100% - 900px)/2));

}

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-thumb{

    background:rgba(148,163,184,.2);

    border-radius:20px;

}


/* MESSAGE */

.message-row{

    display:flex;

    gap:12px;

    margin-bottom:27px;

}

.message-row.user{

    justify-content:flex-start;

}

.message-row.ai{

    justify-content:flex-start;

}


/* AVATAR */

.avatar{

    width:34px;

    height:34px;

    flex-shrink:0;

    border-radius:11px;

    display:grid;

    place-items:center;

    font-size:14px;

    margin-top:2px;

}

.avatar.ai{

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #06b6d4
        );

}

.avatar.user{

    background:
        linear-gradient(
            135deg,
            #334155,
            #475569
        );

}


/* MESSAGE CONTENT */

.message-content{

    min-width:0;

    max-width:calc(100% - 46px);

}

.message-name{

    font-size:11px;

    color:var(--muted);

    margin-bottom:6px;

}

.bubble{

    line-height:1.9;

    font-size:14px;

    word-break:break-word;

}

.message-row.user .bubble{

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #2563eb
        );

    padding:11px 15px;

    border-radius:15px 15px 4px 15px;

    color:white;

}

.message-row.ai .bubble{

    color:var(--text);

}


/* CODE */

.bubble pre{

    direction:ltr;

    text-align:left;

    background:#050812;

    border:1px solid rgba(255,255,255,.08);

    border-radius:12px;

    padding:15px;

    overflow:auto;

    margin:13px 0;

}

.bubble code{

    font-family:"Fira Code",monospace;

    font-size:12px;

}

.bubble strong{

    font-weight:800;

}


/* TOOLS */

.message-tools{

    display:flex;

    gap:8px;

    margin-top:7px;

}

.tool{

    border:0;

    background:transparent;

    color:var(--muted2);

    font-size:10px;

    padding:3px 5px;

}

.tool:hover{

    color:var(--text);

}


/* TYPING */

.typing{

    display:flex;

    gap:5px;

    padding:8px 0;

}

.typing span{

    width:6px;

    height:6px;

    border-radius:50%;

    background:#8b5cf6;

    animation:typing 1s infinite;

}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-4px);
    }

}


/* =========================================================
   COMPOSER
========================================================= */

.composer-wrap{

    flex-shrink:0;

    padding:
        10px
        max(20px,calc((100% - 900px)/2))
        22px;

}

.composer{

    border:1px solid var(--border);

    background:rgba(12,18,32,.86);

    backdrop-filter:blur(20px);

    border-radius:18px;

    box-shadow:var(--shadow);

    overflow:hidden;

}

body.light .composer{
    background:rgba(255,255,255,.9);
}


/* QUICK ACTIONS */

.quick-actions{

    display:flex;

    gap:7px;

    padding:10px 12px 0;

    overflow-x:auto;

}

.quick{

    white-space:nowrap;

    border:1px solid var(--border);

    background:rgba(255,255,255,.025);

    color:var(--muted);

    border-radius:9px;

    padding:6px 9px;

    font-size:10px;

}

.quick:hover{

    color:var(--text);

    border-color:var(--border-hover);

}


/* INPUT */

.input-row{

    display:flex;

    gap:8px;

    padding:10px;

}

.chat-input{

    flex:1;

    min-width:0;

    resize:none;

    border:0;

    outline:none;

    background:transparent;

    color:var(--text);

    padding:10px 5px;

    min-height:42px;

    max-height:130px;

    line-height:1.6;

}

.chat-input::placeholder{

    color:var(--muted2);

}


/* INPUT BUTTON */

.input-button{

    width:42px;

    height:42px;

    flex-shrink:0;

    border:1px solid var(--border);

    background:rgba(255,255,255,.035);

    color:var(--text);

    border-radius:11px;

}

.input-button:hover{

    border-color:var(--border-hover);

}

.input-button.recording{

    background:rgba(239,68,68,.15);

    border-color:rgba(239,68,68,.5);

    color:#f87171;

}


/* SEND */

.send-button{

    width:42px;

    height:42px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #3b82f6
        );

    box-shadow:
        0 7px 20px rgba(99,102,241,.25);

}

.send-button:hover{

    transform:translateY(-1px);

}

.send-button:disabled{

    opacity:.4;

    transform:none;

}


/* STOP */

.stop-button{

    display:none;

    width:42px;

    height:42px;

    border:1px solid rgba(239,68,68,.3);

    background:rgba(239,68,68,.1);

    color:#f87171;

    border-radius:11px;

}

.stop-button.show{
    display:block;
}


/* FOOTER */

.composer-footer{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 13px 9px;

    color:var(--muted2);

    font-size:9px;

}

.webgpu-status{

    display:flex;

    align-items:center;

    gap:5px;

}

.status-dot{

    width:6px;

    height:6px;

    border-radius:50%;

    background:var(--orange);

}


/* =========================================================
   MOBILE
========================================================= */

.mobile-menu{

    display:none;

}


@media(max-width:800px){

    .sidebar{

        position:fixed;

        right:-290px;

        top:0;

        z-index:1000;

        width:270px;

        transition:.3s;

        box-shadow:-20px 0 60px rgba(0,0,0,.4);

    }

    .sidebar.open{
        right:0;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        padding:0 14px;
    }

    .messages{

        padding:
            25px
            15px;

    }

    .composer-wrap{

        padding:
            8px
            10px
            12px;

    }

    .quick-grid{

        grid-template-columns:
            repeat(2,1fr);

    }

    .welcome{

        padding:25px 18px;

    }

}


/* =========================================================
   SMALL
========================================================= */

@media(max-width:450px){

    .quick-actions{
        display:none;
    }

    .welcome h1{
        font-size:34px;
    }

    .welcome p{
        font-size:13px;
    }

    .quick-grid{
        gap:7px;
    }

}

</style>
</head>


<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>


<div class="app">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar" id="sidebar">


    <div class="logo-area">

        <div class="logo">
            ⚡
        </div>

        <div class="logo-text">

            <strong>A5 AI</strong>

            <span>Local Intelligence</span>

        </div>

    </div>


    <button
        class="new-chat"
        id="newChat"
    >
        ＋ محادثة جديدة
    </button>


    <div class="search-box">

        <span class="search-icon">
            🔎
        </span>

        <input
            id="searchInput"
            placeholder="البحث في المحادثات..."
        >

    </div>


    <div class="session-title">
        محادثاتك
    </div>


    <div
        class="sessions"
        id="sessions"
    ></div>


    <div class="sidebar-bottom">

        <button
            class="side-button"
            id="clearChats"
        >
            🗑️
            حذف المحادثات
        </button>


        <button
            class="side-button"
            id="exportChat"
        >
            📥
            تصدير المحادثة
        </button>


        <button
            class="side-button"
            id="themeButton"
        >
            🌙
            تغيير المظهر
        </button>

    </div>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- TOPBAR -->

    <header class="topbar">


        <div class="top-title">

            <button
                class="top-button mobile-menu"
                id="menuButton"
            >
                ☰
            </button>


            <div class="top-title-icon">
                🤖
            </div>


            <div>

                <strong>
                    A5
                </strong>

                <span>
                    ذكاء اصطناعي محلي
                </span>

            </div>

        </div>


        <div class="top-actions">

            <button
                class="top-button"
                id="clearCurrent"
                title="مسح المحادثة الحالية"
            >
                🧹
            </button>

        </div>

    </header>


    <!-- CHAT -->

    <section class="chat-area">


        <!-- WELCOME -->

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-inner">


                <div class="welcome-logo">
                    ⚡
                </div>


                <h1>
                    أهلاً بك في A5
                </h1>


                <p>
                    مساعد ذكاء اصطناعي يعمل محلياً داخل متصفحك.
                    اكتب فكرتك كما هي، ودع A5 يتعامل معها.
                </p>


                <div class="quick-grid">


                    <button
                        class="quick-card"
                        data-prompt="ساعدني في كتابة كود نظيف ومرتب"
                    >

                        <span class="icon">
                            💻
                        </span>

                        <span>
                            برمجة
                        </span>

                    </button>


                    <button
                        class="quick-card"
                        data-prompt="اشرح لي هذا الموضوع بطريقة بسيطة ومفهومة"
                    >

                        <span class="icon">
                            📚
                        </span>

                        <span>
                            شرح
                        </span>

                    </button>


                    <button
                        class="quick-card"
                        data-prompt="حلل هذه الفكرة بصراحة واذكر نقاط ضعفها"
                    >

                        <span class="icon">
                            🧠
                        </span>

                        <span>
                            تحليل
                        </span>

                    </button>


                    <button
                        class="quick-card"
                        data-prompt="اقترح لي فكرة مشروع قوية ومختلفة"
                    >

                        <span class="icon">
                            💡
                        </span>

                        <span>
                            أفكار
                        </span>

                    </button>


                </div>

            </div>

        </div>


        <!-- MESSAGES -->

        <div
            class="messages"
            id="messages"
            style="display:none"
        ></div>


        <!-- COMPOSER -->

        <div class="composer-wrap">


            <div class="composer">


                <div class="quick-actions">

                    <button
                        class="quick"
                        data-prompt="اكتب لي كود كامل ومنظم"
                    >
                        💻 كود
                    </button>

                    <button
                        class="quick"
                        data-prompt="اشرح لي هذا بالتفصيل وبطريقة سهلة"
                    >

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(text){

    return String(text)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;");

}


/* =========================================================
   MARKDOWN
========================================================= */

function renderText(text){

    let html =
        escapeHTML(text);


    html =
        html.replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"
        );


    html =
        html.replace(
            /`([^`]+)`/g,
            "<code>$1</code>"
        );


    html =
        html.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


    html =
        html.replace(
            /\n/g,
            "<br>"
        );


    return html;

}

        assistant:
            assistant.slice(0,700),

        time:
            Date.now()

    });


    if(memory.length > 25){

        memory =

    }


    saveMemory();

}

function getSessionName(chat,index){

    if(!chat.length){

        return `محادثة ${index+1}`;

    const first =
        chat.find(
            x =>
                x.role === "user"
        );

    if(!first){

        return `محادثة ${index+1}`;

    }

    return first.content
        .slice(0,30)
        .replace(/\n/g," ");

}

                search &&
                !name.toLowerCase()
                    .includes(search)
            ){

                return;

            }


            const button =
                document.createElement(
                    "button"
                );


            button.className =

            button.innerHTML = `

                <span class="session-icon">
                    💬
                </span>

                <span class="session-name">
                    ${escapeHTML(name)}

            button.onclick = ()=>{

async function initAI(){

/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

    if(generating){
        return;
    }


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    if(!engine){

        statusText.textContent =
            "تشغيل A5...";

        await initAI();


        if(!engine){

            drawAI(
                "لم أستطع تشغيل النموذج المحلي. تأكد من أن المتصفح يدعم WebGPU وأن جهازك يستطيع تشغيل النموذج."
            );

            return;

        }

    }


    drawUser(text,true);

    input.value = "";

    resizeInput();


    generating = true;

    sendButton.disabled = true;

    stopButton.classList.add(
        "show"
    );


    statusText.textContent =
        "A5 يفكر...";


    statusDot.style.background =
        "#f59e0b";


    controller =
        new AbortController();


    const placeholder =
        createPlaceholder();


    try{

        const history =
            sessions[currentSession]
                .map(
                    m=>({

                        role:m.role,

                        content:m.content

                    })
                );


        const messages = [

            {

                role:"system",

                content:
                    systemPrompt()

            },

            ...history

        ];


        const stream =
            await engine.chat
                .completions
                .create({

                    messages,

                    temperature:.75,

                    top_p:.9,

                    repetition_penalty:1.08,

                    max_tokens:1200,

                    stream:true

                });


        let answer = "";


        placeholder.bubble.innerHTML =
            "";


        for await(
            const chunk of stream
        ){

            if(
                controller.signal.aborted
            ){

                break;

            }


            const piece =
                chunk
                    ?.choices?.[0]
                    ?.delta?.content
                    || "";


            if(!piece){
                continue;
            }


            answer += piece;


            placeholder.bubble.innerHTML =
                renderText(answer);


            scrollBottom();

        }


        if(
            controller.signal.aborted
        ){

            answer +=
                "\n\n[تم إيقاف التوليد]";

        }


        if(!answer.trim()){

            answer =
                "لم ينتج A5 رداً هذه المرة.";

        }


        placeholder.bubble.innerHTML =
            renderText(answer);


        sessions[currentSession]
            .push({

                role:"assistant",

                content:answer

            });


        saveSessions();


        addMemory(
            text,
            answer
        );


        addTools(
            placeholder.row,
            answer
        );


    }catch(error){

        console.error(error);


        placeholder.bubble.innerHTML =
            renderText(
                "حدث خطأ أثناء توليد الرد."
            );

    }finally{

        generating = false;

        controller = null;

        sendButton.disabled = false;

        stopButton.classList.remove(
            "show"
        );

        statusText.textContent =
            "A5 جاهز";

        statusDot.style.background =
            "#22c55e";

        input.focus();

    }

}

/* =========================================================
   VOICE
========================================================= */

micButton.onclick =
    ()=>{

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if(!SpeechRecognition){

            alert(
                "التعرف على الصوت غير متاح في هذا المتصفح."
            );

            return;

        }


        if(recording){

            recognition?.stop();

            return;

        }


        recognition =
            new SpeechRecognition();


        recognition.lang =
            "ar-SA";

        recognition.continuous =
            false;

        recognition.interimResults =
            true;


        recognition.onstart =
            ()=>{

                recording = true;

                micButton.classList.add(
                    "recording"
                );

                statusText.textContent =
                    "A5 يستمع...";

            };


        recognition.onresult =
            event=>{

                let result = "";

                for(
                    let i =
                        event.resultIndex;

                    i <
                        event.results.length;

                    i++
                ){

                    result +=
                        event
                            .results[i][0]
                            .transcript;

                }


                input.value =
                    result;

                resizeInput();

            };


        recognition.onend =
            ()=>{

                recording = false;

                micButton.classList.remove(
                    "recording"
                );

                statusText.textContent =
                    "A5 جاهز";

            };


        recognition.onerror =
            ()=>{

                recording = false;

                micButton.classList.remove(
                    "recording"
                );

                statusText.textContent =
                    "A5 جاهز";

            };


        recognition.start();

    };

function speakText(text){

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }


    speechSynthesis.cancel();


    const clean =
        text
            .replace(
                /```[\s\S]*?```/g,
                "كود"
            )
            .replace(
                /[*_#`]/g,
                ""
            );


    const voice =
        new SpeechSynthesisUtterance(
            clean
        );


    voice.lang =
        "ar-SA";

    voice.rate =
        .95;


    speechSynthesis.speak(
        voice
    );

}


/* =========================================================
   THEME
========================================================= */

const savedTheme =
    localStorage.getItem(
        "a5_theme"
    );


if(savedTheme === "light"){

    document.body.classList.add(
        "light"
    );

}


$("themeButton").onclick =
    ()=>{

        document.body.classList.toggle(
            "light"
        );


        const light =
            document.body.classList.contains(
                "light"
            );


        localStorage.setItem(
            "a5_theme",
            light
                ? "light"
                : "dark"
        );

    };
