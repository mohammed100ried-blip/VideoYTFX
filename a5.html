<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A5 AI - المساعد الصارم</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #05070d;
            --panel: rgba(10,15,27,.86);
            --border: rgba(255,255,255,.08);
            --text: #f8fafc;
            --muted: #94a3b8;
            --muted2: #64748b;
            --primary: #6366f1;
            --red: #ef4444;
            --green: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; }
        body {
            overflow: hidden;
            color: var(--text);
            font-family: "Tajawal", sans-serif;
            background: radial-gradient(circle at 10% 0%, rgba(99,102,241,.18), transparent 30%), var(--bg);
        }

        .app { width: 100%; height: 100vh; display: flex; }

        .sidebar {
            width: 280px; height: 100vh; flex-shrink: 0; display: flex; flex-direction: column;
            padding: 18px; background: var(--panel); border-left: 1px solid var(--border); backdrop-filter: blur(25px);
        }

        .logo-area { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; }
        .logo { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); font-size: 20px; }
        .logo-title { font-size: 18px; font-weight: 800; }
        .logo-sub { color: var(--muted); font-size: 10px; }

        .new-chat {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid rgba(99,102,241,.3);
            border-radius: 12px; background: rgba(99,102,241,.12); color: var(--text); font-weight: 700; cursor: pointer;
        }

        .sessions { flex: 1; overflow-y: auto; }
        .session {
            width: 100%; padding: 10px; margin-bottom: 4px; border: 1px solid transparent;
            border-radius: 10px; background: transparent; color: var(--muted); text-align: right; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px;
        }
        .session.active { background: rgba(99,102,241,.12); border-color: rgba(99,102,241,.2); color: var(--text); }

        .main { flex: 1; height: 100vh; display: flex; flex-direction: column; }
        .topbar { height: 60px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); }
        .topbar h2 { font-size: 16px; font-weight: 700; }

        .messages { flex: 1; overflow-y: auto; padding: 25px max(18px, calc((100% - 850px)/2)); }
        .message { display: flex; gap: 12px; margin-bottom: 24px; }
        .avatar { width: 36px; height: 36px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; font-size: 14px; }
        .avatar.ai { background: linear-gradient(135deg, #6366f1, #06b6d4); }
        .avatar.user { background: #334155; }
        .message-body { max-width: calc(100% - 48px); }
        .bubble { font-size: 14px; line-height: 1.8; word-break: break-word; }
        .message.user .bubble { padding: 10px 14px; border-radius: 14px 14px 2px 14px; background: #312e81; color: white; }

        .composer-wrap { padding: 15px max(18px, calc((100% - 850px)/2)); }
        .composer { border: 1px solid var(--border); border-radius: 16px; background: var(--panel); backdrop-filter: blur(20px); padding: 10px; }
        .input-row { display: flex; gap: 8px; align-items: center; }
        .input { flex: 1; resize: none; outline: none; border: 0; background: transparent; color: var(--text); padding: 8px; font-size: 14px; }
        .send { width: 40px; height: 40px; border: 0; border-radius: 10px; background: #6366f1; color: white; cursor: pointer; }
        .status { padding: 6px 8px 0; color: var(--muted2); font-size: 10px; display: flex; justify-content: space-between; }
    </style>
</head>

<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo">⚡</div>
            <div>
                <div class="logo-title">A5 AI</div>
                <div class="logo-sub">مساعد صارم ومباشر</div>
            </div>
        </div>
        <button class="new-chat" id="newChat">＋ محادثة جديدة</button>
        <div class="sessions" id="sessions"></div>
    </aside>

    <main class="main">
        <header class="topbar">
            <h2>A5 - التحليل المباشر والصريح</h2>
        </header>

        <section class="messages" id="messages"></section>

        <div class="composer-wrap">
            <div class="composer">
                <div class="input-row">
                    <textarea class="input" id="input" rows="1" placeholder="اكتب سؤالك أو فكرتك لـ A5..."></textarea>
                    <button class="send" id="send">➤</button>
                </div>
                <div class="status">
                    <span id="status">جاري تحميل المحرك المحلي...</span>
                    <span>WebGPU Enabled</span>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

const MODEL = "Llama-3.2-3B-Instruct-q4f16_1-MLC";
const $ = id => document.getElementById(id);

let engine = null;
let sessions = [[]];
let current = 0;

// تعليمات النظام الأساسية للنموذج للصراحة والصرامة
function systemPrompt() {
    return `أنت A5، مساعد ذكي صارم ومباشر للغاية.
قواعدك الأساسية:
1. ممنوع المجاملة، المداهنة، أو النفاق تماماً.
2. إذا كانت فكرة المستخدم ضعيفة، غير منطقية، أو تحتوي على أخطاء، قم بنقدها بصراحة قاطعة ومباشرة وبكلام حاد عند الضرورة لبيان موضع الخلل.
3. قدم الحلول العملية فوراً دون مقدمات فارغة أو ترحيبات مطولة.
4. حافظ على المستوى المهني دون استخدام أساليب السب، بل ركز القسوة في النقد العلمي والمنطقي.`;
}

function renderChat() {
    const messagesEl = $("messages");
    messagesEl.innerHTML = "";
    const chat = sessions[current] || [];

    chat.forEach(msg => {
        const row = document.createElement("div");
        row.className = `message ${msg.role}`;
        row.innerHTML = `
            <div class="avatar ${msg.role}">${msg.role === 'user' ? '👤' : '⚡'}</div>
            <div class="message-body">
                <div class="bubble">${msg.content.replace(/\n/g, '<br>')}</div>
            </div>
        `;
        messagesEl.appendChild(row);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function init() {
    try {
        engine = await CreateMLCEngine(MODEL, {
            initProgressCallback: (p) => {
                $("status").innerText = `جاري التحميل: ${Math.round(p.progress * 100)}%`;
            }
        });
        $("status").innerText = "A5 جاهز للعمل محلياً.";
    } catch (e) {
        $("status").innerText = "خطأ: يتطلب المتصفح دعم WebGPU.";
    }
}

async function send() {
    const text = $("input").value.trim();
    if (!text || !engine) return;

    sessions[current].push({ role: "user", content: text });
    $("input").value = "";
    renderChat();

    const history = [
        { role: "system", content: systemPrompt() },
        ...sessions[current]
    ];

    const aiMsg = { role: "assistant", content: "" };
    sessions[current].push(aiMsg);

    const completion = await engine.chat.completions.create({
        messages: history,
        stream: true,
        temperature: 0.5
    });

    for await (const chunk of completion) {
        aiMsg.content += chunk.choices[0]?.delta?.content || "";
        renderChat();
    }
}

$("send").onclick = send;
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
$("newChat").onclick = () => { sessions.push([]); current = sessions.length - 1; renderChat(); };

init();
</script>

</body>
</html>
