<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A5 AI - VideoYTFX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #162447, #080b14 55%);
            color: white;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 20px auto;
            border-radius: 20px;
            background: #1877f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: bold;
            box-shadow: 0 10px 35px rgba(24,119,242,.35);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aeb7c7;
            font-size: 17px;
            margin-bottom: 40px;
        }

        .ai-box {
            background: rgba(20,27,43,.9);
            border: 1px solid #27334d;
            border-radius: 22px;
            padding: 40px 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .ai-box h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .ai-box p {
            color: #aeb7c7;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .chat {
            display: flex;
            gap: 10px;
            max-width: 650px;
            margin: auto;
        }

        .chat input {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #34415d;
            background: #0d1320;
            color: white;
            outline: none;
            font-size: 16px;
        }

        .chat button {
            padding: 15px 22px;
            border: none;
            border-radius: 12px;
            background: #1877f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .chat button:hover {
            background: #2685ff;
        }

        #response {
            margin-top: 25px;
            color: #cbd5e1;
            min-height: 25px;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            color: #8ea7d8;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 35px;
            }

            .chat {
                flex-direction: column;
            }

            .chat button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">A5</div>

        <h1>A5 AI</h1>

        <p class="subtitle">
            Your AI assistant inside VideoYTFX.
        </p>

        <div class="ai-box">

            <h2>Ask A5</h2>

            <p>
                Ask anything and A5 will help you.
            </p>

            <div class="chat">
                <input
                    id="question"
                    type="text"
                    placeholder="Write your question..."
                >

                <button onclick="askA5()">
                    Ask A5
                </button>
            </div>

            <div id="response"></div>

        </div>

        <a class="back" href="index.html">
            ← Back to Home
        </a>

    </div>

    <script>
        function askA5() {
            const question = document.getElementById("question").value;
            const response = document.getElementById("response");

            if (!question.trim()) {
                response.textContent = "Please write a question first.";
                return;
            }

            response.textContent =
                "A5 AI is coming soon...";
        }
    </script>

</body>
</html>
