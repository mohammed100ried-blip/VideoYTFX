<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A5 AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07090e;
            --sidebar: #0b0e15;
            --panel: #10141d;
            --panel2: #151a24;
            --border: rgba(255,255,255,.09);
            --text: #f4f7fb;
            --muted: #8993a5;
            --accent: #6d7cff;
            --accent2: #9a5cff;
            --danger: #ff5577;
            --success: #35d07f;
            --user: #202838;
            --assistant: #111721;
            --shadow: 0 20px 70px rgba(0,0,0,.35);
        }

        body.light {
            --bg: #f5f7fb;
            --sidebar: #ffffff;
            --panel: #ffffff;
            --panel2: #f1f4f8;
            --border: rgba(10,20,40,.10);
            --text: #111827;
            --muted: #667085;
            --user: #e9edff;
            --assistant: #ffffff;
            --shadow: 0 20px 60px rgba(30,40,70,.10);
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(109,124,255,.12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(154,92,255,.10),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);
            font-family:
                Arial,
                "Segoe UI",
                Tahoma,
                sans-serif;

            transition:
                background .25s,
                color .25s;
        }

        button,
        textarea,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* ======================================
           APP
        ====================================== */

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ======================================
           SIDEBAR
        ====================================== */

        .sidebar {
            width: 285px;
            min-width: 285px;
            height: 100%;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,.025),
                    transparent
                ),
                var(--sidebar);

            border-left: 1px solid var(--border);

            display: flex;
            flex-direction: column;

            padding: 16px;

            transition:
                transform .3s ease,
                width .3s ease;
        }

        html[dir="ltr"] .sidebar {
            border-left: 0;
            border-right: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            padding: 5px 5px 20px;
        }

        .logo {
            width: 43px;
            height: 43px;

            display: grid;
            place-items: center;

            border-radius: 14px;

            color: white;
            font-size: 19px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            box-shadow:
                0 10px 30px
                rgba(109,124,255,.25);
        }

        .brand-text strong {
            display: block;
            font-size: 18px;
        }

        .brand-text span {
            display: block;
            margin-top: 2px;

            color: var(--muted);
            font-size: 11px;
        }

        .new-chat {
            width: 100%;
            height: 45px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    rgba(109,124,255,.18),
                    rgba(154,92,255,.12)
                );

            color: var(--text);

            font-weight: 800;

            transition: .2s;
        }

        .new-chat:hover {
            transform: translateY(-2px);
            border-color: rgba(109,124,255,.45);
        }

        .search-box {
            margin: 14px 0;
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 40px;

            padding: 0 38px 0 12px;

            border:
                1px solid
                var(--border);

            border-radius: 10px;

            outline: none;

            background:
                rgba(255,255,255,.035);

            color: var(--text);
        }

        html[dir="ltr"] .search-box input {
            padding:
                0 12px 0 38px;
        }

        .search-icon {
            position: absolute;
            top: 10px;
            right: 12px;
            color: var(--muted);
        }

        html[dir="ltr"] .search-icon {
            right: auto;
            left: 12px;
        }

        .sessions-title {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;

            padding: 5px 4px 9px;
        }

        .sessions {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
        }

        .session {
            width: 100%;

            padding: 11px;

            margin-bottom: 6px;

            border:
                1px solid
                transparent;

            border-radius: 11px;

            background:
                transparent;

            color: var(--text);

            text-align: start;

            transition: .18s;

            overflow: hidden;
        }

        .session:hover {
            background:
                rgba(255,255,255,.045);

            border-color:
                var(--border);
        }

        .session.active {
            background:
                rgba(109,124,255,.12);

            border-color:
                rgba(109,124,255,.25);
        }

        .session-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            font-size: 13px;
            font-weight: 700;
        }

        .session-preview {
            color: var(--muted);

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            font-size: 11px;

            margin-top: 5px;
        }

        .sidebar-bottom {
            display: grid;
            gap: 7px;

            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .side-button {
            height: 39px;

            border:
                1px solid
                var(--border);

            border-radius: 10px;

            background:
                rgba(255,255,255,.03);

            color: var(--text);

            font-weight: 700;

            transition: .2s;
        }

        .side-button:hover {
            background:
                rgba(255,255,255,.07);
        }

        .danger:hover {
            border-color:
                rgba(255,85,119,.4);

            color:
                #ff6b88;
        }

        /* ======================================
           MAIN
        ====================================== */

        .main {
            flex: 1;
            min-width: 0;

            height: 100%;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        .topbar {
            height: 66px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            border-bottom:
                1px solid
                var(--border);

            background:
                rgba(10,13,20,.55);

            backdrop-filter:
                blur(18px);
        }

        body.light .topbar {
            background:
                rgba(255,255,255,.7);
        }

        .top-left,
        .top-right {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .mobile-menu {
            display: none;
        }

        .icon-button {
            width: 39px;
            height: 39px;

            display: grid;
            place-items: center;

            border:
                1px solid
                var(--border);

            border-radius: 10px;

            background:
                rgba(255,255,255,.03);

            color: var(--text);

            font-size: 17px;
        }

        .model-name {
            font-size: 13px;
            font-weight: 800;
        }

        .online {
            display: flex;
            align-items: center;
            gap: 7px;

            color: var(--muted);
            font-size: 11px;
        }

        .online-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 12px
                rgba(53,208,127,.7);
        }

        /* ======================================
           CHAT
        ====================================== */

        .chat {
            flex: 1;
            overflow-y: auto;

            padding: 30px 20px 180px;
        }

        .chat-inner {
            width: min(900px, 100%);
            margin: auto;
        }

        .welcome {
            min-height: 55vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .welcome-logo {
            width: 75px;
            height: 75px;

            display: grid;
            place-items: center;

            border-radius: 25px;

            font-size: 28px;
            font-weight: 900;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            box-shadow:
                0 20px 55px
                rgba(109,124,255,.25);

            margin-bottom: 22px;
        }

        .welcome h1 {
            font-size:
                clamp(29px, 5vw, 48px);

            margin-bottom: 10px;
        }

        .welcome h1 span {
            background:
                linear-gradient(
                    90deg,
                    var(--accent),
                    var(--accent2)
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .welcome p {
            max-width: 600px;

            color: var(--muted);

            line-height: 1.8;

            font-size: 14px;
        }

        .quick-grid {
            width: min(720px, 100%);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 8px;

            margin-top: 25px;
        }

        .quick {
            min-height: 65px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.035);

            color: var(--text);

            font-size: 12px;
            font-weight: 700;

            transition: .2s;
        }

        .quick:hover {
            transform: translateY(-2px);

            border-color:
                rgba(109,124,255,.4);

            background:
                rgba(109,124,255,.08);
        }

        /* ======================================
           MESSAGES
        ====================================== */

        .messages {
            display: grid;
            gap: 22px;
        }

        .message {
            display: flex;
            gap: 12px;

            animation:
                messageIn .25s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 35px;
            height: 35px;

            min-width: 35px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            font-size: 13px;
            font-weight: 900;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
        }

        .message.user .message-avatar {
            background:
                #30394b;
        }

        .message-body {
            min-width: 0;
            max-width: min(780px, 90%);

            padding:
                13px 16px;

            border:
                1px solid
                var(--border);

            border-radius: 15px;

            background:
                var(--assistant);

            line-height: 1.8;

            font-size: 14px;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,.08);
        }

        .message.user .message-body {
            background:
                var(--user);
        }

        .message-tools {
            display: flex;
            gap: 6px;

            margin-top: 10px;
        }

        .message-tool {
            border: 0;

            background:
                transparent;

            color: var(--muted);

            font-size: 11px;

            padding: 4px 6px;

            border-radius: 6px;
        }

        .message-tool:hover {
            color: var(--text);
            background:
                rgba(255,255,255,.06);
        }

        pre {
            direction: ltr;
            text-align: left;

            overflow-x: auto;

            padding: 14px;

            margin: 12px 0;

            border-radius: 10px;

            background:
                #070a10;

            border:
                1px solid
                rgba(255,255,255,.08);

            font-family:
                Consolas,
                monospace;

            line-height: 1.6;
        }

        code {
            font-family:
                Consolas,
                monospace;

            background:
                rgba(255,255,255,.06);

            padding:
                2px 5px;

            border-radius: 5px;
        }

        pre code {
            background: transparent;
            padding: 0;
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            padding: 5px 0;
        }

        .typing span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--muted);

            animation:
                typing 1s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: .4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* ======================================
           COMPOSER
        ====================================== */

        .composer-wrap {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                0 20px
                20px;

            background:
                linear-gradient(
                    transparent,
                    var(--bg) 35%
                );
        }

        .composer {
            width: min(900px, 100%);
            margin: auto;

            padding-top: 25px;
        }

        .quick-actions {
            display: flex;
            gap: 7px;

            overflow-x: auto;

            padding-bottom: 9px;
        }

        .quick-action {
            flex: 0 0 auto;

            border:
                1px solid
                var(--border);

            border-radius: 9px;

            background:
                rgba(255,255,255,.035);

            color: var(--muted);

            padding:
                7px 10px;

            font-size: 11px;
        }

        .quick-action:hover {
            color: var(--text);
            border-color:
                rgba(109,124,255,.35);
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;

            padding: 9px;

            border:
                1px solid
                var(--border);

            border-radius: 17px;

            background:
                var(--panel);

            box-shadow:
                var(--shadow);
        }

        .input {
            flex: 1;

            min-height: 42px;
            max-height: 150px;

            resize: none;

            border: 0;
            outline: 0;

            background: transparent;

            color: var(--text);

            line-height: 1.6;

            padding:
                9px 5px;
        }

        .input::placeholder {
            color: var(--muted);
        }

        .input-button,
        .send,
        .stop {
            width: 42px;
            height: 42px;

            min-width: 42px;

            display: grid;
            place-items: center;

            border: 0;

            border-radius: 11px;
        }

        .input-button {
            background:
                rgba(255,255,255,.05);

            color: var(--text);
        }

        .send {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );

            box-shadow:
                0 8px 22px
                rgba(109,124,255,.25);

            transition: .2s;
        }

        .send:hover:not(:disabled) {
            transform: scale(1.04);
        }

        .send:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .stop {
            display: none;

            color: white;

            background:
                var(--danger);
        }

        .stop.show {
            display: grid;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;

            color: var(--muted);

            font-size: 10px;

            padding:
                8px 4px 0;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                var(--success);
        }

        .status-dot.busy {
            background:
                #f5a623;

            box-shadow:
                0 0 10px
                rgba(245,166,35,.6);
        }

        .status-dot.error {
            background:
                var(--danger);
        }

        /* ======================================
           MOBILE
        ====================================== */

        @media (max-width: 800px) {

            .sidebar {
                position: fixed;

                top: 0;
                bottom: 0;

                right: 0;

                z-index: 100;

                box-shadow:
                    -20px 0 60px
                    rgba(0,0,0,.35);

                transform:
                    translateX(105%);
            }

            html[dir="ltr"] .sidebar {
                right: auto;
                left: 0;

                transform:
                    translateX(-105%);
            }

            .sidebar.open {
                transform:
                    translateX(0);
            }

            .mobile-menu {
                display: grid;
            }

            .quick-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .topbar {
                padding:
                    0 12px;
            }

            .chat {
                padding:
                    20px 12px 185px;
            }

            .composer-wrap {
                padding:
                    0 10px
                    12px;
            }

            .model-name {
                display: none;
            }
        }

        @media (max-width: 450px) {

            .quick-grid {
                grid-template-columns: 1fr 1fr;
            }

            .welcome p {
                font-size: 13px;
            }

            .message-body {
                max-width: 88%;
                font-size: 13px;
            }
        }
    </style>
</head>


<body>

<div class="app">

    <!-- ==================================
         SIDEBAR
    ================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="logo">
                A5
            </div>

            <div class="brand-text">
                <strong>A5 AI</strong>
                <span>Personal Intelligence</span>
            </div>

        </div>


        <button
            class="new-chat"
            id="newChat"
        >
            ＋ محادثة جديدة
        </button>


        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                id="search"
                type="text"
                placeholder="البحث في المحادثات..."
            >

        </div>


        <div class="sessions-title">
            المحادثات
        </div>


        <div
            class="sessions"
            id="sessions"
        ></div>


        <div class="sidebar-bottom">

            <button
                class="side-button"
                id="export"
            >
                ⇩ تصدير المحادثة
            </button>

            <button
                class="side-button"
                id="theme"
            >
                ◐ المظهر
            </button>

            <button
                class="side-button danger"
                id="clearCurrent"
            >
                حذف المحادثة الحالية
            </button>

            <button
                class="side-button danger"
                id="clearAll"
            >
                حذف كل المحادثات
            </button>

        </div>

    </aside>


    <!-- ==================================
         MAIN
    ================================== -->

    <main class="main">

        <header class="topbar">

            <div class="top-left">

                <button
                    class="icon-button mobile-menu"
                    id="menu"
                >
                    ☰
                </button>

                <div class="model-name">
                    A5 Intelligence
                </div>

                <div class="online">

                    <span
                        class="online-dot"
                        id="statusDot"
                    ></span>

                    <span id="status">
                        جاهز
                    </span>

                </div>

            </div>


            <div class="top-right">

                <button
                    class="icon-button"
                    id="language"
                    title="Language"
                >
                    EN
                </button>

                <button
                    class="icon-button"
                    id="voiceOutput"
                    title="Voice"
                >
                    🔊
                </button>

            </div>

        </header>


        <!-- ==================================
             CHAT
        ================================== -->

        <section
            class="chat"
            id="chat"
        >

            <div class="chat-inner">

                <!-- WELCOME -->

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        A5
                    </div>

                    <h1>
                        أنا <span>A5</span>
                    </h1>

                    <p>
                        مساعدك الذكي للتحليل، البرمجة،
                        التفكير النقدي، البحث، وصناعة الأفكار.
                        لن أوافق على فكرتك لمجرد أنها فكرتك.
                    </p>


                    <div class="quick-grid">

                        <button
                            class="quick"
                            data-prompt="حلل فكرتي بعمق وابحث عن نقاط ضعفها."
                        >
                            🧠 تحليل
                        </button>

                        <button
                            class="quick"
                            data-prompt="راجع الكود الذي سأرسله وابحث عن الأخطاء والمشاكل."
                        >
                            💻 برمجة
                        </button>

                        <button
                            class="quick"
                            data-prompt="أعطني الحقيقة مباشرة بدون مجاملة."
                        >
                            ⚔️ صراحة
                        </button>

                        <button
                            class="quick"
                            data-prompt="ساعدني في بناء خطة عملية خطوة بخطوة."
                        >
                            🎯 خطة
                        </button>

                    </div>

                </div>


                <!-- MESSAGES -->

                <div
                    class="messages"
                    id="messages"
                ></div>

            </div>

        </section>


        <!-- ==================================
             COMPOSER
        ================================== -->

        <div class="composer-wrap">

            <div class="composer">

                <div class="quick-actions">

                    <button
                        class="quick-action"
                        data-prompt="انتقد فكرتي بصراحة."
                    >
                        🧠 نقد
                    </button>

                    <button
                        class="quick-action"
                        data-prompt="راجع الكود وابحث عن الأخطاء."
                    >
                        💻 كود
                    </button>

                    <button
                        class="quick-action"
                        data-prompt="قل لي أين أخطأت بالتحديد."
                    >
                        🎯 خطأ
                    </button>

                    <button
                        class="quick-action"
                        data-prompt="لا تجاملني وأعطني الحقيقة."
                    >
                        ⚔️ صراحة
                    </button>

                </div>


                <div class="input-box">

                    <button
                        class="input-button"
                        id="mic"
                        title="الصوت"
                    >
                        🎙️
                    </button>


                    <textarea
                        class="input"
                        id="input"
                        rows="1"
                        placeholder="اكتب لـ A5..."
                    ></textarea>


                    <button
                        class="stop"
                        id="stop"
                    >
                        ■
                    </button>


                    <button
                        class="send"
                        id="send"
                        disabled
                    >
                        ➤
                    </button>

                </div>


                <div class="status">

                    <div class="status-left">

                        <span
                            class="status-dot"
                            id="statusDotBottom"
                        ></span>

                        <span id="statusBottom">
                            A5 جاهز
                        </span>

                    </div>

                    <span>
                        A5 • Cloud Intelligence
                    </span>

                </div>

            </div>

        </div>

    </main>

</div>


<script>

    /* =====================================================
       A5 CONFIG
    ===================================================== */

    const API_ENDPOINT = "/api/chat";

    const MAX_HISTORY = 40;

    const MAX_MEMORY = 25;


    /*
     * شخصية A5.
     *
     * هذه ليست مفتاح API.
     * يمكن تعديلها لاحقًا من Backend.
     */

    const A5_SYSTEM_PROMPT = `
أنت A5، مساعد ذكاء اصطناعي متطور.

مهمتك:
- فهم طلب المستخدم قبل الإجابة.
- التفكير بشكل منطقي ومنظم.
- عدم الموافقة على المستخدم لمجرد إرضائه.
- كشف الأخطاء والافتراضات الضعيفة.
- تقديم حلول عملية وقابلة للتنفيذ.
- عند البرمجة، أعطِ كودًا كاملًا عندما يكون ذلك مناسبًا.
- لا تدّعي أنك نفذت شيئًا لم تنفذه.
- إذا كانت المعلومة غير مؤكدة، وضّح ذلك.
- كن مباشرًا وواضحًا.
- انتقد الفكرة وليس الشخص.
- استخدم لغة المستخدم.
`;


    /* =====================================================
       DOM
    ===================================================== */

    const $ = id =>
        document.getElementById(id);


    const sidebar =
        $("sidebar");

    const sessionsEl =
        $("sessions");

    const search =
        $("search");

    const chat =
        $("chat");

    const welcome =
        $("welcome");

    const messagesEl =
        $("messages");

    const input =
        $("input");

    const send =
        $("send");

    const stop =
        $("stop");

    const mic =
        $("mic");

    const status =
        $("status");

    const statusBottom =
        $("statusBottom");

    const statusDot =
        $("statusDot");

    const statusDotBottom =
        $("statusDotBottom");


    /* =====================================================
       STATE
    ===================================================== */

    let sessions =
        load(
            "a5_sessions",
            [[]]
        );


    let memory =
        load(
            "a5_memory",
            []
        );


    let current =
        Number(
            localStorage.getItem(
                "a5_current"
            ) || 0
        );


    let generating =
        false;


    let controller =
        null;


    let recognition =
        null;


    let voiceEnabled =
        localStorage.getItem(
            "a5_voice"
        ) !== "false";


    let language =
        localStorage.getItem(
            "a5_language"
        ) || "ar";


    if (
        !Array.isArray(sessions) ||
        sessions.length === 0
    ) {
        sessions = [[]];
    }


    if (
        !Array.isArray(memory)
    ) {
        memory = [];
    }


    if (
        current < 0 ||
        current >= sessions.length
    ) {
        current = 0;
    }


    /* =====================================================
       STORAGE
    ===================================================== */

    function load(
        key,
        fallback
    ) {

        try {

            const value =
                localStorage.getItem(
                    key
                );

            if (!value) {
                return fallback;
            }

            const parsed =
                JSON.parse(value);

            return parsed ?? fallback;

        } catch {

            return fallback;

        }

    }


    function save() {

        try {

            localStorage.setItem(
                "a5_sessions",
                JSON.stringify(
                    sessions
                )
            );


            localStorage.setItem(
                "a5_memory",
                JSON.stringify(
                    memory
                )
            );


            localStorage.setItem(
                "a5_current",
                String(current)
            );

        } catch (error) {

            console.error(
                "A5 storage error:",
                error
            );

        }

    }


    /* =====================================================
       SECURITY / MARKDOWN
    ===================================================== */

    function escapeHTML(text) {

        return String(text)
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );

    }


    function renderMarkdown(text) {

        let value =
            escapeHTML(
                text
            );


        const codeBlocks = [];


        value =
            value.replace(
                /```([\s\S]*?)```/g,
                (_, code) => {

                    const token =
                        `___A5CODE${codeBlocks.length}___`;

                    codeBlocks.push(
                        code.trim()
                    );

                    return token;

                }
            );


        value =
            value.replace(
                /`([^`]+)`/g,
                "<code>$1</code>"
            );


        value =
            value.replace(
                /\*\*(.*?)\*\*/g,
                "<strong>$1</strong>"
            );


        value =
            value.replace(
                /\n/g,
                "<br>"
            );


        codeBlocks.forEach(
            (code, index) => {

                const token =
                    `___A5CODE${index}___`;

                value =
                    value.replace(
                        token,
                        `<pre><code>${code}</code></pre>`
                    );

            }
        );


        return value;

    }


    /* =====================================================
       STATUS
    ===================================================== */

    function setStatus(
        text,
        type = "ready"
    ) {

        status.textContent =
            text;

        statusBottom.textContent =
            text;


        statusDot.className =
            "online-dot";

        statusDotBottom.className =
            "status-dot";


        if (
            type === "busy"
        ) {

            statusDot.classList.add(
                "busy"
            );

            statusDotBottom.classList.add(
                "busy"
            );

        }


        if (
            type === "error"
        ) {

            statusDot.classList.add(
                "error"
            );

            statusDotBottom.classList.add(
                "error"
            );

        }

    }


    /* =====================================================
       SESSION RENDER
    ===================================================== */

    function getSessionTitle(
        session
    ) {

        const first =
            session.find(
                message =>
                    message.role ===
                    "user"
            );


        if (!first) {
            return "محادثة جديدة";
        }


        return first.content
            .replace(
                /\s+/g,
                " "
            )
            .trim()
            .slice(
                0,
                42
            );

    }


    function renderSessions() {

        sessionsEl.innerHTML =
            "";


        const query =
            search.value
                .trim()
                .toLowerCase();


        sessions.forEach(
            (session, index) => {

                const title =
                    getSessionTitle(
                        session
                    );


                const preview =
                    session.length
                        ? session[
                            session.length - 1
                          ].content
                        : "ابدأ محادثة جديدة";


                if (
                    query &&
                    !(
                        title
                            .toLowerCase()
                            .includes(query)
                    )
                ) {

                    return;

                }


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "session" +
                    (
                        index === current
                            ? " active"
                            : ""
                    );


                button.innerHTML = `
                    <div class="session-title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="session-preview">
                        ${escapeHTML(
                            preview.slice(0, 65)
                        )}
                    </div>
                `;


                button.onclick = () => {

                    current =
                        index;

                    save();

                    renderSessions();

                    renderChat();

                    closeSidebar();

                };


                sessionsEl.appendChild(
                    button
                );

            }
        );

    }


    /* =====================================================
       MESSAGE RENDER
    ===================================================== */

    function renderChat() {

        const session =
            sessions[current] || [];


        messagesEl.innerHTML =
            "";


        welcome.style.display =
            session.length
                ? "none"
                : "flex";


        session.forEach(
            message => {

                appendMessage(
                    message.role,
                    message.content,
                    false
                );

            }
        );


        scrollBottom();

    }


    function appendMessage(
        role,
        content,
        scroll = true
    ) {

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "message " +
            (
                role === "user"
                    ? "user"
                    : "assistant"
            );


        const avatar =
            role === "user"
                ? "U"
                : "A5";


        const tools =
            role === "assistant"
                ? `
                    <div class="message-tools">

                        <button
                            class="message-tool copy"
                        >
                            نسخ
                        </button>

                        <button
                            class="message-tool speak"
                        >
                            🔊 قراءة
                        </button>

                    </div>
                `
                : "";


        row.innerHTML = `
            <div class="message-avatar">
                ${avatar}
            </div>

            <div class="message-body">

                <div class="message-content">
                    ${renderMarkdown(content)}
                </div>

                ${tools}

            </div>
        `;


        if (
            role === "assistant"
        ) {

            const copy =
                row.querySelector(
                    ".copy"
                );


            const speak =
                row.querySelector(
                    ".speak"
                );


            copy.onclick =
                async () => {

                    await navigator
                        .clipboard
                        .writeText(
                            content
                        );

                    copy.textContent =
                        "تم النسخ ✓";


                    setTimeout(
                        () => {

                            copy.textContent =
                                "نسخ";

                        },
                        1300
                    );

                };


            speak.onclick = () => {

                speakText(
                    content
                );

            };

        }


        messagesEl.appendChild(
            row
        );


        if (scroll) {
            scrollBottom();
        }


        return row;

    }


    /* =====================================================
       TYPING
    ===================================================== */

    function showTyping() {

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "message assistant";

        row.id =
            "typingMessage";


        row.innerHTML = `
            <div class="message-avatar">
                A5
            </div>

            <div class="message-body">

                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>
        `;


        messagesEl.appendChild(
            row
        );


        scrollBottom();

    }


    function removeTyping() {

        document
            .getElementById(
                "typingMessage"
            )
            ?.remove();

    }


    /* =====================================================
       SCROLL
    ===================================================== */

    function scrollBottom() {

        requestAnimationFrame(
            () => {

                chat.scrollTo({
                    top:
                        chat.scrollHeight,
                    behavior:
                        "smooth"
                });

            }
        );

    }


    /* =====================================================
       MEMORY
    ===================================================== */

    function addMemory(
        user,
        assistant
    ) {

        memory.push({

            user:
                user.slice(
                    0,
                    600
                ),

            assistant:
                assistant.slice(
                    0,
                    1200
                ),

            time:
                Date.now()

        });


        if (
            memory.length >
            MAX_MEMORY
        ) {

            memory =
                memory.slice(
                    -MAX_MEMORY
                );

        }


        save();

    }


    function buildMemory() {

        if (
            !memory.length
        ) {

            return "";

        }


        return memory
            .slice(-8)
            .map(
                (item, index) => {

                    return `
${index + 1}.
المستخدم: ${item.user}
A5: ${item.assistant}
`;

                }
            )
            .join("\n");

    }


    /* =====================================================
       SEND MESSAGE
    ===================================================== */

    async function sendMessage(
        forcedText = null
    ) {

        if (
            generating
        ) {
            return;
        }


        const text =
            (
                forcedText ??
                input.value
            ).trim();


        if (!text) {
            return;
        }


        input.value =
            "";

        resizeInput();


        const session =
            sessions[current];


        session.push({

            role:
                "user",

            content:
                text

        });


        welcome.style.display =
            "none";


        appendMessage(
            "user",
            text
        );


        save();

        renderSessions();


        generating =
            true;

        controller =
            new AbortController();


        send.disabled =
            true;

        stop.classList.add(
            "show"
        );


        setStatus(
            "A5 يفكر...",
            "busy"
        );


        showTyping();


        try {

            const recent =
                session.slice(
                    -MAX_HISTORY
                );


            const response =
                await fetch(
                    API_ENDPOINT,
                    {

                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:
                                    text,

                                messages:
                                    recent,

                                memory:
                                    buildMemory(),

                                system:
                                    A5_SYSTEM_PROMPT,

                                language:
                                    language

                            }),

                        signal:
                            controller.signal

                    }
                );


            if (
                !response.ok
            ) {

                let errorText =
                    "فشل الاتصال بالخادم.";

                try {

                    const errorData =
                        await response.json();

                    errorText =
                        errorData.error ||
                        errorText;

                } catch {}


                throw new Error(
                    errorText
                );

            }


            const data =
                await response.json();


            const answer =
                String(
                    data.reply ??
                    data.message ??
                    ""
                ).trim();


            if (!answer) {

                throw new Error(
                    "الخادم لم يرجع إجابة."
                );

            }


            removeTyping();


            session.push({

                role:
                    "assistant",

                content:
                    answer

            });


            appendMessage(
                "assistant",
                answer
            );


            addMemory(
                text,
                answer
            );


            save();

            renderSessions();


            if (
                voiceEnabled
            ) {

                // لا نشغل الصوت تلقائيًا.
                // المستخدم يستطيع الضغط على "قراءة".

            }


            setStatus(
                "A5 جاهز",
                "ready"
            );

        } catch (error) {

            removeTyping();


            if (
                error.name ===
                "AbortError"
            ) {

                appendMessage(
                    "assistant",
                    "تم إيقاف التوليد."
                );

                setStatus(
                    "تم الإيقاف",
                    "ready"
                );

            } else {

                console.error(
                    "A5 error:",
                    error
                );


                appendMessage(
                    "assistant",
                    "حدث خطأ أثناء الاتصال بـ A5:\n\n" +
                    error.message
                );


                setStatus(
                    "خطأ في الاتصال",
                    "error"
                );

            }

        }


        generating =
            false;

        controller =
            null;

        send.disabled =
            !input.value.trim();

        stop.classList.remove(
            "show"
        );


        input.focus();

    }


    /* =====================================================
       STOP
    ===================================================== */

    stop.onclick = () => {

        if (
            controller
        ) {

            controller.abort();

        }

    };


    /* =====================================================
       NEW CHAT
    ===================================================== */

    $("newChat").onclick = () => {

        sessions.push([]);

        current =
            sessions.length - 1;

        save();

        renderSessions();

        renderChat();

        input.focus();

        closeSidebar();

    };


    /* =====================================================
       DELETE CURRENT
    ===================================================== */

    $("clearCurrent").onclick = () => {

        if (
            !sessions[current]?.length
        ) {
            return;
        }


        if (
            !confirm(
                "هل تريد حذف المحادثة الحالية؟"
            )
        ) {

            return;

        }


        sessions[current] =
            [];

        save();

        renderSessions();

        renderChat();

    };


    /* =====================================================
       DELETE ALL
    ===================================================== */

    $("clearAll").onclick = () => {

        if (
            !confirm(
                "سيتم حذف جميع المحادثات. هل أنت متأكد؟"
            )
        ) {

            return;

        }


        sessions =
            [[]];

        current =
            0;

        memory =
            [];

        save();

        renderSessions();

        renderChat();

    };


    /* =====================================================
       EXPORT
    ===================================================== */

    $("export").onclick = () => {

        const session =
            sessions[current] || [];


        if (
            !session.length
        ) {

            alert(
                "لا توجد محادثة لتصديرها."
            );

            return;

        }


        let text =
            "A5 AI\n\n";


        session.forEach(
            message => {

                text +=
                    message.role === "user"
                        ? "المستخدم:\n"
                        : "A5:\n";

                text +=
                    message.content;

                text +=
                    "\n\n----------------\n\n";

            }
        );


        const blob =
            new Blob(
                [text],
                {
                    type:
                        "text/plain;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;

        link.download =
            "A5-conversation.txt";


        document.body.appendChild(
            link
        );

        link.click();

        link.remove();


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );

    };


    /* =====================================================
       THEME
    ===================================================== */

    function setTheme(
        theme
    ) {

        document.body.classList.toggle(
            "light",
            theme === "light"
        );


        localStorage.setItem(
            "a5_theme",
            theme
        );

    }


    $("theme").onclick = () => {

        const currentTheme =
            localStorage.getItem(
                "a5_theme"
            ) || "dark";


        setTheme(
            currentTheme === "dark"
                ? "light"
                : "dark"
        );

    };


    setTheme(
        localStorage.getItem(
            "a5_theme"
        ) || "dark"
    );


    /* =====================================================
       LANGUAGE
    ===================================================== */

    $("language").onclick = () => {

        language =
            language === "ar"
                ? "en"
                : "ar";


        localStorage.setItem(
            "a5_language",
            language
        );


        document.documentElement.lang =
            language;


        document.documentElement.dir =
            language === "ar"
                ? "rtl"
                : "ltr";


        $("language").textContent =
            language === "ar"
                ? "EN"
                : "AR";

    };


    document.documentElement.lang =
        language;


    document.documentElement.dir =
        language === "ar"
            ? "rtl"
            : "ltr";


    $("language").textContent =
        language === "ar"
            ? "EN"
            : "AR";


    /* =====================================================
       VOICE OUTPUT
    ===================================================== */

    $("voiceOutput").onclick = () => {

        voiceEnabled =
            !voiceEnabled;


        localStorage.setItem(
            "a5_voice",
            String(
                voiceEnabled
            )
        );


        $("voiceOutput").textContent =
            voiceEnabled
                ? "🔊"
                : "🔇";

    };


    $("voiceOutput").textContent =
        voiceEnabled
            ? "🔊"
            : "🔇";


    function speakText(
        text
    ) {

        if (
            !(
                "speechSynthesis"
                in window
            )
        ) {

            return;

        }


        speechSynthesis.cancel();


        const clean =
            text
                .replace(
                    /```[\s\S]*?```/g,
                    " "
                )
                .replace(
                    /[*_#`]/g,
                    ""
                );


        const utterance =
            new SpeechSynthesisUtterance(
                clean
            );


        utterance.lang =
            language === "ar"
                ? "ar-SA"
                : "en-US";


        utterance.rate =
            .95;


        speechSynthesis.speak(
            utterance
        );

    }


    /* =====================================================
       SPEECH RECOGNITION
    ===================================================== */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (
        SpeechRecognition
    ) {

        recognition =
            new SpeechRecognition();


        recognition.continuous =
            false;


        recognition.interimResults =
            false;


        recognition.lang =
            "ar-SA";


        recognition.onstart = () => {

            mic.textContent =
                "🔴";

            setStatus(
                "A5 يستمع...",
                "busy"
            );

        };


        recognition.onresult =
            event => {

                const transcript =
                    event.results[0][0]
                        .transcript;


                input.value +=
                    (
                        input.value
                            ? " "
                            : ""
                    ) +
                    transcript;


                resizeInput();

                updateSendButton();

            };


        recognition.onerror =
            () => {

                mic.textContent =
                    "🎙️";

                setStatus(
                    "A5 جاهز",
                    "ready"
                );

            };


        recognition.onend =
            () => {

                mic.textContent =
                    "🎙️";

                if (!generating) {

                    setStatus(
                        "A5 جاهز",
                        "ready"
                    );

                }

            };


        mic.onclick = () => {

            recognition.lang =
                language === "ar"
                    ? "ar-SA"
                    : "en-US";


            recognition.start();

        };

    } else {

        mic.onclick = () => {

            alert(
                "التعرف على الصوت غير مدعوم في هذا المتصفح."
            );

        };

    }


    /* =====================================================
       INPUT
    ===================================================== */

    function resizeInput() {

        input.style.height =
            "auto";


        input.style.height =
            Math.min(
                input.scrollHeight,
                150
            ) +
            "px";

    }


    function updateSendButton() {

        send.disabled =
            !input.value.trim() ||
            generating;

    }


    input.addEventListener(
        "input",
        () => {

            resizeInput();

            updateSendButton();

        }
    );


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    send.onclick =
        () => sendMessage();


    /* =====================================================
       QUICK PROMPTS
    ===================================================== */

    document
        .querySelectorAll(
            "[data-prompt]"
        )
        .forEach(
            button => {

                button.onclick = () => {

                    const prompt =
                        button.dataset.prompt;


                    input.value =
                        prompt;


                    resizeInput();

                    updateSendButton();

                    input.focus();


                    if (
                        button.classList.contains(
                            "quick"
                        )
                    ) {

                        sendMessage();

                    }

                };

            }
        );


    /* =====================================================
       MOBILE SIDEBAR
    ===================================================== */

    $("menu").onclick =
        () => {

            sidebar.classList.toggle(
                "open"
            );

        };


    function closeSidebar() {

        sidebar.classList.remove(
            "open"
        );

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    search.oninput =
        renderSessions;


    /* =====================================================
       INITIALIZE
    ===================================================== */

    renderSessions();

    renderChat();

    updateSendButton();
