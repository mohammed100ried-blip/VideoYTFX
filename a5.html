<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A5 AI</title>

    <style>

        :root {
            --bg: #070b14;
            --bg2: #0b1020;
            --card: rgba(15, 23, 42, 0.82);
            --border: rgba(148, 163, 184, 0.18);

            --text: #f8fafc;
            --muted: #94a3b8;

            --primary: #3b82f6;
            --primary2: #60a5fa;

            --user: #2563eb;
            --ai: rgba(30, 41, 59, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(37, 99, 235, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(59, 130, 246, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    var(--bg),
                    var(--bg2)
                );

            color: var(--text);

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }

        body.light {
            --bg: #f8fafc;
            --bg2: #e2e8f0;

            --card: rgba(255, 255, 255, 0.88);
            --border: rgba(15, 23, 42, 0.1);

            --text: #0f172a;
            --muted: #64748b;

            --ai: rgba(226, 232, 240, 0.9);
        }

        button,
        textarea {
            font-family: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7, 11, 20, 0.65);

            backdrop-filter: blur(18px);

            position: sticky;
            top: 0;

            z-index: 10;
        }

        body.light header {
            background:
                rgba(248, 250, 252, 0.75);
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 12px;
        }

        .logo {
            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            font-size: 20px;
            font-weight: bold;

            box-shadow:
                0 8px 25px
                rgba(59, 130, 246, 0.3);
        }

        .brand-text h1 {
            font-size: 19px;
        }

        .brand-text span {
            display: block;

            margin-top: 3px;

            font-size: 12px;

            color: var(--muted);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;

            border: 1px solid var(--border);

            border-radius: 11px;

            background: var(--card);

            color: var(--text);

            cursor: pointer;

            font-size: 17px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .icon-btn:hover {
            transform: translateY(-2px);

            background:
                rgba(59, 130, 246, 0.12);
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            height:
                calc(100vh - 75px);

            max-width: 1000px;

            margin: auto;

            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;

            overflow-y: auto;

            padding:
                35px 25px 25px;
        }

        .welcome {
            min-height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .welcome-content {
            max-width: 650px;
        }

        .welcome-logo {
            width: 90px;
            height: 90px;

            margin:
                0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 27px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            font-size: 38px;
            font-weight: bold;

            box-shadow:
                0 20px 45px
                rgba(59, 130, 246, 0.3);
        }

        .welcome h2 {
            font-size:
                clamp(30px, 5vw, 48px);

            margin-bottom: 12px;
        }

        .welcome p {
            color: var(--muted);

            line-height: 1.7;

            font-size: 16px;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: flex;

            gap: 12px;

            margin-bottom: 24px;

            animation:
                messageIn 0.25s ease;
        }

        @keyframes messageIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            font-size: 15px;
            font-weight: bold;
        }

        .message.user .avatar {
            order: 2;
        }

        .bubble {
            max-width: 75%;

            padding:
                13px 16px;

            border-radius: 17px;

            line-height: 1.6;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .message.ai .bubble {
            background:
                var(--ai);

            border:
                1px solid var(--border);

            border-top-left-radius: 5px;
        }

        .message.user .bubble {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;

            border-top-right-radius: 5px;
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            padding:
                15px 20px 25px;
        }

        .input-box {
            display: flex;
            align-items: flex-end;

            gap: 10px;

            padding: 10px;

            border:
                1px solid var(--border);

            border-radius: 18px;

            background:
                var(--card);

            backdrop-filter:
                blur(18px);

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.2);
        }

        textarea {
            flex: 1;

            min-height: 45px;
            max-height: 150px;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            color: var(--text);

            font-size: 15px;

            line-height: 1.5;

            padding:
                10px 8px;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .send-btn {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            cursor: pointer;

            font-size: 18px;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hint {
            text-align: center;

            color: var(--muted);

            font-size: 11px;

            margin-top: 9px;
        }

        /* =========================
           TYPING
        ========================= */

        .typing {
            display: flex;

            align-items: center;

            gap: 5px;
        }

        .typing span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                var(--muted);

            animation:
                typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding:
                    0 15px;
            }

            .brand-text h1 {
                font-size: 17px;
            }

            .messages {
                padding:
                    25px 15px;
            }

            .bubble {
                max-width: 85%;
            }

            .input-area {
                padding:
                    10px 12px 15px;
            }

            .welcome-logo {
                width: 75px;
                height: 75px;

                font-size: 32px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="brand">

            <div class="logo">
                A5
            </div>

            <div class="brand-text">

                <h1>
                    A5 AI
                </h1>

                <span id="status">
                    AI Assistant
                </span>

            </div>

        </div>


        <div class="header-actions">

            <button
                class="icon-btn"
                onclick="toggleLanguage()"
                id="languageBtn"
                title="Language"
            >
                🌐
            </button>

            <button
                class="icon-btn"
                onclick="toggleTheme()"
                id="themeBtn"
                title="Theme"
            >
                ☀️
            </button>

            <button
                class="icon-btn"
                onclick="clearChat()"
                title="Clear chat"
            >
                🗑️
            </button>

        </div>

    </header>


    <!-- =========================
         CHAT
    ========================== -->

    <main class="chat">

        <div
            class="messages"
            id="messages"
        >

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-content">

                    <div class="welcome-logo">
                        A5
                    </div>

                    <h2 id="welcomeTitle">
                        How can I help you?
                    </h2>

                    <p id="welcomeDescription">
                        I am A5, your intelligent AI
                        assistant. Ask me anything.
                    </p>

                </div>

            </div>

        </div>


        <!-- =========================
             INPUT
        ========================== -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message A5 AI..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="send-btn"
                    id="sendBtn"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

            <div
                class="hint"
                id="hint"
            >
                Press Enter to send • Shift + Enter for a new line
            </div>

        </div>

    </main>


    <script>

        /* =========================
           LANGUAGE DATA
        ========================== */

        const translations = {

            en: {

                status:
                    "AI Assistant",

                welcomeTitle:
                    "How can I help you?",

                welcomeDescription:
                    "I am A5, your intelligent AI assistant. Ask me anything.",

                placeholder:
                    "Message A5 AI...",

                hint:
                    "Press Enter to send • Shift + Enter for a new line",

                aiGreeting:
                    "Hello! I am A5 AI. How can I help you today?",

                empty:
                    "Please write a message first."

            },

            ar: {

                status:
                    "مساعد ذكاء اصطناعي",

                welcomeTitle:
                    "كيف يمكنني مساعدتك؟",

                welcomeDescription:
                    "أنا A5، مساعدك الذكي بالذكاء الاصطناعي. اسألني أي شيء.",

                placeholder:
                    "اكتب رسالة إلى A5 AI...",

                hint:
                    "اضغط Enter للإرسال • Shift + Enter لسطر جديد",

                aiGreeting:
                    "مرحبًا! أنا A5 AI. كيف يمكنني مساعدتك اليوم؟",

                empty:
                    "اكتب رسالة أولاً."

            }

        };


        /* =========================
           LANGUAGE
        ========================== */

        let language =
            localStorage.getItem("a5-language")
            || "en";


        function updateLanguage() {

            const t =
                translations[language];

            document.documentElement.lang =
                language;

            document.documentElement.dir =
                language === "ar"
                    ? "rtl"
                    : "ltr";

            document.getElementById(
                "status"
            ).textContent =
                t.status;

            document.getElementById(
                "welcomeTitle"
            ).textContent =
                t.welcomeTitle;

            document.getElementById(
                "welcomeDescription"
            ).textContent =
                t.welcomeDescription;

            document.getElementById(
                "messageInput"
            ).placeholder =
                t.placeholder;

            document.getElementById(
                "hint"
            ).textContent =
                t.hint;

            document.getElementById(
                "languageBtn"
            ).textContent =
                language === "en"
                    ? "🇦🇪"
                    : "🇬🇧";

            localStorage.setItem(
                "a5-language",
                language
            );
        }


        function toggleLanguage() {

            language =
                language === "en"
                    ? "ar"
                    : "en";

            updateLanguage();
        }


        /* =========================
           THEME
        ========================== */

        let theme =
            localStorage.getItem("a5-theme")
            || "dark";


        function updateTheme() {

            if (theme === "light") {

                document.body.classList.add(
                    "light"
                );

                document.getElementById(
                    "themeBtn"
                ).textContent = "🌙";

            } else {

                document.body.classList.remove(
                    "light"
                );

                document.getElementById(
                    "themeBtn"
                ).textContent = "☀️";
            }

            localStorage.setItem(
                "a5-theme",
                theme
            );
        }


        function toggleTheme() {

            theme =
                theme === "dark"
                    ? "light"
                    : "dark";

            updateTheme();
        }


        /* =========================
           ADD MESSAGE
        ========================== */

        function addMessage(
            text,
            type
        ) {

            const messages =
                document.getElementById(
                    "messages"
                );

            const welcome =
                document.getElementById(
                    "welcome"
                );

            if (welcome) {
                welcome.remove();
            }

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                `message ${type}`;


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar";

            avatar.textContent =
                type === "user"
                    ? "U"
                    : "A5";


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "bubble";

            bubble.textContent =
                text;


            message.appendChild(
                avatar
            );

            message.appendChild(
                bubble
            );

            messages.appendChild(
                message
            );

            messages.scrollTop =
                messages.scrollHeight;

            return message;
        }


        /* =========================
           TYPING
        ========================== */

        function showTyping() {

            const messages =
                document.getElementById(
                    "messages"
                );

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                "message ai";

            message.id =
                "typingMessage";


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar";

            avatar.textContent =
                "A5";


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "bubble";


            bubble.innerHTML = `
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;


            message.appendChild(
                avatar
            );

            message.appendChild(
                bubble
            );

            messages.appendChild(
                message
            );

            messages.scrollTop =
                messages.scrollHeight;
        }


        function removeTyping() {

            const typing =
                document.getElementById(
                    "typingMessage"
                );

            if (typing) {
                typing.remove();
            }
        }


        /* =========================
           SEND MESSAGE
        ========================== */

        function sendMessage() {

            const input =
                document.getElementById(
                    "messageInput"
                );

            const sendBtn =
                document.getElementById(
                    "sendBtn"
                );

            const text =
                input.value.trim();


            if (!text) {

                const t =
                    translations[language];

                addMessage(
                    t.empty,
                    "ai"
                );

                return;
            }


            addMessage(
                text,
                "user"
            );

            input.value = "";

            input.style.height =
                "45px";

            sendBtn.disabled = true;

            showTyping();


            /*
             * مؤقتًا هذا رد تجريبي.
             *
             * في المرحلة التالية سنستبدله
             * بطلب API حقيقي للذكاء الاصطناعي.
             */

            setTimeout(() => {

                removeTyping();

                const t =
                    translations[language];

                addMessage(
                    t.aiGreeting,
                    "ai"
                );

                sendBtn.disabled =
                    false;

            }, 900);
        }


        /* =========================
           ENTER KEY
        ========================== */

        function handleKey(event) {

            if (
                event.key === "Enter"
                &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }


        /* =========================
           AUTO RESIZE
        ========================== */

        const textarea =
            document.getElementById(
                "messageInput"
            );


        textarea.addEventListener(
            "input",
            function () {

                this.style.height =
                    "45px";

                this.style.height =
                    Math.min(
                        this.scrollHeight,
                        150
                    ) + "px";

            }
        );


        /* =========================
           CLEAR CHAT
        ========================== */

        function clearChat() {

            const messages =
                document.getElementById(
                    "messages"
                );

            messages.innerHTML = `

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-content">

                        <div class="welcome-logo">
                            A5
                        </div>

                        <h2 id="welcomeTitle">
                            How can I help you?
                        </h2>

                        <p id="welcomeDescription">
                            I am A5, your intelligent AI assistant.
                            Ask me anything.
                        </p>

                    </div>

                </div>

            `;

            updateLanguage();
        }


        /* =========================
           START
        ========================== */

        updateLanguage();

        updateTheme();

    </script>

</body>

</html>
