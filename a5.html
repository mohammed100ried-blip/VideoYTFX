<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A5 AI</title>

    <style>

        :root {
            --bg: #070b14;
            --bg2: #0b1020;
            --card: rgba(15, 23, 42, 0.82);
            --border: rgba(148, 163, 184, 0.18);

            --text: #f8fafc;
            --muted: #94a3b8;

            --primary: #3b82f6;
            --primary2: #60a5fa;

            --ai: rgba(30, 41, 59, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(37, 99, 235, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(59, 130, 246, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    var(--bg),
                    var(--bg2)
                );

            color: var(--text);

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }

        body.light {
            --bg: #f8fafc;
            --bg2: #e2e8f0;
            --card: rgba(255, 255, 255, 0.92);
            --border: rgba(15, 23, 42, 0.1);
            --text: #0f172a;
            --muted: #64748b;
            --ai: rgba(226, 232, 240, 0.9);
        }

        button,
        textarea,
        input,
        select {
            font-family: inherit;
        }

        /* HEADER */

        header {
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7, 11, 20, 0.65);

            backdrop-filter:
                blur(18px);

            position: sticky;
            top: 0;

            z-index: 20;
        }

        body.light header {
            background:
                rgba(248, 250, 252, 0.78);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            font-size: 19px;
            font-weight: bold;

            box-shadow:
                0 8px 25px
                rgba(59, 130, 246, 0.3);
        }

        .brand-text h1 {
            font-size: 19px;
        }

        .brand-text span {
            display: block;

            margin-top: 3px;

            font-size: 12px;

            color: var(--muted);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;

            border:
                1px solid var(--border);

            border-radius: 11px;

            background:
                var(--card);

            color: var(--text);

            cursor: pointer;

            font-size: 17px;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .icon-btn:hover {
            transform:
                translateY(-2px);

            background:
                rgba(59, 130, 246, 0.12);
        }

        /* CHAT */

        .chat {
            height:
                calc(100vh - 75px);

            max-width: 1000px;

            margin: auto;

            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;

            overflow-y: auto;

            padding:
                35px 25px 25px;
        }

        .welcome {
            min-height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .welcome-content {
            max-width: 650px;
        }

        .welcome-logo {
            width: 90px;
            height: 90px;

            margin:
                0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 27px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            font-size: 38px;
            font-weight: bold;

            box-shadow:
                0 20px 45px
                rgba(59, 130, 246, 0.3);
        }

        .welcome h2 {
            font-size:
                clamp(30px, 5vw, 48px);

            margin-bottom: 12px;
        }

        .welcome p {
            color: var(--muted);

            line-height: 1.7;

            font-size: 16px;
        }

        /* MESSAGES */

        .message {
            display: flex;

            gap: 12px;

            margin-bottom: 24px;

            animation:
                messageIn 0.25s ease;
        }

        @keyframes messageIn {

            from {
                opacity: 0;
                transform:
                    translateY(8px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            font-size: 14px;
            font-weight: bold;
        }

        .message.user .avatar {
            order: 2;
        }

        .bubble {
            max-width: 78%;

            padding:
                13px 16px;

            border-radius: 17px;

            line-height: 1.65;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .message.ai .bubble {
            background:
                var(--ai);

            border:
                1px solid var(--border);

            border-top-left-radius: 5px;
        }

        .message.user .bubble {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;

            border-top-right-radius: 5px;
        }

        /* INPUT */

        .input-area {
            padding:
                15px 20px 25px;
        }

        .input-box {
            display: flex;
            align-items: flex-end;

            gap: 10px;

            padding: 10px;

            border:
                1px solid var(--border);

            border-radius: 18px;

            background:
                var(--card);

            backdrop-filter:
                blur(18px);

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.2);
        }

        textarea {
            flex: 1;

            min-height: 45px;
            max-height: 150px;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            color: var(--text);

            font-size: 15px;

            line-height: 1.5;

            padding:
                10px 8px;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .send-btn {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            cursor: pointer;

            font-size: 18px;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .send-btn:hover {
            transform:
                translateY(-2px);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hint {
            text-align: center;

            color: var(--muted);

            font-size: 11px;

            margin-top: 9px;
        }

        /* TYPING */

        .typing {
            display: flex;

            align-items: center;

            gap: 5px;
        }

        .typing span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                var(--muted);

            animation:
                typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay:
                0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay:
                0.3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.3;
                transform:
                    translateY(0);
            }

            30% {
                opacity: 1;
                transform:
                    translateY(-3px);
            }

        }

        /* SETTINGS */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.65);

            backdrop-filter:
                blur(8px);

            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .settings {
            width: 100%;
            max-width: 500px;

            padding: 25px;

            border:
                1px solid var(--border);

            border-radius: 22px;

            background:
                var(--card);

            box-shadow:
                0 25px 80px
                rgba(0, 0, 0, 0.45);
        }

        .settings h2 {
            margin-bottom: 8px;
        }

        .settings-description {
            color: var(--muted);

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: bold;
        }

        .field input,
        .field select {
            width: 100%;

            padding: 12px 13px;

            border:
                1px solid var(--border);

            border-radius: 11px;

            outline: none;

            background:
                rgba(0, 0, 0, 0.15);

            color: var(--text);

            font-size: 14px;
        }

        body.light .field input,
        body.light .field select {
            background:
                rgba(255, 255, 255, 0.7);
        }

        .settings-buttons {
            display: flex;

            gap: 10px;

            margin-top: 20px;
        }

        .settings-btn {
            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 11px;

            cursor: pointer;

            font-weight: bold;
        }

        .save-btn {
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;
        }

        .cancel-btn {
            background:
                rgba(148, 163, 184, 0.15);

            color: var(--text);
        }

        .error {
            color: #f87171;

            font-size: 13px;

            margin-top: 8px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding:
                    0 15px;
            }

            .brand-text h1 {
                font-size: 17px;
            }

            .messages {
                padding:
                    25px 15px;
            }

            .bubble {
                max-width: 85%;
            }

            .input-area {
                padding:
                    10px 12px 15px;
            }

            .welcome-logo {
                width: 75px;
                height: 75px;

                font-size: 32px;
            }

        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="brand">

            <div class="logo">
                A5
            </div>

            <div class="brand-text">

                <h1>
                    A5 AI
                </h1>

                <span id="status">
                    AI Assistant
                </span>

            </div>

        </div>


        <div class="header-actions">

            <button
                class="icon-btn"
                onclick="toggleLanguage()"
                id="languageBtn"
                title="Language"
            >
                🇦🇪
            </button>

            <button
                class="icon-btn"
                onclick="toggleTheme()"
                id="themeBtn"
                title="Theme"
            >
                ☀️
            </button>

            <button
                class="icon-btn"
                onclick="openSettings()"
                title="AI Settings"
            >
                ⚙️
            </button>

            <button
                class="icon-btn"
                onclick="clearChat()"
                title="Clear chat"
            >
                🗑️
            </button>

        </div>

    </header>


    <!-- CHAT -->

    <main class="chat">

        <div
            class="messages"
            id="messages"
        >

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-content">

                    <div class="welcome-logo">
                        A5
                    </div>

                    <h2 id="welcomeTitle">
                        How can I help you?
                    </h2>

                    <p id="welcomeDescription">
                        I am A5, your intelligent AI
                        assistant. Ask me anything.
                    </p>

                </div>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Message A5 AI..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="send-btn"
                    id="sendBtn"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

            <div
                class="hint"
                id="hint"
            >
                Press Enter to send • Shift + Enter for a new line
            </div>

        </div>

    </main>


    <!-- SETTINGS MODAL -->

    <div
        class="modal"
        id="settingsModal"
    >

        <div class="settings">

            <h2>
                A5 AI Settings
            </h2>

            <p class="settings-description">
                Enter your API key and choose the model
                A5 should use. The key is saved only in
                this browser.
            </p>


            <div class="field">

                <label>
                    API Key
                </label>

                <input
                    type="password"
                    id="apiKey"
                    placeholder="Paste your API key here"
                    autocomplete="off"
                >

            </div>


            <div class="field">

                <label>
                    Model
                </label>

                <select id="model">

                    <option value="openrouter/free">
                        OpenRouter Free
                    </option>

                    <option value="openai/gpt-chat-latest">
                        GPT Chat Latest
                    </option>

                </select>

            </div>


            <div
                class="error"
                id="settingsError"
            ></div>


            <div class="settings-buttons">

                <button
                    class="settings-btn cancel-btn"
                    onclick="closeSettings()"
                >
                    Cancel
                </button>

                <button
                    class="settings-btn save-btn"
                    onclick="saveSettings()"
                >
                    Save
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================
           A5 CONFIG
        ========================== */

        const API_URL =
            "https://openrouter.ai/api/v1/chat/completions";

        const SITE_URL =
            "https://mohammed100ried-blip.github.io/VideoYTFX/a5.html";

        const SITE_NAME =
            "A5 AI";


        /*
         * The API key is intentionally NOT
         * hard-coded into this file.
         */

        let apiKey =
            localStorage.getItem(
                "a5-api-key"
            ) || "";

        let selectedModel =
            localStorage.getItem(
                "a5-model"
            ) || "openrouter/free";


        /* =========================
           LANGUAGE
        ========================== */

        const translations = {

            en: {

                status:
                    "AI Assistant",

                welcomeTitle:
                    "How can I help you?",

                welcomeDescription:
                    "I am A5, your intelligent AI assistant. Ask me anything.",

                placeholder:
                    "Message A5 AI...",

                hint:
                    "Press Enter to send • Shift + Enter for a new line",

                empty:
                    "Please write a message first.",

                noKey:
                    "Please open ⚙️ Settings and add your API key first.",

                thinking:
                    "A5 is thinking...",

                error:
                    "Something went wrong while contacting the AI.",

                networkError:
                    "Could not connect to the AI service.",

                settingsSaved:
                    "Settings saved successfully."

            },

            ar: {

                status:
                    "مساعد ذكاء اصطناعي",

                welcomeTitle:
                    "كيف يمكنني مساعدتك؟",

                welcomeDescription:
                    "أنا A5، مساعدك الذكي بالذكاء الاصطناعي. اسألني أي شيء.",

                placeholder:
                    "اكتب رسالة إلى A5 AI...",

                hint:
                    "اضغط Enter للإرسال • Shift + Enter لسطر جديد",

                empty:
                    "اكتب رسالة أولاً.",

                noKey:
                    "افتح ⚙️ الإعدادات وأضف مفتاح API أولاً.",

                thinking:
                    "A5 يفكر...",

                error:
                    "حدث خطأ أثناء الاتصال بالذكاء الاصطناعي.",

                networkError:
                    "تعذر الاتصال بخدمة الذكاء الاصطناعي.",

                settingsSaved:
                    "تم حفظ الإعدادات بنجاح."

            }

        };


        let language =
            localStorage.getItem(
                "a5-language"
            ) || "en";


        function updateLanguage() {

            const t =
                translations[language];

            document.documentElement.lang =
                language;

            document.documentElement.dir =
                language === "ar"
                    ? "rtl"
                    : "ltr";

            document.getElementById(
                "status"
            ).textContent =
                t.status;

            document.getElementById(
                "welcomeTitle"
            ).textContent =
                t.welcomeTitle;

            document.getElementById(
                "welcomeDescription"
            ).textContent =
                t.welcomeDescription;

            document.getElementById(
                "messageInput"
            ).placeholder =
                t.placeholder;

            document.getElementById(
                "hint"
            ).textContent =
                t.hint;

            document.getElementById(
                "languageBtn"
            ).textContent =
                language === "en"
                    ? "🇦🇪"
                    : "🇬🇧";

            localStorage.setItem(
                "a5-language",
                language
            );
        }


        function toggleLanguage() {

            language =
                language === "en"
                    ? "ar"
                    : "en";

            updateLanguage();
        }


        /* =========================
           THEME
        ========================== */

        let theme =
            localStorage.getItem(
                "a5-theme"
            ) || "dark";


        function updateTheme() {

            if (theme === "light") {

                document.body.classList.add(
                    "light"
                );

                document.getElementById(
                    "themeBtn"
                ).textContent =
                    "🌙";

            } else {

                document.body.classList.remove(
                    "light"
                );

                document.getElementById(
                    "themeBtn"
                ).textContent =
                    "☀️";
            }

            localStorage.setItem(
                "a5-theme",
                theme
            );
        }


        function toggleTheme() {

            theme =
                theme === "dark"
                    ? "light"
                    : "dark";

            updateTheme();
        }


        /* =========================
           MESSAGE
        ========================== */

        function addMessage(
            text,
            type
        ) {

            const messages =
                document.getElementById(
                    "messages"
                );

            const welcome =
                document.getElementById(
                    "welcome"
                );

            if (welcome) {
                welcome.remove();
            }

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                `message ${type}`;


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar";

            avatar.textContent =
                type === "user"
                    ? "U"
                    : "A5";


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "bubble";

            bubble.textContent =
                text;


            message.appendChild(
                avatar
            );

            message.appendChild(
                bubble
            );

            messages.appendChild(
                message
            );

            messages.scrollTop =
                messages.scrollHeight;

            return message;
        }


        /* =========================
           TYPING
        ========================== */

        function showTyping() {

            const messages =
                document.getElementById(
                    "messages"
                );

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                "message ai";

            message.id =
                "typingMessage";


            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar";

            avatar.textContent =
                "A5";


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "bubble";


            bubble.innerHTML = `
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;


            message.appendChild(
                avatar
            );

            message.appendChild(
                bubble
            );

            messages.appendChild(
                message
            );

            messages.scrollTop =
                messages.scrollHeight;
        }


        function removeTyping() {

            const typing =
                document.getElementById(
                    "typingMessage"
                );

            if (typing) {
                typing.remove();
            }
        }


        /* =========================
           CONVERSATION MEMORY
        ========================== */

        let conversation = [];


        /*
         * A5 personality/instructions.
         */

        const SYSTEM_PROMPT = `
You are A5 AI, an intelligent and helpful assistant.

Your job is to:
- Answer clearly and accurately.
- Be helpful and respectful.
- Understand Arabic and English.
- Reply in the language used by the user.
- Explain difficult topics simply.
- Help with programming and websites.
- Do not claim to be human.
- Do not invent facts when you are uncertain.
`.trim();


        /* =========================
           SEND TO AI
        ========================== */

        async function askAI(userText) {

            if (!apiKey) {

                const t =
                    translations[language];

                addMessage(
                    t.noKey,
                    "ai"
                );

                openSettings();

                return;
            }


            conversation.push({

                role: "user",

                content:
                    userText

            });


            const messages = [

                {
                    role: "system",
                    content:
                        SYSTEM_PROMPT
                },

                ...conversation

            ];


            try {

                const response =
                    await fetch(
                        API_URL,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${apiKey}`,

                                "HTTP-Referer":
                                    SITE_URL,

                                "X-Title":
                                    SITE_NAME

                            },

                            body:
                                JSON.stringify({

                                    model:
                                        selectedModel,

                                    messages:
                                        messages,

                                    temperature:
                                        0.7

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    console.error(
                        "AI API error:",
                        data
                    );

                    throw new Error(
                        data?.error?.message
                        ||
                        "API request failed"
                    );
                }


                const answer =
                    data?.choices?.[0]?.message?.content;


                if (!answer) {

                    throw new Error(
                        "No response returned"
                    );
                }


                conversation.push({

                    role: "assistant",

                    content:
                        answer

                });


                addMessage(
                    answer,
                    "ai"
                );


                saveConversation();


            } catch (error) {

                console.error(error);

                const t =
                    translations[language];

                addMessage(
                    `${t.error}\n\n${error.message}`,
                    "ai"
                );

            }

        }


        /* =========================
           SEND MESSAGE
        ========================== */

        async function sendMessage() {

            const input =
                document.getElementById(
                    "messageInput"
                );

            const sendBtn =
                document.getElementById(
                    "sendBtn"
                );

            const text =
                input.value.trim();


            if (!text) {

                const t =
                    translations[language];

                addMessage(
                    t.empty,
                    "ai"
                );

                return;
            }


            addMessage(
                text,
                "user"
            );


            input.value = "";

            input.style.height =
                "45px";

            sendBtn.disabled =
                true;

            showTyping();


            try {

                await askAI(text);

            } finally {

                removeTyping();

                sendBtn.disabled =
                    false;

                input.focus();

            }

        }


        /* =========================
           ENTER
        ========================== */

        function handleKey(event) {

            if (
                event.key === "Enter"
                &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }


        /* =========================
           TEXTAREA RESIZE
        ========================== */

        const textarea =
            document.getElementById(
                "messageInput"
            );


        textarea.addEventListener(
            "input",
            function () {

                this.style.height =
                    "45px";

                this.style.height =
                    Math.min(
                        this.scrollHeight,
                        150
                    ) + "px";

            }
        );


        /* =========================
           SETTINGS
        ========================== */

        function openSettings() {

            document.getElementById(
                "apiKey"
            ).value =
                apiKey;

            document.getElementById(
                "model"
            ).value =
                selectedModel;

            document.getElementById(
                "settingsError"
            ).textContent =
                "";

            document.getElementById(
                "settingsModal"
            ).classList.add(
                "show"
            );
        }


        function closeSettings() {

            document.getElementById(
                "settingsModal"
            ).classList.remove(
                "show"
            );
        }


        function saveSettings() {

            const key =
                document.getElementById(
                    "apiKey"
                ).value.trim();

            const model =
                document.getElementById(
                    "model"
                ).value;


            if (!key) {

                document.getElementById(
                    "settingsError"
                ).textContent =
                    translations[
                        language
                    ].noKey;

                return;
            }


            apiKey =
                key;

            selectedModel =
                model;


            localStorage.setItem(
                "a5-api-key",
                apiKey
            );

            localStorage.setItem(
                "a5-model",
                selectedModel
            );


            closeSettings();
        }


        /* =========================
           SAVE CHAT
        ========================== */

        function saveConversation() {

            try {

                localStorage.setItem(
                    "a5-conversation",
                    JSON.stringify(
                        conversation
                    )
                );

            } catch (error) {

                console.warn(
                    "Could not save conversation."
                );

            }

        }


        function loadConversation() {

            try {

                const saved =
                    localStorage.getItem(
                        "a5-conversation"
                    );


                if (!saved) {
                    return;
                }


                conversation =
                    JSON.parse(
                        saved
                    );


                for (
                    const message
                    of conversation
                ) {

                    if (
                        message.role ===
                        "user"
                    ) {

                        addMessage(
                            message.content,
                            "user"
                        );

                    }

                    if (
                        message.role ===
                        "assistant"
                    ) {

                        addMessage(
                            message.content,
                            "ai"
                        );

                    }

                }

            } catch (error) {

                console.warn(
                    "Could not load conversation."
                );

                conversation = [];
            }

        }


        /* =========================
           CLEAR CHAT
        ========================== */

        function clearChat() {

            conversation = [];

            localStorage.removeItem(
                "a5-conversation"
            );


            const messages =
                document.getElementById(
                    "messages"
                );


            messages.innerHTML = `

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-content">

                        <div class="welcome-logo">
                            A5
                        </div>

                        <h2 id="welcomeTitle">
                            How can I help you?
                        </h2>

                        <p id="welcomeDescription">
                            I am A5, your intelligent AI
                            assistant. Ask me anything.
                        </p>

                    </div>

                </div>

            `;


            updateLanguage();
        }


        /* =========================
           CLOSE MODAL ON BACKDROP
        ========================== */

        document.getElementById(
            "settingsModal"
        ).addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    this
                ) {

                    closeSettings();

                }

            }
        );


        /* =========================
           START
        ========================== */

        updateLanguage();

        updateTheme();

        loadConversation();

    </script>

</body>

</html>
