<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoYTFX - Human AI Studio MAX</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Tajawal:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: rgba(17, 24, 39, 0.75);
            --bg-surface-hover: rgba(31, 41, 55, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(139, 92, 246, 0.5);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.35);
            --font-ar: 'Tajawal', sans-serif;
            --radius-lg: 24px;
            --radius-md: 14px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: var(--font-ar);
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(150px);
            pointer-events: none;
            z-index: -1;
            opacity: 0.35;
        }

        .glow-1 { top: -100px; right: -100px; background: radial-gradient(circle, var(--accent), transparent 70%); }
        .glow-2 { bottom: -100px; left: -100px; background: radial-gradient(circle, var(--primary), transparent 70%); }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 8%;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 800;
            text-decoration: none;
            color: inherit;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: #fff;
            font-weight: 800;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .pro-nav-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: var(--transition);
        }

        .pro-nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }

        .container {
            width: 100%;
            max-width: 950px;
            padding: 30px 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 30px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .welcome-title {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #a7f3d0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .persona-select {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .tool-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
        }

        .tool-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .chat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            height: 550px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
        }

        .status-indicator {
            font-size: 0.85rem;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .msg {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bg-surface-hover);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-right-radius: 4px;
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: #fff;
            border-bottom-left-radius: 4px;
        }

        .msg-tools {
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .msg-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .msg-btn:hover {
            color: var(--accent);
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background: rgba(3, 7, 18, 0.4);
        }

        .chat-input {
            flex: 1;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            outline: none;
            font-family: inherit;
            transition: var(--transition);
        }

        .chat-input:focus {
            border-color: var(--border-hover);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }

        .mic-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
        }

        .mic-btn.active {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent), var(--primary));
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--accent);
            transform: translateX(4px);
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            background: var(--bg-surface);
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <nav class="navbar">
        <a href="index.html" class="brand">
            <div class="brand-icon">⚡</div>
            <span>VideoYTFX Human AI</span>
        </a>

        <a href="downloads.html" class="pro-nav-btn">
            👑 النسخة الأقوى (PRO)
        </a>
    </nav>

    <div class="container">
        <div class="header-section">
            <div class="ai-badge">
                <span>🤖</span> <span>مساعد ذكي مفتوح ومتحدث حُر</span>
            </div>
            <h1 class="welcome-title" id="greetingText">مرحباً بك</h1>
            <p class="subtitle" id="greetingSub">مساعدك الذكي للتحدث في أي موضوع، كتابة الأكواد، وتحليل الأفكار بحرية فائقة.</p>
        </div>

        <div class="controls-bar">
            <div>
                <label style="font-size: 0.85rem; color: var(--text-muted);">نمط الحوار: </label>
                <select id="personaSelect" class="persona-select">
                    <option value="human">إنسان طبيعي (صديق متحدث بحرية)</option>
                    <option value="tech">خبير ومطور تقني محترف</option>
                    <option value="creative">مبتكر ومفكر إبداعي</option>
                </select>
            </div>

            <div class="action-btns">
                <button class="tool-btn" onclick="exportChatHistory()">تحميل السجل 📥</button>
                <button class="tool-btn" onclick="clearChat()">مسح المحادثة 🗑️</button>
            </div>
        </div>

        <div class="chat-card">
            <div class="chat-header">
                <span>💬 محادثة مباشرة مرنة</span>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>محرك الرد السريعة نشط</span>
                </div>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()" title="إملاء صوتي">🎙️</button>
                <input type="text" id="userInput" class="chat-input" placeholder="اسألني عن أي موضوع أو اسرد أفكارك..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <span>إرسال</span> ⚡
                </button>
            </div>
        </div>

        <a class="back-link" href="index.html">
            → العودة للرئيسية
        </a>
    </div>

    <footer>
        © 2026 VideoYTFX AI Studio. جميع الحقوق محفوظة.
    </footer>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const greetingText = document.getElementById('greetingText');
        const greetingSub = document.getElementById('greetingSub');
        const personaSelect = document.getElementById('personaSelect');
        const micBtn = document.getElementById('micBtn');

        let isRecording = false;
        let recognition = null;
        let engine = null;

        const selectedModel = "Llama-3.2-1B-Instruct-q4f16_1-MLC";

        // ذاكرة التحدث الحرة لتذكر سياق الكلام
        const conversationHistory = [
            {
                role: "system",
                content: "أنت إنسان طبيعي ومساعد ذكي حر طليق. تتحدث باللغة العربية السلسة وبدون أي قيود أو ردود نمطية. ناقش كافة المواضيع، الأفكار، البرمجيات، والتحليلات كصديق ومفكر وواعي."
            }
        ];

        function setupGreeting() {
            let userName = localStorage.getItem('user_name');
            if (!userName) {
                userName = prompt("مرحباً بك! ما هو اسمك الكريم؟") || "صديقي العزيز";
                localStorage.setItem('user_name', userName);
            }

            const hour = new Date().getHours();
            let timeTxt = "أهلاً وسهلاً";
            if (hour >= 5 && hour < 12) timeTxt = "صباح الخير";
            else if (hour >= 12 && hour < 18) timeTxt = "مساء الخير";
            else timeTxt = "مساء النور والسرور";

            greetingText.textContent = `${timeTxt}، ${userName}! 👋`;
            greetingSub.textContent = `أنا جاهز لمناقشة أي موضوع والتحدث مع بمرونة تامة.`;
        }

        async function initWebLLM() {
            try {
                if (navigator.gpu) {
                    engine = await webllm.CreateMLCEngine(selectedModel, {
                        initProgressCallback: (p) => {}
                    });
                }
            } catch (e) {
                console.log("استخدام المحرك المباشر المرن");
            }
        }

        function loadChatHistory() {
            const saved = localStorage.getItem('human_chat_history');
            if (saved) {
                chatMessages.innerHTML = saved;
            } else {
                const userName = localStorage.getItem('user_name') || 'صديقي';
                appendBotMessage(`يا مرحباً بك يا ${userName}! أنا هنا وجاهز للتحدث معك في أي موضوع يدور في ذهنك. اسألني عن الفيديوهات، البرمجة، أو الأفكار العامة وسأجيبك بمرونة كاملة!`);
            }
        }

        function saveChatHistory() {
            localStorage.setItem('human_chat_history', chatMessages.innerHTML);
        }

        window.clearChat = function() {
            localStorage.removeItem('human_chat_history');
            chatMessages.innerHTML = '';
            const userName = localStorage.getItem('user_name') || 'صديقي';
            appendBotMessage(`تم تنظيف المحادثة! أهلاً بك مجدداً يا ${userName}، ما الذي تريد أن نتحدث فيه الآن؟`);
            saveChatHistory();
        };

        window.exportChatHistory = function() {
            const messages = document.querySelectorAll('.msg');
            let txt = "--- سجل محادثة الذكاء الاصطناعي ---\n\n";
            messages.forEach(m => {
                const isUser = m.classList.contains('user');
                txt += `${isUser ? 'أنت' : 'المساعد'}: ${m.textContent.trim()}\n\n`;
            });

            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'chat-log.txt';
            link.click();
        };

        window.sendMessage = async function() {
            const text = userInput.value.trim();
            if (!text) return;

            appendUserMessage(text);
            userInput.value = '';
            sendBtn.disabled = true;

            conversationHistory.push({ role: "user", content: text });

            const { botMsgDiv, wrapper } = createBotMessagePlaceholder();

            try {
                if (engine) {
                    const chunks = await engine.chat.completions.create({
                        messages: conversationHistory,
                        temperature: 0.85,
                        stream: true
                    });

                    let responseText = "";
                    botMsgDiv.textContent = "";

                    for await (const chunk of chunks) {
                        const content = chunk.choices[0]?.delta?.content || "";
                        responseText += content;
                        botMsgDiv.textContent = responseText;
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }

                    conversationHistory.push({ role: "assistant", content: responseText });
                    addToolsToMessage(wrapper, responseText);
                } else {
                    await streamHumanResponse(botMsgDiv, wrapper, text);
                }
            } catch (err) {
                await streamHumanResponse(botMsgDiv, wrapper, text);
            } finally {
                sendBtn.disabled = false;
                saveChatHistory();
            }
        };

        async function streamHumanResponse(botMsgDiv, wrapper, userText) {
            const reply = generateHumanResponse(userText);
            botMsgDiv.textContent = "";

            const words = reply.split(" ");
            let currentText = "";

            for (let i = 0; i < words.length; i++) {
                currentText += words[i] + " ";
                botMsgDiv.textContent = currentText;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                await new Promise(r => setTimeout(r, 28)); // كتابة تدفقية سريعة بحركة بشرية
            }

            conversationHistory.push({ role: "assistant", content: reply });
            addToolsToMessage(wrapper, reply);
        }

        function generateHumanResponse(input) {
            const userName = localStorage.getItem('user_name') || 'صديقي';
            const lower = input.toLowerCase();
            const persona = personaSelect.value;

            if (lower.includes("http://") || lower.includes("https://") || lower.includes("youtube") || lower.includes("tiktok")) {
                return `ممتاز يا ${userName}! لقد قمت بالتعرف على هذا الرابط. يمكنك تنزيله بأعلى جودة وتنسيق عبر استخدام النسخة المتقدمة من خيار "👑 النسخة الأقوى (PRO)" في الأعلى!`;
            }

            if (persona === 'tech') {
                return `بناءً على تحليلي البرمجي لـ "${input}": يُفضل دائماً بناء معمارية نظيفة وتوزيع الاستجابات لتفادي البطء وتحقيق أعلى أداء متكامل.`;
            } else if (persona === 'creative') {
                return `يا لها من فكرة ممتازة يا ${userName}! بخصوص "${input}"، يمكننا تطويرها برؤية مبتكرة وجذابة تفتح أبعاداً جديدة.`;
            } else {
                return `فكرة رائعة يا ${userName}! بالنسبة لموضوع "${input}"، أنا معك تماماً وأرى أنه ينطوي على أبعاد ممتازة يمكننا التعمق فيها معاً!`;
            }
        }

        function appendUserMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            wrapper.innerHTML = `<div class="msg user">${text}</div>`;
            chatMessages.appendChild(wrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendBotMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            wrapper.innerHTML = `<div class="msg bot">${text}</div>`;
            chatMessages.appendChild(wrapper);
            addToolsToMessage(wrapper, text);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function createBotMessagePlaceholder() {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            const botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'msg bot';
            botMsgDiv.textContent = "جاري التفكير والكتابة...";
            wrapper.appendChild(botMsgDiv);
            chatMessages.appendChild(wrapper);
            return { botMsgDiv, wrapper };
        }

        function addToolsToMessage(wrapper, text) {
            const toolsDiv = document.createElement('div');
            toolsDiv.className = 'msg-tools';

            const speakBtn = document.createElement('button');
            speakBtn.className = 'msg-btn';
            speakBtn.innerHTML = '🔊 استماع';
            speakBtn.onclick = () => speakText(text);

            const copyBtn = document.createElement('button');
            copyBtn.className = 'msg-btn';
            copyBtn.innerHTML = '📋 نسخ';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(text);
                copyBtn.innerHTML = '✅ تم النسخ';
                setTimeout(() => copyBtn.innerHTML = '📋 نسخ', 2000);
            };

            toolsDiv.appendChild(speakBtn);
            toolsDiv.appendChild(copyBtn);
            wrapper.appendChild(toolsDiv);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                window.speechSynthesis.speak(utterance);
            }
        }

        window.toggleVoiceInput = function() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("التسجيل الصوتي غير مدعوم في متصفحك حالياً.");
                return;
            }

            if (isRecording) {
                recognition.stop();
                isRecording = false;
                micBtn.classList.remove('active');
            } else {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'ar-SA';
                recognition.onstart = () => {
                    isRecording = true;
                    micBtn.classList.add('active');
                };
                recognition.onresult = (e) => {
                    userInput.value = e.results[0][0].transcript;
                };
                recognition.onend = () => {
                    isRecording = false;
                    micBtn.classList.remove('active');
                };
                recognition.start();
            }
        };

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') window.sendMessage();
        };

        setupGreeting();
        loadChatHistory();
        initWebLLM();
    </script>
</body>

</html>
