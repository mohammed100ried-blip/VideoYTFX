<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070b14"
    >

    <title>A5 AI</title>

    <style>

        /* =========================================================
           A5 AI
           Clean AI Interface
           ========================================================= */

        :root {
            --bg: #070b14;
            --bg-secondary: #0b1020;
            --card: rgba(17, 24, 39, 0.78);
            --card-solid: #101827;

            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);

            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-soft: rgba(99, 102, 241, 0.14);

            --danger: #ef4444;
            --success: #22c55e;

            --user-message: #1e293b;
            --assistant-message: rgba(15, 23, 42, 0.82);

            --shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);

            --radius: 22px;

            --transition:
                180ms ease;
        }

        body.light {
            --bg: #f4f7fb;
            --bg-secondary: #e9eef7;
            --card: rgba(255, 255, 255, 0.88);
            --card-solid: #ffffff;

            --border: rgba(15, 23, 42, 0.09);
            --border-hover: rgba(15, 23, 42, 0.16);

            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;

            --user-message: #e2e8f0;
            --assistant-message: rgba(255, 255, 255, 0.92);

            --shadow:
                0 25px 70px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(99, 102, 241, 0.18),
                    transparent 38%
                ),
                var(--bg);

            color: var(--text);

            overflow: hidden;

            transition:
                background var(--transition),
                color var(--transition);
        }

        button,
        textarea,
        input {
            font: inherit;
        }

        button {
            border: 0;
            outline: none;
        }

        /* =========================================================
           APP
           ========================================================= */

        .app {
            width: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .header {
            height: 68px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                0 22px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(7, 11, 20, 0.72);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            position: relative;
            z-index: 20;
        }

        body.light .header {
            background:
                rgba(255, 255, 255, 0.78);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;

            display: grid;
            place-items: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 8px 25px
                rgba(99, 102, 241, 0.32);

            color: white;
        }

        .brand-logo svg {
            width: 22px;
            height: 22px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 750;
            letter-spacing: -0.2px;
        }

        .brand-status {
            display: flex;
            align-items: center;
            gap: 6px;

            color: var(--text-secondary);

            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 10px
                rgba(34, 197, 94, 0.7);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .icon-button {
            width: 40px;
            height: 40px;

            border-radius: 12px;

            display: grid;
            place-items: center;

            color: var(--text-secondary);

            background: transparent;

            cursor: pointer;

            transition:
                background var(--transition),
                color var(--transition),
                transform var(--transition);
        }

        .icon-button:hover {
            background: var(--primary-soft);
            color: var(--text);
        }

        .icon-button:active {
            transform: scale(0.94);
        }

        .icon-button svg {
            width: 20px;
            height: 20px;
        }

        /* =========================================================
           CHAT
           ========================================================= */

        .chat {
            flex: 1;

            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            scroll-behavior: smooth;
        }

        .chat::-webkit-scrollbar {
            width: 7px;
        }

        .chat::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.18);
            border-radius: 20px;
        }

        .chat-inner {
            width: min(950px, 100%);
            margin: 0 auto;

            padding:
                40px 22px
                170px;
        }

        /* =========================================================
           WELCOME
           ========================================================= */

        .welcome {
            min-height: calc(100dvh - 180px);

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 30px 0;
        }

        .welcome-logo {
            width: 82px;
            height: 82px;

            display: grid;
            place-items: center;

            border-radius: 26px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 20px 60px
                rgba(99, 102, 241, 0.28);

            margin-bottom: 24px;
        }

        .welcome-logo svg {
            width: 40px;
            height: 40px;

            color: white;
        }

        .welcome h1 {
            font-size:
                clamp(28px, 5vw, 46px);

            line-height: 1.1;

            letter-spacing: -1.5px;

            margin-bottom: 14px;
        }

        .welcome p {
            max-width: 560px;

            color: var(--text-secondary);

            font-size: 15px;

            line-height: 1.8;
        }

        .suggestions {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            width: min(620px, 100%);

            margin-top: 28px;
        }

        .suggestion {
            padding: 15px 16px;

            text-align: start;

            border:
                1px solid var(--border);

            background:
                var(--card);

            color: var(--text);

            border-radius: 16px;

            cursor: pointer;

            transition:
                border-color var(--transition),
                background var(--transition),
                transform var(--transition);
        }

        .suggestion:hover {
            border-color: var(--border-hover);
            background: var(--primary-soft);

            transform: translateY(-2px);
        }

        .suggestion-title {
            font-size: 13px;
            font-weight: 700;

            margin-bottom: 5px;
        }

        .suggestion-text {
            color: var(--text-secondary);

            font-size: 12px;

            line-height: 1.5;
        }

        /* =========================================================
           MESSAGE
           ========================================================= */

        .message {
            display: flex;

            gap: 12px;

            margin-bottom: 26px;

            animation:
                messageIn 220ms ease both;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 34px;
            height: 34px;

            flex-shrink: 0;

            display: grid;
            place-items: center;

            border-radius: 11px;

            background:
                var(--primary-soft);

            color: var(--primary);
        }

        .avatar svg {
            width: 18px;
            height: 18px;
        }

        .message.user .avatar {
            background:
                rgba(99, 102, 241, 0.18);

            color:
                #818cf8;
        }

        .message-content {
            max-width: min(760px, 82%);

            display: flex;
            flex-direction: column;

            gap: 7px;
        }

        .message.user .message-content {
            align-items: flex-end;
        }

        .message-name {
            color: var(--text-muted);

            font-size: 11px;
            font-weight: 700;
        }

        .message-bubble {
            padding: 13px 16px;

            border-radius: 18px;

            background:
                var(--assistant-message);

            border:
                1px solid var(--border);

            color: var(--text);

            line-height: 1.75;

            font-size: 14px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            box-shadow:
                0 6px 25px
                rgba(0, 0, 0, 0.08);
        }

        .message.user .message-bubble {
            background:
                var(--user-message);

            border:
                1px solid var(--border);
        }

        .message-actions {
            display: flex;
            align-items: center;
            gap: 4px;

            opacity: 0;

            transition:
                opacity var(--transition);
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action {
            width: 30px;
            height: 30px;

            border-radius: 9px;

            display: grid;
            place-items: center;

            background: transparent;

            color: var(--text-muted);

            cursor: pointer;
        }

        .message-action:hover {
            background: var(--primary-soft);
            color: var(--text);
        }

        .message-action svg {
            width: 16px;
            height: 16px;
        }

        /* =========================================================
           IMAGE IN MESSAGE
           ========================================================= */

        .message-image {
            max-width: min(420px, 100%);

            border-radius: 15px;

            border:
                1px solid var(--border);

            display: block;

            margin-bottom: 8px;
        }

        /* =========================================================
           TYPING
           ========================================================= */

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;

            padding: 5px 2px;
        }

        .typing span {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                var(--text-secondary);

            animation:
                typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 150ms;
        }

        .typing span:nth-child(3) {
            animation-delay: 300ms;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* =========================================================
           INPUT AREA
           ========================================================= */

        .composer-area {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 30;

            pointer-events: none;

            padding:
                20px 18px
                calc(20px + env(safe-area-inset-bottom));
        }

        .composer-area::before {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 180px;

            pointer-events: none;

            background:
                linear-gradient(
                    to top,
                    var(--bg) 0%,
                    rgba(7, 11, 20, 0.9) 35%,
                    transparent 100%
                );

            z-index: -1;
        }

        body.light .composer-area::before {
            background:
                linear-gradient(
                    to top,
                    var(--bg) 0%,
                    rgba(244, 247, 251, 0.92) 35%,
                    transparent 100%
                );
        }

        .composer-wrap {
            width: min(850px, 100%);

            margin: auto;

            pointer-events: auto;
        }

        .image-preview {
            display: none;

            margin-bottom: 9px;

            padding: 8px;

            border:
                1px solid var(--border);

            border-radius: 15px;

            background:
                var(--card);

            width: fit-content;

            position: relative;
        }

        .image-preview.visible {
            display: block;
        }

        .image-preview img {
            width: 110px;
            height: 85px;

            object-fit: cover;

            border-radius: 10px;

            display: block;
        }

        .remove-preview {
            position: absolute;

            top: 2px;
            right: 2px;

            width: 24px;
            height: 24px;

            border-radius: 50%;

            display: grid;
            place-items: center;

            background:
                rgba(0, 0, 0, 0.7);

            color: white;

            cursor: pointer;
        }

        .remove-preview svg {
            width: 13px;
            height: 13px;
        }

        .composer {
            min-height: 62px;

            display: flex;
            align-items: flex-end;

            gap: 7px;

            padding: 8px;

            border:
                1px solid var(--border-hover);

            border-radius: 21px;

            background:
                rgba(15, 23, 42, 0.84);

            box-shadow:
                var(--shadow);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

            transition:
                border-color var(--transition),
                box-shadow var(--transition);
        }

        body.light .composer {
            background:
                rgba(255, 255, 255, 0.88);
        }

        .composer:focus-within {
            border-color:
                rgba(99, 102, 241, 0.55);

            box-shadow:
                0 20px 70px
                rgba(0, 0, 0, 0.22),
                0 0 0 3px
                rgba(99, 102, 241, 0.07);
        }

        .textarea {
            flex: 1;

            min-width: 0;

            max-height: 180px;

            min-height: 44px;

            resize: none;

            overflow-y: auto;

            border: 0;
            outline: 0;

            background: transparent;

            color: var(--text);

            padding:
                11px 8px;

            line-height: 1.5;

            font-size: 14px;
        }

        .textarea::placeholder {
            color:
                var(--text-muted);
        }

        .textarea::-webkit-scrollbar {
            width: 4px;
        }

        .textarea::-webkit-scrollbar-thumb {
            background:
                rgba(148, 163, 184, 0.2);

            border-radius: 10px;
        }

        .tool-button {
            width: 44px;
            height: 44px;

            flex-shrink: 0;

            border-radius: 14px;

            display: grid;
            place-items: center;

            background: transparent;

            color:
                var(--text-secondary);

            cursor: pointer;

            transition:
                background var(--transition),
                color var(--transition),
                transform var(--transition);
        }

        .tool-button:hover {
            background:
                var(--primary-soft);

            color:
                var(--text);
        }

        .tool-button:active {
            transform: scale(0.92);
        }

        .tool-button svg {
            width: 21px;
            height: 21px;
        }

        .send-button {
            background:
                var(--primary);

            color: white;
        }

        .send-button:hover {
            background:
                var(--primary-hover);

            color: white;
        }

        .send-button.stop {
            background:
                var(--danger);
        }

        /* =========================================================
           LIVE VOICE MODE
           ========================================================= */

        .mic-button.listening {
            color: white;

            background:
                rgba(239, 68, 68, 0.18);

            animation:
                micPulse 1.4s infinite;
        }

        @keyframes micPulse {
            0% {
                box-shadow:
                    0 0 0 0
                    rgba(239, 68, 68, 0.45);
            }

            70% {
                box-shadow:
                    0 0 0 12px
                    rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(239, 68, 68, 0);
            }
        }

        .voice-status {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 9px;

            margin-bottom: 8px;

            color:
                var(--text-secondary);

            font-size: 12px;
        }

        .voice-status.visible {
            display: flex;
        }

        .voice-bars {
            display: flex;
            align-items: center;

            gap: 3px;

            height: 18px;
        }

        .voice-bars span {
            width: 3px;
            height: 7px;

            border-radius: 3px;

            background:
                #ef4444;

            animation:
                voiceBar 0.8s infinite ease-in-out;
        }

        .voice-bars span:nth-child(2) {
            animation-delay: 100ms;
        }

        .voice-bars span:nth-child(3) {
            animation-delay: 200ms;
        }

        .voice-bars span:nth-child(4) {
            animation-delay: 300ms;
        }

        .voice-bars span:nth-child(5) {
            animation-delay: 400ms;
        }

        @keyframes voiceBar {
            0%,
            100% {
                height: 5px;
            }

            50% {
                height: 17px;
            }
        }

        .composer-hint {
            text-align: center;

            margin-top: 9px;

            color:
                var(--text-muted);

            font-size: 10px;
        }

        /* =========================================================
           CAMERA MODAL
           ========================================================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, 0.72);

            backdrop-filter:
                blur(10px);
        }

        .modal.visible {
            display: flex;
        }

        .camera-box {
            width:
                min(700px, 100%);

            overflow: hidden;

            border-radius: 25px;

            background:
                var(--card-solid);

            border:
                1px solid var(--border);

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.5);
        }

        .camera-header {
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                0 16px;

            border-bottom:
                1px solid var(--border);
        }

        .camera-title {
            font-size: 14px;
            font-weight: 750;
        }

        .camera-content {
            position: relative;

            background: #000;

            aspect-ratio: 16 / 10;

            overflow: hidden;
        }

        #cameraVideo {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        .camera-footer {
            padding: 15px;

            display: flex;
            justify-content: center;
            gap: 9px;

            border-top:
                1px solid var(--border);
        }

        .camera-action {
            height: 44px;

            padding:
                0 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            border-radius: 13px;

            color: var(--text);

            background:
                var(--primary-soft);

            cursor: pointer;
        }

        .camera-action.primary {
            background:
                var(--primary);

            color: white;
        }

        .camera-action:hover {
            filter: brightness(1.08);
        }

        .camera-action svg {
            width: 18px;
            height: 18px;
        }

        /* =========================================================
           TOAST
           ========================================================= */

        .toast-container {
            position: fixed;

            top: 78px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 200;

            display: flex;

            flex-direction: column;

            gap: 8px;

            pointer-events: none;
        }

        .toast {
            min-width: 230px;

            max-width: 90vw;

            padding:
                12px 15px;

            border:
                1px solid var(--border);

            border-radius: 13px;

            background:
                var(--card-solid);

            color:
                var(--text);

            box-shadow:
                var(--shadow);

            font-size: 12px;

            text-align: center;

            animation:
                toastIn 220ms ease both;
        }

        .toast.error {
            border-color:
                rgba(239, 68, 68, 0.35);
        }

        .toast.success {
            border-color:
                rgba(34, 197, 94, 0.35);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform:
                    translateY(-10px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 650px) {

            .header {
                height: 62px;

                padding:
                    0 13px;
            }

            .brand-logo {
                width: 36px;
                height: 36px;
            }

            .brand-name {
                font-size: 15px;
            }

            .chat-inner {
                padding:
                    28px 13px
                    150px;
            }

            .welcome {
                min-height:
                    calc(100dvh - 170px);
            }

            .welcome-logo {
                width: 68px;
                height: 68px;

                border-radius: 22px;
            }

            .welcome-logo svg {
                width: 32px;
                height: 32px;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .welcome p {
                font-size: 13px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .message-content {
                max-width: 86%;
            }

            .message-actions {
                opacity: 1;
            }

            .composer-area {
                padding:
                    10px 9px
                    calc(10px + env(safe-area-inset-bottom));
            }

            .composer {
                min-height: 57px;
                border-radius: 18px;
            }

            .tool-button {
                width: 40px;
                height: 40px;
            }

            .textarea {
                font-size: 14px;
            }

            .composer-hint {
                display: none;
            }
        }

        @media (max-width: 420px) {

            .header-actions .clear-button {
                display: none;
            }

            .message {
                gap: 8px;
            }

            .avatar {
                width: 31px;
                height: 31px;
            }

            .message-bubble {
                padding:
                    11px 13px;

                font-size: 13px;
            }

            .tool-button {
                width: 38px;
                height: 38px;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header class="header">

        <div class="brand">

            <div class="brand-logo">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M12 3a7 7 0 0 0-7 7v3a7 7 0 0 0 14 0v-3a7 7 0 0 0-7-7Z"/>

    if (savedTheme === "light") {

        body.classList.add("light");

    }


    themeButton.addEventListener(
        "click",
        () => {

            body.classList.toggle("light");

            localStorage.setItem(

                    ? "light"
                    : "dark"
            );

    /* =========================================================
       LOCAL CONVERSATION
       ========================================================= */

    function saveConversation() {

        /*
            لا نحفظ الصور Base64 في localStorage.
            الصور الكبيرة ستقتل مساحة التخزين بسرعة.
        */

        const safeConversation =
            conversation.map(item => {

                return {
                    role: item.role,
                    content:
                        typeof item.content === "string"
                            ? item.content
                            : ""
                };

            });

        localStorage.setItem(
            "a5-conversation",
            JSON.stringify(safeConversation)
        );

    }


    function loadConversation() {

        try {

            const saved =
                localStorage.getItem(
                    "a5-conversation"
                );

            if (!saved) return;

            const parsed =
                JSON.parse(saved);

            if (!Array.isArray(parsed)) return;

            conversation =
                parsed;

            conversation.forEach(item => {

                if (
                    item.role === "user" ||
                    item.role === "assistant"
                ) {

                    renderMessage(
                        item.role,
                        item.content
                    );

                }

            });

            if (conversation.length > 0) {

                hideWelcome();

            }

        } catch (error) {

            console.error(
                "Conversation loading error:",
                error
            );

        }

    }

       ========================================================= */

    function escapeHTML(text) {

        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

                '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
            );

        return safe;

    }

    async function openCamera() {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showToast(
                t("unsupportedCamera"),
                "error"
            );

            return;

        }

        cameraModal.classList.add(
            "visible"
        );

        await startCamera();

    }


    async function startCamera() {

        stopCamera();

        try {

            cameraStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {

                        facingMode:
                            currentCamera

                    },

                    audio: false

                });

            cameraVideo.srcObject =
                cameraStream;

        } catch (error) {

            console.error(
                "Camera error:",
                error
            );

            cameraModal.classList.remove(
                "visible"
            );

            showToast(
                t("cameraError"),
                "error"
            );

        }

    }


    function stopCamera() {

        if (!cameraStream) return;

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        cameraStream = null;

    }


    closeCameraButton.addEventListener(
        "click",
        closeCamera
    );


    function closeCamera() {

        cameraModal.classList.remove(
            "visible"
        );

        stopCamera();

    function captureImage() {

        if (!cameraStream) {

            showToast(
                t("cameraError"),
                "error"
            );

            return;

        }

        const canvas =
            document.createElement("canvas");

        const videoWidth =
            cameraVideo.videoWidth;

        const videoHeight =
            cameraVideo.videoHeight;

        if (!videoWidth || !videoHeight) {

            return;

        }

        canvas.width =
            videoWidth;

        canvas.height =
            videoHeight;

        const context =
            canvas.getContext("2d");

        /*
            الصورة كما تظهر من الكاميرا.
        */

        if (
            currentCamera === "user"
        ) {

            context.translate(
                canvas.width,
                0
            );

            context.scale(
                -1,
                1
            );

        }

        context.drawImage(
            cameraVideo,
            0,
            0,
            canvas.width,
            canvas.height
        );

        pendingImage =
            canvas.toDataURL(
                "image/jpeg",
                0.88
            );

        previewImage.src =
            pendingImage;

        imagePreview.classList.add(
            "visible"
        );

        closeCamera();

        showToast(
            t("imageReady"),
            "success"
        );

    }


    /* =========================================================
       MICROPHONE / SPEECH RECOGNITION
       ========================================================= */

    function initializeSpeechRecognition() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;

        if (!SpeechRecognition) {

            recognition = null;

            return;

        }

        recognition =
            new SpeechRecognition();

        recognition.continuous =
            true;

        recognition.interimResults =
            true;

        recognition.maxAlternatives =
            1;

        recognition.lang =
            currentLanguage === "ar"
                ? "ar-SA"
                : "en-US";


        recognition.onstart =
            () => {

                isListening = true;

                micButton.classList.add(
                    "listening"
                );

                voiceStatus.classList.add(
                    "visible"
                );

                voiceStatusText.textContent =
                    t("listening");

            };


        recognition.onresult =
            event => {

                let finalText = "";

                let interimText = "";

                for (
                    let i =
                        event.resultIndex;
                    i <
                        event.results.length;
                    i++
                ) {

                    const result =
                        event.results[i];

                    const transcript =
                        result[0].transcript;

                    if (
                        result.isFinal
                    ) {

                        finalText +=
                            transcript;

                    } else {

                        interimText +=
                            transcript;

                    }

                }

                /*
                    نضع النص في الصندوق أثناء الكلام.
                */

                if (finalText) {

                    const existing =
                        messageInput.value
                            .trim();

                    if (existing) {

                        messageInput.value =
                            existing +
                            " " +
                            finalText;

                    } else {

                        messageInput.value =
                            finalText;

                    }

                }

                /*
                    نعرض الكلام المؤقت بدون حفظه.
                */

                if (interimText) {

                    voiceStatusText.textContent =
                        interimText;

                } else {

                    voiceStatusText.textContent =
                        t("listening");

                }

                autoResize();

            };


        recognition.onerror =
            event => {

                console.error(
                    "Speech error:",
                    event.error
                );

                /*
                    no-speech ليس خطأ قاتلًا.
                */

                if (
                    event.error !==
                    "no-speech"
                ) {

                    showToast(
                        t("microphoneError"),
                        "error"
                    );

                }

            };


        recognition.onend =
            async () => {

                isListening = false;

                micButton.classList.remove(
                    "listening"
                );

                voiceStatus.classList.remove(
                    "visible"
                );

                /*
                    إذا كان هناك نص،
                    نرسله تلقائيًا.

                    هذه هي المحادثة الفورية.
                */

                const text =
                    messageInput.value.trim();

                if (
                    text &&
                    !isThinking
                ) {

                    messageInput.value =
                        "";

                    autoResize();

                    await sendMessage(
                        text,
                        true
                    );

                }

            };

    }


    initializeSpeechRecognition();

    function toggleMicrophone() {

        if (!recognition) {

            showToast(

        /*
            لا نبدأ تسجيلًا جديدًا أثناء طلب AI.
        */

            isThinking
        ) {

            return;

        }

        if (isListening) {

            recognition.stop();

            return;

        }

        try {

            /*
                تحديث اللغة قبل البدء.
            */

            recognition.lang =
                currentLanguage === "ar"
                    ? "ar-SA"
                    : "en-US";

            /*
                نمسح النص القديم قبل جلسة صوت جديدة
                حتى تكون المحادثة طبيعية.
            */

            messageInput.value =
                "";

            autoResize();

            recognition.start();

        } catch (error) {

            console.error(
                error
            );

        }

    }


    /* =========================================================
       TEXT TO SPEECH
       ========================================================= */

    function speak(text) {

        if (
            !("speechSynthesis" in window)
        ) {

            return;

        }

        speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                text
            );

        const isArabic =
            /[\u0600-\u06FF]/.test(
                text
            );

        utterance.lang =
            isArabic
                ? "ar-SA"
                : "en-US";

        utterance.rate =
            1;

        utterance.pitch =
            1;

        utterance.volume =
            1;


        utterance.onstart =
            () => {

                voiceStatus.classList.add(
                    "visible"
                );

                voiceStatusText.textContent =
                    t("speaking");

            };


        utterance.onend =
            () => {

                voiceStatus.classList.remove(
                    "visible"
                );

            };


        utterance.onerror =
            () => {

                voiceStatus.classList.remove(
                    "visible"
                );

            };


        speechSynthesis.speak(
            utterance
        );

    }

    async function sendMessage(
        text,
        fromVoice = false
    ) {

        /*
            حماية من الإرسال الفارغ.
        */

        if (
            !text &&
            !pendingImage
        ) {

            return;

        }

        /*
            إذا كان المستخدم وضع مفتاحًا
            في مكانه.
        */

        if (
            !A5_API_KEY ||
            A5_API_KEY.includes(
                "PUT_YOUR_NEW_OPENROUTER_KEY"
            )
        ) {

            showToast(
                t("missingKey"),
                "error"
            );

            return;

        }


        const image =
            pendingImage;

        /*
            امسح الصورة الحالية بعد حفظها
            في متغير محلي.
        */

        pendingImage = null;

        previewImage.src = "";

        imagePreview.classList.remove(
            "visible"
        );

        imageInput.value = "";


        /*
            عرض رسالة المستخدم.
        */

        renderMessage(
            "user",
            text ||
                (
                    currentLanguage === "ar"
                        ? "حلل هذه الصورة."
                        : "Analyze this image."
                ),
            image
        );


        /*
            الرسالة التي سترسل إلى النموذج.
        */

        let apiContent;


        /*
            Multimodal message
        */

        if (image) {

            apiContent = [

                {
                    type: "text",

                    text:
                        text ||
                        (
                            currentLanguage === "ar"
                                ? "حلل هذه الصورة بالتفصيل."
                                : "Analyze this image in detail."
                        )

                },

                {
                    type: "image_url",

                    image_url: {

                        url:
                            image

                    }

                }

            ];

        } else {

            apiContent =
                text;

        }


        /*
            نضيف المحادثة إلى الذاكرة.
        */

        conversation.push({

            role: "user",

            content:
                text ||
                (
                    currentLanguage === "ar"
                        ? "حلل هذه الصورة."
                        : "Analyze this image."
                )

        });


        saveConversation();


        /*
            حالة التفكير.
        */

        setThinking(true);

        showTyping();


        try {

            /*
                نبني الرسائل.

                لا نرسل الصور القديمة من localStorage.
                لذلك الصور تعمل مع الرسالة الحالية فقط.
            */

            const messages = [

                {
                    role: "system",

                    content: `
You are A5 AI, a helpful, intelligent and friendly assistant.

Rules:

- Answer clearly and accurately.
- Understand Arabic and English.
- Reply in the same language as the user.
- Help with programming, websites, education, writing and general questions.
- Analyze images when an image is provided.
- Do not claim to be human.
- Do not invent facts.
- If you are uncertain, say so clearly.
- Keep answers useful and reasonably concise.
- Follow the user's language naturally.
                    `.trim()

                },

                /*
                    نأخذ آخر 30 رسالة تقريبًا
                    حتى لا يكبر الطلب بلا حدود.
                */

                ...conversation
                    .slice(-30)
                    .map(item => ({

                        role:
                            item.role,

                        content:
                            item.content

                    }))

            ];


            /*
                الرسالة الحالية إذا كانت تحتوي صورة
                يجب أن تحتوي على content متعدد الأجزاء.

                لذلك نستبدل آخر رسالة.
            */

            messages[
                messages.length - 1
            ].content =
                apiContent;


            /*
                API request
            */

            currentController =
                new AbortController();


            const response =
                await fetch(
                    API_URL,
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                A5_API_KEY.trim(),

                            "HTTP-Referer":
                                SITE_URL,

                            "X-Title":
                                SITE_NAME

                        },

                        body:
                            JSON.stringify({

                                model:
                                    MODEL,

                                messages:
                                    messages,

                                temperature:
                                    0.7,

                                max_tokens:
                                    2000

                            }),

                        signal:
                            currentController.signal

                    }
                );


            /*
                نحاول قراءة JSON حتى عند الخطأ
                حتى نعرف الخطأ الحقيقي.
            */

            const data =
                await response.json()
                    .catch(
                        () => ({})
                    );


            if (!response.ok) {

                const apiMessage =
                    data?.error?.message ||
                    data?.message ||
                    `HTTP ${response.status}`;

                throw new Error(
                    apiMessage
                );

            }


            const answer =
                data?.choices?.[0]?.message?.content;


            if (!answer) {

                throw new Error(
                    "The AI returned an empty response."
                );

            }


            removeTyping();


            /*
                حفظ الرد.
            */

            conversation.push({

                role:
                    "assistant",

                content:
                    answer

            });


            saveConversation();


            /*
                عرض الرد.
            */

            renderMessage(
                "assistant",
                answer
            );


            /*
                نقرأ الرد صوتيًا إذا كانت الرسالة
                جاءت من وضع الميكروفون.
            */

            if (fromVoice) {

                speak(answer);

            }


        } catch (error) {

            removeTyping();

            console.error(
                "A5 API Error:",
                error
            );


            if (
                error.name ===
                "AbortError"
            ) {

                return;

            }


            let message =
                t("apiError");


            /*
                نعرض الخطأ الحقيقي للمستخدم.
                هذا مهم جدًا أثناء الاختبار.
            */

            message +=
                "\n\n" +
                error.message;


            renderMessage(
                "assistant",
                message
            );


        } finally {

            currentController =
                null;

            setThinking(false);

        }

    }

    async function copyText(text) {

        try {

            await navigator.clipboard.writeText(
                text
            );

            showToast(
                t("copied"),
                "success"
            );

        } catch (error) {

            /*
                Fallback
            */

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                text;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();

            showToast(
                t("copied"),
                "success"
            );

        }

    }


    /* =========================================================

    function autoResize() {

        messageInput.style.height =
            "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                180
            ) + "px";

    }


    messageInput.addEventListener(
        "input",
        autoResize
    );


    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                if (!isThinking) {

                    sendCurrentMessage();

                }

            }

        }
    );


    /* =========================================================
       SUGGESTIONS
       ========================================================= */

    document
        .querySelectorAll(".suggestion")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const prompt =
                            button.dataset.prompt;

                        messageInput.value =
                            prompt;

                        autoResize();

                        sendCurrentMessage();

                    }
                );

            }
        );


    /* =========================================================
       PASTE IMAGE
       ========================================================= */

    document.addEventListener(
        "paste",
        event => {

            const items =
                event.clipboardData?.items;

            if (!items) return;

            for (
                const item of items
            ) {

                if (
                    item.type.startsWith(
                        "image/"
                    )
                ) {

                    const file =
                        item.getAsFile();

                    if (file) {

                        prepareImage(
                            file
                        );

                    }

                    break;

                }

            }

        }
    );


    /* =========================================================
       DRAG & DROP IMAGE
       ========================================================= */

    chat.addEventListener(
        "dragover",
        event => {

            event.preventDefault();

        }
    );


    chat.addEventListener(
        "drop",
        event => {

            event.preventDefault();

            const files =
                event.dataTransfer?.files;

            if (!files?.length) return;

            const file =
                files[0];

            if (
                file.type.startsWith(
                    "image/"
                )
            ) {

                prepareImage(
                    file
                );

            }

        }
    );


    /* =========================================================
       TOAST
       ========================================================= */

    function showToast(
        message,
        type = ""
    ) {

        const toast =
            document.createElement(
                "div"
            );

        toast.className =
            `toast ${type}`;

        toast.textContent =
            message;

        toastContainer.appendChild(
            toast
        );

        setTimeout(
            () => {

                toast.style.opacity =
                    "0";

                toast.style.transform =
                    "translateY(-10px)";

                setTimeout(
                    () => toast.remove(),
                    200
                );

            },
            3000
        );

    }


    /* =========================================================
       KEYBOARD ESC
       ========================================================= */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape"
            ) {

                if (
                    cameraModal.classList.contains(
                        "visible"
                    )
                ) {

                    closeCamera();

                }

                if (
                    isListening &&
                    recognition
                ) {

                    recognition.stop();

                }

            }

        }
    );


    /* =========================================================
       PAGE VISIBILITY
       ========================================================= */

    document.addEventListener(
        "visibilitychange",
        () => {

            /*
                لا نترك الكاميرا تعمل في الخلفية.
            */

            if (
                document.hidden &&
                cameraStream
            ) {

                stopCamera();

            }

        }
    );


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    applyLanguage();

    loadConversation();

    autoResize();


    /*
        رسالة في Console للمطور.
    */

    console.log(
        "%cA5 AI initialized",
        "font-size:16px;font-weight:bold;color:#6366f1"
    );

    console.log(
        "Voice recognition:",
        !!recognition
    );

    console.log(
        "Camera:",
        !!(
            navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia
        )
    );

</script>

</body>
</html>
