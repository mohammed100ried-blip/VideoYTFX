
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>image-001</title>

<style>
:root {
  --bg: #050505;
  --panel: rgba(15,15,15,.88);
  --panel2: #191919;
  --text: #ffffff;
  --muted: #a5a5a5;
  --line: rgba(255,220,0,.2);
  --accent: #ffdf00;
  --accent2: #fff6a0;
  --shadow: 0 0 30px rgba(255,220,0,.08);
}

[data-theme="light"] {
  --bg: #f3f3f0;
  --panel: rgba(255,255,255,.92);
  --panel2: #eeeeea;
  --text: #151515;
  --muted: #666;
  --line: rgba(160,130,0,.25);
  --accent: #d5ae00;
  --accent2: #fff0a0;
  --shadow: 0 0 25px rgba(150,120,0,.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
  overflow-x: hidden;
}

/* BACKGROUND STORM */

#storm {
  position: fixed;
  inset: 0;
  z-index: -3;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 45%, #24200b 0%, transparent 40%),
    radial-gradient(ellipse at center, #111 0%, #030303 75%);
}

#storm::before,
#storm::after {
  content: "";
  position: absolute;
  width: 100vmax;
  height: 100vmax;
  left: 50%;
  top: 50%;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  background: repeating-conic-gradient(
    from 0deg,
    transparent 0deg 12deg,
    rgba(255,220,0,.025) 13deg 16deg,
    transparent 18deg 30deg
  );
  animation: stormSpin 35s linear infinite;
  mask-image: radial-gradient(transparent 0%, black 45%, transparent 75%);
}

#storm::after {
  width: 75vmax;
  height: 75vmax;
  background: repeating-conic-gradient(
    from 40deg,
    transparent 0deg 20deg,
    rgba(255,255,255,.035) 22deg 24deg,
    transparent 26deg 40deg
  );
  animation: stormSpin 22s linear infinite reverse;
}

@keyframes stormSpin {
  to { transform: translate(-50%,-50%) rotate(360deg); }
}

/* BLACK HOLE CURSOR */

#blackHole {
  position: fixed;
  width: 95px;
  height: 95px;
  left: 0;
  top: 0;
  z-index: 9999;
  pointer-events: none;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  opacity: .8;
  background:
    radial-gradient(circle,
      #000 0 25%,
      #080808 27% 38%,
      rgba(255,220,0,.45) 42%,
      rgba(255,255,255,.18) 46%,
      transparent 68%);
  filter: drop-shadow(0 0 13px rgba(255,220,0,.35));
  transition: width .2s, height .2s;
}

#blackHole::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(255,225,0,.5);
  border-radius: 50%;
  animation: holeSpin 4s linear infinite;
}

#blackHole::after {
  content: "";
  position: absolute;
  inset: 20px;
  border: 2px solid rgba(255,255,255,.3);
  border-left-color: transparent;
  border-right-color: transparent;
  border-radius: 50%;
  animation: holeSpin 2s linear infinite reverse;
}

@keyframes holeSpin {
  to { transform: rotate(360deg); }
}

@media (pointer: coarse) {
  #blackHole { display:none; }
}

/* HEADER */

header {
  height: 75px;
  padding: 0 4%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(5,5,5,.82);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--accent);
  text-shadow: 0 0 18px rgba(255,220,0,.4);
}

.header-actions {
  display: flex;
  gap: 9px;
}

/* GENERAL */

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 15px;
  transition: .2s;
}

button:hover {
  border-color: var(--accent);
  box-shadow: 0 0 14px rgba(255,220,0,.13);
  transform: translateY(-1px);
}

button:active {
  transform: scale(.97);
}

.primary {
  background: var(--accent);
  color: #080808;
  border-color: var(--accent);
  font-weight: bold;
}

main {
  width: min(1450px, 94%);
  margin: 30px auto 70px;
}

.page {
  display: none;
  animation: pageIn .35s ease;
}

.page.active {
  display: block;
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* HOME */

.home-title {
  text-align: center;
  margin: 65px 0 45px;
}

.home-title h1 {
  font-size: clamp(35px,6vw,65px);
  margin: 0;
  color: var(--text);
  letter-spacing: 2px;
}

.home-title span {
  color: var(--accent);
}

.home-title::after {
  content: "";
  display: block;
  width: 100px;
  height: 3px;
  margin: 20px auto;
  background: var(--accent);
  box-shadow: 0 0 20px var(--accent);
}

.cards {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
}

.card {
  min-height: 210px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: .3s;
}

.card::before {
  content: "";
  position: absolute;
  width: 180%;
  height: 180%;
  background: conic-gradient(
    transparent,
    transparent,
    rgba(255,220,0,.16),
    transparent 35%
  );
  animation: cardSpin 8s linear infinite;
}

.card::after {
  content: "";
  position: absolute;
  inset: 1px;
  background: var(--panel);
  border-radius: 19px;
}

@keyframes cardSpin {
  to { transform: rotate(360deg); }
}

.card:hover {
  transform: translateY(-7px);
  border-color: var(--accent);
  box-shadow: 0 10px 35px rgba(255,220,0,.1);
}

.card h2 {
  position: relative;
  z-index: 2;
  font-size: 25px;
  color: var(--text);
}

/* EDITOR LAYOUT */

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.heading h1 {
  margin: 0;
  font-size: 27px;
}

.heading-actions,
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0,1fr) 300px;
  gap: 17px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 17px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.toolbar {
  padding: 13px;
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
}

.stage {
  min-height: 520px;
  padding: 20px;
  display: grid;
  place-items: center;
  overflow: auto;
  background-color: var(--panel2);
  background-image:
    linear-gradient(45deg,#8882 25%,transparent 25%),
    linear-gradient(-45deg,#8882 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#8882 75%),
    linear-gradient(-45deg,transparent 75%,#8882 75%);
  background-size: 22px 22px;
  background-position: 0 0,0 11px,11px -11px,-11px 0;
}

canvas {
  display: block;
  max-width: 100%;
  height: auto;
  background: white;
  touch-action: none;
}

#editCanvas,
#retouchCanvas {
  display: none;
  max-height: 720px;
  object-fit: contain;
}

.drop {
  width: min(420px,100%);
  padding: 45px 20px;
  text-align: center;
  border: 2px dashed var(--accent);
  border-radius: 18px;
  cursor: pointer;
  transition: .2s;
}

.drop:hover {
  background: rgba(255,220,0,.05);
  box-shadow: 0 0 25px rgba(255,220,0,.1);
}

.drop h2 {
  font-size: 23px;
}

.sidebar {
  padding: 17px;
  max-height: 850px;
  overflow-y: auto;
}

.sidebar h3 {
  margin: 0 0 15px;
  color: var(--accent);
  font-size: 20px;
}

.control {
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.control label {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 14px;
}

input[type=range] {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
}

input[type=color] {
  width: 50px;
  height: 35px;
  border: 0;
  background: transparent;
  cursor: pointer;
}

input[type=text],
select,
input[type=number] {
  width: 100%;
  padding: 10px;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 9px;
}

select option {
  background: #151515;
  color: white;
}

.full {
  width: 100%;
  margin-top: 9px;
}

.value {
  color: var(--accent);
  font-weight: bold;
}

.hint {
  color: var(--muted);
  font-size: 12px;
}

.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  padding: 13px 20px;
  background: #171717;
  border: 1px solid var(--accent);
  color: white;
  border-radius: 12px;
  display: none;
  z-index: 10000;
  box-shadow: 0 0 25px rgba(255,220,0,.15);
}

.toast.show {
  display: block;
  animation: pageIn .2s;
}

@media(max-width:850px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { max-height: none; }
  .stage { min-height: 350px; }
  .cards { grid-template-columns: 1fr; }
  .card { min-height: 145px; }
  #editCanvas,#retouchCanvas { max-height: 450px; }
  header { padding: 0 3%; }
  .logo { font-size: 20px; }
}
</style>
</head>

<body>

<div id="storm"></div>
<div id="blackHole"></div>

<header>
  <div class="logo">image-001</div>
  <div class="header-actions">
    <button id="themeBtn">تغيير المظهر</button>
    <button id="homeBtn">الرئيسية</button>
  </div>
</header>

<main>

<!-- HOME -->

<section id="home" class="page active">
  <div class="home-title">
    <h1>image-<span>001</span></h1>
  </div>

  <div class="cards">
    <article class="card" data-page="editor">
      <h2>تحرير الصور</h2>
    </article>

    <article class="card" data-page="retouch">
      <h2>تنظيف الصور</h2>
    </article>

    <article class="card" data-page="drawing">
      <h2>الرسم</h2>
    </article>
  </div>
</section>

<!-- IMAGE EDITOR -->

<section id="editor" class="page">
  <div class="heading">
    <h1>تحرير الصور</h1>

    <div class="heading-actions">
      <button id="rotateBtn">تدوير</button>
      <button id="flipBtn">عكس</button>
      <button id="resetEdit">إعادة ضبط</button>
      <button class="primary" id="exportEdit">تصدير PNG</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="toolbar">
        <button class="primary" id="chooseEdit">اختيار صورة</button>
        <input id="editFile" type="file" accept="image/*" hidden>
        <span id="editInfo" class="hint">لم يتم اختيار صورة</span>
      </div>

      <div class="stage">
        <div class="drop" id="editDrop">
          <h2>اختر صورة للتعديل</h2>
          <button class="primary" id="dropChoose">فتح صورة</button>
        </div>
        <canvas id="editCanvas"></canvas>
      </div>
    </div>

    <aside class="panel sidebar">
      <h3>التعديلات</h3>

      <div class="control">
        <label>الإضاءة <span id="brightVal" class="value">100%</span></label>
        <input id="bright" type="range" min="0" max="200" value="100">
      </div>

      <div class="control">
        <label>التباين <span id="contrastVal" class="value">100%</span></label>
        <input id="contrast" type="range" min="0" max="200" value="100">
      </div>

      <div class="control">
        <label>التشبع <span id="saturationVal" class="value">100%</span></label>
        <input id="saturation" type="range" min="0" max="200" value="100">
      </div>

      <div class="control">
        <label>التمويه <span id="blurVal" class="value">0px</span></label>
        <input id="blur" type="range" min="0" max="10" value="0">
      </div>

      <div class="control">
        <label>درجة الألوان <span id="hueVal" class="value">0°</span></label>
        <input id="hue" type="range" min="-180" max="180" value="0">
      </div>

      <div class="control">
        <label>الفلاتر</label>
        <select id="filter">
          <option value="none">بدون فلتر</option>
          <option value="grayscale(1)">أبيض وأسود</option>
          <option value="sepia(1)">بني</option>
          <option value="saturate(1.8) contrast(1.1)">ألوان قوية</option>
          <option value="contrast(1.15) saturate(.8)">سينمائي</option>
          <option value="sepia(.2) saturate(1.3)">دافئ</option>
          <option value="invert(1)">عكس الألوان</option>
          <option value="brightness(1.1) contrast(1.2)">حاد</option>
        </select>
      </div>
    </aside>
  </div>
</section>

<!-- RETOUCH -->

<section id="retouch" class="page">
  <div class="heading">
    <h1>تنظيف الصور</h1>
    <div class="heading-actions">
      <button id="undoRetouch">تراجع</button>
      <button class="primary" id="exportRetouch">تصدير PNG</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="toolbar">
        <button class="primary" id="chooseRetouch">اختيار صورة</button>
        <input id="retouchFile" type="file" accept="image/*" hidden>
      </div>

      <div class="stage">
        <div class="drop" id="retouchDrop">
          <h2>اختر صورة للتنظيف</h2>
          <button class="primary" id="retouchDropChoose">فتح صورة</button>
        </div>
        <canvas id="retouchCanvas"></canvas>
      </div>
    </div>

    <aside class="panel sidebar">
      <h3>أدوات التنظيف</h3>

      <div class="control">
        <label>الأداة</label>
        <select id="retouchTool">
          <option value="blur">تمويه</option>
          <option value="clone">نسخ منطقة مجاورة</option>
        </select>
      </div>

      <div class="control">
        <label>حجم الفرشاة <span id="retouchSizeVal" class="value">30px</span></label>
        <input id="retouchSize" type="range" min="5" max="120" value="30">
      </div>

      <div class="control">
        <label>قوة التمويه <span id="blurStrengthVal" class="value">5px</span></label>
        <input id="blurStrength" type="range" min="1" max="20" value="5">
      </div>

      <div class="control">
        <label>مسافة النسخ <span id="cloneOffsetVal" class="value">50px</span></label>
        <input id="cloneOffset" type="range" min="10" max="200" value="50">
      </div>
    </aside>
  </div>
</section>

<!-- DRAWING -->

<section id="drawing" class="page">
  <div class="heading">
    <h1>الرسم</h1>
    <div class="heading-actions">
      <button id="undoDrawing">تراجع</button>
      <button id="clearDrawing">مسح اللوحة</button>
      <button class="primary" id="exportDrawing">تصدير PNG</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="toolbar">
        <button id="importReference">إضافة صورة مرجعية</button>
        <input id="referenceFile" type="file" accept="image/*" hidden>
        <button id="removeReference">إزالة الصورة المرجعية</button>
      </div>

      <div class="stage">
        <canvas id="drawingCanvas" width="1200" height="800"></canvas>
      </div>
    </div>

    <aside class="panel sidebar">
      <h3>أدوات الرسم</h3>

      <div class="control">
        <label>الفرشاة</label>
        <select id="brushType">
          <option value="pencil">قلم رصاص</option>
          <option value="ink">حبر</option>
          <option value="soft">قلم ناعم</option>
          <option value="marker">ماركر</option>
          <option value="highlighter">تمييز</option>
          <option value="airbrush">بخاخ</option>
          <option value="watercolor">مائي</option>
          <option value="oil">زيتي</option>
          <option value="crayon">شمع</option>
          <option value="neon">نيون</option>
          <option value="calligraphy">خط عريض</option>
          <option value="pixel">بكسل</option>
          <option value="rainbow">قوس قزح</option>
          <option value="eraser">ممحاة</option>
        </select>
      </div>

      <div class="control">
        <label>اللون</label>
        <input id="brushColor" type="color" value="#111111">
      </div>

      <div class="control">
        <label>الحجم <span id="brushSizeVal" class="value">8px</span></label>
        <input id="brushSize" type="range" min="1" max="100" value="8">
      </div>

      <div class="control">
        <label>الشفافية <span id="opacityVal" class="value">100%</span></label>
        <input id="opacity" type="range" min="5" max="100" value="100">
      </div>

      <div class="control">
        <label>تنعيم الخط <span id="smoothVal" class="value">50%</span></label>
        <input id="smooth" type="range" min="0" max="100" value="50">
      </div>

      <div class="control">
        <label>شكل الفرشاة</label>
        <select id="brushShape">
          <option value="round">دائري</option>
          <option value="square">مربع</option>
          <option value="flat">مسطح</option>
        </select>
      </div>

      <div class="control">
        <label>خلفية اللوحة</label>
        <input id="backgroundColor" type="color" value="#ffffff">
        <button class="full" id="applyBackground">تغيير الخلفية</button>
      </div>
    </aside>
  </div>
</section>

</main>

<div class="toast" id="toast"></div>

<script>
const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];

function message(text) {
  const toast = $('#toast');
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(message.timer);
  message.timer = setTimeout(() => toast.classList.remove('show'), 2300);
}

/* BLACK HOLE FOLLOW MOUSE */

const blackHole = $('#blackHole');
let mouseX = -200;
let mouseY = -200;
let holeX = -200;
let holeY = -200;

window.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function animateHole() {
  holeX += (mouseX - holeX) * .13;
  holeY += (mouseY - holeY) * .13;
  blackHole.style.left = holeX + 'px';
  blackHole.style.top = holeY + 'px';
  requestAnimationFrame(animateHole);
}
animateHole();

/* NAVIGATION */

$$('[data-page]').forEach(card => {
  card.addEventListener('click', () => showPage(card.dataset.page));
});

function showPage(id) {
  $$('.page').forEach(page => page.classList.remove('active'));
  $('#' + id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('#homeBtn').onclick = () => showPage('home');

$('#themeBtn').onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
};

/* FILE HELPERS */

function loadImage(file, callback) {
  if (!file || !file.type.startsWith('image/')) {
    message('اختر ملف صورة صالحًا');
    return;
  }

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = () => {
    callback(img, file.name);
    URL.revokeObjectURL(url);
  };

  img.onerror = () => {
    URL.revokeObjectURL(url);
    message('تعذر فتح الصورة');
  };

  img.src = url;
}

function downloadCanvas(canvas, name) {
  canvas.toBlob(blob => {
    if (!blob) {
      message('تعذر تصدير الصورة');
      return;
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }, 'image/png');
}

function attachDrop(zone, callback) {
  zone.addEventListener('dragover', e => {
    e.preventDefault();
    zone.style.borderColor = '#ffffff';
  });

  zone.addEventListener('dragleave', () => {
    zone.style.borderColor = '';
  });

  zone.addEventListener('drop', e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) loadImage(file, callback);
  });
}

/* IMAGE EDITOR */

const editCanvas = $('#editCanvas');
const editCtx = editCanvas.getContext('2d');

let editImage = null;
let editName = 'image';
let editRotation = 0;
let editFlip = false;

function renderEdit() {
  if (!editImage) return;

  const rotated = Math.abs(editRotation % 180) === 90;
  const width = editImage.naturalWidth;
  const height = editImage.naturalHeight;

  editCanvas.width = rotated ? height : width;
  editCanvas.height = rotated ? width : height;

  editCtx.clearRect(0, 0, editCanvas.width, editCanvas.height);

  const filter =
    `brightness(${$('#bright').value}%)
     contrast(${$('#contrast').value}%)
     saturate(${$('#saturation').value}%)
     blur(${$('#blur').value}px)
     hue-rotate(${$('#hue').value}deg)
     ${$('#filter').value === 'none' ? '' : $('#filter').value}`;

  editCtx.save();
  editCtx.filter = filter;
  editCtx.translate(editCanvas.width / 2, editCanvas.height / 2);
  editCtx.rotate(editRotation * Math.PI / 180);
  editCtx.scale(editFlip ? -1 : 1, 1);
  editCtx.drawImage(editImage, -width / 2, -height / 2, width, height);
  editCtx.restore();
}

function updateEditValues() {
  $('#brightVal').textContent = $('#bright').value + '%';
  $('#contrastVal').textContent = $('#contrast').value + '%';
  $('#saturationVal').textContent = $('#saturation').value + '%';
  $('#blurVal').textContent = $('#blur').value + 'px';
  $('#hueVal').textContent = $('#hue').value + '°';
}

function loadEdit(img, name) {
  editImage = img;
  editName = name.replace(/\.[^.]+$/, '') || 'image';
  editRotation = 0;
  editFlip = false;

  $('#editDrop').style.display = 'none';
  editCanvas.style.display = 'block';
  $('#editInfo').textContent = `${img.naturalWidth} × ${img.naturalHeight}`;

  ['bright', 'contrast', 'saturation'].forEach(id => $('#' + id).value = 100);
  $('#blur').value = 0;
  $('#hue').value = 0;
  $('#filter').value = 'none';

  updateEditValues();
  renderEdit();
}

['bright', 'contrast', 'saturation', 'blur', 'hue'].forEach(id => {
  $('#' + id).addEventListener('input', () => {
    updateEditValues();
    renderEdit();
  });
});

$('#filter').onchange = renderEdit;

$('#chooseEdit').onclick = () => $('#editFile').click();
$('#dropChoose').onclick = () => $('#editFile').click();

$('#editFile').onchange = () => {
  loadImage($('#editFile').files[0], loadEdit);
};

$('#rotateBtn').onclick = () => {
  if (!editImage) return message('اختر صورة أولًا');
  editRotation = (editRotation + 90) % 360;
  renderEdit();
};

$('#flipBtn').onclick = () => {
  if (!editImage) return message('اختر صورة أولًا');
  editFlip = !editFlip;
  renderEdit();
};

$('#resetEdit').onclick = () => {
  if (!editImage) return;

  editRotation = 0;
  editFlip = false;

  ['bright', 'contrast', 'saturation'].forEach(id => $('#' + id).value = 100);
  $('#blur').value = 0;
  $('#hue').value = 0;
  $('#filter').value = 'none';

  updateEditValues();
  renderEdit();
};

$('#exportEdit').onclick = () => {
  if (!editImage) return message('اختر صورة أولًا');
  renderEdit();
  downloadCanvas(editCanvas, editName + '-edited.png');
};

attachDrop($('#editDrop'), loadEdit);

/* RETOUCH EDITOR */

const retouchCanvas = $('#retouchCanvas');
const retouchCtx = retouchCanvas.getContext('2d');

let retouchImage = null;
let retouchHistory = [];
let retouchDown = false;
let retouchLast = null;

function loadRetouch(img) {
  retouchImage = img;
  retouchCanvas.width = img.naturalWidth;
  retouchCanvas.height = img.naturalHeight;

  retouchCtx.clearRect(0, 0, retouchCanvas.width, retouchCanvas.height);
  retouchCtx.drawImage(img, 0, 0);

  $('#retouchDrop').style.display = 'none';
  retouchCanvas.style.display = 'block';
  retouchHistory = [];
}

$('#chooseRetouch').onclick = () => $('#retouchFile').click();
$('#retouchDropChoose').onclick = () => $('#retouchFile').click();

$('#retouchFile').onchange = () => {
  loadImage($('#retouchFile').files[0], loadRetouch);
};

attachDrop($('#retouchDrop'), loadRetouch);

function retouchPoint(e) {
  const rect = retouchCanvas.getBoundingClientRect();

  return {
    x: (e.clientX - rect.left) * retouchCanvas.width / rect.width,
    y: (e.clientY - rect.top) * retouchCanvas.height / rect.height
  };
}

function saveRetouch() {
  retouchHistory.push(
    retouchCtx.getImageData(0, 0, retouchCanvas.width, retouchCanvas.height)
  );

  if (retouchHistory.length > 12) retouchHistory.shift();
}

function retouchAt(point) {
  const size = Number($('#retouchSize').value);
  const mode = $('#retouchTool').value;

  const x = Math.max(0, Math.floor(point.x - size));
  const y = Math.max(0, Math.floor(point.y - size));
  const w = Math.min(retouchCanvas.width - x, size * 2);
  const h = Math.min(retouchCanvas.height - y, size * 2);

  if (w <= 0 || h <= 0) return;

  const temp = document.createElement('canvas');
  temp.width = w;
  temp.height = h;

  const tempCtx = temp.getContext('2d');

  if (mode === 'blur') {
    tempCtx.filter = `blur(${$('#blurStrength').value}px)`;
    tempCtx.drawImage(retouchCanvas, x, y, w, h, 0, 0, w, h);
  } else {
    const offset = Number($('#cloneOffset').value);

    const sourceX = Math.max(0, Math.min(
      retouchCanvas.width - w,
      x - offset
    ));

    const sourceY = Math.max(0, Math.min(
      retouchCanvas.height - h,
      y
    ));

    tempCtx.drawImage(
      retouchCanvas,
      sourceX, sourceY, w, h,
      0, 0, w, h
    );
  }

  retouchCtx.save();
  retouchCtx.beginPath();
  retouchCtx.arc(point.x, point.y, size, 0, Math.PI * 2);
  retouchCtx.clip();
  retouchCtx.drawImage(temp, x, y);
  retouchCtx.restore();
}

$('#retouchSize').oninput = () => {
  $('#retouchSizeVal').textContent = $('#retouchSize').value + 'px';
};

$('#blurStrength').oninput = () => {
  $('#blurStrengthVal').textContent = $('#blurStrength').value + 'px';
};

$('#cloneOffset').oninput = () => {
  $('#cloneOffsetVal').textContent = $('#cloneOffset').value + 'px';
};

retouchCanvas.addEventListener('pointerdown', e => {
  if (!retouchImage) return;

  retouchDown = true;
  retouchCanvas.setPointerCapture(e.pointerId);
  saveRetouch();

  retouchLast = retouchPoint(e);
  retouchAt(retouchLast);
});

retouchCanvas.addEventListener('pointermove', e => {
  if (!retouchDown) return;

  const point = retouchPoint(e);
  const distance = Math.hypot(
    point.x - retouchLast.x,
    point.y - retouchLast.y
  );

  const step = Math.max(2, Number($('#retouchSize').value) / 4);
  const count = Math.max(1, Math.ceil(distance / step));
  const previous = { ...retouchLast };

  for (let i = 1; i <= count; i++) {
    retouchAt({
      x: previous.x + (point.x - previous.x) * i / count,
      y: previous.y + (point.y - previous.y) * i / count
    });
  }

  retouchLast = point;
});

function stopRetouch() {
  retouchDown = false;
  retouchLast = null;
}

['pointerup', 'pointercancel', 'lostpointercapture'].forEach(event => {
  retouchCanvas.addEventListener(event, stopRetouch);
});

$('#undoRetouch').onclick = () => {
  if (!retouchHistory.length) return message('لا توجد خطوة للتراجع');
  retouchCtx.putImageData(retouchHistory.pop(), 0, 0);
};

$('#exportRetouch').onclick = () => {
  if (!retouchImage) return message('اختر صورة أولًا');
  downloadCanvas(retouchCanvas, 'image-001-retouched.png');
};

/* DRAWING */

const drawCanvas = $('#drawingCanvas');
const drawCtx = drawCanvas.getContext('2d');

let drawing = false;
let drawLast = null;
let drawHistory = [];
let drawBackground = '#ffffff';
let rainbowHue = 0;
let referenceImage = null;

function resetDrawing() {
  drawCtx.save();
  drawCtx.globalAlpha = 1;
  drawCtx.globalCompositeOperation = 'source-over';
  drawCtx.fillStyle = drawBackground;
  drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);

  if (referenceImage) {
    drawCtx.globalAlpha = .25;

    const scale = Math.min(
      drawCanvas.width / referenceImage.width,
      drawCanvas.height / referenceImage.height
    );

    const w = referenceImage.width * scale;
    const h = referenceImage.height * scale;

    drawCtx.drawImage(
      referenceImage,
      (drawCanvas.width - w) / 2,
      (drawCanvas.height - h) / 2,
      w,
      h
    );
  }

  drawCtx.restore();
}

function saveDrawing() {
  drawHistory.push(
    drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height)
  );

  if (drawHistory.length > 25) drawHistory.shift();
}

function drawPoint(e) {
  const rect = drawCanvas.getBoundingClientRect();

  return {
    x: (e.clientX - rect.left) * drawCanvas.width / rect.width,
    y: (e.clientY - rect.top) * drawCanvas.height / rect.height
  };
}

function currentBrush() {
  return {
    type: $('#brushType').value,
    size: Number($('#brushSize').value),
    color: $('#brushColor').value,
    opacity: Number($('#opacity').value) / 100,
    shape: $('#brushShape').value
  };
}

function paintPoint(point, brush, previous) {
  const ctx = drawCtx;

  ctx.save();
  ctx.globalAlpha = brush.opacity;
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineCap = brush.shape === 'square' ? 'square' : 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = brush.size;
  ctx.strokeStyle = brush.color;
  ctx.fillStyle = brush.color;
  ctx.shadowBlur = 0;
  ctx.setLineDash([]);

  switch (brush.type) {
    case 'eraser':
      ctx.globalCompositeOperation = 'destination-out';
      break;

    case 'pencil':
      ctx.globalAlpha *= .65;
      ctx.lineWidth *= .55;
      break;

    case 'ink':
      ctx.lineWidth *= .72;
      break;

    case 'soft':
      ctx.globalAlpha *= .55;
      ctx.shadowColor = brush.color;
      ctx.shadowBlur = brush.size / 2;
      break;

    case 'marker':
      ctx.globalAlpha *= .65;
      ctx.lineWidth *= 1.3;
      break;

    case 'highlighter':
      ctx.globalAlpha *= .25;
      ctx.lineWidth *= 2.2;
      break;

    case 'watercolor':
      ctx.globalAlpha *= .18;
      ctx.lineWidth *= 1.8;
      break;

    case 'oil':
      ctx.globalAlpha *= .9;
      ctx.lineWidth *= .9;
      break;

    case 'crayon':
      ctx.globalAlpha *= .65;
      ctx.setLineDash([2, 2]);
      break;

    case 'neon':
      ctx.shadowColor = brush.color;
      ctx.shadowBlur = Math.max(8, brush.size * 2);
      ctx.lineWidth *= .7;
      break;

    case 'calligraphy':
      ctx.lineCap = 'butt';
      ctx.lineWidth *= 1.2;
      break;

    case 'pixel':
      ctx.lineCap = 'square';
      ctx.lineWidth = Math.max(4, Math.round(brush.size / 3) * 3);
      break;

    case 'rainbow':
      ctx.strokeStyle = `hsl(${rainbowHue % 360} 100% 50%)`;
      ctx.fillStyle = ctx.strokeStyle;
      rainbowHue += 4;
      break;

    case 'airbrush':
      ctx.globalAlpha *= .16;

      for (let i = 0; i < Math.max(20, brush.size * 2); i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * brush.size;
        const dot = Math.random() * Math.max(1, brush.size / 10);

        ctx.beginPath();
        ctx.arc(
          point.x + Math.cos(angle) * radius,
          point.y + Math.sin(angle) * radius,
          dot,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      ctx.restore();
      return;
  }

  if (brush.shape === 'flat' && brush.type !== 'eraser') {
    ctx.lineCap = 'butt';
  }

  ctx.beginPath();

  if (previous) {
    ctx.moveTo(previous.x, previous.y);
    ctx.lineTo(point.x, point.y);
    ctx.stroke();
  } else {
    ctx.arc(
      point.x,
      point.y,
      Math.max(1, ctx.lineWidth / 2),
      0,
      Math.PI * 2
    );
    ctx.fill();
  }

  ctx.restore();
}

drawCanvas.addEventListener('pointerdown', e => {
  drawing = true;
  drawCanvas.setPointerCapture(e.pointerId);

  saveDrawing();

  drawLast = drawPoint(e);
  paintPoint(drawLast, currentBrush(), null);
});

drawCanvas.addEventListener('pointermove', e => {
  if (!drawing) return;

  const point = drawPoint(e);
  const brush = currentBrush();

  const distance = Math.hypot(
    point.x - drawLast.x,
    point.y - drawLast.y
  );

  const smooth = Number($('#smooth').value);
  const spacing = Math.max(1, brush.size * (1 - smooth / 130));
  const count = Math.max(1, Math.ceil(distance / spacing));
  const previous = { ...drawLast };

  for (let i = 1; i <= count; i++) {
    const next = {
      x: previous.x + (point.x - previous.x) * i / count,
      y: previous.y + (point.y - previous.y) * i / count
    };

    paintPoint(next, brush, drawLast);
    drawLast = next;
  }
});

function stopDrawing() {
  drawing = false;
  drawLast = null;
  drawCtx.beginPath();
}

['pointerup', 'pointercancel', 'lostpointercapture'].forEach(event => {
  drawCanvas.addEventListener(event, stopDrawing);
});

$('#brushSize').oninput = () => {
  $('#brushSizeVal').textContent = $('#brushSize').value + 'px';
};

$('#opacity').oninput = () => {
  $('#opacityVal').textContent = $('#opacity').value + '%';
};

$('#smooth').oninput = () => {
  $('#smoothVal').textContent = $('#smooth').value + '%';
};

$('#undoDrawing').onclick = () => {
  if (!drawHistory.length) return message('لا توجد خطوة للتراجع');
  drawCtx.putImageData(drawHistory.pop(), 0, 0);
};

$('#clearDrawing').onclick = () => {
  saveDrawing();
  referenceImage = null;
  resetDrawing();
};

$('#applyBackground').onclick = () => {
  saveDrawing();
  drawBackground = $('#backgroundColor').value;
  resetDrawing();
};

$('#exportDrawing').onclick = () => {
  downloadCanvas(drawCanvas, 'image-001-drawing.png');
};

/* REFERENCE IMAGE */

$('#importReference').onclick = () => $('#referenceFile').click();

$('#referenceFile').onchange = () => {
  loadImage($('#referenceFile').files[0], img => {
    saveDrawing();
    referenceImage = img;
    resetDrawing();
  });
};

$('#removeReference').onclick = () => {
  saveDrawing();
  referenceImage = null;
  resetDrawing();
};

/* INITIALIZE */

resetDrawing();

</script>
</body>
