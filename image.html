<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>تحرير الصور | VideoYTFX</title>

<style>
:root{
  --bg:#050505;
  --panel:#0d0d0d;
  --panel2:#151515;
  --text:#f5f5f5;
  --muted:#999;
  --line:#292929;
  --accent:#ffd600;
  --accent2:#fff18a;
  --shadow:rgba(255,214,0,.16);
}

[data-theme="light"]{
  --bg:#f4f4f1;
  --panel:#fff;
  --panel2:#ededeb;
  --text:#111;
  --muted:#666;
  --line:#d6d6d0;
  --accent:#d6a900;
  --accent2:#ffe45c;
  --shadow:rgba(214,169,0,.15);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
  overflow-x:hidden;
  transition:background .3s,color .3s;
}

/* BLACK HOLE BACKGROUND */

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 45%,
      #000 0%,
      #000 15%,
      rgba(30,25,0,.35) 25%,
      transparent 48%),
    radial-gradient(ellipse at 50% 45%,
      transparent 25%,
      rgba(255,214,0,.10) 38%,
      transparent 57%),
    radial-gradient(circle at 15% 15%,
      rgba(255,214,0,.08),
      transparent 30%),
    radial-gradient(circle at 85% 80%,
      rgba(255,255,255,.04),
      transparent 30%),
    var(--bg);
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  opacity:.17;
  background-image:
    radial-gradient(1px 1px at 10% 20%,white 50%,transparent),
    radial-gradient(1px 1px at 70% 30%,white 50%,transparent),
    radial-gradient(2px 2px at 40% 80%,white 50%,transparent),
    radial-gradient(1px 1px at 90% 65%,white 50%,transparent),
    radial-gradient(1px 1px at 25% 60%,white 50%,transparent);
  background-size:350px 350px;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 14px;
  transition:.2s;
}

button:hover{
  border-color:var(--accent);
  box-shadow:0 0 16px var(--shadow);
  transform:translateY(-2px);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
  transform:none;
}

.primary{
  background:var(--accent);
  color:#090909;
  border-color:var(--accent);
  font-weight:800;
}

.danger{
  background:#351010;
  border-color:#702020;
  color:#ffbaba;
}

header{
  min-height:82px;
  padding:14px 4%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:rgba(5,5,5,.82);
  border-bottom:1px solid rgba(255,214,0,.18);
  backdrop-filter:blur(18px);
  position:sticky;
  top:0;
  z-index:20;
}

[data-theme="light"] header{
  background:rgba(255,255,255,.86);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:var(--text);
}

.brand-mark{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:12px;
  border:1px solid var(--accent);
  color:var(--accent);
  font-size:20px;
  font-weight:900;
  box-shadow:0 0 18px var(--shadow);
}

.header-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

/* MAIN TITLE */

.hero{
  display:flex;
  justify-content:center;
  padding:45px 15px 35px;
}

.hero-title{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  padding:17px 28px;
  border:1px solid rgba(255,214,0,.45);
  border-radius:50px;
  background:rgba(255,214,0,.045);
  color:var(--accent);
  font-size:clamp(17px,3vw,23px);
  font-weight:900;
  letter-spacing:.5px;
  box-shadow:0 0 30px rgba(255,214,0,.07);
  animation:titleGlow 3s ease-in-out infinite;
}

.hero-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 15px var(--accent),0 0 30px var(--accent);
  animation:dotPulse 1.5s infinite;
}

@keyframes titleGlow{
  0%,100%{box-shadow:0 0 15px rgba(255,214,0,.06)}
  50%{box-shadow:0 0 32px rgba(255,214,0,.18)}
}

@keyframes dotPulse{
  50%{opacity:.45;transform:scale(.8)}
}

/* HOME */

main{
  width:min(1450px,95%);
  margin:auto;
  padding-bottom:60px;
}

.page{display:none}
.page.active{display:block}

.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
  margin:20px 0 45px;
}

.card{
  min-height:210px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:18px;
  background:linear-gradient(145deg,var(--panel),var(--panel2));
  border:1px solid var(--line);
  border-radius:20px;
  cursor:pointer;
  transition:.3s;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:var(--accent);
  filter:blur(100px);
  opacity:0;
  transition:.3s;
}

.card:hover{
  transform:translateY(-7px);
  border-color:var(--accent);
  box-shadow:0 15px 45px rgba(0,0,0,.3),0 0 20px var(--shadow);
}

.card:hover::before{opacity:.12}

.card-symbol{
  font-size:36px;
  font-weight:300;
  color:var(--accent);
  position:relative;
}

.card h2{
  font-size:22px;
  position:relative;
}

/* EDITOR LAYOUT */

.heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.heading h1{
  font-size:25px;
}

.row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}

.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
  gap:17px;
}

.panel{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.toolbar{
  padding:12px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  border-bottom:1px solid var(--line);
}

.stage{
  min-height:500px;
  padding:18px;
  display:grid;
  place-items:center;
  overflow:auto;
  background-color:var(--panel2);
  background-image:
    linear-gradient(45deg,#8882 25%,transparent 25%),
    linear-gradient(-45deg,#8882 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#8882 75%),
    linear-gradient(-45deg,transparent 75%,#8882 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}

canvas{
  display:block;
  max-width:100%;
  height:auto;
  background:white;
}

#editCanvas,#retouchCanvas{
  display:none;
  max-height:700px;
  object-fit:contain;
  cursor:crosshair;
}

.drop{
  width:min(420px,100%);
  padding:55px 20px;
  text-align:center;
  border:1px dashed var(--accent);
  border-radius:17px;
  cursor:pointer;
  background:rgba(255,214,0,.025);
  transition:.2s;
}

.drop:hover{
  background:rgba(255,214,0,.07);
  box-shadow:0 0 25px var(--shadow);
}

.drop strong{
  font-size:20px;
  color:var(--accent);
}

.sidebar{
  padding:17px;
  max-height:850px;
  overflow:auto;
}

.sidebar h3{
  margin-bottom:15px;
  font-size:19px;
}

.control{
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.control label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  font-size:14px;
  font-weight:700;
}

input[type="range"]{
  width:100%;
  accent-color:var(--accent);
  cursor:pointer;
}

input[type="color"]{
  width:48px;
  height:36px;
  padding:2px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:8px;
  cursor:pointer;
}

input[type="text"],select,input[type="number"]{
  width:100%;
  padding:10px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
}

select:focus,input:focus{
  border-color:var(--accent);
}

.value{
  color:var(--accent);
  direction:ltr;
}

.full{
  width:100%;
  margin-top:10px;
}

.info{
  color:var(--muted);
  font-size:12px;
  margin-right:5px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:13px 20px;
  background:#171717;
  color:white;
  border:1px solid var(--accent);
  border-radius:12px;
  z-index:100;
  transition:.25s;
  box-shadow:0 0 20px var(--shadow);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

footer{
  padding:22px;
  text-align:center;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{max-height:none}
}

@media(max-width:650px){
  header{padding:12px 3%}
  .brand-mark{width:36px;height:36px}
  .hero{padding:30px 10px}
  .hero-title{padding:14px 18px}
  .cards{grid-template-columns:1fr;gap:13px}
  .card{min-height:145px}
  .stage{min-height:330px;padding:10px}
  .heading h1{font-size:21px}
  .heading .row{width:100%}
  .heading .row button{flex:1}
  .sidebar{padding:13px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<header>
  <a class="brand" href="#" id="brandHome">
    <span class="brand-mark">V</span>
    <strong>VideoYTFX</strong>
  </a>

  <div class="header-actions">
    <button id="themeBtn" title="تغيير المظهر">المظهر</button>
    <button id="homeBtn">الرئيسية</button>
  </div>
</header>

<section class="hero">
  <div class="hero-title">
    <span>CREATIVE IMAGE STUDIO</span>
    <span class="hero-dot"></span>
  </div>
</section>

<main>

<!-- HOME -->

<section id="home" class="page active">
  <div class="cards">

    <article class="card" data-page="editor">
      <span class="card-symbol">01</span>
      <h2>تحرير الصور</h2>
    </article>

    <article class="card" data-page="retouch">
      <span class="card-symbol">02</span>
      <h2>تنظيف الصور</h2>
    </article>

    <article class="card" data-page="drawing">
      <span class="card-symbol">03</span>
      <h2>الرسم</h2>
    </article>

  </div>
</section>

<!-- IMAGE EDITOR -->

<section id="editor" class="page">

  <div class="heading">
    <h1>تحرير الصور</h1>

    <div class="row">
      <button id="rotateBtn">تدوير</button>
      <button id="flipBtn">عكس</button>
      <button id="resetEdit">إعادة ضبط</button>
      <button class="primary" id="exportEdit">تنزيل</button>
    </div>
  </div>

  <div class="layout">

    <div class="panel">
      <div class="toolbar">
        <button class="primary" id="chooseEdit">اختيار صورة</button>
        <input id="editFile" type="file" accept="image/*" hidden>
        <span id="editInfo" class="info"></span>
      </div>

      <div class="stage" id="editStage">
        <div class="drop" id="editDrop">
          <strong>اختيار صورة</strong>
        </div>
        <canvas id="editCanvas"></canvas>
      </div>
    </div>

    <aside class="panel sidebar">
      <h3>التعديلات</h3>

      <div class="control">
        <label>الإضاءة <span id="brightVal" class="value">100%</span></label>
        <input id="bright" type="range" min="0" max="200" value="100">
      </div>

      <div class="control">
        <label>التباين <span id="contrastVal" class="value">100%</span></label>
        <input id="contrast" type="range" min="0" max="200" value="100">
      </div>

      <div class="control">
        <label>التشبع <span id="saturationVal" class="value">100%</span></label>
        <input id="saturation" type="range" min="0" max="200" value="100">
      </div>

      <div class="control">
        <label>التمويه <span id="blurVal" class="value">0px</span></label>
        <input id="blur" type="range" min="0" max="15" value="0">
      </div>

      <div class="control">
        <label>الفلاتر</label>
        <select id="filter">
          <option value="none">بدون فلتر</option>
          <option value="grayscale(1)">أبيض وأسود</option>
          <option value="sepia(1)">بني</option>
          <option value="saturate(1.8) contrast(1.1)">ألوان قوية</option>
          <option value="contrast(1.15) saturate(.8)">سينمائي</option>
          <option value="sepia(.2) saturate(1.3)">دافئ</option>
          <option value="hue-rotate(35deg)">ألوان باردة</option>
          <option value="invert(1)">عكس الألوان</option>
        </select>
      </div>
    </aside>

  </div>
</section>

<!-- RETOUCH -->

<section id="retouch" class="page">

  <div class="heading">
    <h1>تنظيف الصور</h1>

    <div class="row">
      <button id="undoRetouch">تراجع</button>
      <button class="primary" id="exportRetouch">تنزيل</button>
    </div>
  </div>

  <div class="layout">

    <div class="panel">
      <div class="toolbar">
        <button class="primary" id="chooseRetouch">اختيار صورة</button>
        <input id="retouchFile" type="file" accept="image/*" hidden>
      </div>

      <div class="stage">
        <div class="drop" id="retouchDrop">
          <strong>اختيار صورة</strong>
        </div>
        <canvas id="retouchCanvas"></canvas>
      </div>
    </div>

    <aside class="panel sidebar">
      <h3>أدوات التنظيف</h3>

      <div class="control">
        <label>الأداة</label>
        <select id="retouchTool">
          <option value="blur">تمويه</option>
          <option value="clone">نسخ المنطقة المجاورة</option>
        </select>
      </div>

      <div class="control">
        <label>حجم الفرشاة <span id="retouchSizeVal" class="value">30px</span></label>
        <input id="retouchSize" type="range" min="5" max="100" value="30">
      </div>

      <div class="control">
        <label>مسافة النسخ <span id="cloneOffsetVal" class="value">50px</span></label>
        <input id="cloneOffset" type="range" min="10" max="200" value="50">
      </div>
    </aside>

  </div>
</section>

<!-- DRAWING -->

<section id="drawing" class="page">

  <div class="heading">
    <h1>الرسم</h1>

    <div class="row">
      <button id="undoDrawing">تراجع</button>
      <button id="clearDrawing">مسح</button>
      <button class="primary" id="exportDrawing">تنزيل</button>
    </div>
  </div>

  <div class="layout">

    <div class="panel">
      <div class="toolbar">
        <button id="drawingBackgroundBtn">تغيير الخلفية</button>
      </div>

      <div class="stage">
        <canvas id="drawingCanvas" width="1200" height="800"></canvas>
      </div>
    </div>

    <aside class="panel sidebar">
      <h3>أدوات الرسم</h3>

      <div class="control">
        <label>الفرشاة</label>
        <select id="brushType">
          <option value="pencil">قلم رصاص</option>
          <option value="ink">حبر</option>
          <option value="soft">قلم ناعم</option>
          <option value="marker">ماركر</option>
          <option value="highlighter">قلم تمييز</option>
          <option value="airbrush">بخاخ</option>
          <option value="watercolor">ألوان مائية</option>
          <option value="oil">فرشاة زيتية</option>
          <option value="crayon">قلم شمع</option>
          <option value="neon">نيون</option>
          <option value="calligraphy">خط عريض</option>
          <option value="pixel">بكسل</option>
          <option value="rainbow">ألوان متغيرة</option>
          <option value="eraser">ممحاة</option>
        </select>
      </div>

      <div class="control">
        <label>اللون</label>
        <input id="brushColor" type="color" value="#111111">
      </div>

      <div class="control">
        <label>حجم الفرشاة <span id="brushSizeVal" class="value">8px</span></label>
        <input id="brushSize" type="range" min="1" max="100" value="8">
      </div>

      <div class="control">
        <label>الشفافية <span id="opacityVal" class="value">100%</span></label>
        <input id="opacity" type="range" min="5" max="100" value="100">
      </div>

      <div class="control">
        <label>تنعيم الخط <span id="smoothVal" class="value">50%</span></label>
        <input id="smooth" type="range" min="0" max="100" value="50">
      </div>

      <div class="control">
        <label>شكل الفرشاة</label>
        <select id="brushShape">
          <option value="round">دائري</option>
          <option value="square">مربع</option>
          <option value="flat">مسطح</option>
        </select>
      </div>

      <div class="control">
        <label>خلفية اللوحة</label>
        <input id="backgroundColor" type="color" value="#ffffff">
        <button class="full" id="applyBackground">تطبيق الخلفية</button>
      </div>
    </aside>

  </div>
</section>

</main>

<footer>VideoYTFX</footer>
<div class="toast" id="toast"></div>

<script>
const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];

/* GENERAL */

let toastTimer;

function message(text){
  const toast = $("#toast");
  toast.textContent = text;
  toast.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },2200);
}

function showPage(id){
  $$(".page").forEach(page=>page.classList.remove("active"));
  $("#"+id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

$$("[data-page]").forEach(card=>{
  card.addEventListener("click",()=>{
    showPage(card.dataset.page);
  });
});

$("#homeBtn").onclick = ()=>showPage("home");
$("#brandHome").onclick = e=>{
  e.preventDefault();
  showPage("home");
};

$("#themeBtn").onclick = ()=>{
  const root = document.documentElement;
  const next = root.dataset.theme==="dark"?"light":"dark";

  root.dataset.theme = next;
  $("#themeBtn").textContent = next==="dark"?"المظهر":"الوضع الداكن";

  try{
    localStorage.setItem("image_studio_theme",next);
  }catch(error){}
};

try{
  const savedTheme = localStorage.getItem("image_studio_theme");
  if(savedTheme==="light" || savedTheme==="dark"){
    document.documentElement.dataset.theme = savedTheme;
    $("#themeBtn").textContent = savedTheme==="dark"?"المظهر":"الوضع الداكن";
  }
}catch(error){}

/* IMAGE LOADING */

function loadImage(file,callback){
  if(!file || !file.type.startsWith("image/")){
    message("اختر صورة صالحة");
    return;
  }

  const url = URL.createObjectURL(file);
  const image = new Image();

  image.onload = ()=>{
    callback(image,file.name);
    URL.revokeObjectURL(url);
  };

  image.onerror = ()=>{
    URL.revokeObjectURL(url);
    message("تعذر فتح الصورة");
  };

  image.src = url;
}

function downloadCanvas(canvas,name){
  canvas.toBlob(blob=>{
    if(!blob){
      message("تعذر تنزيل الصورة");
      return;
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = name;
    link.click();

    setTimeout(()=>URL.revokeObjectURL(url),1500);
  },"image/png");
}

function attachDrop(zone,callback){
  zone.addEventListener("dragover",event=>{
    event.preventDefault();
    zone.style.borderColor="#fff";
  });

  zone.addEventListener("dragleave",()=>{
    zone.style.borderColor="";
  });

  zone.addEventListener("drop",event=>{
    event.preventDefault();
    zone.style.borderColor="";

    const file = event.dataTransfer.files[0];
    if(file) loadImage(file,callback);
  });
}

/* IMAGE EDITOR */

const editCanvas = $("#editCanvas");
const editCtx = editCanvas.getContext("2d");

let editImage = null;
let editName = "image";
let editRotation = 0;
let editFlip = false;

function renderEdit(){
  if(!editImage) return;

  const width = editImage.naturalWidth;
  const height = editImage.naturalHeight;
  const rotated = Math.abs(editRotation%180)===90;

  editCanvas.width = rotated?height:width;
  editCanvas.height = rotated?width:height;

  editCtx.clearRect(0,0,editCanvas.width,editCanvas.height);

  editCtx.save();

  editCtx.filter = `
    brightness(${$("#bright").value}%)
    contrast(${$("#contrast").value}%)
    saturate(${$("#saturation").value}%)
    blur(${$("#blur").value}px)
    ${$("#filter").value==="none"?"":$("#filter").value}
  `;

  editCtx.translate(editCanvas.width/2,editCanvas.height/2);
  editCtx.rotate(editRotation*Math.PI/180);
  editCtx.scale(editFlip?-1:1,1);
  editCtx.drawImage(editImage,-width/2,-height/2,width,height);

  editCtx.restore();
}

function updateEditValues(){
  $("#brightVal").textContent=$("#bright").value+"%";
  $("#contrastVal").textContent=$("#contrast").value+"%";
  $("#saturationVal").textContent=$("#saturation").value+"%";
  $("#blurVal").textContent=$("#blur").value+"px";
}

function loadEdit(image,name){
  editImage = image;
  editName = name.replace(/\.[^.]+$/,"") || "image";

  editRotation = 0;
  editFlip = false;

  $("#editDrop").style.display="none";
  editCanvas.style.display="block";
  $("#editInfo").textContent = image.naturalWidth+" × "+image.naturalHeight;

  ["bright","contrast","saturation"].forEach(id=>{
    $("#"+id).value=100;
  });

  $("#blur").value=0;
  $("#filter").value="none";

  updateEditValues();
  renderEdit();
}

["bright","contrast","saturation","blur"].forEach(id=>{
  $("#"+id).addEventListener("input",()=>{
    updateEditValues();
    renderEdit();
  });
});

$("#filter").onchange=renderEdit;

$("#chooseEdit").onclick=()=>$("#editFile").click();

$("#editFile").onchange=()=>{
  loadImage($("#editFile").files[0],loadEdit);
  $("#editFile").value="";
};

$("#rotateBtn").onclick=()=>{
  if(!editImage) return message("اختر صورة أولاً");
  editRotation=(editRotation+90)%360;
  renderEdit();
};

$("#flipBtn").onclick=()=>{
  if(!editImage) return message("اختر صورة أولاً");
  editFlip=!editFlip;
  renderEdit();
};

$("#resetEdit").onclick=()=>{
  if(!editImage) return;

  editRotation=0;
  editFlip=false;

  ["bright","contrast","saturation"].forEach(id=>{
    $("#"+id).value=100;
  });

  $("#blur").value=0;
  $("#filter").value="none";

  updateEditValues();
  renderEdit();
};

$("#exportEdit").onclick=()=>{
  if(!editImage) return message("اختر صورة أولاً");

  renderEdit();
  downloadCanvas(editCanvas,editName+"-edited.png");
};

attachDrop($("#editDrop"),loadEdit);

/* RETOUCH */

const retouchCanvas = $("#retouchCanvas");
const retouchCtx = retouchCanvas.getContext("2d");

let retouchImage = null;
let retouchHistory = [];
let retouchDown = false;
let retouchLast = null;
let retouchSnapshot = null;

function loadRetouch(image){
  retouchImage=image;

  retouchCanvas.width=image.naturalWidth;
  retouchCanvas.height=image.naturalHeight;

  retouchCtx.clearRect(0,0,retouchCanvas.width,retouchCanvas.height);
  retouchCtx.drawImage(image,0,0);

  $("#retouchDrop").style.display="none";
  retouchCanvas.style.display="block";

  retouchHistory=[];
}

$("#chooseRetouch").onclick=()=>$("#retouchFile").click();

$("#retouchFile").onchange=()=>{
  loadImage($("#retouchFile").files[0],loadRetouch);
  $("#retouchFile").value="";
};

attachDrop($("#retouchDrop"),loadRetouch);

function retouchPoint(event){
  const rect=retouchCanvas.getBoundingClientRect();

  return {
    x:(event.clientX-rect.left)*retouchCanvas.width/rect.width,
    y:(event.clientY-rect.top)*retouchCanvas.height/rect.height
  };
}

function saveRetouch(){
  if(!retouchCanvas.width || !retouchCanvas.height) return;

  retouchHistory.push(
    retouchCtx.getImageData(0,0,retouchCanvas.width,retouchCanvas.height)
  );

  if(retouchHistory.length>15) retouchHistory.shift();
}

function retouchAt(point){
  const size=Number($("#retouchSize").value);
  const mode=$("#retouchTool").value;

  const x=Math.max(0,Math.floor(point.x-size));
  const y=Math.max(0,Math.floor(point.y-size));

  const width=Math.min(retouchCanvas.width-x,size*2);
  const height=Math.min(retouchCanvas.height-y,size*2);

  if(width<1 || height<1) return;

  const temp=document.createElement("canvas");
  temp.width=width;
  temp.height=height;

  const tempCtx=temp.getContext("2d");

  if(mode==="blur"){
    tempCtx.filter=`blur(${Math.max(2,size/5)}px)`;
    tempCtx.drawImage(
      retouchCanvas,
      x,y,width,height,
      0,0,width,height
    );
  }else{
    const offset=Number($("#cloneOffset").value);

    const sourceX=Math.max(
      0,
      Math.min(retouchCanvas.width-width,point.x-offset-size)
    );

    const sourceY=Math.max(
      0,
      Math.min(retouchCanvas.height-height,point.y-size)
    );

    if(retouchSnapshot){
      tempCtx.drawImage(
        retouchSnapshot,
        sourceX,sourceY,width,height,
        0,0,width,height
      );
    }
  }

  retouchCtx.save();
  retouchCtx.beginPath();
  retouchCtx.arc(point.x,point.y,size,0,Math.PI*2);
  retouchCtx.clip();
  retouchCtx.drawImage(temp,x,y,width,height);
  retouchCtx.restore();
}

$("#retouchSize").oninput=()=>{
  $("#retouchSizeVal").textContent=$("#retouchSize").value+"px";
};

$("#cloneOffset").oninput=()=>{
  $("#cloneOffsetVal").textContent=$("#cloneOffset").value+"px";
};

retouchCanvas.addEventListener("pointerdown",event=>{
  if(!retouchImage) return;

  retouchDown=true;
  retouchCanvas.setPointerCapture(event.pointerId);

  saveRetouch();

  retouchSnapshot=document.createElement("canvas");
  retouchSnapshot.width=retouchCanvas.width;
  retouchSnapshot.height=retouchCanvas.height;
  retouchSnapshot.getContext("2d").drawImage(retouchCanvas,0,0);

  retouchLast=retouchPoint(event);
  retouchAt(retouchLast);
});

retouchCanvas.addEventListener("pointermove",event=>{
  if(!retouchDown) return;

  const point=retouchPoint(event);
  const distance=Math.hypot(
    point.x-retouchLast.x,
    point.y-retouchLast.y
  );

  const step=Math.max(2,Number($("#retouchSize").value)/4);
  const count=Math.max(1,Math.ceil(distance/step));
  const previous={...retouchLast};

  for(let i=1;i<=count;i++){
    retouchAt({
      x:previous.x+(point.x-previous.x)*i/count,
      y:previous.y+(point.y-previous.y)*i/count
    });
  }

  retouchLast=point;
});

function finishRetouch(){
  retouchDown=false;
  retouchLast=null;
  retouchSnapshot=null;
}

["pointerup","pointercancel","lostpointercapture"].forEach(event=>{
  retouchCanvas.addEventListener(event,finishRetouch);
});

$("#undoRetouch").onclick=()=>{
  if(!retouchHistory.length) return;

  retouchCtx.putImageData(retouchHistory.pop(),0,0);
};

$("#exportRetouch").onclick=()=>{
  if(!retouchImage) return message("اختر صورة أولاً");

  downloadCanvas(retouchCanvas,"VideoYTFX-retouched.png");
};

/* DRAWING */

const drawCanvas=$("#drawingCanvas");
const drawCtx=drawCanvas.getContext("2d");

let drawing=false;
let drawLast=null;
let drawHistory=[];
let drawBackground="#ffffff";
let rainbowHue=0;

function resetDrawing(){
  drawCtx.save();
  drawCtx.globalAlpha=1;
  drawCtx.globalCompositeOperation="source-over";
  drawCtx.fillStyle=drawBackground;
  drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height);
  drawCtx.restore();
}

function saveDrawing(){
  drawHistory.push(
    drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height)
  );

  if(drawHistory.length>30) drawHistory.shift();
}

function drawPoint(event){
  const rect=drawCanvas.getBoundingClientRect();

  return {
    x:(event.clientX-rect.left)*drawCanvas.width/rect.width,
    y:(event.clientY-rect.top)*drawCanvas.height/rect.height
  };
}

function currentBrush(){
  return {
    type:$("#brushType").value,
    size:Number($("#brushSize").value),
    color:$("#brushColor").value,
    opacity:Number($("#opacity").value)/100,
    shape:$("#brushShape").value
  };
}

function paintPoint(point,brush){
  const ctx=drawCtx;

  ctx.save();
  ctx.globalAlpha=brush.opacity;
  ctx.globalCompositeOperation="source-over";
  ctx.lineCap=brush.shape==="square"?"square":"round";
  ctx.lineJoin="round";
  ctx.lineWidth=brush.size;
  ctx.strokeStyle=brush.color;
  ctx.fillStyle=brush.color;
  ctx.shadowBlur=0;
  ctx.setLineDash([]);

  switch(brush.type){

    case "eraser":
      ctx.globalCompositeOperation="destination-out";
      ctx.strokeStyle="#000";
      ctx.fillStyle="#000";
      break;

    case "pencil":
      ctx.globalAlpha*=.65;
      ctx.lineWidth=Math.max(1,brush.size*.55);
      break;

    case "ink":
      ctx.lineWidth=Math.max(1,brush.size*.72);
      break;

    case "soft":
      ctx.globalAlpha*=.45;
      ctx.shadowColor=brush.color;
      ctx.shadowBlur=brush.size*.5;
      break;

    case "marker":
      ctx.globalAlpha*=.78;
      ctx.lineWidth=brush.size*1.3;
      break;

    case "highlighter":
      ctx.globalAlpha*=.25;
      ctx.lineWidth=brush.size*2.2;
      ctx.lineCap="square";
      break;

    case "watercolor":
      ctx.globalAlpha*=.15;
      ctx.lineWidth=brush.size*1.8;
      break;

    case "oil":
      ctx.globalAlpha*=.9;
      ctx.lineWidth=brush.size*.85;
      break;

    case "crayon":
      ctx.globalAlpha*=.7;
      break;

    case "neon":
      ctx.shadowColor=brush.color;
      ctx.shadowBlur=Math.max(8,brush.size*2);
      ctx.lineWidth=Math.max(1,brush.size*.7);
      break;

    case "calligraphy":
      ctx.lineCap="butt";
      ctx.lineWidth=brush.size*1.2;
      break;

    case "pixel":
      ctx.lineCap="square";
      ctx.lineWidth=Math.max(4,Math.round(brush.size/3)*3);
      break;

    case "rainbow":
      ctx.strokeStyle=`hsl(${rainbowHue%360} 100% 50%)`;
      ctx.fillStyle=ctx.strokeStyle;
      rainbowHue+=5;
      break;

    case "airbrush":
      ctx.globalAlpha*=.12;

      for(let i=0;i<Math.max(20,brush.size*2);i++){
        const angle=Math.random()*Math.PI*2;
        const radius=Math.random()*brush.size;
        const dot=Math.random()*Math.max(1,brush.size/10);

        ctx.beginPath();
        ctx.arc(
          point.x+Math.cos(angle)*radius,
          point.y+Math.sin(angle)*radius,
          dot,0,Math.PI*2
        );
        ctx.fill();
      }

      ctx.restore();
      return;
  }

  if(brush.shape==="flat" && brush.type!=="eraser"){
    ctx.lineCap="butt";
  }

  if(!drawLast){
    ctx.beginPath();
    ctx.arc(
      point.x,
      point.y,
      Math.max(1,ctx.lineWidth/2),
      0,
      Math.PI*2
    );
    ctx.fill();
  }else{
    ctx.beginPath();
    ctx.moveTo(drawLast.x,drawLast.y);
    ctx.lineTo(point.x,point.y);
    ctx.stroke();

    if(brush.type==="watercolor"){
      ctx.globalAlpha*=.4;
      ctx.lineWidth=brush.size*2.2;
      ctx.beginPath();
      ctx.moveTo(drawLast.x,drawLast.y);
      ctx.lineTo(point.x,point.y);
      ctx.stroke();
    }

    if(brush.type==="crayon"){
      ctx.globalAlpha*=.3;
      ctx.lineWidth=Math.max(1,brush.size*.3);
      ctx.setLineDash([1,3]);
      ctx.beginPath();
      ctx.moveTo(drawLast.x,drawLast.y);
      ctx.lineTo(point.x,point.y);
      ctx.stroke();
    }
  }

  ctx.restore();
}

resetDrawing();

drawCanvas.addEventListener("pointerdown",event=>{
  drawing=true;
  drawCanvas.setPointerCapture(event.pointerId);

  saveDrawing();

  drawLast=drawPoint(event);
  paintPoint(drawLast,currentBrush());
});

drawCanvas.addEventListener("pointermove",event=>{
  if(!drawing) return;

  const point=drawPoint(event);
  const brush=currentBrush();

  const distance=Math.hypot(
    point.x-drawLast.x,
    point.y-drawLast.y
  );

  const smooth=Number($("#smooth").value);
  const spacing=Math.max(1,brush.size*(1-smooth/130));
  const count=Math.max(1,Math.ceil(distance/spacing));
  const previous={...drawLast};

  for(let i=1;i<=count;i++){
    const next={
      x:previous.x+(point.x-previous.x)*i/count,
      y:previous.y+(point.y-previous.y)*i/count
    };

    paintPoint(next,brush);
    drawLast=next;
  }
});

function finishDrawing(){
  drawing=false;
  drawLast=null;
  drawCtx.beginPath();
}

["pointerup","pointercancel","lostpointercapture"].forEach(event=>{
  drawCanvas.addEventListener(event,finishDrawing);
});

$("#brushSize").oninput=()=>{
  $("#brushSizeVal").textContent=$("#brushSize").value+"px";
};

$("#opacity").oninput=()=>{
  $("#opacityVal").textContent=$("#opacity").value+"%";
};

$("#smooth").oninput=()=>{
  $("#smoothVal").textContent=$("#smooth").value+"%";
};

$("#undoDrawing").onclick=()=>{
  if(!drawHistory.length) return;

  drawCtx.putImageData(drawHistory.pop(),0,0);
};

$("#clearDrawing").onclick=()=>{
  saveDrawing();
  resetDrawing();
};

$("#applyBackground").onclick=()=>{
  drawBackground=$("#backgroundColor").value;
  saveDrawing();
  resetDrawing();
};

$("#drawingBackgroundBtn").onclick=()=>{
  $("#backgroundColor").click();
};

$("#backgroundColor").addEventListener("input",()=>{
  drawBackground=$("#backgroundColor").value;
  saveDrawing();
  resetDrawing();
});

$("#exportDrawing").onclick=()=>{
  downloadCanvas(drawCanvas,"VideoYTFX-drawing.png");
};
</script>
