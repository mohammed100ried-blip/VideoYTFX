
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image-001</title>

<style>
:root {
    --bg:#050505;
    --panel:rgba(12,12,12,.88);
    --panel2:rgba(25,23,15,.92);
    --text:#ffffff;
    --muted:#aaa99f;
    --line:rgba(255,215,70,.22);
    --accent:#ffdc43;
    --accent2:#ffffff;
}

[data-theme="light"] {
    --bg:#eeeeea;
    --panel:rgba(255,255,255,.91);
    --panel2:rgba(235,231,215,.95);
    --text:#171717;
    --muted:#66645d;
    --line:rgba(160,125,0,.25);
    --accent:#b58b00;
    --accent2:#ffffff;
}

* {
    box-sizing:border-box;
}

html {
    scroll-behavior:smooth;
}

body {
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
    isolation:isolate;
    overflow-x:hidden;
}

/* BACKGROUND EFFECTS */

#cosmicBackground {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

header, main, .toast {
    position:relative;
    z-index:2;
}

header {
    min-height:75px;
    padding:12px 4%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    background:rgba(5,5,5,.78);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(15px);
}

header h2 {
    margin:0;
    font-size:23px;
    letter-spacing:1px;
    color:var(--accent);
}

button,input,select {
    font:inherit;
}

button {
    cursor:pointer;
    color:var(--text);
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    transition:.2s ease;
}

button:hover {
    border-color:var(--accent);
    box-shadow:0 0 18px rgba(255,220,65,.13);
    transform:translateY(-1px);
}

button:active {
    transform:scale(.97);
}

.primary {
    background:linear-gradient(120deg,#d5aa00,#ffe66b);
    border:0;
    color:#111;
    font-weight:bold;
}

main {
    width:min(1450px,95%);
    margin:28px auto;
}

.page {
    display:none;
}

.page.active {
    display:block;
    animation:pageIn .35s ease;
}

@keyframes pageIn {
    from {opacity:0;transform:translateY(10px)}
    to {opacity:1;transform:translateY(0)}
}

/* HOME */

.hero {
    text-align:center;
    padding:65px 15px 35px;
}

.hero h1 {
    color:var(--accent);
    font-size:clamp(35px,6vw,65px);
    margin:0 0 12px;
    text-shadow:0 0 25px rgba(255,220,65,.25);
    animation:titleGlow 3s infinite alternate;
}

@keyframes titleGlow {
    from {text-shadow:0 0 10px rgba(255,220,65,.2)}
    to {text-shadow:0 0 30px rgba(255,220,65,.55)}
}

.hero p {
    color:var(--muted);
    font-size:15px;
}

.cards {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin:35px 0;
}

.card {
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    min-height:190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:13px;
    cursor:pointer;
    transition:.3s;
    backdrop-filter:blur(12px);
}

.card:hover {
    transform:translateY(-7px);
    border-color:var(--accent);
    box-shadow:0 12px 35px rgba(255,220,65,.09);
}

.card .symbol {
    font-size:38px;
    color:var(--accent);
}

.card h2 {
    font-size:21px;
    margin:0;
}

/* GENERAL */

.heading {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:17px;
}

.heading h1 {
    font-size:25px;
    margin:0;
    color:var(--accent);
}

.layout {
    display:grid;
    grid-template-columns:minmax(0,1fr) 300px;
    gap:17px;
}

.panel {
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    backdrop-filter:blur(14px);
}

.toolbar {
    padding:12px;
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
}

.stage {
    min-height:500px;
    padding:18px;
    display:grid;
    place-items:center;
    overflow:auto;
    background-color:rgba(20,20,20,.65);
    background-image:
        linear-gradient(45deg,#8881 25%,transparent 25%),
        linear-gradient(-45deg,#8881 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#8881 75%),
        linear-gradient(-45deg,transparent 75%,#8881 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0;
}

canvas {
    display:block;
    max-width:100%;
    height:auto;
    touch-action:none;
}

#editCanvas,#retouchCanvas {
    display:none;
    max-height:650px;
    object-fit:contain;
    cursor:crosshair;
}

.drop {
    border:2px dashed var(--accent);
    border-radius:18px;
    padding:40px 25px;
    text-align:center;
    cursor:pointer;
    max-width:420px;
    transition:.2s;
}

.drop:hover {
    background:rgba(255,220,65,.06);
}

.drop h2 {
    font-size:20px;
}

.sidebar {
    padding:17px;
    max-height:850px;
    overflow:auto;
}

.sidebar h3 {
    margin:0 0 13px;
    color:var(--accent);
}

.control {
    padding:13px 0;
    border-bottom:1px solid var(--line);
}

.control label {
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
    font-size:14px;
}

input[type=range] {
    width:100%;
    accent-color:var(--accent);
}

input[type=color] {
    width:48px;
    height:35px;
    border:0;
    background:transparent;
    cursor:pointer;
}

input[type=text],select,input[type=number] {
    width:100%;
    padding:10px;
    background:var(--panel2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:9px;
}

.row {
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}

.full {
    width:100%;
    margin-top:9px;
}

.value {
    color:var(--accent);
}

.hint {
    font-size:12px;
    color:var(--muted);
    line-height:1.7;
}

.toast {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 20px;
    background:#171717;
    border:1px solid var(--accent);
    border-radius:10px;
    display:none;
    color:white;
    z-index:20;
}

.toast.show {
    display:block;
    animation:pageIn .2s ease;
}

@media(max-width:850px) {
    .layout {
        grid-template-columns:1fr;
    }

    .sidebar {
        max-height:none;
    }

    .stage {
        min-height:330px;
    }

    .cards {
        grid-template-columns:1fr;
    }

    .card {
        min-height:140px;
    }

    #editCanvas,#retouchCanvas {
        max-height:420px;
    }

    header h2 {
        font-size:18px;
    }
}
</style>
</head>

<body>

<canvas id="cosmicBackground"></canvas>

<header>
    <h2>image-001</h2>
    <div class="row">
        <button id="themeBtn">تغيير المظهر</button>
        <button id="homeBtn">الرئيسية</button>
    </div>
</header>

<main>

<!-- HOME -->

<section id="home" class="page active">

    <div class="hero">
        <h1>image-001</h1>
        <p>Creative Image Editor</p>
    </div>

    <div class="cards">

        <article class="card" data-page="editor">
            <span class="symbol">01</span>
            <h2>تحرير الصور</h2>
        </article>

        <article class="card" data-page="retouch">
            <span class="symbol">02</span>
            <h2>تنظيف الصور</h2>
        </article>

        <article class="card" data-page="drawing">
            <span class="symbol">03</span>
            <h2>الرسم</h2>
        </article>

    </div>
</section>

<!-- IMAGE EDITOR -->

<section id="editor" class="page">

    <div class="heading">
        <h1>تحرير الصور</h1>

        <div class="row">
            <button id="rotateBtn">تدوير</button>
            <button id="flipBtn">عكس</button>
            <button id="resetEdit">إعادة ضبط</button>
            <button class="primary" id="exportEdit">تنزيل الصورة</button>
        </div>
    </div>

    <div class="layout">

        <div class="panel">

            <div class="toolbar">
                <button class="primary" id="chooseEdit">اختيار صورة</button>
                <input id="editFile" type="file" accept="image/*" hidden>
                <span id="editInfo" class="hint">لم يتم اختيار صورة</span>
            </div>

            <div class="stage" id="editStage">

                <div class="drop" id="editDrop">
                    <h2>اختر صورة للتعديل</h2>
                </div>

                <canvas id="editCanvas"></canvas>

            </div>
        </div>

        <aside class="panel sidebar">

            <h3>أدوات التعديل</h3>

            <div class="control">
                <label>الإضاءة <span id="brightVal" class="value">100%</span></label>
                <input id="bright" type="range" min="0" max="200" value="100">
            </div>

            <div class="control">
                <label>التباين <span id="contrastVal" class="value">100%</span></label>
                <input id="contrast" type="range" min="0" max="200" value="100">
            </div>

            <div class="control">
                <label>التشبع <span id="saturationVal" class="value">100%</span></label>
                <input id="saturation" type="range" min="0" max="200" value="100">
            </div>

            <div class="control">
                <label>التمويه <span id="blurVal" class="value">0px</span></label>
                <input id="blur" type="range" min="0" max="10" value="0">
            </div>

            <div class="control">
                <label>الفلاتر</label>
                <select id="filter">
                    <option value="none">بدون فلتر</option>
                    <option value="grayscale(1)">أبيض وأسود</option>
                    <option value="sepia(1)">بني</option>
                    <option value="saturate(1.8) contrast(1.1)">ألوان قوية</option>
                    <option value="contrast(1.15) saturate(.8)">سينمائي</option>
                    <option value="sepia(.2) saturate(1.3)">دافئ</option>
                    <option value="hue-rotate(35deg)">تغيير الألوان</option>
                </select>
            </div>

        </aside>
    </div>
</section>

<!-- RETOUCH -->

<section id="retouch" class="page">

    <div class="heading">
        <h1>تنظيف الصور</h1>

        <div class="row">
            <button id="undoRetouch">تراجع</button>
            <button class="primary" id="exportRetouch">تنزيل الصورة</button>
        </div>
    </div>

    <div class="layout">

        <div class="panel">

            <div class="toolbar">
                <button class="primary" id="chooseRetouch">اختيار صورة</button>
                <input id="retouchFile" type="file" accept="image/*" hidden>
            </div>

            <div class="stage">

                <div class="drop" id="retouchDrop">
                    <h2>اختر صورة لتنظيفها</h2>
                </div>

                <canvas id="retouchCanvas"></canvas>

            </div>
        </div>

        <aside class="panel sidebar">

            <h3>أدوات التنظيف</h3>

            <div class="control">
                <label>الأداة</label>
                <select id="retouchTool">
                    <option value="blur">تمويه</option>
                </select>
            </div>

            <div class="control">
                <label>حجم الفرشاة <span id="retouchSizeVal" class="value">30px</span></label>
                <input id="retouchSize" type="range" min="5" max="100" value="30">
            </div>

        </aside>
    </div>
</section>

<!-- DRAWING -->

<section id="drawing" class="page">

    <div class="heading">
        <h1>الرسم</h1>

        <div class="row">
            <button id="undoDrawing">تراجع</button>
            <button id="clearDrawing">مسح الرسم</button>
            <button class="primary" id="exportDrawing">تنزيل الرسم</button>
        </div>
    </div>

    <div class="layout">

        <div class="panel">

            <div class="toolbar">
                <span>لوحة الرسم</span>
            </div>

            <div class="stage">
                <canvas id="drawingCanvas" width="1200" height="800"></canvas>
            </div>

        </div>

        <aside class="panel sidebar">

            <h3>أدوات الرسم</h3>

            <div class="control">
                <label>نوع الفرشاة</label>

                <select id="brushType">
                    <option value="pencil">قلم رصاص</option>
                    <option value="ink">حبر</option>
                    <option value="soft">قلم ناعم</option>
                    <option value="marker">ماركر</option>
                    <option value="highlighter">قلم تمييز</option>
                    <option value="airbrush">بخاخ</option>
                    <option value="watercolor">ألوان مائية</option>
                    <option value="oil">فرشاة زيتية</option>
                    <option value="crayon">قلم شمع</option>
                    <option value="neon">نيون</option>
                    <option value="calligraphy">خط عريض</option>
                    <option value="pixel">بكسل</option>
                    <option value="rainbow">قوس قزح</option>
                    <option value="eraser">ممحاة</option>
                </select>
            </div>

            <div class="control">
                <label>لون الفرشاة</label>
                <input id="brushColor" type="color" value="#111111">
            </div>

            <div class="control">
                <label>حجم الفرشاة <span id="brushSizeVal" class="value">8px</span></label>
                <input id="brushSize" type="range" min="1" max="100" value="8">
            </div>

            <div class="control">
                <label>الشفافية <span id="opacityVal" class="value">100%</span></label>
                <input id="opacity" type="range" min="5" max="100" value="100">
            </div>

            <div class="control">
                <label>تنعيم الخط <span id="smoothVal" class="value">50%</span></label>
                <input id="smooth" type="range" min="0" max="100" value="50">
            </div>

            <div class="control">
                <label>شكل الفرشاة</label>
                <select id="brushShape">
                    <option value="round">دائري</option>
                    <option value="square">مربع</option>
                    <option value="flat">مسطح</option>
                </select>
            </div>

            <div class="control">
                <label>خلفية اللوحة</label>
                <input id="backgroundColor" type="color" value="#ffffff">
                <button class="full" id="applyBackground">تغيير الخلفية</button>
            </div>

        </aside>
    </div>
</section>

</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* GENERAL */

function message(text) {
    const t = $("#toast");
    t.textContent = text;
    t.classList.add("show");

    clearTimeout(message.timer);

    message.timer = setTimeout(() => {
        t.classList.remove("show");
    }, 2200);
}

$$("[data-page]").forEach(card => {
    card.onclick = () => showPage(card.dataset.page);
});

function showPage(id) {
    $$(".page").forEach(p => p.classList.remove("active"));
    $("#" + id).classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
}

$("#homeBtn").onclick = () => showPage("home");

$("#themeBtn").onclick = () => {
    const root = document.documentElement;
    root.dataset.theme =
        root.dataset.theme === "dark" ? "light" : "dark";
};

/* IMAGE LOADING */

function loadImage(file, callback) {
    if (!file || !file.type.startsWith("image/")) {
        message("اختر ملف صورة صالحًا");
        return;
    }

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
        callback(img, file.name);
        URL.revokeObjectURL(url);
    };

    img.onerror = () => {
        URL.revokeObjectURL(url);
        message("تعذر فتح الصورة");
    };

    img.src = url;
}

function downloadCanvas(canvas, name) {
    canvas.toBlob(blob => {
        if (!blob) {
            message("تعذر تنزيل الصورة");
            return;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = name;
        a.click();

        setTimeout(() => URL.revokeObjectURL(url), 1500);
    }, "image/png");
}

function attachDrop(zone, callback) {
    zone.addEventListener("dragover", e => {
        e.preventDefault();
        zone.style.borderColor = "#ffffff";
    });

    zone.addEventListener("dragleave", () => {
        zone.style.borderColor = "";
    });

    zone.addEventListener("drop", e => {
        e.preventDefault();

        const file = e.dataTransfer.files[0];
        if (file) loadImage(file, callback);
    });

    zone.onclick = () => {
        const input = zone.parentElement.querySelector('input[type="file"]');
        if (input) input.click();
    };
}

/* IMAGE EDITOR */

const editCanvas = $("#editCanvas");
const editCtx = editCanvas.getContext("2d");

let editImage = null;
let editName = "image";
let editRotation = 0;
let editFlip = false;

function renderEdit() {
    if (!editImage) return;

    const rotated = Math.abs(editRotation % 180) === 90;
    const w = editImage.naturalWidth;
    const h = editImage.naturalHeight;

    editCanvas.width = rotated ? h : w;
    editCanvas.height = rotated ? w : h;

    editCtx.clearRect(0,0,editCanvas.width,editCanvas.height);

    editCtx.save();

    editCtx.filter =
        `brightness(${$("#bright").value}%)
         contrast(${$("#contrast").value}%)
         saturate(${$("#saturation").value}%)
         blur(${$("#blur").value}px)
         ${$("#filter").value === "none" ? "" : $("#filter").value}`;

    editCtx.translate(editCanvas.width/2,editCanvas.height/2);
    editCtx.rotate(editRotation * Math.PI / 180);
    editCtx.scale(editFlip ? -1 : 1,1);

    editCtx.drawImage(editImage,-w/2,-h/2,w,h);

    editCtx.restore();
}

function loadEdit(img,name) {
    editImage = img;
    editName = name.replace(/\.[^.]+$/,"") || "image";

    editRotation = 0;
    editFlip = false;

    $("#editDrop").style.display = "none";
    editCanvas.style.display = "block";

    $("#editInfo").textContent =
        `${img.naturalWidth} × ${img.naturalHeight}`;

    ["bright","contrast","saturation"].forEach(id => {
        $("#" + id).value = 100;
    });

    $("#blur").value = 0;
    $("#filter").value = "none";

    updateEditValues();
    renderEdit();
}

function updateEditValues() {
    $("#brightVal").textContent = $("#bright").value + "%";
    $("#contrastVal").textContent = $("#contrast").value + "%";
    $("#saturationVal").textContent = $("#saturation").value + "%";
    $("#blurVal").textContent = $("#blur").value + "px";
}

["bright","contrast","saturation","blur"].forEach(id => {
    $("#" + id).oninput = () => {
        updateEditValues();
        renderEdit();
    };
});

$("#filter").onchange = renderEdit;

$("#chooseEdit").onclick = () => $("#editFile").click();

$("#editFile").onchange = () => {
    loadImage($("#editFile").files[0],loadEdit);
};

$("#rotateBtn").onclick = () => {
    if (!editImage) return message("اختر صورة أولًا");

    editRotation = (editRotation + 90) % 360;
    renderEdit();
};

$("#flipBtn").onclick = () => {
    if (!editImage) return message("اختر صورة أولًا");

    editFlip = !editFlip;
    renderEdit();
};

$("#resetEdit").onclick = () => {
    if (!editImage) return;

    editRotation = 0;
    editFlip = false;

    ["bright","contrast","saturation"].forEach(id => {
        $("#" + id).value = 100;
    });

    $("#blur").value = 0;
    $("#filter").value = "none";

    updateEditValues();
    renderEdit();
};

$("#exportEdit").onclick = () => {
    if (!editImage) return message("اختر صورة أولًا");

    renderEdit();
    downloadCanvas(editCanvas,editName + "-edited.png");
};

attachDrop($("#editDrop"),loadEdit);

/* RETOUCH */

const retouchCanvas = $("#retouchCanvas");
const retouchCtx = retouchCanvas.getContext("2d");

let retouchImage = null;
let retouchHistory = [];
let retouchDown = false;
let retouchLast = null;

function loadRetouch(img) {
    retouchImage = img;

    retouchCanvas.width = img.naturalWidth;
    retouchCanvas.height = img.naturalHeight;

    retouchCtx.drawImage(img,0,0);

    $("#retouchDrop").style.display = "none";
    retouchCanvas.style.display = "block";

    retouchHistory = [];
}

$("#chooseRetouch").onclick = () => $("#retouchFile").click();

$("#retouchFile").onchange = () => {
    loadImage($("#retouchFile").files[0],loadRetouch);
};

attachDrop($("#retouchDrop"),loadRetouch);

function retouchPoint(e) {
    const r = retouchCanvas.getBoundingClientRect();

    return {
        x:(e.clientX-r.left)*retouchCanvas.width/r.width,
        y:(e.clientY-r.top)*retouchCanvas.height/r.height
    };
}

function saveRetouch() {
    retouchHistory.push(
        retouchCtx.getImageData(0,0,retouchCanvas.width,retouchCanvas.height)
    );

    if (retouchHistory.length > 12) retouchHistory.shift();
}

function retouchAt(p) {
    const size = Number($("#retouchSize").value);

    const x = Math.max(0,Math.floor(p.x-size));
    const y = Math.max(0,Math.floor(p.y-size));

    const w = Math.min(retouchCanvas.width-x,size*2);
    const h = Math.min(retouchCanvas.height-y,size*2);

    if (w < 1 || h < 1) return;

    const temp = document.createElement("canvas");
    temp.width = w;
    temp.height = h;

    const tc = temp.getContext("2d");

    tc.filter = `blur(${Math.max(2,size/5)}px)`;
    tc.drawImage(retouchCanvas,x,y,w,h,0,0,w,h);

    retouchCtx.save();
    retouchCtx.beginPath();
    retouchCtx.arc(p.x,p.y,size,0,Math.PI*2);
    retouchCtx.clip();
    retouchCtx.drawImage(temp,x,y,w,h);
    retouchCtx.restore();
}

$("#retouchSize").oninput = () => {
    $("#retouchSizeVal").textContent = $("#retouchSize").value + "px";
};

retouchCanvas.addEventListener("pointerdown",e => {
    if (!retouchImage) return;

    retouchDown = true;
    retouchCanvas.setPointerCapture(e.pointerId);

    saveRetouch();

    retouchLast = retouchPoint(e);
    retouchAt(retouchLast);
});

retouchCanvas.addEventListener("pointermove",e => {
    if (!retouchDown) return;

    const p = retouchPoint(e);

    const distance = Math.hypot(
        p.x-retouchLast.x,
        p.y-retouchLast.y
    );

    const step = Math.max(2,Number($("#retouchSize").value)/4);
    const count = Math.max(1,Math.ceil(distance/step));

    const old = {...retouchLast};

    for (let i=1;i<=count;i++) {
        retouchAt({
            x:old.x+(p.x-old.x)*i/count,
            y:old.y+(p.y-old.y)*i/count
        });
    }

    retouchLast = p;
});

["pointerup","pointercancel","lostpointercapture"].forEach(ev => {
    retouchCanvas.addEventListener(ev,() => {
        retouchDown = false;
        retouchLast = null;
    });
});

$("#undoRetouch").onclick = () => {
    if (!retouchHistory.length) return;

    retouchCtx.putImageData(retouchHistory.pop(),0,0);
};

$("#exportRetouch").onclick = () => {
    if (!retouchImage) return message("اختر صورة أولًا");

    downloadCanvas(retouchCanvas,"image-001-retouched.png");
};

/* DRAWING */

const drawCanvas = $("#drawingCanvas");
const drawCtx = drawCanvas.getContext("2d");

let drawing = false;
let drawLast = null;
let drawHistory = [];
let drawBackground = "#ffffff";
let rainbowHue = 0;

function resetDrawing() {
    drawCtx.save();

    drawCtx.globalAlpha = 1;
    drawCtx.globalCompositeOperation = "source-over";
    drawCtx.fillStyle = drawBackground;
    drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height);

    drawCtx.restore();
}

function saveDrawing() {
    drawHistory.push(
        drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height)
    );

    if (drawHistory.length > 25) drawHistory.shift();
}

function drawPoint(e) {
    const r = drawCanvas.getBoundingClientRect();

    return {
        x:(e.clientX-r.left)*drawCanvas.width/r.width,
        y:(e.clientY-r.top)*drawCanvas.height/r.height
    };
}

function currentBrush() {
    return {
        type:$("#brushType").value,
        size:Number($("#brushSize").value),
        color:$("#brushColor").value,
        opacity:Number($("#opacity").value)/100,
        shape:$("#brushShape").value
    };
}

function paintPoint(p,b) {
    const c = drawCtx;

    c.save();

    c.globalAlpha = b.opacity;
    c.globalCompositeOperation = "source-over";
    c.lineCap = b.shape === "square" ? "square" : "round";
    c.lineJoin = "round";
    c.lineWidth = b.size;
    c.strokeStyle = b.color;
    c.fillStyle = b.color;
    c.shadowBlur = 0;
    c.setLineDash([]);

    switch (b.type) {
        case "eraser":
            c.globalCompositeOperation = "destination-out";
            break;

        case "pencil":
            c.globalAlpha *= .65;
            c.lineWidth = Math.max(1,b.size*.55);
            break;

        case "ink":
            c.lineWidth = Math.max(1,b.size*.72);
            break;

        case "soft":
            c.globalAlpha *= .5;
            c.shadowColor = b.color;
            c.shadowBlur = 5;
            break;

        case "marker":
            c.globalAlpha *= .78;
            c.lineWidth = b.size*1.3;
            break;

        case "highlighter":
            c.globalAlpha *= .25;
            c.lineWidth = b.size*2.2;
            c.lineCap = "square";
            break;

        case "watercolor":
            c.globalAlpha *= .2;
            c.lineWidth = b.size*1.8;
            break;

        case "oil":
            c.globalAlpha *= .9;
            c.lineWidth = b.size*.85;
            break;

        case "crayon":
            c.globalAlpha *= .7;
            break;

        case "neon":
            c.shadowColor = b.color;
            c.shadowBlur = Math.max(8,b.size*2);
            c.lineWidth = Math.max(1,b.size*.7);
            break;

        case "calligraphy":
            c.lineCap = "butt";
            c.lineWidth = b.size*1.2;
            break;

        case "pixel":
            c.lineCap = "square";
            c.lineWidth = Math.max(4,Math.round(b.size/3)*3);
            break;

        case "rainbow":
            c.strokeStyle = `hsl(${rainbowHue%360} 100% 50%)`;
            c.fillStyle = c.strokeStyle;
            rainbowHue += 5;
            break;

        case "airbrush":
            c.globalAlpha *= .12;

            for (let i=0;i<Math.max(20,b.size*2);i++) {
                const angle = Math.random()*Math.PI*2;
                const radius = Math.random()*b.size;
                const dot = Math.random()*Math.max(1,b.size/10);

                c.beginPath();
                c.arc(
                    p.x+Math.cos(angle)*radius,
                    p.y+Math.sin(angle)*radius,
                    dot,0,Math.PI*2
                );
                c.fill();
            }

            c.restore();
            return;
    }

    if (b.shape === "flat" && b.type !== "eraser") {
        c.lineCap = "butt";
    }

    if (!drawLast) {
        c.beginPath();
        c.arc(p.x,p.y,Math.max(1,c.lineWidth/2),0,Math.PI*2);
        c.fill();
    } else {
        c.beginPath();
        c.moveTo(drawLast.x,drawLast.y);
        c.lineTo(p.x,p.y);
        c.stroke();

        if (b.type === "watercolor") {
            c.globalAlpha *= .4;
            c.lineWidth = b.size*2.2;
            c.beginPath();
            c.moveTo(drawLast.x,drawLast.y);
            c.lineTo(p.x,p.y);
            c.stroke();
        }

        if (b.type === "crayon") {
            c.globalAlpha *= .3;
            c.lineWidth = Math.max(1,b.size*.3);
            c.setLineDash([1,3]);
            c.beginPath();
            c.moveTo(drawLast.x,drawLast.y);
            c.lineTo(p.x,p.y);
            c.stroke();
        }
    }

    c.restore();
}

resetDrawing();

drawCanvas.addEventListener("pointerdown",e => {
    drawing = true;
    drawCanvas.setPointerCapture(e.pointerId);

    saveDrawing();

    drawLast = drawPoint(e);
    paintPoint(drawLast,currentBrush());
});

drawCanvas.addEventListener("pointermove",e => {
    if (!drawing) return;

    const p = drawPoint(e);
    const b = currentBrush();

    const distance = Math.hypot(
        p.x-drawLast.x,
        p.y-drawLast.y
    );

    const smooth = Number($("#smooth").value);
    const spacing = Math.max(1,b.size*(1-smooth/130));
    const count = Math.max(1,Math.ceil(distance/spacing));

    const previous = {...drawLast};

    for (let i=1;i<=count;i++) {
        const next = {
            x:previous.x+(p.x-previous.x)*i/count,
            y:previous.y+(p.y-previous.y)*i/count
        };

        paintPoint(next,b);
        drawLast = next;
    }
});

["pointerup","pointercancel","lostpointercapture"].forEach(ev => {
    drawCanvas.addEventListener(ev,() => {
        drawing = false;
        drawLast = null;
        drawCtx.beginPath();
    });
});

$("#brushSize").oninput = () => {
    $("#brushSizeVal").textContent = $("#brushSize").value + "px";
};

$("#opacity").oninput = () => {
    $("#opacityVal").textContent = $("#opacity").value + "%";
};

$("#smooth").oninput = () => {
    $("#smoothVal").textContent = $("#smooth").value + "%";
};

$("#undoDrawing").onclick = () => {
    if (!drawHistory.length) return;

    drawCtx.putImageData(drawHistory.pop(),0,0);
};

$("#clearDrawing").onclick = () => {
    saveDrawing();
    resetDrawing();
};

$("#applyBackground").onclick = () => {
    saveDrawing();
    drawBackground = $("#backgroundColor").value;
    resetDrawing();
};

$("#exportDrawing").onclick = () => {
    downloadCanvas(drawCanvas,"image-001-drawing.png");
};

/* COSMIC BACKGROUND ENGINE */

(() => {
    const canvas = $("#cosmicBackground");
    const ctx = canvas.getContext("2d");

    let W = 0;
    let H = 0;
    let dpr = 1;
    let time = 0;
    let particles = [];
    let stars = [];

    const mouse = {
        x:innerWidth/2,
        y:innerHeight/2,
        active:false
    };

    const hole = {
        x:innerWidth*.72,
        y:innerHeight*.52,
        radius:43
    };

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1,1.5);

        W = window.innerWidth;
        H = window.innerHeight;

        canvas.width = Math.floor(W*dpr);
        canvas.height = Math.floor(H*dpr);

        canvas.style.width = W+"px";
        canvas.style.height = H+"px";

        ctx.setTransform(dpr,0,0,dpr,0,0);

        createParticles();
    }

    function createParticles() {
        particles = [];
        stars = [];

        const amount = Math.min(450,Math.floor(W*H/3000));

        for (let i=0;i<amount;i++) {
            particles.push({
                angle:Math.random()*Math.PI*2,
                distance:60+Math.random()*270,
                speed:.002+Math.random()*.006,
                size:.5+Math.random()*1.8,
                alpha:.15+Math.random()*.65
            });
        }

        for (let i=0;i<100;i++) {
            stars.push({
                x:Math.random()*W,
                y:Math.random()*H,
                size:.5+Math.random()*1.3,
                alpha:.15+Math.random()*.5
            });
        }
    }

    function drawStars() {
        stars.forEach(s => {
            const flicker = .7+Math.sin(time*2+s.x)*.3;

            ctx.beginPath();
            ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${s.alpha*flicker})`;
            ctx.fill();
        });
    }

    /* TORNADO */

    function drawTornado() {
        const cx = W*.22;
        const cy = H*.57;

        ctx.save();

        for (let i=0;i<11;i++) {
            const progress = i/11;
            const y = cy-220+progress*440;
            const width = 12+progress*115;
            const rotation = time*(1.1+progress)+i*.7;

            ctx.beginPath();

            for (let j=0;j<=120;j++) {
                const t = j/120;
                const angle = rotation+t*Math.PI*5;
                const r = width*t;

                const px = cx+Math.cos(angle)*r;
                const py = y+Math.sin(angle)*r*.24;

                if (j===0) ctx.moveTo(px,py);
                else ctx.lineTo(px,py);
            }

            ctx.strokeStyle = i%2===0
                ? "rgba(255,255,255,.23)"
                : "rgba(255,220,90,.30)";

            ctx.lineWidth = 1.5+progress*2;
            ctx.shadowColor = "#ffe17a";
            ctx.shadowBlur = 10;
            ctx.stroke();
        }

        // دوامة مركزية
        for (let i=0;i<75;i++) {
            const angle = time*2+i*.4;
            const progress = i/75;
            const r = 5+progress*125;

            const x = cx+Math.cos(angle)*r;
            const y = cy+Math.sin(angle)*r*1.8;

            ctx.beginPath();
            ctx.arc(x,y,1+progress,0,Math.PI*2);
            ctx.fillStyle = "rgba(255,255,255,.5)";
            ctx.fill();
        }

        ctx.restore();
    }

    /* BLACK HOLE */

    function drawBlackHole(x,y,radius) {
        ctx.save();

        // الهالة الخارجية
        const glow = ctx.createRadialGradient(
            x,y,radius*.3,
            x,y,radius*3.8
        );

        glow.addColorStop(0,"rgba(255,255,255,.13)");
        glow.addColorStop(.3,"rgba(255,220,80,.12)");
        glow.addColorStop(1,"rgba(0,0,0,0)");

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x,y,radius*3.8,0,Math.PI*2);
        ctx.fill();

        // حلقات الضوء
        for (let i=0;i<4;i++) {
            ctx.beginPath();

            ctx.ellipse(
                x,y,
                radius*(1.25+i*.25),
                radius*(.35+i*.08),
                time*.35+i,
                0,Math.PI*2
            );

            ctx.strokeStyle = i%2===0
                ? "rgba(255,255,255,.65)"
                : "rgba(255,220,70,.6)";

            ctx.lineWidth = 2;
            ctx.shadowColor = "#ffe36a";
            ctx.shadowBlur = 17;
            ctx.stroke();
        }

        // القرص المضيء
        ctx.beginPath();

        ctx.ellipse(
            x,y,
            radius*1.9,
            radius*.45,
            time*.12,
            0,Math.PI*2
        );

        ctx.strokeStyle = "rgba(255,255,255,.85)";
        ctx.lineWidth = 4;
        ctx.shadowColor = "#ffe36a";
        ctx.shadowBlur = 22;
        ctx.stroke();

        // مركز الثقب الأسود
        ctx.shadowBlur = 0;

        const center = ctx.createRadialGradient(
            x-radius*.2,y-radius*.2,1,
            x,y,radius
        );

        center.addColorStop(0,"#000000");
        center.addColorStop(.7,"#000000");
        center.addColorStop(1,"#17130a");

        ctx.fillStyle = center;
        ctx.beginPath();
        ctx.arc(x,y,radius,0,Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    /* PARTICLES */

    function drawParticles(x,y) {
        particles.forEach(p => {
            p.angle += p.speed;

            const px = x+Math.cos(p.angle)*p.distance;
            const py = y+Math.sin(p.angle)*p.distance*.55;

            ctx.beginPath();
            ctx.arc(px,py,p.size,0,Math.PI*2);

            ctx.fillStyle =
                `rgba(255,225,150,${p.alpha})`;

            ctx.shadowColor = "#ffe58a";
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        });
    }

    function animate() {
        time += .012;

        ctx.clearRect(0,0,W,H);

        // الخلفية
        const bg = ctx.createRadialGradient(
            W*.5,H*.5,10,
            W*.5,H*.5,Math.max(W,H)*.8
        );

        bg.addColorStop(0,"#17140b");
        bg.addColorStop(.45,"#090909");
        bg.addColorStop(1,"#020202");

        ctx.fillStyle = bg;
        ctx.fillRect(0,0,W,H);

        drawStars();
        drawTornado();

        // متابعة الماوس
        if (mouse.active) {
            hole.x += (mouse.x-hole.x)*.035;
            hole.y += (mouse.y-hole.y)*.035;
        } else {
            hole.x += (W*.72-hole.x)*.009;
            hole.y += (H*.52-hole.y)*.009;
        }

        drawParticles(hole.x,hole.y);
        drawBlackHole(hole.x,hole.y,hole.radius);

        requestAnimationFrame(animate);
    }

    window.addEventListener("mousemove",e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
    });

    window.addEventListener("mouseleave",() => {
        mouse.active = false;
    });

    window.addEventListener("resize",resize);

    resize();
    animate();
})();

</script>
