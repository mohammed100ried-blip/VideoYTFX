<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoYTFX - Image Studio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030712;
            --panel: rgba(15, 23, 42, .82);
            --panel2: rgba(30, 41, 59, .65);
            --border: rgba(255,255,255,.09);
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --danger: #ef4444;
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 10%, rgba(59,130,246,.15), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(139,92,246,.14), transparent 30%),
                var(--bg);
            color: var(--text);
            font-family: "Tajawal", sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .navbar {
            height: 72px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(3,7,18,.75);
            backdrop-filter: blur(18px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 8px 30px rgba(59,130,246,.3);
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            padding: 9px 14px;
            border-radius: 11px;
            cursor: pointer;
            transition: .2s;
        }

        .nav-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .container {
            width: min(1250px, 94%);
            margin: auto;
            padding: 35px 0 60px;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-icon {
            width: 75px;
            height: 75px;
            margin: auto auto 16px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            font-size: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 15px 40px rgba(59,130,246,.25);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1rem;
        }

        .editor {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            backdrop-filter: blur(20px);
        }

        .panel h2 {
            font-size: 1.05rem;
            margin-bottom: 16px;
        }

        .upload {
            min-height: 180px;
            border: 2px dashed rgba(59,130,246,.35);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            transition: .25s;
            background: rgba(59,130,246,.04);
        }

        .upload:hover,
        .upload.dragging {
            border-color: var(--primary);
            background: rgba(59,130,246,.1);
        }

        .upload-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .upload strong {
            display: block;
            margin-bottom: 5px;
        }

        .upload span {
            color: var(--muted);
            font-size: .85rem;
        }

        #imageInput {
            display: none;
        }

        .controls {
            margin-top: 20px;
        }

        .control {
            margin-bottom: 18px;
        }

        .control-head {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: .9rem;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #111827;
            color: white;
            outline: none;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 18px;
        }

        .action-btn {
            border: 1px solid var(--border);
            background: var(--panel2);
            color: white;
            padding: 11px;
            border-radius: 11px;
            cursor: pointer;
            transition: .2s;
        }

        .action-btn:hover {
            border-color: var(--primary);
            background: rgba(59,130,246,.15);
            transform: translateY(-2px);
        }

        .download {
            width: 100%;
            margin-top: 10px;
            border: 0;
            padding: 13px;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 10px 25px rgba(59,130,246,.2);
            transition: .2s;
        }

        .download:hover {
            transform: translateY(-2px);
        }

        .download:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
        }

        .canvas-panel {
            min-height: 650px;
            display: flex;
            flex-direction: column;
        }

        .canvas-wrapper {
            flex: 1;
            min-height: 500px;
            border-radius: 15px;
            border: 1px solid var(--border);
            background:
                linear-gradient(45deg, #111827 25%, transparent 25%),
                linear-gradient(-45deg, #111827 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #111827 75%),
                linear-gradient(-45deg, transparent 75%, #111827 75%);
            background-size: 30px 30px;
            background-position: 0 0, 0 15px, 15px -15px, -15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        canvas {
            max-width: 100%;
            max-height: 560px;
            display: block;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
        }

        .empty {
            text-align: center;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 55px;
            opacity: .5;
            margin-bottom: 10px;
        }

        .canvas-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .canvas-actions button {
            flex: 1;
        }

        .status {
            margin-top: 12px;
            text-align: center;
            color: var(--muted);
            font-size: .85rem;
            min-height: 20px;
        }

        footer {
            text-align: center;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding: 22px;
            font-size: .85rem;
        }

        @media (max-width: 850px) {
            .editor {
                grid-template-columns: 1fr;
            }

            .canvas-panel {
                min-height: 500px;
            }

            .canvas-wrapper {
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <a href="index.html" class="brand">
        <span class="brand-icon">V</span>
        <span>VideoYTFX</span>
    </a>

    <div class="nav-buttons">
        <button class="nav-btn" id="languageBtn">🌐 English</button>
        <button class="nav-btn" id="themeBtn">☀️</button>
    </div>
</nav>

<main class="container">

    <section class="hero">
        <div class="hero-icon">🖼️</div>
        <h1 id="title">استوديو الصور</h1>
        <p class="subtitle" id="subtitle">
            عدّل وحسّن وأضف الفلاتر والمؤثرات إلى صورك بسهولة.
        </p>
    </section>

    <section class="editor">

        <!-- LEFT PANEL -->
        <aside class="panel">

            <h2 id="uploadTitle">إضافة صورة</h2>

            <div class="upload" id="uploadArea">
                <div class="upload-icon">📷</div>

                <strong id="uploadText">
                    اضغط لاختيار صورة
                </strong>

                <span id="uploadHint">
                    أو اسحب الصورة هنا
                </span>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >
            </div>

            <div class="controls">

                <div class="control">
                    <div class="control-head">
                        <span id="brightnessLabel">الإضاءة</span>
                        <span id="brightnessValue">100%</span>
                    </div>

                    <input
                        type="range"
                        id="brightness"
                        min="0"
                        max="200"
                        value="100"
                    >
                </div>

                <div class="control">
                    <div class="control-head">
                        <span id="contrastLabel">التباين</span>
                        <span id="contrastValue">100%</span>
                    </div>

                    <input
                        type="range"
                        id="contrast"
                        min="0"
                        max="200"
                        value="100"
                    >
                </div>

                <div class="control">
                    <div class="control-head">
                        <span id="saturationLabel">التشبع</span>
                        <span id="saturationValue">100%</span>
                    </div>

                    <input
                        type="range"
                        id="saturation"
                        min="0"
                        max="200"
                        value="100"
                    >
                </div>

                <div class="control">
                    <div class="control-head">
                        <span id="blurLabel">ضبابية</span>
                        <span id="blurValue">0px</span>
                    </div>

                    <input
                        type="range"
                        id="blur"
                        min="0"
                        max="20"
                        value="0"
                    >
                </div>

                <div class="control">
                    <label id="filterLabel" class="control-head">
                        الفلتر
                    </label>

                    <select id="filter">
                        <option value="none">بدون فلتر</option>
                        <option value="vintage">Vintage</option>
                        <option value="warm">Warm</option>
                        <option value="cool">Cool</option>
                        <option value="dramatic">Dramatic</option>
                        <option value="mono">Black & White</option>
                    </select>
                </div>

                <div class="button-grid">
                    <button class="action-btn" id="rotateLeft">
                        ↶ تدوير
                    </button>

                    <button class="action-btn" id="rotateRight">
                        ↷ تدوير
                    </button>

                    <button class="action-btn" id="zoomOut">
                        − تصغير
                    </button>

                    <button class="action-btn" id="zoomIn">
                        ＋ تكبير
                    </button>

                    <button class="action-btn" id="reset">
                        🔄 إعادة ضبط
                    </button>
                </div>

                <button
                    class="download"
                    id="downloadBtn"
                    disabled
                >
                    ⬇️ تحميل الصورة
                </button>

            </div>

        </aside>

        <!-- CANVAS -->
        <section class="panel canvas-panel">

            <div class="canvas-wrapper" id="canvasWrapper">

                <div class="empty" id="emptyState">
                    <div class="empty-icon">🖼️</div>
                    <div id="emptyText">
                        أضف صورة لبدء التعديل
                    </div>
                </div>

                <canvas id="imageCanvas"></canvas>

            </div>

            <div class="canvas-actions">

                <button class="action-btn" id="openButton">
                    📁 اختيار صورة
                </button>

                <button class="action-btn" id="resetImage">
                    🔄 إعادة الصورة
                </button>

            </div>

            <div class="status" id="status"></div>

        </section>

    </section>

</main>

<footer>
    © 2026 VideoYTFX. All rights reserved.
</footer>

<script src="image.js"></script>

</body>
</html>
