<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحرير الصور</title>
<style>
:root{--bg:#090d17;--panel:#121a2a;--panel2:#1b263b;--text:#f4f6ff;--muted:#9ca9c2;--line:#2c3952;--accent:#7c83ff}
[data-theme="light"]{--bg:#f2f4fa;--panel:#fff;--panel2:#e9edf6;--text:#182137;--muted:#68748c;--line:#d9e0ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
header{height:68px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line)}
header h2{font-size:21px;margin:0}
button,input,select{font:inherit}
button{cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
button:hover{border-color:var(--accent)}
.primary{background:linear-gradient(120deg,#6678ff,#a45cff);border:0;color:white}
main{width:min(1400px,95%);margin:25px auto}
.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;cursor:pointer}
.card:hover{border-color:var(--accent);transform:translateY(-3px)}
.card span{font-size:43px}.card h2{font-size:23px;margin:0}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.heading h1{font-size:25px;margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.toolbar{padding:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.stage{min-height:500px;padding:18px;display:grid;place-items:center;overflow:auto;background-color:var(--panel2);background-image:linear-gradient(45deg,#8881 25%,transparent 25%),linear-gradient(-45deg,#8881 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#8881 75%),linear-gradient(-45deg,transparent 75%,#8881 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
canvas{display:block;max-width:100%;height:auto;touch-action:none;background:white}
#editCanvas,#retouchCanvas{display:none;max-height:650px;object-fit:contain;cursor:crosshair}
.drop{border:2px dashed var(--accent);border-radius:18px;padding:40px 20px;text-align:center;cursor:pointer;max-width:420px}
.drop span{font-size:45px}.drop h2{font-size:20px}
.sidebar{padding:16px;max-height:800px;overflow:auto}
.sidebar h3{margin:0 0 12px}
.control{padding:12px 0;border-bottom:1px solid var(--line)}
.control label{display:flex;justify-content:space-between;gap:8px;margin-bottom:9px;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:45px;height:35px;border:0;background:transparent}
input[type=text],select,input[type=number]{width:100%;padding:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}
.full{width:100%;margin-top:9px}
.value{color:var(--accent)}
.hint{font-size:12px;color:var(--muted);line-height:1.7}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:none;z-index:10}
.toast.show{display:block}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{max-height:none}.stage{min-height:330px}.cards{grid-template-columns:1fr}.card{min-height:130px}#editCanvas,#retouchCanvas{max-height:420px}}
</style>
</head>
<body>
<header>
  <h2>تحرير الصور</h2>
  <div class="row">
    <button id="themeBtn">☀️</button>
    <button id="homeBtn">الرئيسية</button>
  </div>
</header>

<main>
<section id="home" class="page active">
  <div class="cards">
    <article class="card" data-page="editor"><span>🖼️</span><h2>تحرير الصور</h2></article>
    <article class="card" data-page="retouch"><span>🪄</span><h2>تنظيف الصور</h2></article>
    <article class="card" data-page="drawing"><span>🎨</span><h2>الرسم</h2></article>
  </div>
</section>

<section id="editor" class="page">
  <div class="heading">
    <h1>تحرير الصور</h1>
    <div class="row">
      <button id="rotateBtn">↻ تدوير</button>
      <button id="flipBtn">↔ عكس</button>
      <button id="resetEdit">إعادة ضبط</button>
      <button class="primary" id="exportEdit">تنزيل الصورة</button>
    </div>
  </div>
  <div class="layout">
    <div class="panel">
      <div class="toolbar">
        <button class="primary" id="chooseEdit">اختيار صورة</button>
        <input id="editFile" type="file" accept="image/*" hidden>
        <span id="editInfo" class="hint">لم يتم اختيار صورة</span>
      </div>
      <div class="stage" id="editStage">
        <div class="drop" id="editDrop"><span>📷</span><h2>اختر صورة</h2></div>
        <canvas id="editCanvas"></canvas>
      </div>
    </div>
    <aside class="panel sidebar">
      <h3>أدوات التعديل</h3>
      <div class="control"><label>الإضاءة <span id="brightVal" class="value">100%</span></label><input id="bright" type="range" min="0" max="200" value="100"></div>
      <div class="control"><label>التباين <span id="contrastVal" class="value">100%</span></label><input id="contrast" type="range" min="0" max="200" value="100"></div>
      <div class="control"><label>التشبع <span id="saturationVal" class="value">100%</span></label><input id="saturation" type="range" min="0" max="200" value="100"></div>
      <div class="control"><label>التمويه <span id="blurVal" class="value">0px</span></label><input id="blur" type="range" min="0" max="10" value="0"></div>
      <div class="control"><label>الفلاتر</label>
        <select id="filter">
          <option value="none">بدون فلتر</option>
          <option value="grayscale(1)">أبيض وأسود</option>
          <option value="sepia(1)">بني</option>
          <option value="saturate(1.8) contrast(1.1)">ألوان قوية</option>
          <option value="contrast(1.15) saturate(.8)">سينمائي</option>
          <option value="sepia(.2) saturate(1.3)">دافئ</option>
          <option value="hue-rotate(35deg)">ألوان باردة</option>
        </select>
      </div>
    </aside>
  </div>
</section>

<section id="retouch" class="page">
  <div class="heading">
    <h1>تنظيف الصور</h1>
    <div class="row">
      <button id="undoRetouch">تراجع</button>
      <button class="primary" id="exportRetouch">تنزيل الصورة</button>
    </div>
  </div>
  <div class="layout">
    <div class="panel">
      <div class="toolbar"><button class="primary" id="chooseRetouch">اختيار صورة</button><input id="retouchFile" type="file" accept="image/*" hidden></div>
      <div class="stage" id="retouchStage">
        <div class="drop" id="retouchDrop"><span>🪄</span><h2>اختر صورة</h2></div>
        <canvas id="retouchCanvas"></canvas>
      </div>
    </div>
    <aside class="panel sidebar">
      <h3>أدوات التنظيف</h3>
      <div class="control"><label>الأداة</label>
        <select id="retouchTool"><option value="blur">تمويه</option><option value="clone">نسخ المنطقة المجاورة</option></select>
      </div>
      <div class="control"><label>حجم الفرشاة <span id="retouchSizeVal" class="value">30px</span></label><input id="retouchSize" type="range" min="5" max="100" value="30"></div>
      <div class="control"><label>مسافة النسخ</label><input id="cloneOffset" type="range" min="10" max="150" value="50"></div>
    </aside>
  </div>
</section>

<section id="drawing" class="page">
  <div class="heading">
    <h1>الرسم</h1>
    <div class="row">
      <button id="undoDrawing">تراجع</button>
      <button id="clearDrawing">مسح الرسم</button>
      <button class="primary" id="exportDrawing">تنزيل الرسم</button>
    </div>
  </div>
  <div class="layout">
    <div class="panel">
      <div class="toolbar"><span>لوحة الرسم</span></div>
      <div class="stage">
        <canvas id="drawingCanvas" width="1200" height="800"></canvas>
      </div>
    </div>
    <aside class="panel sidebar">
      <h3>الفرش الاحترافية</h3>
      <div class="control"><label>نوع الفرشاة</label>
        <select id="brushType">
          <option value="pencil">✏️ قلم رصاص</option>
          <option value="ink">🖊️ حبر</option>
          <option value="soft">🖋️ قلم ناعم</option>
          <option value="marker">🖍️ ماركر</option>
          <option value="highlighter">🟨 قلم تمييز</option>
          <option value="airbrush">💨 بخاخ</option>
          <option value="watercolor">🎨 ألوان مائية</option>
          <option value="oil">🖌️ فرشاة زيتية</option>
          <option value="crayon">🖍️ قلم شمع</option>
          <option value="neon">💡 نيون</option>
          <option value="calligraphy">✒️ خط عريض</option>
          <option value="pixel">▦ بكسل</option>
          <option value="rainbow">🌈 قوس قزح</option>
          <option value="eraser">🧽 ممحاة</option>
        </select>
      </div>
      <div class="control"><label>لون الفرشاة</label><input id="brushColor" type="color" value="#111111"></div>
      <div class="control"><label>حجم الفرشاة <span id="brushSizeVal" class="value">8px</span></label><input id="brushSize" type="range" min="1" max="100" value="8"></div>
      <div class="control"><label>الشفافية <span id="opacityVal" class="value">100%</span></label><input id="opacity" type="range" min="5" max="100" value="100"></div>
      <div class="control"><label>تنعيم الخط <span id="smoothVal" class="value">50%</span></label><input id="smooth" type="range" min="0" max="100" value="50"></div>
      <div class="control"><label>شكل الفرشاة</label>
        <select id="brushShape"><option value="round">دائري</option><option value="square">مربع</option><option value="flat">مسطح</option></select>
      </div>
      <div class="control"><label>خلفية اللوحة</label><input id="backgroundColor" type="color" value="#ffffff"><button class="full" id="applyBackground">تغيير الخلفية</button></div>
    </aside>
  </div>
</section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function message(text){
  const t=$('#toast');
  t.textContent=text;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

$$('[data-page]').forEach(card=>{
  card.onclick=()=>showPage(card.dataset.page);
});

function showPage(id){
  $$('.page').forEach(p=>p.classList.remove('active'));
  $('#'+id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

$('#homeBtn').onclick=()=>showPage('home');

$('#themeBtn').onclick=()=>{
  const root=document.documentElement;
  root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
  $('#themeBtn').textContent=root.dataset.theme==='dark'?'☀️':'🌙';
};

/* تحميل الصور */
function loadImage(file,callback){
  if(!file||!file.type.startsWith('image/')){
    message('اختر ملف صورة صالحًا');
    return;
  }
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    callback(img,file.name);
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>{
    URL.revokeObjectURL(url);
    message('تعذر فتح الصورة');
  };
  img.src=url;
}

function downloadCanvas(canvas,name){
  canvas.toBlob(blob=>{
    if(!blob){message('تعذر تنزيل الصورة');return;}
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=name;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  },'image/png');
}

function attachDrop(zone,callback){
  zone.addEventListener('dragover',e=>{
    e.preventDefault();
    zone.style.borderColor='#b17aff';
  });
  zone.addEventListener('dragleave',()=>{
    zone.style.borderColor='';
  });
  zone.addEventListener('drop',e=>{
    e.preventDefault();
    const file=e.dataTransfer.files[0];
    if(file)loadImage(file,callback);
  });
}

/* تحرير الصور */
const editCanvas=$('#editCanvas');
const editCtx=editCanvas.getContext('2d');
let editImage=null,editName='image',editRotation=0,editFlip=false;

function renderEdit(){
  if(!editImage)return;
  const rotated=Math.abs(editRotation%180)===90;
  const w=editImage.naturalWidth,h=editImage.naturalHeight;
  editCanvas.width=rotated?h:w;
  editCanvas.height=rotated?w:h;
  editCtx.clearRect(0,0,editCanvas.width,editCanvas.height);
  editCtx.save();
  editCtx.filter=
    `brightness(${$('#bright').value}%)
     contrast(${$('#contrast').value}%)
     saturate(${$('#saturation').value}%)
     blur(${$('#blur').value}px)
     ${$('#filter').value==='none'?'':$('#filter').value}`;
  editCtx.translate(editCanvas.width/2,editCanvas.height/2);
  editCtx.rotate(editRotation*Math.PI/180);
  editCtx.scale(editFlip?-1:1,1);
  editCtx.drawImage(editImage,-w/2,-h/2,w,h);
  editCtx.restore();
}

function loadEdit(img,name){
  editImage=img;
  editName=name.replace(/\.[^.]+$/,'')||'image';
  editRotation=0;
  editFlip=false;
  $('#editDrop').style.display='none';
  editCanvas.style.display='block';
  $('#editInfo').textContent=`${img.naturalWidth} × ${img.naturalHeight}`;
  ['bright','contrast','saturation'].forEach(id=>$('#'+id).value=100);
  $('#blur').value=0;
  $('#filter').value='none';
  updateEditValues();
  renderEdit();
}

function updateEditValues(){
  $('#brightVal').textContent=$('#bright').value+'%';
  $('#contrastVal').textContent=$('#contrast').value+'%';
  $('#saturationVal').textContent=$('#saturation').value+'%';
  $('#blurVal').textContent=$('#blur').value+'px';
}

['bright','contrast','saturation','blur'].forEach(id=>{
  $('#'+id).oninput=()=>{
    updateEditValues();
    renderEdit();
  };
});
$('#filter').onchange=renderEdit;
$('#chooseEdit').onclick=()=>$('#editFile').click();
$('#editFile').onchange=()=>loadImage($('#editFile').files[0],loadEdit);
$('#rotateBtn').onclick=()=>{if(editImage){editRotation=(editRotation+90)%360;renderEdit();}};
$('#flipBtn').onclick=()=>{if(editImage){editFlip=!editFlip;renderEdit();}};
$('#resetEdit').onclick=()=>{
  if(!editImage)return;
  editRotation=0;editFlip=false;
  ['bright','contrast','saturation'].forEach(id=>$('#'+id).value=100);
  $('#blur').value=0;$('#filter').value='none';
  updateEditValues();renderEdit();
};
$('#exportEdit').onclick=()=>{
  if(!editImage){message('اختر صورة أولًا');return;}
  renderEdit();
  downloadCanvas(editCanvas,'تحرير-الصور.png');
};
attachDrop($('#editDrop'),loadEdit);

/* تنظيف الصور */
const retouchCanvas=$('#retouchCanvas');
const retouchCtx=retouchCanvas.getContext('2d');
let retouchImage=null,retouchName='image',retouchHistory=[],retouchDown=false,retouchLast=null;

function loadRetouch(img,name){
  retouchImage=img;
  retouchName=name.replace(/\.[^.]+$/,'')||'image';
  retouchCanvas.width=img.naturalWidth;
  retouchCanvas.height=img.naturalHeight;
  retouchCtx.drawImage(img,0,0);
  $('#retouchDrop').style.display='none';
  retouchCanvas.style.display='block';
  retouchHistory=[];
}

$('#chooseRetouch').onclick=()=>$('#retouchFile').click();
$('#retouchFile').onchange=()=>loadImage($('#retouchFile').files[0],loadRetouch);
attachDrop($('#retouchDrop'),loadRetouch);

function retouchPoint(e){
  const r=retouchCanvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*retouchCanvas.width/r.width,
         y:(e.clientY-r.top)*retouchCanvas.height/r.height};
}

function saveRetouch(){
  retouchHistory.push(retouchCtx.getImageData(0,0,retouchCanvas.width,retouchCanvas.height));
  if(retouchHistory.length>15)retouchHistory.shift();
}

function retouchAt(p){
  const size=Number($('#retouchSize').value);
  const mode=$('#retouchTool').value;
  const x=Math.max(0,Math.floor(p.x-size));
  const y=Math.max(0,Math.floor(p.y-size));
  const w=Math.min(retouchCanvas.width-x,size*2);
  const h=Math.min(retouchCanvas.height-y,size*2);
  if(w<1||h<1)return;

  const temp=document.createElement('canvas');
  temp.width=w;temp.height=h;
  const tc=temp.getContext('2d');

  if(mode==='blur'){
    tc.filter=`blur(${Math.max(2,size/5)}px)`;
    tc.drawImage(retouchCanvas,x,y,w,h,0,0,w,h);
  }else{
    const offset=Number($('#cloneOffset').value);
    const sx=Math.max(0,Math.min(retouchCanvas.width-w,p.x-offset-size));
    const sy=Math.max(0,Math.min(retouchCanvas.height-h,p.y-size));
    tc.drawImage(retouchCanvas,sx,sy,w,h,0,0,w,h);
  }

  retouchCtx.save();
  retouchCtx.beginPath();
  retouchCtx.arc(p.x,p.y,size,0,Math.PI*2);
  retouchCtx.clip();
  retouchCtx.drawImage(temp,x,y,w,h);
  retouchCtx.restore();
}

$('#retouchSize').oninput=()=>$('#retouchSizeVal').textContent=$('#retouchSize').value+'px';

retouchCanvas.addEventListener('pointerdown',e=>{
  if(!retouchImage)return;
  retouchDown=true;
  retouchCanvas.setPointerCapture(e.pointerId);
  saveRetouch();
  retouchLast=retouchPoint(e);
  retouchAt(retouchLast);
});

retouchCanvas.addEventListener('pointermove',e=>{
  if(!retouchDown)return;
  const p=retouchPoint(e);
  const distance=Math.hypot(p.x-retouchLast.x,p.y-retouchLast.y);
  const step=Math.max(2,Number($('#retouchSize').value)/4);
  const count=Math.max(1,Math.ceil(distance/step));
  const old={...retouchLast};

  for(let i=1;i<=count;i++){
    retouchAt({
      x:old.x+(p.x-old.x)*i/count,
      y:old.y+(p.y-old.y)*i/count
    });
  }
  retouchLast=p;
});

['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  retouchCanvas.addEventListener(ev,()=>{retouchDown=false;retouchLast=null;});
});

$('#undoRetouch').onclick=()=>{
  if(retouchHistory.length)retouchCtx.putImageData(retouchHistory.pop(),0,0);
};
$('#exportRetouch').onclick=()=>{
  if(!retouchImage){message('اختر صورة أولًا');return;}
  downloadCanvas(retouchCanvas,'تحرير-الصور-بعد-التنظيف.png');
};

/* لوحة الرسم والفرش */
const drawCanvas=$('#drawingCanvas');
const drawCtx=drawCanvas.getContext('2d');
let drawing=false,drawLast=null,drawHistory=[],drawBackground='#ffffff',rainbowHue=0;

function resetDrawing(){
  drawCtx.save();
  drawCtx.globalAlpha=1;
  drawCtx.globalCompositeOperation='source-over';
  drawCtx.fillStyle=drawBackground;
  drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height);
  drawCtx.restore();
}

function saveDrawing(){
  drawHistory.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height));
  if(drawHistory.length>30)drawHistory.shift();
}

function drawPoint(e){
  const r=drawCanvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)*drawCanvas.width/r.width,
         y:(e.clientY-r.top)*drawCanvas.height/r.height};
}

function currentBrush(){
  return{
    type:$('#brushType').value,
    size:Number($('#brushSize').value),
    color:$('#brushColor').value,
    opacity:Number($('#opacity').value)/100,
    shape:$('#brushShape').value
  };
}

function paintPoint(p,b){
  const c=drawCtx;
  c.save();
  c.globalAlpha=b.opacity;
  c.globalCompositeOperation='source-over';
  c.lineCap=b.shape==='square'?'square':'round';
  c.lineJoin='round';
  c.lineWidth=b.size;
  c.strokeStyle=b.color;
  c.fillStyle=b.color;
  c.shadowBlur=0;
  c.setLineDash([]);

  switch(b.type){
    case 'eraser':
      c.globalCompositeOperation='destination-out';
      c.strokeStyle='#000';c.fillStyle='#000';
      break;
    case 'pencil':
      c.globalAlpha*=.65;c.lineWidth=Math.max(1,b.size*.55);
      break;
    case 'ink':
      c.lineWidth=Math.max(1,b.size*.72);
      break;
    case 'marker':
      c.globalAlpha*=.78;c.lineWidth=b.size*1.3;
      break;
    case 'highlighter':
      c.globalAlpha*=.25;c.lineWidth=b.size*2.2;c.lineCap='square';
      break;
    case 'watercolor':
      c.globalAlpha*=.15;c.lineWidth=b.size*1.8;
      break;
    case 'oil':
      c.globalAlpha*=.9;c.lineWidth=b.size*.85;
      break;
    case 'crayon':
      c.globalAlpha*=.7;
      break;
    case 'neon':
      c.shadowColor=b.color;c.shadowBlur=Math.max(8,b.size*2);
      c.lineWidth=Math.max(1,b.size*.7);
      break;
    case 'calligraphy':
      c.lineCap='butt';c.lineWidth=b.size*1.2;
      break;
    case 'pixel':
      c.lineCap='square';c.lineWidth=Math.max(4,Math.round(b.size/3)*3);
      break;
    case 'rainbow':
      c.strokeStyle=`hsl(${rainbowHue%360} 100% 50%)`;
      c.fillStyle=c.strokeStyle;rainbowHue+=5;
      break;
    case 'airbrush':
      c.globalAlpha*=.12;
      for(let i=0;i<Math.max(20,b.size*2);i++){
        const angle=Math.random()*Math.PI*2;
        const radius=Math.random()*b.size;
        const dot=Math.random()*Math.max(1,b.size/10);
        c.beginPath();
        c.arc(p.x+Math.cos(angle)*radius,p.y+Math.sin(angle)*radius,dot,0,Math.PI*2);
        c.fill();
      }
      c.restore();
      return;
  }

  if(b.shape==='flat'&&b.type!=='eraser')c.lineCap='butt';

  if(!drawLast){
    c.beginPath();
    c.arc(p.x,p.y,Math.max(1,c.lineWidth/2),0,Math.PI*2);
    c.fill();
  }else{
    c.beginPath();
    c.moveTo(drawLast.x,drawLast.y);
    c.lineTo(p.x,p.y);
    c.stroke();

    if(b.type==='watercolor'){
      c.globalAlpha*=.4;
      c.lineWidth=b.size*2.2;
      c.beginPath();
      c.moveTo(drawLast.x,drawLast.y);
      c.lineTo(p.x,p.y);
      c.stroke();
    }

    if(b.type==='crayon'){
      c.globalAlpha*=.3;
      c.lineWidth=Math.max(1,b.size*.3);
      c.setLineDash([1,3]);
      c.beginPath();
      c.moveTo(drawLast.x,drawLast.y);
      c.lineTo(p.x,p.y);
      c.stroke();
    }
  }
  c.restore();
}

resetDrawing();

drawCanvas.addEventListener('pointerdown',e=>{
  drawing=true;
  drawCanvas.setPointerCapture(e.pointerId);
  saveDrawing();
  drawLast=drawPoint(e);
  paintPoint(drawLast,currentBrush());
});

drawCanvas.addEventListener('pointermove',e=>{
  if(!drawing)return;
  const p=drawPoint(e);
  const b=currentBrush();
  const distance=Math.hypot(p.x-drawLast.x,p.y-drawLast.y);
  const smooth=Number($('#smooth').value);
  const spacing=Math.max(1,b.size*(1-smooth/130));
  const count=Math.max(1,Math.ceil(distance/spacing));
  const previous={...drawLast};

  for(let i=1;i<=count;i++){
    const next={
      x:previous.x+(p.x-previous.x)*i/count,
      y:previous.y+(p.y-previous.y)*i/count
    };
    paintPoint(next,b);
    drawLast=next;
  }
});

['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  drawCanvas.addEventListener(ev,()=>{
    drawing=false;
    drawLast=null;
    drawCtx.beginPath();
  });
});

$('#brushSize').oninput=()=>$('#brushSizeVal').textContent=$('#brushSize').value+'px';
$('#opacity').oninput=()=>$('#opacityVal').textContent=$('#opacity').value+'%';
$('#smooth').oninput=()=>$('#smoothVal').textContent=$('#smooth').value+'%';

$('#undoDrawing').onclick=()=>{
  if(drawHistory.length)drawCtx.putImageData(drawHistory.pop(),0,0);
};
$('#clearDrawing').onclick=()=>{
  saveDrawing();
  resetDrawing();
};
$('#applyBackground').onclick=()=>{
  drawBackground=$('#backgroundColor').value;
  saveDrawing();
  resetDrawing();
};
$('#exportDrawing').onclick=()=>{
  downloadCanvas(drawCanvas,'تحرير-الصور-الرسم.png');
};
</script>
</body>
</html>
