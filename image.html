
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>image-001</title>

<style>
:root{
  --bg:#050505;
  --panel:rgba(8,8,8,.92);
  --panel2:#111;
  --text:#fff;
  --muted:#aaa;
  --gold:#ffd000;
  --gold2:#ff9d00;
  --line:rgba(255,205,0,.35);
  --shadow:0 0 25px rgba(255,190,0,.18);
}
[data-theme="light"]{
  --bg:#eee;
  --panel:rgba(255,255,255,.94);
  --panel2:#fff;
  --text:#171717;
  --muted:#555;
  --line:rgba(180,130,0,.4);
  --shadow:0 0 20px rgba(180,130,0,.15);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
  overflow-x:hidden;
}
button,input,select{font:inherit}
button{cursor:pointer;color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:3px;
}

/* الخلفية */
.background{
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    linear-gradient(rgba(0,0,0,.30),rgba(0,0,0,.83)),
    url("image-001-bg.png") center/cover no-repeat;
  transform:scale(1.04);
  animation:backgroundMove 25s ease-in-out infinite alternate;
}
@keyframes backgroundMove{
  from{transform:scale(1.04) translateY(0)}
  to{transform:scale(1.12) translateY(-10px)}
}
.background::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,.55) 100%);
}

/* البرق الأبيض */
.lightning{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:0;
  background:rgba(255,255,255,.16);
  animation:flash 8s infinite;
}
@keyframes flash{
  0%,91%,93%,96%,100%{opacity:0}
  92%{opacity:.55}
  94%{opacity:.15}
  95%{opacity:.4}
}

/* الهيدر */
header{
  height:76px;
  padding:0 4%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(15px);
  position:sticky;
  top:0;
  z-index:20;
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  border:1px solid var(--gold);
  border-radius:50px;
  padding:9px 20px;
  background:rgba(0,0,0,.65);
  box-shadow:var(--shadow);
}
.brand-mark{
  color:var(--gold);
  font-size:27px;
  font-weight:1000;
  text-shadow:0 0 15px var(--gold);
}
.brand-name{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
}
.header-actions{display:flex;gap:10px}
.btn{
  border:1px solid var(--line);
  background:rgba(0,0,0,.65);
  border-radius:30px;
  padding:11px 18px;
  transition:.25s;
}
.btn:hover{
  border-color:var(--gold);
  box-shadow:0 0 18px rgba(255,200,0,.35);
  transform:translateY(-2px);
}
.gold-btn{
  background:linear-gradient(120deg,#ffe45c,#e99b00);
  color:#111;
  border:0;
  font-weight:bold;
}

/* الصفحة الرئيسية */
main{
  width:min(1450px,94%);
  margin:35px auto;
}
.hero{
  min-height:480px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  position:relative;
  padding:40px 15px;
}
.hero-title{
  font-size:clamp(48px,9vw,105px);
  font-weight:1000;
  letter-spacing:-3px;
  margin:0;
  color:white;
  text-shadow:
    0 3px 0 #777,
    0 0 15px rgba(255,255,255,.45),
    0 0 35px rgba(255,190,0,.7);
  animation:titleAppear 1.3s ease both;
}
.hero-title span{color:var(--gold)}
@keyframes titleAppear{
  from{opacity:0;transform:translateY(35px) scale(.9);filter:blur(10px)}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
.hero-line{
  width:min(600px,80%);
  height:2px;
  margin:25px auto;
  background:linear-gradient(90deg,transparent,var(--gold),white,var(--gold),transparent);
  box-shadow:0 0 15px var(--gold);
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
  width:min(1050px,100%);
  margin:20px auto 0;
}
.card{
  min-height:120px;
  border:1px solid var(--gold);
  border-radius:24px;
  background:linear-gradient(145deg,rgba(0,0,0,.94),rgba(25,18,0,.9));
  box-shadow:0 0 18px rgba(255,190,0,.2),inset 0 0 20px rgba(255,190,0,.06);
  font-size:23px;
  font-weight:900;
  transition:.3s;
}
.card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 0 35px rgba(255,200,0,.5);
  background:linear-gradient(145deg,#171000,#050505);
}
.card::after{
  content:"";
  display:block;
  height:3px;
  width:0;
  margin:12px auto 0;
  background:var(--gold);
  box-shadow:0 0 15px var(--gold);
  transition:.3s;
}
.card:hover::after{width:55%}

/* صفحات الأدوات */
.page{display:none}
.page.active{display:block}
.heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  margin:15px 0 20px;
}
.heading h1{margin:0;font-size:28px;color:var(--gold)}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 290px;
  gap:18px;
}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.toolbar{
  padding:13px;
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.stage{
  min-height:480px;
  padding:20px;
  display:grid;
  place-items:center;
  overflow:auto;
  background-color:#171717;
  background-image:
    linear-gradient(45deg,#ffffff0c 25%,transparent 25%),
    linear-gradient(-45deg,#ffffff0c 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ffffff0c 75%),
    linear-gradient(-45deg,transparent 75%,#ffffff0c 75%);
  background-size:20px 20px;
}
canvas{
  max-width:100%;
  height:auto;
  display:block;
  background:white;
  touch-action:none;
}
#editCanvas,#retouchCanvas{display:none;max-height:650px}
.drop{
  padding:45px 25px;
  border:2px dashed var(--gold);
  border-radius:18px;
  text-align:center;
  cursor:pointer;
  background:rgba(0,0,0,.5);
}
.drop h2{color:var(--gold)}
.sidebar{padding:17px;max-height:800px;overflow:auto}
.sidebar h3{margin:0 0 12px;color:var(--gold)}
.control{
  padding:13px 0;
  border-bottom:1px solid var(--line);
}
.control label{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
  font-size:14px;
}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=color]{width:50px;height:35px;background:transparent;border:0}
select{
  width:100%;
  padding:10px;
  background:#171717;
  color:white;
  border:1px solid var(--line);
  border-radius:9px;
}
.value{color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.small-btn{
  padding:10px 14px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#111;
}
.small-btn:hover{border-color:var(--gold)}
.toast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  padding:13px 22px;
  background:#111;
  color:white;
  border:1px solid var(--gold);
  border-radius:12px;
  display:none;
  z-index:100;
  box-shadow:0 0 20px #ffcc0040;
}
.toast.show{display:block}
footer{
  text-align:center;
  padding:25px;
  color:#aaa;
  font-size:13px;
}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .hero{min-height:400px}
  .stage{min-height:330px}
  header{padding:0 3%}
  .brand-name{font-size:17px}
  .header-actions .btn{padding:9px 12px}
}
</style>
</head>

<body>
<div class="background"></div>
<div class="lightning"></div>

<header>
  <div class="brand">
    <span class="brand-mark">V</span>
    <span class="brand-name">image-001</span>
  </div>
  <div class="header-actions">
    <button class="btn" id="themeBtn">المظهر</button>
    <button class="btn" id="homeBtn">الرئيسية</button>
  </div>
</header>

<main>

<section id="home" class="page active">
  <div class="hero">
    <h1 class="hero-title">image<span>-001</span></h1>
    <div class="hero-line"></div>

    <div class="cards">
      <button class="card" data-page="editor">تحرير الصور</button>
      <button class="card" data-page="retouch">تنظيف الصور</button>
      <button class="card" data-page="drawing">الرسم</button>
    </div>
  </div>
</section>

<section id="editor" class="page">
  <div class="heading">
    <h1>تحرير الصور</h1>
    <div class="row">
      <button class="small-btn" id="rotateBtn">تدوير</button>
      <button class="small-btn" id="flipBtn">عكس</button>
      <button class="small-btn" id="resetEdit">إعادة ضبط</button>
      <button class="small-btn gold-btn" id="exportEdit">تنزيل الصورة</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="toolbar">
        <button class="small-btn gold-btn" id="chooseEdit">اختيار صورة</button>
        <input id="editFile" type="file" accept="image/*" hidden>
        <span id="editInfo">لم يتم اختيار صورة</span>
      </div>
      <div class="stage">
        <div class="drop" id="editDrop">
          <h2>اختر صورة للتعديل</h2>
          <p>اضغط هنا أو اسحب الصورة إلى هذه المنطقة</p>
        </div>
        <canvas id="editCanvas"></canvas>
      </div>
    </div>

    <aside class="panel sidebar">
      <h3>إعدادات الصورة</h3>
      <div class="control">
        <label>الإضاءة <span id="brightVal" class="value">100%</span></label>
        <input id="bright" type="range" min="0" max="200" value="100">
      </div>
      <div class="control">
        <label>التباين <span id="contrastVal" class="value">100%</span></label>
        <input id="contrast" type="range" min="0" max="200" value="100">
      </div>
      <div class="control">
        <label>التشبع <span id="saturationVal" class="value">100%</span></label>
        <input id="saturation" type="range" min="0" max="200" value="100">
      </div>
      <div class="control">
        <label>التمويه <span id="blurVal" class="value">0px</span></label>
        <input id="blur" type="range" min="0" max="10" value="0">
      </div>
      <div class="control">
        <label>الفلاتر</label>
        <select id="filter">
          <option value="none">بدون فلتر</option>
          <option value="grayscale(1)">أبيض وأسود</option>
          <option value="sepia(1)">بني</option>
          <option value="saturate(1.8) contrast(1.1)">ألوان قوية</option>
          <option value="contrast(1.15) saturate(.8)">سينمائي</option>
          <option value="sepia(.2) saturate(1.3)">دافئ</option>
          <option value="hue-rotate(35deg)">ألوان مختلفة</option>
        </select>
      </div>
    </aside>
  </div>
</section>

<section id="retouch" class="page">
  <div class="heading">
    <h1>تنظيف الصور</h1>
    <div class="row">
      <button class="small-btn" id="undoRetouch">تراجع</button>
      <button class="small-btn gold-btn" id="exportRetouch">تنزيل الصورة</button>
    </div>
  </div>
  <div class="layout">
    <div class="panel">
      <div class="toolbar">
        <button class="small-btn gold-btn" id="chooseRetouch">اختيار صورة</button>
        <input id="retouchFile" type="file" accept="image/*" hidden>
      </div>
      <div class="stage">
        <div class="drop" id="retouchDrop">
          <h2>اختر صورة للتنظيف</h2>
          <p>ارسم فوق المنطقة التي تريد تعديلها</p>
        </div>
        <canvas id="retouchCanvas"></canvas>
      </div>
    </div>
    <aside class="panel sidebar">
      <h3>أدوات التنظيف</h3>
      <div class="control">
        <label>الأداة</label>
        <select id="retouchTool">
          <option value="blur">تمويه المنطقة</option>
          <option value="clone">نسخ المنطقة المجاورة</option>
        </select>
      </div>
      <div class="control">
        <label>حجم الفرشاة <span id="retouchSizeVal" class="value">30px</span></label>
        <input id="retouchSize" type="range" min="5" max="100" value="30">
      </div>
      <div class="control">
        <label>مسافة النسخ</label>
        <input id="cloneOffset" type="range" min="10" max="150" value="50">
      </div>
    </aside>
  </div>
</section>

<section id="drawing" class="page">
  <div class="heading">
    <h1>الرسم</h1>
    <div class="row">
      <button class="small-btn" id="undoDrawing">تراجع</button>
      <button class="small-btn" id="clearDrawing">مسح الرسم</button>
      <button class="small-btn gold-btn" id="exportDrawing">تنزيل الرسم</button>
    </div>
  </div>
  <div class="layout">
    <div class="panel">
      <div class="toolbar">لوحة الرسم</div>
      <div class="stage">
        <canvas id="drawingCanvas" width="1200" height="800"></canvas>
      </div>
    </div>
    <aside class="panel sidebar">
      <h3>أدوات الرسم</h3>
      <div class="control">
        <label>نوع الفرشاة</label>
        <select id="brushType">
          <option value="pencil">قلم رصاص</option>
          <option value="ink">حبر</option>
          <option value="soft">قلم ناعم</option>
          <option value="marker">ماركر</option>
          <option value="highlighter">قلم تمييز</option>
          <option value="airbrush">بخاخ</option>
          <option value="watercolor">ألوان مائية</option>
          <option value="oil">فرشاة زيتية</option>
          <option value="neon">نيون</option>
          <option value="calligraphy">خط عريض</option>
          <option value="eraser">ممحاة</option>
        </select>
      </div>
      <div class="control">
        <label>لون الفرشاة</label>
        <input id="brushColor" type="color" value="#111111">
      </div>
      <div class="control">
        <label>حجم الفرشاة <span id="brushSizeVal" class="value">8px</span></label>
        <input id="brushSize" type="range" min="1" max="100" value="8">
      </div>
      <div class="control">
        <label>الشفافية <span id="opacityVal" class="value">100%</span></label>
        <input id="opacity" type="range" min="5" max="100" value="100">
      </div>
      <div class="control">
        <label>تنعيم الخط <span id="smoothVal" class="value">50%</span></label>
        <input id="smooth" type="range" min="0" max="100" value="50">
      </div>
      <div class="control">
        <label>خلفية اللوحة</label>
        <input id="backgroundColor" type="color" value="#ffffff">
        <button class="small-btn" id="applyBackground">تغيير الخلفية</button>
      </div>
    </aside>
  </div>
</section>

</main>

<footer>image-001</footer>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

function message(text){
  const t=$("#toast");
  t.textContent=text;
  t.classList.add("show");
  clearTimeout(message.timer);
  message.timer=setTimeout(()=>t.classList.remove("show"),2200);
}

function showPage(id){
  $$(".page").forEach(p=>p.classList.remove("active"));
  $("#"+id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

$$("[data-page]").forEach(card=>{
  card.addEventListener("click",()=>showPage(card.dataset.page));
});

$("#homeBtn").onclick=()=>showPage("home");

$("#themeBtn").onclick=()=>{
  const root=document.documentElement;
  root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";
};

function loadImage(file,callback){
  if(!file||!file.type.startsWith("image/")){
    message("اختر ملف صورة صالحًا");
    return;
  }
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    callback(img,file.name);
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>{
    URL.revokeObjectURL(url);
    message("تعذر فتح الصورة");
  };
  img.src=url;
}

function downloadCanvas(canvas,name){
  canvas.toBlob(blob=>{
    if(!blob){message("تعذر تجهيز الصورة");return;}
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=name;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  },"image/png");
}

function attachDrop(zone,callback){
  zone.addEventListener("dragover",e=>{
    e.preventDefault();
    zone.style.borderColor="#fff";
  });
  zone.addEventListener("dragleave",()=>{
    zone.style.borderColor="";
  });
  zone.addEventListener("drop",e=>{
    e.preventDefault();
    const file=e.dataTransfer.files[0];
    if(file)loadImage(file,callback);
  });
}

/* تحرير الصور */
const editCanvas=$("#editCanvas");
const editCtx=editCanvas.getContext("2d");
let editImage=null,editRotation=0,editFlip=false;

function renderEdit(){
  if(!editImage)return;
  const rotated=Math.abs(editRotation%180)===90;
  const w=editImage.naturalWidth,h=editImage.naturalHeight;
  editCanvas.width=rotated?h:w;
  editCanvas.height=rotated?w:h;

  editCtx.save();
  editCtx.filter=
    `brightness(${$("#bright").value}%)
     contrast(${$("#contrast").value}%)
     saturate(${$("#saturation").value}%)
     blur(${$("#blur").value}px)
     ${$("#filter").value==="none"?"":$("#filter").value}`;
  editCtx.translate(editCanvas.width/2,editCanvas.height/2);
  editCtx.rotate(editRotation*Math.PI/180);
  editCtx.scale(editFlip?-1:1,1);
  editCtx.drawImage(editImage,-w/2,-h/2,w,h);
  editCtx.restore();
}

function updateEditValues(){
  ["bright","contrast","saturation"].forEach(id=>{
    $("#"+id+"Val").textContent=$("#"+id).value+"%";
  });
  $("#blurVal").textContent=$("#blur").value+"px";
}

function loadEdit(img,name){
  editImage=img;
  editRotation=0;
  editFlip=false;
  $("#editDrop").style.display="none";
  editCanvas.style.display="block";
  $("#editInfo").textContent=
    `${img.naturalWidth} × ${img.naturalHeight} | ${name}`;
  ["bright","contrast","saturation"].forEach(id=>$("#"+id).value=100);
  $("#blur").value=0;
  $("#filter").value="none";
  updateEditValues();
  renderEdit();
}

["bright","contrast","saturation","blur"].forEach(id=>{
  $("#"+id).oninput=()=>{updateEditValues();renderEdit();};
});
$("#filter").onchange=renderEdit;
$("#chooseEdit").onclick=()=>$("#editFile").click();
$("#editFile").onchange=()=>loadImage($("#editFile").files[0],loadEdit);
$("#rotateBtn").onclick=()=>{
  if(!editImage)return message("اختر صورة أولًا");
  editRotation=(editRotation+90)%360;
  renderEdit();
};
$("#flipBtn").onclick=()=>{
  if(!editImage)return message("اختر صورة أولًا");
  editFlip=!editFlip;
  renderEdit();
};
$("#resetEdit").onclick=()=>{
  if(!editImage)return;
  editRotation=0;editFlip=false;
  ["bright","contrast","saturation"].forEach(id=>$("#"+id).value=100);
  $("#blur").value=0;$("#filter").value="none";
  updateEditValues();renderEdit();
};
$("#exportEdit").onclick=()=>{
  if(!editImage)return message("اختر صورة أولًا");
  renderEdit();
  downloadCanvas(editCanvas,"image-001-edit.png");
};
attachDrop($("#editDrop"),loadEdit);

/* تنظيف الصور */
const retouchCanvas=$("#retouchCanvas");
const retouchCtx=retouchCanvas.getContext("2d");
let retouchImage=null,retouchHistory=[],retouchDown=false,retouchLast=null;

function loadRetouch(img){
  retouchImage=img;
  retouchCanvas.width=img.naturalWidth;
  retouchCanvas.height=img.naturalHeight;
  retouchCtx.drawImage(img,0,0);
  $("#retouchDrop").style.display="none";
  retouchCanvas.style.display="block";
  retouchHistory=[];
}

$("#chooseRetouch").onclick=()=>$("#retouchFile").click();
$("#retouchFile").onchange=()=>loadImage($("#retouchFile").files[0],loadRetouch);
attachDrop($("#retouchDrop"),loadRetouch);

function retouchPoint(e){
  const r=retouchCanvas.getBoundingClientRect();
  return{
    x:(e.clientX-r.left)*retouchCanvas.width/r.width,
    y:(e.clientY-r.top)*retouchCanvas.height/r.height
  };
}
function saveRetouch(){
  retouchHistory.push(retouchCtx.getImageData(0,0,retouchCanvas.width,retouchCanvas.height));
  if(retouchHistory.length>12)retouchHistory.shift();
}
function retouchAt(p){
  const size=Number($("#retouchSize").value);
  const mode=$("#retouchTool").value;
  const x=Math.max(0,Math.floor(p.x-size));
  const y=Math.max(0,Math.floor(p.y-size));
  const w=Math.min(retouchCanvas.width-x,size*2);
  const h=Math.min(retouchCanvas.height-y,size*2);
  if(w<1||h<1)return;

  const temp=document.createElement("canvas");
  temp.width=w;temp.height=h;
  const tc=temp.getContext("2d");

  if(mode==="blur"){
    tc.filter=`blur(${Math.max(2,size/5)}px)`;
    tc.drawImage(retouchCanvas,x,y,w,h,0,0,w,h);
  }else{
    const offset=Number($("#cloneOffset").value);
    const sx=Math.max(0,Math.min(retouchCanvas.width-w,p.x-offset-size));
    const sy=Math.max(0,Math.min(retouchCanvas.height-h,p.y-size));
    tc.drawImage(retouchCanvas,sx,sy,w,h,0,0,w,h);
  }

  retouchCtx.save();
  retouchCtx.beginPath();
  retouchCtx.arc(p.x,p.y,size,0,Math.PI*2);
  retouchCtx.clip();
  retouchCtx.drawImage(temp,x,y,w,h);
  retouchCtx.restore();
}
$("#retouchSize").oninput=()=>$("#retouchSizeVal").textContent=$("#retouchSize").value+"px";

retouchCanvas.addEventListener("pointerdown",e=>{
  if(!retouchImage)return;
  retouchDown=true;
  retouchCanvas.setPointerCapture(e.pointerId);
  saveRetouch();
  retouchLast=retouchPoint(e);
  retouchAt(retouchLast);
});
retouchCanvas.addEventListener("pointermove",e=>{
  if(!retouchDown)return;
  const p=retouchPoint(e);
  const distance=Math.hypot(p.x-retouchLast.x,p.y-retouchLast.y);
  const step=Math.max(2,Number($("#retouchSize").value)/4);
  const count=Math.max(1,Math.ceil(distance/step));
  const old={...retouchLast};
  for(let i=1;i<=count;i++){
    retouchAt({
      x:old.x+(p.x-old.x)*i/count,
      y:old.y+(p.y-old.y)*i/count
    });
  }
  retouchLast=p;
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  retouchCanvas.addEventListener(ev,()=>{
    retouchDown=false;
    retouchLast=null;
  });
});
$("#undoRetouch").onclick=()=>{
  if(retouchHistory.length){
    retouchCtx.putImageData(retouchHistory.pop(),0,0);
  }
};
$("#exportRetouch").onclick=()=>{
  if(!retouchImage)return message("اختر صورة أولًا");
  downloadCanvas(retouchCanvas,"image-001-retouched.png");
};

/* الرسم */
const drawCanvas=$("#drawingCanvas");
const drawCtx=drawCanvas.getContext("2d");
let drawing=false,drawLast=null,drawHistory=[],drawBackground="#ffffff";

function resetDrawing(){
  drawCtx.save();
  drawCtx.globalAlpha=1;
  drawCtx.globalCompositeOperation="source-over";
  drawCtx.fillStyle=drawBackground;
  drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height);
  drawCtx.restore();
}
function saveDrawing(){
  drawHistory.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height));
  if(drawHistory.length>25)drawHistory.shift();
}
function drawPoint(e){
  const r=drawCanvas.getBoundingClientRect();
  return{
    x:(e.clientX-r.left)*drawCanvas.width/r.width,
    y:(e.clientY-r.top)*drawCanvas.height/r.height
  };
}
function currentBrush(){
  return{
    type:$("#brushType").value,
    size:Number($("#brushSize").value),
    color:$("#brushColor").value,
    opacity:Number($("#opacity").value)/100
  };
}
function paintPoint(p,b){
  const c=drawCtx;
  c.save();
  c.globalAlpha=b.opacity;
  c.globalCompositeOperation="source-over";
  c.lineCap="round";
  c.lineJoin="round";
  c.lineWidth=b.size;
  c.strokeStyle=b.color;
  c.fillStyle=b.color;
  c.shadowBlur=0;

  if(b.type==="eraser"){
    c.globalCompositeOperation="destination-out";
  }
  if(b.type==="pencil")c.globalAlpha*=.65;
  if(b.type==="marker"){c.globalAlpha*=.75;c.lineWidth*=1.4;}
  if(b.type==="highlighter"){c.globalAlpha*=.25;c.lineWidth*=2.2;}
  if(b.type==="watercolor"){c.globalAlpha*=.2;c.lineWidth*=1.8;}
  if(b.type==="neon"){
    c.shadowColor=b.color;
    c.shadowBlur=Math.max(8,b.size*2);
  }
  if(b.type==="calligraphy")c.lineWidth*=1.5;

  if(!drawLast){
    c.beginPath();
    c.arc(p.x,p.y,Math.max(1,c.lineWidth/2),0,Math.PI*2);
    c.fill();
  }else{
    c.beginPath();
    c.moveTo(drawLast.x,drawLast.y);
    c.lineTo(p.x,p.y);
    c.stroke();
  }
  c.restore();
}
resetDrawing();

drawCanvas.addEventListener("pointerdown",e=>{
  drawing=true;
  drawCanvas.setPointerCapture(e.pointerId);
  saveDrawing();
  drawLast=drawPoint(e);
  paintPoint(drawLast,currentBrush());
});
drawCanvas.addEventListener("pointermove",e=>{
  if(!drawing)return;
  const p=drawPoint(e);
  const b=currentBrush();
  const distance=Math.hypot(p.x-drawLast.x,p.y-drawLast.y);
  const spacing=Math.max(1,b.size*.25);
  const count=Math.max(1,Math.ceil(distance/spacing));
  const old={...drawLast};
  for(let i=1;i<=count;i++){
    const next={
      x:old.x+(p.x-old.x)*i/count,
      y:old.y+(p.y-old.y)*i/count
    };
    paintPoint(next,b);
    drawLast=next;
  }
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  drawCanvas.addEventListener(ev,()=>{
    drawing=false;
    drawLast=null;
  });
});

$("#brushSize").oninput=()=>$("#brushSizeVal").textContent=$("#brushSize").value+"px";
$("#opacity").oninput=()=>$("#opacityVal").textContent=$("#opacity").value+"%";
$("#smooth").oninput=()=>$("#smoothVal").textContent=$("#smooth").value+"%";

$("#undoDrawing").onclick=()=>{
  if(drawHistory.length)drawCtx.putImageData(drawHistory.pop(),0,0);
};
$("#clearDrawing").onclick=()=>{
  saveDrawing();
  resetDrawing();
};
$("#applyBackground").onclick=()=>{
  drawBackground=$("#backgroundColor").value;
  saveDrawing();
  resetDrawing();
};
$("#exportDrawing").onclick=()=>{
  downloadCanvas(drawCanvas,"image-001-drawing.png");
};
</script>
