
<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030712">
    <title>VideoYTFX</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #030712;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --cyan: #22d3ee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
            isolation: isolate;
            background:
                radial-gradient(
                    ellipse at 15% 10%,
                    rgba(37, 99, 235, 0.14),
                    transparent 40%
                ),
                radial-gradient(
                    ellipse at 90% 85%,
                    rgba(147, 51, 234, 0.13),
                    transparent 42%
                ),
                #030712;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .ambient {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.25;
            pointer-events: none;
            z-index: -1;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        .glow-one {
            top: -220px;
            left: -160px;
            background: #2563eb;
        }

        .glow-two {
            right: -180px;
            top: 25%;
            background: #9333ea;
            animation-delay: -4s;
        }

        .glow-three {
            bottom: -260px;
            left: 25%;
            background: #0891b2;
            animation-delay: -7s;
        }

        .main {
            width: 100%;
            min-height: 100vh;
            padding: 25px;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .logo {
            display: inline-block;
            position: relative;
            font-size: clamp(3rem, 11vw, 8rem);
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: -0.065em;
            white-space: nowrap;

            background: linear-gradient(
                110deg,
                #ffffff 5%,
                #bfdbfe 25%,
                #3b82f6 48%,
                #8b5cf6 72%,
                #e879f9 95%
            );

            background-size: 250% auto;
            background-position: 0% center;

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(
                0 0 24px rgba(59, 130, 246, 0.25)
            );

            animation:
                logoEnter 1.2s ease-out both,
                logoGradient 6s ease-in-out 1.2s infinite alternate,
                logoGlow 4s ease-in-out 1.2s infinite alternate;
        }

        .logo::after {
            content: "";
            position: absolute;
            height: 3px;
            width: 72%;
            bottom: -18px;
            left: 14%;
            border-radius: 50%;
            background: linear-gradient(
                90deg,
                transparent,
                #3b82f6,
                #a855f7,
                transparent
            );
            box-shadow: 0 0 18px rgba(59, 130, 246, 0.6);
            animation: lineGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoEnter {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.94);
                filter: blur(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes logoGradient {
            from {
                background-position: 0% center;
            }

            to {
                background-position: 100% center;
            }
        }

        @keyframes logoGlow {
            from {
                filter: drop-shadow(
                    0 0 15px rgba(59, 130, 246, 0.2)
                );
            }

            to {
                filter: drop-shadow(
                    0 0 35px rgba(139, 92, 246, 0.45)
                );
            }
        }

        @keyframes floatGlow {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(45px, 35px) scale(1.15);
            }
        }

        @keyframes lineGlow {
            from {
                opacity: 0.45;
                transform: scaleX(0.8);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: clamp(2.7rem, 11vw, 4rem);
                letter-spacing: -0.07em;
            }

            .ambient {
                width: 280px;
                height: 280px;
                filter: blur(100px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <div class="ambient glow-one"></div>
    <div class="ambient glow-two"></div>
    <div class="ambient glow-three"></div>

    <main class="main">
        <h1 class="logo">VideoYTFX</h1>
    </main>
</body>
</html>
