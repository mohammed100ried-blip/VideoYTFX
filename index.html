<style>
:root {
    --bg:#030308;
    --surface:rgba(13,16,28,.88);
    --surface-hover:#171c2d;
    --border:rgba(255,255,255,.09);
    --text:#f8fafc;
    --muted:#94a3b8;
    --blue:#1677ff;
    --red:#ff1744;
    --purple:#713cff;
    --cyan:#36d9ff;
    --radius:22px;
}

[data-theme="light"] {
    --bg:#f1f4fa;
    --surface:rgba(255,255,255,.9);
    --surface-hover:#fff;
    --border:rgba(15,23,42,.12);
    --text:#111827;
    --muted:#64748b;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html {
    scroll-behavior:smooth;
}

body {
    min-height:100vh;
    overflow-x:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans',sans-serif;
    transition:background .4s,color .4s;
}

html[dir="rtl"] body {
    font-family:'Tajawal',sans-serif;
}

a {
    text-decoration:none;
    color:inherit;
}

button {
    font:inherit;
}

/* =================================
   BACKGROUND
================================= */

.background-glow {
    position:fixed;
    width:430px;
    height:430px;
    border-radius:50%;
    filter:blur(130px);
    pointer-events:none;
    z-index:-2;
    opacity:.22;
    animation:backgroundFloat 12s ease-in-out infinite alternate;
}

.glow-one {
    top:-180px;
    left:-130px;
    background:var(--blue);
}

.glow-two {
    top:30%;
    right:-200px;
    background:var(--red);
    animation-delay:-4s;
}

.glow-three {
    bottom:-220px;
    left:25%;
    background:var(--purple);
    animation-delay:-7s;
}

@keyframes backgroundFloat {
    from {
        transform:translate(0,0) scale(1);
    }
    to {
        transform:translate(65px,40px) scale(1.2);
    }
}

/* PARTICLES */

.particles {
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particles span {
    position:absolute;
    bottom:-20px;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 12px var(--blue);
    animation:particleUp linear infinite;
}

.particles span:nth-child(1) {
    left:10%;
    animation-duration:12s;
}

.particles span:nth-child(2) {
    left:25%;
    animation-duration:17s;
    animation-delay:2s;
    background:var(--red);
}

.particles span:nth-child(3) {
    left:40%;
    animation-duration:14s;
    animation-delay:4s;
}

.particles span:nth-child(4) {
    left:60%;
    animation-duration:18s;
    animation-delay:1s;
    background:var(--red);
}

.particles span:nth-child(5) {
    left:75%;
    animation-duration:13s;
    animation-delay:3s;
}

.particles span:nth-child(6) {
    left:90%;
    animation-duration:16s;
    animation-delay:5s;
    background:var(--red);
}

@keyframes particleUp {
    0% {
        transform:translateY(0);
        opacity:0;
    }
    20% {
        opacity:.8;
    }
    100% {
        transform:translateY(-110vh);
        opacity:0;
    }
}

/* =================================
   NAVBAR
================================= */

.navbar {
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    padding:16px 7%;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    opacity:0;
    animation:interfaceReveal .8s ease forwards;
    animation-delay:4.8s;
}

.brand {
    display:flex;
    align-items:center;
    gap:10px;

    font-weight:800;
    font-size:1.35rem;
    letter-spacing:-.5px;

    background:linear-gradient(
        110deg,
        var(--text),
        var(--blue),
        var(--red)
    );

    background-clip:text;
    -webkit-background-clip:text;
    color:transparent;
    transition:.3s;
}

.brand:hover {
    filter:drop-shadow(0 0 12px var(--blue));
}

.brand-icon {
    width:38px;
    height:38px;
    object-fit:cover;
    border-radius:10px;
    box-shadow:0 0 15px rgba(22,119,255,.35);
    transition:.3s;
}

.brand:hover .brand-icon {
    transform:rotate(-5deg) scale(1.08);
    box-shadow:0 0 22px rgba(255,23,68,.4);
}

.nav-actions {
    display:flex;
    gap:10px;
}

.btn-ui {
    display:inline-flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:13px;
    cursor:pointer;
    transition:.3s;
}

.btn-ui:hover {
    transform:translateY(-3px);
    border-color:var(--blue);
    box-shadow:0 0 20px rgba(22,119,255,.2);
}

/* =================================
   HERO
================================= */

.hero {
    position:relative;
    min-height:48vh;
    display:grid;
    place-items:center;
    padding:65px 20px 55px;
    text-align:center;
}

.hero-content {
    max-width:850px;
    width:100%;
    opacity:0;
    animation:interfaceReveal 1s ease forwards;
    animation-delay:5s;
}

.hero-logo {
    display:block;
    width:clamp(220px,34vw,390px);
    height:auto;
    aspect-ratio:1/1;
    object-fit:contain;
    margin:0 auto 25px;
    border-radius:22px;

    filter:
        drop-shadow(0 0 15px rgba(22,119,255,.24))
        drop-shadow(0 0 22px rgba(255,23,68,.15));

    animation:logoFloat 5s ease-in-out infinite;
    transition:filter .4s,transform .4s;
}

.hero-logo:hover {
    transform:scale(1.035);
    filter:
        drop-shadow(0 0 22px rgba(22,119,255,.55))
        drop-shadow(0 0 30px rgba(255,23,68,.35));
}

@keyframes logoFloat {
    0%,100% {
        transform:translateY(0);
    }
    50% {
        transform:translateY(-9px);
    }
}

.visually-hidden {
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
}

/* =================================
   BUTTONS
================================= */

.cta-group {
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
}

.btn-primary,
.btn-secondary {
    display:inline-flex;
    justify-content:center;
    align-items:center;
    gap:9px;
    min-width:175px;
    padding:15px 26px;
    border-radius:14px;
    font-weight:800;
    transition:.35s;
}

.btn-primary {
    color:white;
    background:linear-gradient(120deg,#e60035,#ff1744);
    border:1px solid rgba(255,23,68,.6);
}

.btn-secondary {
    color:white;
    background:linear-gradient(120deg,#0759c9,#1677ff);
    border:1px solid rgba(22,119,255,.6);
}

.btn-primary:hover,
.btn-secondary:hover {
    transform:translateY(-5px) scale(1.04);
}

.btn-primary:hover {
    box-shadow:0 0 35px rgba(255,23,68,.4);
}

.btn-secondary:hover {
    box-shadow:0 0 35px rgba(22,119,255,.4);
}

/* =================================
   FEATURES
================================= */

.features {
    max-width:1140px;
    margin:0 auto;
    padding:25px 20px 90px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(255px,1fr));
    gap:22px;
}

.card {
    --accent:var(--blue);
    position:relative;
    isolation:isolate;
    min-height:225px;
    padding:30px;
    overflow:visible;

    display:flex;
    flex-direction:column;
    justify-content:center;

    border:1px solid var(--border);
    border-radius:var(--radius);
    background:var(--surface);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    transition:
        transform .4s,
        border-color .4s,
        box-shadow .4s;

    opacity:0;
    animation:interfaceReveal .8s ease forwards;
    animation-delay:5.15s;
}

.card:nth-child(1) {
    --accent:#ff1744;
}

.image-card {
    --accent:#1677ff;
}

.video-card {
    --accent:#ff365e;
}

.gesture-card {
    --accent:#378dff;

    background:
        radial-gradient(
            ellipse at 100% 0%,
            rgba(22,119,255,.13),
            transparent 55%
        ),
        radial-gradient(
            ellipse at 0% 100%,
            rgba(255,23,68,.12),
            transparent 60%
        ),
        var(--surface);
}

.card:nth-child(2) {
    animation-delay:5.3s;
}

.card:nth-child(3) {
    animation-delay:5.45s;
}

.card:nth-child(4) {
    animation-delay:5.6s;
}

/* SMOKE AROUND CARDS */

.card::before {
    content:"";
    position:absolute;
    inset:-14px;
    z-index:-1;
    border-radius:inherit;
    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 10% 50%,
            rgba(255,23,68,.55),
            transparent 55%
        ),
        radial-gradient(
            ellipse at 90% 50%,
            rgba(22,119,255,.55),
            transparent 55%
        );

    filter:blur(24px);
    opacity:.35;

    animation:cardSmoke 4s ease-in-out infinite;
}

.card::after {
    content:"";
    position:absolute;
    inset:-7px;
    z-index:-1;
    border-radius:inherit;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,23,68,.4),
            transparent 45%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(22,119,255,.4),
            transparent 45%
        );

    filter:blur(17px);
    opacity:.2;

    animation:cardSmoke2 5s ease-in-out infinite alternate;
}

@keyframes cardSmoke {
    0%,100% {
        transform:scale(.9) translateY(0);
        opacity:.25;
    }
    50% {
        transform:scale(1.1) translateY(-5px);
        opacity:.7;
    }
}

@keyframes cardSmoke2 {
    from {
        transform:scale(.9) rotate(-4deg);
        opacity:.15;
    }
    to {
        transform:scale(1.12) rotate(4deg);
        opacity:.5;
    }
}

/* HOVER EFFECT */

.card:hover {
    transform:translateY(-10px) scale(1.02);
    border-color:var(--accent);

    box-shadow:
        0 20px 50px rgba(0,0,0,.25),
        0 0 30px color-mix(
            in srgb,
            var(--accent) 25%,
            transparent
        );
}

.card:hover::before {
    opacity:.95;
    filter:blur(30px);
}

.card:hover::after {
    opacity:.65;
    filter:blur(23px);
}

/* CARD TEXT */

.card h3 {
    position:relative;
    z-index:1;
    font-size:1.45rem;
    font-weight:800;
    letter-spacing:-.5px;
    color:var(--text);
    transition:.3s;
}

.card:hover h3 {
    color:var(--accent);
    transform:translateX(5px);
}

html[dir="rtl"] .card:hover h3 {
    transform:translateX(-5px);
}

/* NUMBER LABEL */

.card-number {
    position:relative;
    z-index:1;
    font-size:2.2rem;
    font-weight:800;
    letter-spacing:3px;
    margin-bottom:22px;
    color:var(--accent);

    text-shadow:0 0 22px color-mix(
        in srgb,
        var(--accent) 50%,
        transparent
    );

    transition:.35s;
}

.card:hover .card-number {
    letter-spacing:7px;
    transform:translateY(-3px);
}

/* GESTURE CARD */

.gesture-orb {
    position:absolute;
    width:100px;
    height:100px;
    right:25px;
    bottom:30px;
    border:1px solid rgba(22,119,255,.35);
    border-radius:50%;
    opacity:.65;
    pointer-events:none;
    animation:orbitPulse 3.5s ease-in-out infinite;
}

.gesture-orb::before,
.gesture-orb::after {
    content:"";
    position:absolute;
    inset:12px;
    border:1px solid rgba(255,23,68,.4);
    border-radius:50%;
}

.gesture-orb::after {
    inset:25px;
    border-color:rgba(22,119,255,.5);
}

@keyframes orbitPulse {
    0%,100% {
        transform:scale(.92) rotate(0deg);
        opacity:.4;
    }
    50% {
        transform:scale(1.1) rotate(35deg);
        opacity:1;
    }
}

html[dir="rtl"] .gesture-orb {
    right:auto;
    left:25px;
}

/* =================================
   FOOTER
================================= */

footer {
    padding:25px 20px;
    text-align:center;
    border-top:1px solid var(--border);
    background:var(--surface);
    color:var(--muted);
    font-size:.88rem;
}

/* =================================
   SMOKE INTRO
================================= */

.smoke-intro {
    position:fixed;
    inset:0;
    z-index:1000;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:#030308;
    animation:introDisappear 1s ease forwards;
    animation-delay:4.5s;
    pointer-events:none;
}

.smoke-title {
    position:relative;
    z-index:3;
    font-size:clamp(3rem,10vw,8rem);
    font-weight:800;
    letter-spacing:-4px;
    color:transparent;

    background:linear-gradient(
        110deg,
        #fff,
        #1677ff,
        #ff1744,
        #fff
    );

    background-size:300% 300%;
    background-clip:text;
    -webkit-background-clip:text;

    opacity:0;
    filter:blur(25px);

    animation:
        smokeTextReveal 2s ease forwards,
        gradientMove 4s ease infinite;

    animation-delay:1.2s,3s;
}

.smoke-layer {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    filter:blur(35px);
}

.smoke-layer span {
    position:absolute;
    width:190px;
    height:190px;
    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(22,119,255,.7),
        rgba(255,23,68,.4),
        transparent 70%
    );

    opacity:0;
    animation:smokeMove 3.5s ease-in-out infinite;
}

.smoke-layer span:nth-child(1) {animation-delay:0s}
.smoke-layer span:nth-child(2) {animation-delay:.3s}
.smoke-layer span:nth-child(3) {animation-delay:.6s}
.smoke-layer span:nth-child(4) {animation-delay:.9s}
.smoke-layer span:nth-child(5) {animation-delay:1.2s}
.smoke-layer span:nth-child(6) {animation-delay:1.5s}
.smoke-layer span:nth-child(7) {animation-delay:1.8s}
.smoke-layer span:nth-child(8) {animation-delay:2.1s}

@keyframes smokeMove {
    0% {
        opacity:0;
        scale:.4;
        translate:0 100px;
    }
    40% {
        opacity:.8;
        scale:1.5;
    }
    100% {
        opacity:0;
        scale:2.5;
        translate:0 -130px;
    }
}

@keyframes smokeTextReveal {
    0% {
        opacity:0;
        filter:blur(30px);
        transform:scale(.7);
    }
    60% {
        opacity:1;
        filter:blur(4px);
        transform:scale(1.08);
    }
    100% {
        opacity:1;
        filter:blur(0);
        transform:scale(1);
    }
}

@keyframes introDisappear {
    to {
        opacity:0;
        visibility:hidden;
    }
}

/* INTERFACE ANIMATION */

@keyframes interfaceReveal {
    from {
        opacity:0;
        transform:translateY(35px);
        filter:blur(8px);
    }
    to {
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
    }
}

/* =================================
   RESPONSIVE
================================= */

@media(max-width:640px) {
    .navbar {
        padding:12px 4%;
    }

    .brand {
        font-size:1.05rem;
    }

    .brand-icon {
        width:31px;
        height:31px;
    }

    .nav-actions {
        gap:6px;
    }

    .btn-ui {
        padding:8px 10px;
        font-size:.84rem;
    }

    .hero {
        min-height:auto;
        padding:55px 18px 40px;
    }

    .hero-logo {
        width:min(78vw,310px);
        margin-bottom:20px;
    }

    .cta-group {
        flex-direction:column;
        width:100%;
    }

    .btn-primary,
    .btn-secondary {
        width:100%;
    }

    .features {
        grid-template-columns:1fr;
        padding:15px 18px 60px;
    }

    .card {
        min-height:190px;
    }

    .gesture-orb {
        width:78px;
        height:78px;
        right:18px;
        bottom:25px;
    }

    html[dir="rtl"] .gesture-orb {
        right:auto;
        left:18px;
    }
}

/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior:auto!important;
        animation:none!important;
        transition:none!important;
    }

    .smoke-intro {
        display:none;
    }

    .navbar,
    .hero-content,
    .card {
        opacity:1;
        filter:none;
        transform:none;
    }
}
</style>
</head>

<script>

/* LANGUAGE SYSTEM */

function setLanguage(lang) {

    const selected = lang === "ar" ? "ar" : "en";

    document.documentElement.lang = selected;

    document.documentElement.dir =
        selected === "ar" ? "rtl" : "ltr";

    document.getElementById("langLabel").textContent =
        selected === "en" ? "العربية" : "English";

    document.querySelectorAll("[data-en][data-ar]").forEach(element => {
        element.textContent = element.dataset[selected];
    });

    try {
        localStorage.setItem("app_lang", selected);
    } catch(error) {
        console.warn("Language preference could not be saved.", error);
    }
}

function toggleLanguage() {
    setLanguage(
        document.documentElement.lang === "en" ? "ar" : "en"
    );
}

/* THEME SYSTEM */

function setTheme(theme) {

    const selected = theme === "light" ? "light" : "dark";

    document.documentElement.setAttribute(
        "data-theme",
        selected
    );

    document.getElementById("themeLabel").textContent =
        selected === "light" ? "Dark" : "Light";

    document.querySelector('meta[name="theme-color"]').content =
        selected === "light" ? "#f1f4fa" : "#030308";

    try {
        localStorage.setItem("app_theme", selected);
    } catch(error) {
        console.warn("Theme preference could not be saved.", error);
    }
}

function toggleTheme() {

    const current =
        document.documentElement.getAttribute("data-theme");

    setTheme(current === "dark" ? "light" : "dark");
}

/* SAVED PREFERENCES */

function readPreference(key, fallback) {

    try {
        return localStorage.getItem(key) || fallback;
    } catch(error) {
        return fallback;
    }
}

/* INITIALIZATION */

setLanguage(readPreference("app_lang", "en"));
setTheme(readPreference("app_theme", "dark"));

/* INTRO CLEANUP */

window.addEventListener("load", () => {

    const intro = document.getElementById("smokeIntro");

    if (!intro) return;

    window.setTimeout(() => {
        intro.remove();
    }, 5600);
});

/* LOGO ERROR HANDLING */

document.querySelectorAll(".hero-logo, .brand-icon").forEach(image => {

    image.addEventListener("error", () => {

        console.error(
            "Logo not found. Put videoytfx-logo.png beside index.html."
        );

    });

});

</script>
