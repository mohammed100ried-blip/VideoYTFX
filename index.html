<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoYTFX</title>

    <style>

        :root {
            --bg: #070b14;
            --bg2: #0b1020;
            --card: rgba(15, 23, 42, 0.75);
            --border: rgba(148, 163, 184, 0.18);

            --text: #f8fafc;
            --muted: #94a3b8;

            --primary: #3b82f6;
            --primary2: #60a5fa;

            --shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(37, 99, 235, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(59, 130, 246, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    var(--bg),
                    var(--bg2)
                );

            color: var(--text);

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }

        body.light {
            --bg: #f8fafc;
            --bg2: #e2e8f0;
            --card: rgba(255, 255, 255, 0.82);
            --border: rgba(15, 23, 42, 0.1);

            --text: #0f172a;
            --muted: #64748b;

            --shadow:
                0 20px 50px rgba(15, 23, 42, 0.12);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 20px 6%;

            border-bottom:
                1px solid var(--border);

            backdrop-filter: blur(15px);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 21px;
            font-weight: 700;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            font-weight: 900;

            box-shadow:
                0 8px 25px
                rgba(59, 130, 246, 0.3);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            border: 1px solid var(--border);

            background: var(--card);

            color: var(--text);

            padding: 9px 13px;

            border-radius: 10px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);

            background:
                rgba(59, 130, 246, 0.12);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 65vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 80px 20px 60px;
        }

        .hero-content {
            max-width: 850px;
        }

        .main-logo {
            width: 100px;
            height: 100px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 28px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #2563eb
                );

            color: white;

            font-size: 50px;
            font-weight: 900;

            box-shadow:
                0 20px 50px
                rgba(37, 99, 235, 0.35);
        }

        .hero h1 {
            font-size:
                clamp(42px, 8vw, 78px);

            line-height: 1;

            margin-bottom: 20px;

            background:
                linear-gradient(
                    90deg,
                    var(--text),
                    var(--primary2)
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .hero p {
            max-width: 650px;

            margin: 0 auto;

            color: var(--muted);

            font-size: 18px;

            line-height: 1.7;
        }

        /* =========================
           DOWNLOAD BUTTON
        ========================= */

        .download-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            margin-top: 30px;

            padding: 15px 25px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            color: white;

            font-size: 16px;
            font-weight: 700;

            box-shadow:
                0 12px 30px
                rgba(59, 130, 246, 0.28);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 18px 35px
                rgba(59, 130, 246, 0.4);
        }

        /* =========================
           MENU
        ========================= */

        .menu {
            max-width: 1100px;

            margin: 0 auto;

            padding:
                30px 20px 100px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 25px;
        }

        .menu-card {
            position: relative;

            padding: 30px;

            border-radius: 22px;

            border:
                1px solid var(--border);

            background:
                var(--card);

            backdrop-filter:
                blur(18px);

            box-shadow:
                var(--shadow);

            overflow: hidden;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease;
        }

        .menu-card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -80px;
            top: -80px;

            background:
                rgba(59, 130, 246, 0.12);

            border-radius: 50%;
        }

        .menu-card:hover {
            transform:
                translateY(-8px);

            border-color:
                rgba(59, 130, 246, 0.4);
        }

        .menu-icon {
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                rgba(59, 130, 246, 0.13);

            font-size: 28px;

            margin-bottom: 22px;
        }

        .menu-title {
            font-size: 25px;

            margin-bottom: 12px;
        }

        .menu-description {
            color: var(--muted);

            line-height: 1.6;

            font-size: 15px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            padding:
                30px 20px;

            color: var(--muted);

            border-top:
                1px solid var(--border);

            font-size: 14px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 5%;
            }

            .brand {
                font-size: 17px;
            }

            .brand-icon {
                width: 36px;
                height: 36px;
            }

            .hero {
                min-height: 55vh;

                padding-top: 60px;
            }

            .main-logo {
                width: 80px;
                height: 80px;

                font-size: 40px;
            }

            .hero p {
                font-size: 16px;
            }

            .menu {
                grid-template-columns: 1fr;

                padding-left: 15px;
                padding-right: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <a
            href="index.html"
            class="brand"
        >

            <div class="brand-icon">
                V
            </div>

            <span>
                VideoYTFX
            </span>

        </a>

        <div class="nav-actions">

            <button
                class="nav-btn"
                id="languageBtn"
                onclick="toggleLanguage()"
            >
                العربية
            </button>

            <button
                class="nav-btn"
                id="themeBtn"
                onclick="toggleTheme()"
            >
                ☀️
            </button>

        </div>

    </nav>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <div class="hero-content">

            <div class="main-logo">
                V
            </div>

            <h1>
                VideoYTFX
            </h1>

            <p id="heroDescription">
                A simple and powerful video
                downloading experience.
            </p>

            <a
                class="download-btn"
                href="https://github.com/mohammed100ried-blip/VideoYTFX/releases/latest/download/VideoYTFX.exe"
            >
                ⬇️
                <span id="downloadText">
                    Download for Windows
                </span>
            </a>

        </div>

    </section>


    <!-- =========================
         MENU CARDS
    ========================== -->

    <section class="menu">

        <!-- Downloads -->

        <a
            href="downloads.html"
            class="menu-card"
        >

            <div class="menu-icon">
                📥
            </div>

            <h2
                class="menu-title"
                id="downloadsTitle"
            >
                Downloads
            </h2>

            <p
                class="menu-description"
                id="downloadsDescription"
            >
                Download the latest version
                of VideoYTFX.
            </p>

        </a>


        <!-- A5 AI -->

        <a
            href="a5.html"
            class="menu-card"
        >

            <div class="menu-icon">
                🤖
            </div>

            <h2
                class="menu-title"
                id="youtubeTitle"
            >
                A5 AI
            </h2>

            <p
                class="menu-description"
                id="youtubeDescription"
            >
                Your intelligent AI assistant.
            </p>

        </a>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <span id="footerText">
            © 2026 VideoYTFX. All rights reserved.
        </span>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const translations = {

            en: {

                heroDescription:
                    "A simple and powerful video downloading experience.",

                downloadText:
                    "Download for Windows",

                downloadsTitle:
                    "Downloads",

                downloadsDescription:
                    "Download the latest version of VideoYTFX.",

                youtubeTitle:
                    "A5 AI",

                youtubeDescription:
                    "Your intelligent AI assistant.",

                footerText:
                    "© 2026 VideoYTFX. All rights reserved."

            },

            ar: {

                heroDescription:
                    "تجربة بسيطة وقوية لتحميل الفيديوهات.",

                downloadText:
                    "تحميل للويندوز",

                downloadsTitle:
                    "التحميلات",

                downloadsDescription:
                    "قم بتحميل أحدث إصدار من VideoYTFX.",

                youtubeTitle:
                    "A5 AI",

                youtubeDescription:
                    "مساعدك الذكي بالذكاء الاصطناعي.",

                footerText:
                    "© 2026 VideoYTFX. جميع الحقوق محفوظة."

            }

        };


        /* =========================
           LANGUAGE
        ========================== */

        function updateLanguage(language) {

            const t =
                translations[language];

            document.getElementById(
                "heroDescription"
            ).textContent =
                t.heroDescription;

            document.getElementById(
                "downloadText"
            ).textContent =
                t.downloadText;

            document.getElementById(
                "downloadsTitle"
            ).textContent =
                t.downloadsTitle;

            document.getElementById(
                "downloadsDescription"
            ).textContent =
                t.downloadsDescription;

            document.getElementById(
                "youtubeTitle"
            ).textContent =
                t.youtubeTitle;

            document.getElementById(
                "youtubeDescription"
            ).textContent =
                t.youtubeDescription;

            document.getElementById(
                "footerText"
            ).textContent =
                t.footerText;


            document.documentElement.lang =
                language;

            document.documentElement.dir =
                language === "ar"
                    ? "rtl"
                    : "ltr";


            document.getElementById(
                "languageBtn"
            ).textContent =
                language === "ar"
                    ? "English"
                    : "العربية";


            localStorage.setItem(
                "language",
                language
            );
        }


        function toggleLanguage() {

            const current =
                localStorage.getItem(
                    "language"
                ) || "en";

            const next =
                current === "en"
                    ? "ar"
                    : "en";

            updateLanguage(next);
        }


        /* =========================
           THEME
        ========================== */

        function updateTheme(theme) {

            if (theme === "light") {

                document.body.classList.add(
                    "light"
                );

                document.getElementById(
                    "themeBtn"
                ).textContent = "🌙";

            } else {

                document.body.classList.remove(
                    "light"
                );

                document.getElementById(
                    "themeBtn"
                ).textContent = "☀️";
            }

            localStorage.setItem(
                "theme",
                theme
            );
        }


        function toggleTheme() {

            const current =
                localStorage.getItem(
                    "theme"
                ) || "dark";

            const next =
                current === "dark"
                    ? "light"
                    : "dark";

            updateTheme(next);
        }


        /* =========================
           INITIALIZE
        ========================== */

        const savedLanguage =
            localStorage.getItem(
                "language"
            ) || "en";

        const savedTheme =
            localStorage.getItem(
                "theme"
            ) || "dark";


        updateLanguage(
            savedLanguage
        );

        updateTheme(
            savedTheme
        );

    </script>

</body>

</html>
