<style>
:root {
color-scheme: dark;
--bg: #030308;
--surface: rgba(13, 16, 28, .88);
--surface-hover: #171c2d;
--border: rgba(255, 255, 255, .09);
--text: #f8fafc;
--muted: #94a3b8;
--blue: #1677ff;
--red: #ff1744;
--purple: #713cff;
--radius: 22px;
--shadow: 0 20px 55px rgba(0, 0, 0, .22);
}

[data-theme="light"] {
color-scheme: light;
--bg: #f1f4fa;
--surface: rgba(255, 255, 255, .9);
--surface-hover: #fff;
--border: rgba(15, 23, 42, .12);
--text: #111827;
--muted: #64748b;
--shadow: 0 20px 55px rgba(31, 50, 80, .1);
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html {
min-height: 100%;
scroll-behavior: smooth;
}

body {
position: relative;
min-height: 100vh;
overflow-x: hidden;
background: var(--bg);
color: var(--text);
font-family: "Plus Jakarta Sans", sans-serif;
transition: background .4s, color .4s;
}

html[dir="rtl"] body {
font-family: "Tajawal", sans-serif;
}

button, a {
font: inherit;
}

a {
color: inherit;
text-decoration: none;
}

button {
color: inherit;
}

/* Background glow */

.background-glow {
position: fixed;
z-index: -2;
width: 430px;
height: 430px;
border-radius: 50%;
filter: blur(130px);
opacity: .22;
pointer-events: none;
animation: backgroundFloat 12s ease-in-out infinite alternate;
}

.glow-one {
top: -180px;
left: -130px;
background: var(--blue);
}

.glow-two {
top: 30%;
right: -200px;
background: var(--red);
animation-delay: -4s;
}

.glow-three {
bottom: -220px;
left: 25%;
background: var(--purple);
animation-delay: -7s;
}

@keyframes backgroundFloat {
from { transform: translate(0, 0) scale(1); }
to { transform: translate(65px, 40px) scale(1.2); }
}

/* Floating particles */

.particles {
position: fixed;
z-index: -1;
inset: 0;
overflow: hidden;
pointer-events: none;
}

.particles span {
position: absolute;
bottom: -20px;
width: 3px;
height: 3px;
border-radius: 50%;
background: var(--blue);
box-shadow: 0 0 12px currentColor;
animation: particleUp linear infinite;
}

.particles span:nth-child(1) { left: 10%; animation-duration: 12s; }
.particles span:nth-child(2) { left: 25%; animation-duration: 17s; animation-delay: 2s; color: var(--red); }
.particles span:nth-child(3) { left: 40%; animation-duration: 14s; animation-delay: 4s; }
.particles span:nth-child(4) { left: 60%; animation-duration: 18s; animation-delay: 1s; color: var(--red); }
.particles span:nth-child(5) { left: 75%; animation-duration: 13s; animation-delay: 3s; }
.particles span:nth-child(6) { left: 90%; animation-duration: 16s; animation-delay: 5s; color: var(--red); }

@keyframes particleUp {
0% { transform: translateY(0); opacity: 0; }
20% { opacity: .8; }
100% { transform: translateY(-110vh); opacity: 0; }
}

/* Cinematic intro */

.intro-screen {
position: fixed;
z-index: 1000;
inset: 0;
display: grid;
place-items: center;
overflow: hidden;
isolation: isolate;
background:
linear-gradient(180deg, rgba(3, 5, 12, .12), rgba(3, 5, 12, .46) 58%, #030308 100%),
radial-gradient(ellipse at 50% 55%, rgba(255, 125, 76, .32), transparent 31%),
linear-gradient(180deg, #121b2b 0%, #39465b 32%, #c66e62 69%, #11131d 100%);
transition: opacity .9s ease, visibility .9s ease;
}

.intro-screen::before {
content: "";
position: absolute;
z-index: 2;
inset: 0;
pointer-events: none;
background:
radial-gradient(ellipse at center, transparent 22%, rgba(0, 0, 0, .5) 100%),
linear-gradient(180deg, rgba(0, 0, 0, .24), transparent 30%, rgba(0, 0, 0, .4));
}

.intro-screen.finished {
opacity: 0;
visibility: hidden;
pointer-events: none;
}

.intro-sun {
position: absolute;
top: 31%;
left: 50%;
z-index: 0;
width: min(30vw, 330px);
aspect-ratio: 1;
border-radius: 50%;
transform: translateX(-50%);
background: radial-gradient(circle, #ffe7bd 0%, #ffae7d 44%, rgba(255, 123, 91, .12) 71%, transparent 73%);
filter: blur(.5px);
box-shadow: 0 0 110px rgba(255, 139, 97, .35);
animation: sunRise 5.6s ease both;
}

.intro-haze {
position: absolute;
z-index: 1;
inset: 18% -20% 15%;
background:
radial-gradient(ellipse at 25% 75%, rgba(255, 166, 115, .2), transparent 45%),
radial-gradient(ellipse at 75% 76%, rgba(66, 113, 176, .25), transparent 40%);
filter: blur(24px);
animation: hazeDrift 8s ease-in-out infinite alternate;
}

.city {
position: absolute;
z-index: 1;
right: 0;
bottom: 0;
left: 0;
height: 43%;
display: flex;
align-items: end;
justify-content: space-around;
background: linear-gradient(180deg, transparent, rgba(3, 5, 11, .3) 22%, #070a11 92%);
}

.building {
position: relative;
width: clamp(34px, 8vw, 115px);
height: var(--height);
flex: 0 1 auto;
border-top: 1px solid rgba(255, 207, 154, .3);
background:
repeating-linear-gradient(90deg, transparent 0 12px, rgba(255, 194, 126, .2) 13px 15px, transparent 16px 24px),
repeating-linear-gradient(0deg, #111722 0 17px, #202938 18px 20px);
box-shadow: inset 0 0 22px #050810, 0 -5px 20px rgba(0, 0, 0, .2);
}

.building::after {
content: "";
position: absolute;
inset: 0;
background: linear-gradient(90deg, rgba(0, 0, 0, .26), transparent 38%, rgba(0, 0, 0, .28));
}

.rooftop-lines {
position: absolute;
z-index: 2;
right: -10%;
bottom: -22%;
left: -10%;
height: 34%;
transform: perspective(300px) rotateX(25deg);
transform-origin: top;
opacity: .6;
background:
linear-gradient(180deg, transparent, #080a10 45%),
repeating-linear-gradient(90deg, transparent 0 8%, rgba(246, 151, 103, .15) 8.1% 8.3%, transparent 8.4% 16%);
}

.intro-content {
position: relative;
z-index: 4;
width: min(1000px, 94%);
padding: 24px;
text-align: center;
transform: translateY(-4vh);
}

.intro-logo {
display: flex;
justify-content: center;
align-items: center;
direction: ltr;
white-space: nowrap;
filter: drop-shadow(0 12px 22px rgba(0, 0, 0, .7));
}

.intro-logo span {
display: inline-block;
color: #fff7e9;
font-family: Impact, "Arial Black", sans-serif;
font-size: clamp(40px, 10vw, 112px);
font-weight: 900;
line-height: 1;
letter-spacing: clamp(0px, .3vw, 3px);
-webkit-text-stroke: 1px rgba(35, 22, 20, .45);
text-shadow:
2px 3px 0 #884238,
4px 7px 0 rgba(14, 10, 13, .6),
0 0 30px rgba(255, 189, 137, .36);
opacity: 0;
transform: translateY(30px) scale(.9);
animation: titleLetter .6s cubic-bezier(.2, .8, .2, 1) forwards;
animation-delay: calc(var(--i) * .065s + .25s);
}

.intro-subtitle {
margin-top: 20px;
color: #ffe4c8;
font-size: clamp(10px, 1.5vw, 14px);
font-weight: 700;
letter-spacing: clamp(3px, .8vw, 8px);
text-shadow: 0 3px 15px #000;
opacity: 0;
animation: subtitleReveal .8s ease 1s forwards;
}

.intro-line {
width: 0;
height: 2px;
margin: 20px auto 0;
background: linear-gradient(90deg, transparent, #ffd2a2, transparent);
box-shadow: 0 0 20px rgba(255, 181, 126, .8);
animation: lineReveal .9s ease 1.12s forwards;
}

.skip-intro {
position: absolute;
z-index: 5;
right: 22px;
bottom: 20px;
padding: 10px 15px;
border: 1px solid rgba(255, 255, 255, .35);
border-radius: 12px;
background: rgba(6, 9, 16, .58);
color: #fff;
cursor: pointer;
backdrop-filter: blur(10px);
transition: .2s;
}

html[dir="rtl"] .skip-intro {
right: auto;
left: 22px;
}

.skip-intro:hover {
background: rgba(255, 255, 255, .16);
transform: translateY(-2px);
}

@keyframes sunRise {
from { opacity: .35; transform: translate(-50%, 18px) scale(.9); }
to { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

@keyframes hazeDrift {
from { transform: translateX(-2%) scale(1); }
to { transform: translateX(2%) scale(1.08); }
}

@keyframes titleLetter {
to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes subtitleReveal {
to { opacity: .96; }
}

@keyframes lineReveal {
to { width: min(360px, 65vw); }
}

/* Navigation */

.navbar {
position: sticky;
top: 0;
z-index: 20;
display: flex;
justify-content: space-between;
align-items: center;
gap: 16px;
padding: 16px 7%;
border-bottom: 1px solid var(--border);
background: var(--surface);
backdrop-filter: blur(22px);
}

.brand {
color: transparent;
font-size: 1.35rem;
font-weight: 800;
letter-spacing: -.5px;
background: linear-gradient(110deg, var(--text), var(--blue), var(--red));
background-clip: text;
-webkit-background-clip: text;
transition: .3s;
}

.brand:hover {
filter: drop-shadow(0 0 12px var(--blue));
}

.nav-actions {
display: flex;
gap: 10px;
}

.btn-ui {
display: inline-flex;
justify-content: center;
align-items: center;
gap: 8px;
padding: 10px 16px;
border: 1px solid var(--border);
border-radius: 13px;
background: var(--surface);
color: var(--text);
cursor: pointer;
transition: .25s;
}

.btn-ui:hover {
transform: translateY(-3px);
border-color: var(--blue);
box-shadow: 0 0 20px rgba(22, 119, 255, .2);
}

/* Main interface reveal after intro */

.reveal {
opacity: 0;
transform: translateY(28px);
filter: blur(6px);
}

body.intro-finished .reveal {
animation: interfaceReveal .8s ease forwards;
}

body.intro-finished .navbar { animation-delay: .08s; }
body.intro-finished .hero-content { animation-delay: .18s; }
body.intro-finished .card:nth-child(1) { animation-delay: .28s; }
body.intro-finished .card:nth-child(2) { animation-delay: .4s; }
body.intro-finished .card:nth-child(3) { animation-delay: .52s; }
body.intro-finished .card:nth-child(4) { animation-delay: .64s; }

@keyframes interfaceReveal {
to {
opacity: 1;
transform: translateY(0);
filter: blur(0);
}
}

/* Hero */

.hero {
position: relative;
display: grid;
place-items: center;
min-height: 48vh;
padding: 80px 20px 50px;
text-align: center;
}

.hero-content {
max-width: 850px;
}

.hero h1 {
margin-bottom: 30px;
color: transparent;
font-size: clamp(3rem, 8vw, 6rem);
font-weight: 800;
letter-spacing: -3px;
line-height: 1.12;
background: linear-gradient(110deg, #fff, #1677ff, #ff1744, #fff);
background-size: 300% 300%;
background-clip: text;
-webkit-background-clip: text;
filter: drop-shadow(0 0 20px rgba(22, 119, 255, .3));
animation: gradientMove 5s ease infinite;
}

@keyframes gradientMove {
0%, 100% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
}

.hero-description {
max-width: 620px;
margin: -12px auto 28px;
color: var(--muted);
font-size: clamp(.95rem, 2vw, 1.08rem);
line-height: 1.8;
}

/* CTA buttons */

.cta-group {
display: flex;
justify-content: center;
align-items: center;
flex-wrap: wrap;
gap: 16px;
}

.btn-primary, .btn-secondary {
position: relative;
isolation: isolate;
display: inline-flex;
justify-content: center;
align-items: center;
min-width: 175px;
padding: 15px 26px;
border: 1px solid transparent;
border-radius: 14px;
color: white;
font-weight: 800;
transition: .3s;
}

.btn-primary {
border-color: rgba(255, 23, 68, .6);
background: linear-gradient(120deg, #e60035, #ff1744);
}

.btn-secondary {
border-color: rgba(22, 119, 255, .6);
background: linear-gradient(120deg, #0759c9, #1677ff);
}

.btn-primary:hover, .btn-secondary:hover {
transform: translateY(-5px) scale(1.04);
}

.btn-primary:hover { box-shadow: 0 0 35px rgba(255, 23, 68, .4); }
.btn-secondary:hover { box-shadow: 0 0 35px rgba(22, 119, 255, .4); }

/* Feature cards */

.features {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
gap: 22px;
max-width: 1140px;
margin: 0 auto;
padding: 25px 20px 90px;
}

.card {
--accent: var(--blue);
position: relative;
isolation: isolate;
display: flex;
flex-direction: column;
justify-content: center;
min-height: 225px;
padding: 30px;
overflow: hidden;
border: 1px solid var(--border);
border-radius: var(--radius);
background: var(--surface);
backdrop-filter: blur(18px);
transition: transform .35s, border-color .35s, box-shadow .35s;
}

.card:nth-child(1) { --accent: #ff1744; }
.image-card { --accent: #1677ff; }
.video-card { --accent: #ff365e; }

.gesture-card {
--accent: #378dff;
background:
radial-gradient(ellipse at 100% 0%, rgba(22, 119, 255, .13), transparent 55%),
radial-gradient(ellipse at 0% 100%, rgba(255, 23, 68, .12), transparent 60%),
var(--surface);
}

.card::before, .card::after {
content: "";
position: absolute;
z-index: -1;
inset: -12px;
border-radius: inherit;
pointer-events: none;
filter: blur(25px);
opacity: .35;
background:
radial-gradient(ellipse at 10% 50%, color-mix(in srgb, var(--accent) 65%, transparent), transparent 56%),
radial-gradient(ellipse at 90% 50%, color-mix(in srgb, var(--blue) 60%, transparent), transparent 56%);
animation: cardGlow 4s ease-in-out infinite;
}

.card::after {
inset: -7px;
opacity: .18;
filter: blur(18px);
animation: cardGlow 5s ease-in-out infinite alternate-reverse;
}

@keyframes cardGlow {
0%, 100% { transform: scale(.92) translateY(0); opacity: .25; }
50% { transform: scale(1.08) translateY(-5px); opacity: .65; }
}

.card:hover {
transform: translateY(-9px) scale(1.02);
border-color: var(--accent);
box-shadow:
0 20px 50px rgba(0, 0, 0, .25),
0 0 30px color-mix(in srgb, var(--accent) 25%, transparent);
}

.card-number {
margin-bottom: 22px;
color: var(--accent);
font-size: 2.2rem;
font-weight: 800;
letter-spacing: 3px;
text-shadow: 0 0 22px color-mix(in srgb, var(--accent) 50%, transparent);
transition: .3s;
}

.card:hover .card-number {
letter-spacing: 7px;
transform: translateY(-3px);
}

.card h3 {
position: relative;
z-index: 1;
color: var(--text);
font-size: 1.45rem;
font-weight: 800;
letter-spacing: -.5px;
transition: .3s;
}

.card:hover h3 {
color: var(--accent);
transform: translateX(5px);
}

html[dir="rtl"] .card:hover h3 {
transform: translateX(-5px);
}

.gesture-orb {
position: absolute;
right: 25px;
bottom: 30px;
width: 100px;
height: 100px;
border: 1px solid rgba(22, 119, 255, .35);
border-radius: 50%;
opacity: .65;
pointer-events: none;
animation: orbitPulse 3.5s ease-in-out infinite;
}

.gesture-orb::before, .gesture-orb::after {
content: "";
position: absolute;
inset: 12px;
border: 1px solid rgba(255, 23, 68, .4);
border-radius: 50%;
}

.gesture-orb::after {
inset: 25px;
border-color: rgba(22, 119, 255, .5);
}

html[dir="rtl"] .gesture-orb {
right: auto;
left: 25px;
}

@keyframes orbitPulse {
0%, 100% { transform: scale(.92) rotate(0deg); opacity: .4; }
50% { transform: scale(1.1) rotate(35deg); opacity: 1; }
}

/* Footer */

footer {
padding: 25px 20px;
border-top: 1px solid var(--border);
background: var(--surface);
color: var(--muted);
text-align: center;
font-size: .88rem;
}

/* Responsive layout */

@media (max-width: 640px) {
.navbar { padding: 12px 4%; }
.brand { font-size: 1.05rem; }
.nav-actions { gap: 6px; }
.btn-ui { padding: 8px 10px; font-size: .84rem; }
.hero { min-height: auto; padding: 70px 18px 40px; }
.hero h1 { font-size: clamp(2.8rem, 13vw, 4rem); letter-spacing: -1.5px; }
.cta-group { flex-direction: column; width: 100%; }
.btn-primary, .btn-secondary { width: 100%; }
.features { grid-template-columns: 1fr; padding: 15px 18px 60px; }
.card { min-height: 190px; }
.gesture-orb { width: 78px; height: 78px; right: 18px; bottom: 25px; }
html[dir="rtl"] .gesture-orb { right: auto; left: 18px; }
.intro-content { transform: translateY(-2vh); }
.skip-intro { right: 14px; bottom: 14px; }
html[dir="rtl"] .skip-intro { right: auto; left: 14px; }
}

/* Accessibility: reduced motion */

@media (prefers-reduced-motion: reduce) {
*, *::before, *::after {
scroll-behavior: auto !important;
animation-duration: .01ms !important;
animation-iteration-count: 1 !important;
transition-duration: .01ms !important;
}

.reveal {
opacity: 1;
transform: none;
filter: none;
}
}
</style>
</head>

<span data-en=" 2026 VideoYTFX" data-ar=" 2026 VideoYTFX"> 2026 VideoYTFX</span>
</footer>

<script>
"use strict";

const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const intro = document.getElementById("introScreen");
let introTimer = null;

function readPreference(key, fallback) {
try {
return localStorage.getItem(key) || fallback;
} catch {
return fallback;
}
}

function savePreference(key, value) {
try {
localStorage.setItem(key, value);
} catch {
// Storage may be disabled; the page still works without it.
}
}

function setLanguage(language) {
const selectedLanguage = language === "ar" ? "ar" : "en";

document.documentElement.lang = selectedLanguage;
document.documentElement.dir = selectedLanguage === "ar" ? "rtl" : "ltr";

document.querySelectorAll("[data-en][data-ar]").forEach(element => {
element.textContent = element.dataset[selectedLanguage];
});

document.getElementById("langLabel").textContent =
selectedLanguage === "en" ? "" : "English";

savePreference("app_lang", selectedLanguage);
}

function toggleLanguage() {
const currentLanguage = document.documentElement.lang;
setLanguage(currentLanguage === "en" ? "ar" : "en");
}

function setTheme(theme) {
const selectedTheme = theme === "light" ? "light" : "dark";

document.documentElement.dataset.theme = selectedTheme;

document.getElementById("themeLabel").textContent =
selectedTheme === "light" ? "Dark" : "Light";

document.querySelector('meta[name="theme-color"]').content =
selectedTheme === "light" ? "#f1f4fa" : "#030308";

savePreference("app_theme", selectedTheme);
}

function toggleTheme() {
const currentTheme = document.documentElement.dataset.theme;
setTheme(currentTheme === "dark" ? "light" : "dark");
}

function finishIntro() {
if (!intro || intro.classList.contains("finished")) return;

intro.classList.add("finished");
document.body.classList.add("intro-finished");

if (introTimer) {
clearTimeout(introTimer);
introTimer = null;
}

window.setTimeout(() => {
intro.remove();
}, 950);
}

function createAnimatedLogo() {
const logo = document.getElementById("introLogo");
const text = "VideoYTFX";

[...text].forEach((character, index) => {
const letter = document.createElement("span");
letter.textContent = character;
letter.style.setProperty("--i", String(index));
logo.appendChild(letter);
});
}

document.getElementById("languageBtn").addEventListener("click", toggleLanguage);
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("skipIntro").addEventListener("click", finishIntro);

createAnimatedLogo();

setLanguage(readPreference("app_lang", "en"));
setTheme(readPreference("app_theme", "dark"));

if (reducedMotion) {
finishIntro();
} else {
introTimer = window.setTimeout(finishIntro, 5600);
}
</script>

</body>
</html>
