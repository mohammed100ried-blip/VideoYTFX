<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Downloader - VideoYTFX</title>

    <style>
        :root {
            --bg: #070b14;
            --card: rgba(18, 25, 40, 0.88);
            --card2: #101827;
            --text: #ffffff;
            --muted: #9da9bd;
            --border: #26334d;
            --input: #0b1220;
            --primary: #1877f2;
            --primary-hover: #2685ff;
            --danger: #ff4d5a;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        body.light {
            --bg: #f3f6fb;
            --card: rgba(255, 255, 255, 0.92);
            --card2: #ffffff;
            --text: #111827;
            --muted: #667085;
            --border: #dce2ec;
            --input: #f7f9fc;
            --primary: #1769e0;
            --primary-hover: #0f5dcc;
            --shadow: rgba(30, 50, 80, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(24, 119, 242, 0.20), transparent 35%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* NAVBAR */

        nav {
            width: 100%;
            padding: 18px 30px;
            border-bottom: 1px solid var(--border);
            background: rgba(7, 11, 20, 0.55);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        body.light nav {
            background: rgba(255, 255, 255, 0.75);
        }

        .nav-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 21px;
            font-weight: bold;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .settings {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .setting-btn {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            padding: 9px 13px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .setting-btn:hover {
            border-color: var(--primary);
        }

        /* MAIN */

        .container {
            width: 100%;
            max-width: 950px;
            margin: auto;
            padding: 70px 20px;
        }

        .hero {
            text-align: center;
        }

        .youtube-icon {
            width: 86px;
            height: 60px;
            margin: 0 auto 25px;
            border-radius: 18px;
            background: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 45px rgba(255, 0, 0, 0.25);
        }

        .youtube-icon::after {
            content: "";
            width: 0;
            height: 0;
            border-top: 11px solid transparent;
            border-bottom: 11px solid transparent;
            border-left: 17px solid white;
            margin-left: 4px;
        }

        h1 {
            font-size: clamp(34px, 6vw, 58px);
            margin-bottom: 14px;
            letter-spacing: -1px;
        }

        .hero-text {
            color: var(--muted);
            max-width: 650px;
            margin: auto;
            line-height: 1.7;
            font-size: 17px;
        }

        /* DOWNLOAD CARD */

        .download-card {
            margin-top: 45px;
            padding: 30px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 25px 70px var(--shadow);
            backdrop-filter: blur(15px);
        }

        .url-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .url-row {
            display: flex;
            gap: 10px;
        }

        .url-input {
            flex: 1;
            min-width: 0;
            padding: 16px;
            border-radius: 13px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        .url-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.12);
        }

        .paste-btn {
            padding: 0 20px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--card2);
            color: var(--text);
            cursor: pointer;
            font-weight: bold;
        }

        .paste-btn:hover {
            border-color: var(--primary);
        }

        /* OPTIONS */

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .option-box {
            border: 1px solid var(--border);
            background: var(--card2);
            border-radius: 15px;
            padding: 18px;
        }

        .option-box label {
            display: block;
            margin-bottom: 9px;
            color: var(--muted);
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            outline: none;
            font-size: 15px;
        }

        /* DOWNLOAD BUTTON */

        .download-btn {
            width: 100%;
            margin-top: 20px;
            padding: 17px;
            border: none;
            border-radius: 13px;
            background: var(--primary);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* STATUS */

        .status {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: var(--input);
            color: var(--muted);
            text-align: center;
        }

        .status.show {
            display: block;
        }

        /* FEATURES */

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .feature {
            padding: 22px;
            text-align: center;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 17px;
        }

        .feature-icon {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .feature h3 {
            margin-bottom: 7px;
        }

        .feature p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 35px auto 0;
            color: var(--muted);
            text-decoration: none;
        }

        .back:hover {
            color: var(--text);
        }

        footer {
            text-align: center;
            color: var(--muted);
            padding: 25px;
            border-top: 1px solid var(--border);
            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            nav {
                padding: 15px;
            }

            .nav-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            .settings {
                width: 100%;
            }

            .setting-btn {
                flex: 1;
            }

            .container {
                padding: 45px 15px;
            }

            .download-card {
                padding: 20px;
            }

            .url-row {
                flex-direction: column;
            }

            .paste-btn {
                padding: 13px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>
        <div class="nav-inner">

            <div class="brand">
                <div class="brand-icon">V</div>
                <span>VideoYTFX</span>
            </div>

            <div class="settings">

                <button class="setting-btn" onclick="changeLanguage()">
                    🌐 <span id="languageButton">English</span>
                </button>

                <button class="setting-btn" onclick="toggleTheme()">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText">Dark</span>
                </button>

            </div>

        </div>
    </nav>


    <!-- MAIN -->

    <main class="container">

        <section class="hero">

            <div class="youtube-icon"></div>

            <h1 id="title">
                YouTube Downloader
            </h1>

            <p class="hero-text" id="description">
                Download YouTube videos and audio with a simple,
                fast and modern interface.
            </p>

        </section>


        <!-- DOWNLOAD BOX -->

        <section class="download-card">

            <label class="url-label" id="urlLabel">
                YouTube URL
            </label>

            <div class="url-row">

                <input
                    id="url"
                    class="url-input"
                    type="text"
                    placeholder="Paste YouTube link here..."
                >

                <button class="paste-btn" onclick="pasteURL()" id="pasteButton">
                    Paste
                </button>

            </div>


            <div class="options">

                <div class="option-box">

                    <label id="typeLabel">
                        Download type
                    </label>

                    <select id="type">
                        <option value="video" id="videoOption">
                            🎥 Video
                        </option>

                        <option value="audio" id="audioOption">
                            🎵 Audio
                        </option>
                    </select>

                </div>


                <div class="option-box">

                    <label id="qualityLabel">
                        Quality
                    </label>

                    <select id="quality">

                        <option>Best Quality</option>
                        <option>1080p</option>
                        <option>720p</option>
                        <option>480p</option>
                        <option>360p</option>

                    </select>

                </div>

            </div>


            <button class="download-btn" onclick="startDownload()" id="downloadButton">
                ⬇️ Download
            </button>


            <div class="status" id="status"></div>

        </section>


        <!-- FEATURES -->

        <section class="features">

            <div class="feature">

                <div class="feature-icon">⚡</div>

                <h3 id="fastTitle">
                    Fast
                </h3>

                <p id="fastText">
                    Simple and fast downloading interface.
                </p>

            </div>


            <div class="feature">

                <div class="feature-icon">🎬</div>

                <h3 id="qualityTitle">
                    High Quality
                </h3>

                <p id="qualityText">
                    Choose the quality that fits your needs.
                </p>

            </div>


            <div class="feature">

                <div class="feature-icon">🎵</div>

                <h3 id="audioTitle">
                    Audio
                </h3>

                <p id="audioText">
                    Download audio when you need it.
                </p>

            </div>

        </section>


        <a href="index.html" class="back" id="backButton">
            ← Back to Home
        </a>

    </main>


    <footer>
        © 2026 VideoYTFX
    </footer>


    <script>

        /* =========================
           LANGUAGE
        ========================= */

        let arabic = localStorage.getItem("language") === "ar";

        function updateLanguage() {

            const html = document.documentElement;

            if (arabic) {

                html.lang = "ar";
                html.dir = "rtl";

                document.getElementById("languageButton").textContent = "العربية";

                document.getElementById("themeText").textContent =
                    document.body.classList.contains("light")
                        ? "مضيء"
                        : "مظلم";

                document.getElementById("title").textContent =
                    "تحميل فيديوهات YouTube";

                document.getElementById("description").textContent =
                    "قم بتحميل فيديوهات YouTube والصوت بسهولة من خلال واجهة سريعة وعصرية.";

                document.getElementById("urlLabel").textContent =
                    "رابط YouTube";

                document.getElementById("url").placeholder =
                    "ضع رابط YouTube هنا...";

                document.getElementById("pasteButton").textContent =
                    "لصق";

                document.getElementById("typeLabel").textContent =
                    "نوع التحميل";

                document.getElementById("videoOption").textContent =
                    "🎥 فيديو";

                document.getElementById("audioOption").textContent =
                    "🎵 صوت";

                document.getElementById("qualityLabel").textContent =
                    "الجودة";

                document.getElementById("quality").options[0].text =
                    "أفضل جودة";

                document.getElementById("downloadButton").textContent =
                    "⬇️ تحميل";

                document.getElementById("fastTitle").textContent =
                    "سريع";

                document.getElementById("fastText").textContent =
                    "واجهة بسيطة وسريعة للتحميل.";

                document.getElementById("qualityTitle").textContent =
                    "جودة عالية";

                document.getElementById("qualityText").textContent =
                    "اختر الجودة التي تناسبك.";

                document.getElementById("audioTitle").textContent =
                    "صوت";

                document.getElementById("audioText").textContent =
                    "تحميل الصوت عندما تحتاج إليه.";

                document.getElementById("backButton").textContent =
                    "→ العودة للرئيسية";

            } else {

                html.lang = "en";
                html.dir = "ltr";

                document.getElementById("languageButton").textContent =
                    "English";

                document.getElementById("themeText").textContent =
                    document.body.classList.contains("light")
                        ? "Light"
                        : "Dark";

                document.getElementById("title").textContent =
                    "YouTube Downloader";

                document.getElementById("description").textContent =
                    "Download YouTube videos and audio with a simple, fast and modern interface.";

                document.getElementById("urlLabel").textContent =
                    "YouTube URL";

                document.getElementById("url").placeholder =
                    "Paste YouTube link here...";

                document.getElementById("pasteButton").textContent =
                    "Paste";

                document.getElementById("typeLabel").textContent =
                    "Download type";

                document.getElementById("videoOption").textContent =
                    "🎥 Video";

                document.getElementById("audioOption").textContent =
                    "🎵 Audio";

                document.getElementById("qualityLabel").textContent =
                    "Quality";

                document.getElementById("quality").options[0].text =
                    "Best Quality";

                document.getElementById("downloadButton").textContent =
                    "⬇️ Download";

                document.getElementById("fastTitle").textContent =
                    "Fast";

                document.getElementById("fastText").textContent =
                    "Simple and fast downloading interface.";

                document.getElementById("qualityTitle").textContent =
                    "High Quality";

                document.getElementById("qualityText").textContent =
                    "Choose the quality that fits your needs.";

                document.getElementById("audioTitle").textContent =
                    "Audio";

                document.getElementById("audioText").textContent =
                    "Download audio when you need it.";

                document.getElementById("backButton").textContent =
                    "← Back to Home";
            }
        }


        function changeLanguage() {

            arabic = !arabic;

            localStorage.setItem(
                "language",
                arabic ? "ar" : "en"
            );

            updateLanguage();
        }


        /* =========================
           THEME
        ========================= */

        let lightMode = localStorage.getItem("theme") === "light";

        function updateTheme() {

            const icon = document.getElementById("themeIcon");

            document.body.classList.toggle(
                "light",
                lightMode
            );

            if (lightMode) {

                icon.textContent = "☀️";

            } else {

                icon.textContent = "🌙";
            }

            updateLanguage();
        }


        function toggleTheme() {

            lightMode = !lightMode;

            localStorage.setItem(
                "theme",
                lightMode ? "light" : "dark"
            );

            updateTheme();
        }


        /* =========================
           PASTE
        ========================= */

        async function pasteURL() {

            try {

                const text = await navigator.clipboard.readText();

                document.getElementById("url").value = text;

            } catch {

                showStatus(
                    arabic
                        ? "لا يمكن الوصول إلى الحافظة."
                        : "Clipboard access is not available."
                );
            }
        }


        /* =========================
           DOWNLOAD
        ========================= */

        function startDownload() {

            const url = document.getElementById("url").value.trim();

            if (!url) {

                showStatus(
                    arabic
                        ? "يرجى إدخال رابط YouTube أولًا."
                        : "Please enter a YouTube URL first."
                );

                return;
            }

            showStatus(
                arabic
                    ? "سيتم ربط التحميل الحقيقي بالسيرفر لاحقًا."
                    : "The real downloader backend will be connected later."
            );
        }


        function showStatus(message) {

            const status =
                document.getElementById("status");

            status.textContent = message;

            status.classList.add("show");
        }


        /* =========================
           START
        ========================= */

        updateTheme();

    </script>

</body>
</html>
