<!-- استبدل قسم إعدادات التتبّع بهذا القسم -->
<section class="panel">
  <div class="panel-head">
    <h3>إعدادات التتبّع</h3>
  </div>

  <div class="settings">
    <div class="setting">
      <label>مسافة السحب المطلوبة</label>
      <div class="button-control">
        <button class="btn secondary" id="thresholdMinus">−</button>
        <output id="thresholdOut">0.10</output>
        <button class="btn secondary" id="thresholdPlus">+</button>
      </div>
    </div>

    <div class="setting">
      <label>تنعيم الحركة</label>
      <div class="button-control">
        <button class="btn secondary" id="smoothMinus">−</button>
        <output id="smoothOut">متوسط</output>
        <button class="btn secondary" id="smoothPlus">+</button>
      </div>
    </div>
  </div>
</section>

<!-- استبدل قسم الإحصاءات بهذا القسم -->
<section class="panel">
  <div class="panel-head">
    <h3>الإحصاءات</h3>
    <span class="muted">الجلسة الحالية</span>
  </div>

  <div class="stat-grid">
    <div class="stat">
      <div class="stat-label">إجمالي الإيماءات</div>
      <div class="stat-value" id="total">0</div>
      <div class="stat-sub">عدد الحركات المكتشفة</div>
    </div>

    <div class="stat">
      <div class="stat-label">آخر اتجاه</div>
      <div class="stat-value" id="lastDirection">—</div>
      <div class="stat-sub">آخر حركة مكتشفة</div>
    </div>
  </div>

  <div class="history" id="gestureCounts">
    <div class="history-item"><span>👉 اليمين</span><strong id="countRight">0</strong></div>
    <div class="history-item"><span>👈 اليسار</span><strong id="countLeft">0</strong></div>
    <div class="history-item"><span>👆 الأعلى</span><strong id="countUp">0</strong></div>
    <div class="history-item"><span>👇 الأسفل</span><strong id="countDown">0</strong></div>
  </div>

  <div class="controls">
    <button class="btn primary" id="saveBtn">💾 حفظ الإحصاءات</button>
    <button class="btn secondary" id="resetBtn">↻ تصفير الإحصاءات</button>
  </div>
</section>

<style>
.button-control {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}

.button-control output {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  color: var(--cyan);
}

.button-control button {
  min-height: 44px;
  font-size: 22px;
}

#saveBtn {
  background: linear-gradient(120deg, #168f70, #35c99b);
  color: white;
}

.history-item strong {
  color: var(--cyan);
  font-size: 17px;
}
</style>

<script>
/* أضف هذا الكود داخل سكربت الموقع الحالي،
   واستبدل مستمعَي threshold و smooth القديمين به. */

let thresholdValue = 0.10;
let smoothValue = 3;

const gestureCounts = {
  right: 0,
  left: 0,
  up: 0,
  down: 0
};

function updateThreshold() {
  thresholdValue = Math.max(0.04, Math.min(0.25, thresholdValue));
  thresholdValue = Math.round(thresholdValue * 100) / 100;

  $("thresholdOut").value = thresholdValue.toFixed(2);
  $("sensitivity").textContent =
    thresholdValue < 0.08 ? "عالية" :
    thresholdValue > 0.16 ? "منخفضة" : "متوسطة";

  $("threshold").value = thresholdValue;
}

function updateSmooth() {
  smoothValue = Math.max(1, Math.min(6, smoothValue));
  $("smoothOut").value =
    smoothValue <= 2 ? "خفيف" :
    smoothValue >= 5 ? "قوي" : "متوسط";

  $("smooth").value = smoothValue;
}

$("thresholdMinus").addEventListener("click", () => {
  thresholdValue -= 0.01;
  updateThreshold();
});

$("thresholdPlus").addEventListener("click", () => {
  thresholdValue += 0.01;
  updateThreshold();
});

$("smoothMinus").addEventListener("click", () => {
  smoothValue--;
  updateSmooth();
});

$("smoothPlus").addEventListener("click", () => {
  smoothValue++;
  updateSmooth();
});

/* في onResults، استمر باستخدام هاتين القيمتين:
   const smoothValue = Number($("smooth").value);
   const threshold = Number($("threshold").value);
   سيظل الكود يعمل مع تحديث قيم الحقول أعلاه. */

/* استبدل triggerGesture القديمة بهذه النسخة. */
function triggerGesture(direction) {
  lastGestureAt = performance.now();

  const gesture = gestures[direction];
  if (!gesture) return;

  total++;
  gestureCounts[direction]++;

  $("total").textContent = total;
  $("lastDirection").textContent = gesture.emoji;
  $("gestureEmoji").textContent = gesture.emoji;
  $("gestureName").textContent = gesture.name;
  $("gestureDesc").textContent = gesture.desc;
  $("screenLabel").textContent = gesture.name;

  const countElement = {
    right: "countRight",
    left: "countLeft",
    up: "countUp",
    down: "countDown"
  }[direction];

  $(countElement).textContent = gestureCounts[direction];

  historyItems.unshift({
    direction,
    time: new Date().toLocaleTimeString("ar", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    })
  });

  historyItems = historyItems.slice(0, 8);
  renderHistory();
}

/* زر حفظ الإحصاءات في ملف JSON. */
$("saveBtn").addEventListener("click", () => {
  const report = {
    application: "Gesture AI",
    savedAt: new Date().toLocaleString("ar"),
    totalGestures: total,
    counts: {
      right: gestureCounts.right,
      left: gestureCounts.left,
      up: gestureCounts.up,
      down: gestureCounts.down
    },
    history: historyItems
  };

  const blob = new Blob(
    [JSON.stringify(report, null, 2)],
    { type: "application/json;charset=utf-8" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "Gesture-AI-Statistics.json";
  link.click();

  URL.revokeObjectURL(url);
  toast("تم حفظ الإحصاءات بنجاح.");
});

/* أضف هذه الأسطر إلى resetBtn الحالي لتصفير أعداد الاتجاهات أيضًا. */
function resetGestureCounts() {
  Object.keys(gestureCounts).forEach(direction => {
    gestureCounts[direction] = 0;
  });

  $("countRight").textContent = "0";
  $("countLeft").textContent = "0";
  $("countUp").textContent = "0";
  $("countDown").textContent = "0";
}
</script>
