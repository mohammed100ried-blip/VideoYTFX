<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020804">
<title>Gesture AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
:root {
--bg:#020804;
--panel:rgba(5,20,11,.91);
--panel2:rgba(8,30,17,.88);
--border:rgba(57,255,136,.2);
--text:#edfff1;
--muted:#86a993;
--green:#22c55e;
--neon:#39ff88;
--cyan:#7af7ff;
--glow:rgba(34,197,94,.22);
--red:#fb425c;
}

[data-theme="light"] {
--bg:#effcf3;
--panel:rgba(255,255,255,.94);
--panel2:rgba(235,250,240,.95);
--border:rgba(22,163,74,.2);
--text:#092b16;
--muted:#54745f;
--green:#16a34a;
--neon:#00a844;
--cyan:#087f91;
--glow:rgba(22,163,74,.14);
--red:#d6334c;
}

* {
box-sizing:border-box;
margin:0;
padding:0;
}

body {
min-height:100vh;
overflow-x:hidden;
background:var(--bg);
color:var(--text);
font-family:'Tajawal',sans-serif;
transition:background .3s,color .3s;
}

button,select,input {
font:inherit;
}

button {
cursor:pointer;
}

button:disabled {
opacity:.45;
cursor:not-allowed;
}

body::before {
content:"";
position:fixed;
inset:0;
z-index:-4;
pointer-events:none;
background-image:
linear-gradient(rgba(34,197,94,.04) 1px,transparent 1px),
linear-gradient(90deg,rgba(34,197,94,.04) 1px,transparent 1px);
background-size:44px 44px;
}

body::after {
content:"";
position:fixed;
inset:0;
z-index:-3;
pointer-events:none;
background:
radial-gradient(ellipse at 15% 10%,rgba(0,255,100,.12),transparent 36%),
radial-gradient(ellipse at 85% 80%,rgba(0,255,100,.09),transparent 36%);
}

/* Rain and storm */

.rain {
position:fixed;
inset:0;
z-index:-2;
pointer-events:none;
overflow:hidden;
opacity:.22;
background:repeating-linear-gradient(
105deg,
transparent 0 75px,
rgba(170,255,210,.10) 76px,
transparent 78px
);
animation:rainMove .55s linear infinite;
}

@keyframes rainMove {
to {
background-position:0 180px;
}
}

.lightning-flash {
position:fixed;
inset:0;
z-index:80;
pointer-events:none;
background:rgba(230,255,240,0);
opacity:0;
}

.lightning-flash.flash {
animation:flashScreen .38s ease-out;
}

@keyframes flashScreen {
0% {opacity:0}
12% {opacity:.55;background:rgba(240,255,247,.8)}
24% {opacity:.05}
37% {opacity:.35}
100% {opacity:0}
}

.bolt {
position:fixed;
z-index:81;
top:-5%;
width:clamp(80px,16vw,190px);
height:70vh;
pointer-events:none;
opacity:0;
filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 18px #9cffc2);
clip-path:polygon(
53% 0,67% 0,53% 38%,75% 38%,
30% 100%,43% 55%,23% 55%
);
background:linear-gradient(#fff,#caffdd,#fff);
transform:scaleY(.8);
}

.bolt.show {
animation:boltStrike .45s ease-out;
}

@keyframes boltStrike {
0% {opacity:0;transform:scaleY(.5) translateY(-20px)}
15% {opacity:1}
35% {opacity:.15}
48% {opacity:.9}
100% {opacity:0;transform:scaleY(1.05) translateY(12px)}
}

/* App shell */

.navbar {
position:sticky;
top:0;
z-index:20;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
padding:13px 5%;
background:var(--panel);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
border-bottom:1px solid var(--border);
}

.brand {
display:flex;
align-items:center;
gap:12px;
color:var(--text);
text-decoration:none;
font:800 1.15rem 'Orbitron',sans-serif;
letter-spacing:1px;
}

.brand-icon {
width:42px;
height:42px;
display:grid;
place-items:center;
border-radius:13px;
background:linear-gradient(135deg,#064e27,#22c55e);
box-shadow:0 0 22px var(--glow);
font-size:23px;
}

.nav-actions {
display:flex;
gap:8px;
flex-wrap:wrap;
}

.btn {
padding:10px 15px;
border:1px solid var(--border);
border-radius:11px;
background:var(--panel2);
color:var(--text);
transition:.2s;
}

.btn:hover:not(:disabled) {
border-color:var(--neon);
box-shadow:0 0 16px var(--glow);
transform:translateY(-2px);
}

.btn-primary {
color:white;
border:0;
background:linear-gradient(120deg,#04752e,#22c55e);
box-shadow:0 0 20px rgba(34,197,94,.15);
}

.btn-danger {
color:white;
border:0;
background:linear-gradient(120deg,#991b1b,#dc2626);
}

.btn-sound {
color:var(--cyan);
border-color:rgba(122,247,255,.3);
}

.hero {
text-align:center;
padding:42px 15px 26px;
}

.hero h1 {
display:inline-block;
font:900 clamp(2.5rem,7vw,5rem) 'Orbitron',sans-serif;
letter-spacing:-2px;
color:transparent;
background:linear-gradient(90deg,#d8ffe5,#39ff88,#fff,#19e86b,#d8ffe5);
background-size:300% auto;
background-clip:text;
-webkit-background-clip:text;
filter:drop-shadow(0 0 18px rgba(34,255,115,.4));
animation:titleFlow 5s linear infinite;
}

@keyframes titleFlow {
to {background-position:300% center}
}

.workspace {
width:min(1350px,94%);
margin:auto;
padding-bottom:55px;
display:grid;
grid-template-columns:minmax(0,1.2fr) minmax(290px,.8fr);
gap:20px;
}

.column {
min-width:0;
}

.panel {
min-width:0;
padding:21px;
margin-bottom:20px;
border:1px solid var(--border);
border-radius:18px;
background:var(--panel);
box-shadow:0 12px 35px rgba(0,0,0,.12);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);
animation:panelAppear .6s both;
}

@keyframes panelAppear {
from {
opacity:0;
transform:translateY(15px);
}
to {
opacity:1;
transform:translateY(0);
}
}

.panel-head {
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:18px;
}

.panel-head h2,
.panel-head h3 {
font-size:1.12rem;
font-weight:800;
}

.muted {
color:var(--muted);
font-size:.85rem;
}

.status {
padding:5px 12px;
border:1px solid var(--border);
border-radius:30px;
color:var(--muted);
font-size:.82rem;
white-space:nowrap;
}

.status.active {
color:var(--neon);
border-color:var(--green);
box-shadow:0 0 12px var(--glow);
}

.status.error {
color:#ff8090;
border-color:#dc2626;
}

/* Camera */

.camera-box {
position:relative;
width:100%;
aspect-ratio:4/3;
overflow:hidden;
border:1px solid var(--border);
border-radius:15px;
background:#020804;
box-shadow:inset 0 0 30px rgba(0,255,100,.08);
}

#cameraVideo,
#outputCanvas {
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
}

#outputCanvas {
pointer-events:none;
}

.placeholder {
position:absolute;
inset:0;
display:grid;
place-items:center;
text-align:center;
color:#b8d9c1;
background:radial-gradient(circle,rgba(34,197,94,.08),transparent 65%);
}

.placeholder.hidden {
display:none;
}

.placeholder .icon {
margin-bottom:10px;
font-size:4rem;
}

.camera-info {
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
margin-top:13px;
color:var(--muted);
font-size:.87rem;
}

.camera-actions {
display:flex;
gap:10px;
margin-top:16px;
flex-wrap:wrap;
}

.camera-actions button {
flex:1;
min-width:135px;
}

.camera-options {
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:13px;
}

.camera-options label {
display:block;
color:var(--muted);
font-size:.82rem;
margin-bottom:5px;
}

.camera-options select {
width:100%;
padding:9px 10px;
border-radius:9px;
border:1px solid var(--border);
background:var(--panel2);
color:var(--text);
}

/* AI and gesture result */

.ai-strip {
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:10px;
margin-top:14px;
}

.ai-metric {
padding:12px;
border:1px solid var(--border);
border-radius:12px;
background:rgba(34,197,94,.035);
min-width:0;
}

.ai-metric small {
display:block;
color:var(--muted);
font-size:.76rem;
}

.ai-metric strong {
display:block;
margin-top:5px;
color:var(--neon);
font:700 1.05rem 'Orbitron',sans-serif;
overflow-wrap:anywhere;
}

.gesture-display {
display:flex;
align-items:center;
gap:17px;
padding:18px;
border:1px solid var(--border);
border-radius:15px;
background:linear-gradient(120deg,rgba(34,197,94,.12),rgba(0,0,0,.05));
}

.gesture-icon {
width:72px;
height:72px;
flex-shrink:0;
display:grid;
place-items:center;
border:1px solid var(--border);
border-radius:18px;
background:rgba(34,197,94,.12);
font-size:2.5rem;
}

.gesture-name {
color:var(--neon);
font-size:1.25rem;
font-weight:800;
}

.gesture-description {
display:none;
}

.movement-track {
height:7px;
border-radius:10px;
background:rgba(57,255,136,.1);
overflow:hidden;
margin-top:13px;
}

#movementBar {
height:100%;
width:0;
background:linear-gradient(90deg,#16a34a,#7affaa);
transition:width .12s;
}

/* Statistics */

.stats {
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.stat {
padding:16px;
border:1px solid var(--border);
border-radius:14px;
background:rgba(34,197,94,.035);
}

.stat-label {
color:var(--muted);
font-size:.85rem;
}

.stat-value {
margin-top:8px;
color:var(--neon);
font-family:'Orbitron',sans-serif;
font-size:1.65rem;
overflow-wrap:anywhere;
}

.movement-list {
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}

.movement {
display:flex;
justify-content:space-between;
align-items:center;
padding:11px 12px;
border:1px solid var(--border);
border-radius:11px;
background:rgba(34,197,94,.035);
transition:.2s;
gap:8px;
}

.movement:hover {
border-color:var(--neon);
transform:translateY(-2px);
}

.movement strong {
color:var(--neon);
font-family:'Orbitron',sans-serif;
}

/* Settings */

.settings {
display:grid;
gap:19px;
}

.setting label {
display:block;
margin-bottom:9px;
font-weight:700;
}

.setting-row {
display:grid;
grid-template-columns:1fr 65px;
align-items:center;
gap:12px;
}

input[type=range] {
width:100%;
accent-color:var(--green);
cursor:pointer;
}

.output {
color:var(--neon);
font-family:'Orbitron',sans-serif;
text-align:left;
}

/* History */

.history {
display:grid;
gap:8px;
max-height:330px;
overflow:auto;
}

.history-item {
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:11px;
border-bottom:1px solid var(--border);
font-size:.9rem;
animation:historyIn .25s ease;
}

@keyframes historyIn {
from {
opacity:0;
transform:translateX(10px);
}
to {
opacity:1;
transform:translateX(0);
}
}

.history-item span:last-child {
color:var(--muted);
direction:ltr;
font-size:.8rem;
}

.empty {
padding:15px;
text-align:center;
color:var(--muted);
}

.actions {
display:flex;
gap:10px;
margin-top:17px;
}

.actions button {
flex:1;
}

footer {
padding:25px;
text-align:center;
border-top:1px solid var(--border);
color:var(--muted);
background:var(--panel);
}

.toast {
position:fixed;
bottom:20px;
left:50%;
z-index:120;
max-width:90%;
padding:12px 20px;
border:1px solid #22c55e;
border-radius:12px;
color:#d1fae5;
background:#052e16;
opacity:0;
pointer-events:none;
transform:translate(-50%,20px);
transition:.25s;
text-align:center;
}

.toast.show {
opacity:1;
transform:translate(-50%,0);
}

@media(max-width:850px) {
.workspace {
grid-template-columns:1fr;
}
}

@media(max-width:520px) {
.navbar {padding:11px 4%}
.brand {font-size:.95rem}
.nav-actions button {padding:8px;font-size:.78rem}
.hero {padding:30px 10px 25px}
.panel {padding:15px}
.camera-actions {flex-direction:column}
.gesture-display {padding:12px}
.gesture-icon {width:58px;height:58px}
.stats {grid-template-columns:1fr 1fr}
.camera-options {grid-template-columns:1fr}
.ai-strip {grid-template-columns:1fr 1fr 1fr}
.ai-metric {padding:9px 7px}
.ai-metric strong {font-size:.85rem}
}

@media(prefers-reduced-motion:reduce) {
*,
*::before,
*::after {
animation-duration:.01ms!important;
transition-duration:.01ms!important;
}
}
</style>
</head>

<body>

<div class="rain" aria-hidden="true"></div>
<div class="lightning-flash" id="lightningFlash"></div>
<div class="bolt" id="bolt"></div>

<nav class="navbar">
<a href="gesture.html" class="brand">
<span class="brand-icon"></span>
<span>GESTURE <span style="color:var(--neon)">AI</span></span>
</a>

<div class="nav-actions">
<button class="btn btn-sound" id="soundBtn" type="button">
<span data-ar=" : " data-en="Thunder: Off"> : </span>
</button>

<button class="btn" id="languageBtn" type="button"> English</button>
<button class="btn" id="themeBtn" type="button"></button>
</div>
</nav>

<header class="hero">
<h1>GESTURE AI</h1>
</header>

<main class="workspace">

<div class="column">

<!-- CAMERA -->

<section class="panel">
<div class="panel-head">
<h2 data-ar=" " data-en="AI Tracking Camera"> </h2>
<span class="status" id="status"> </span>
</div>

<div class="camera-box">
<video id="cameraVideo" autoplay playsinline muted></video>
<canvas id="outputCanvas"></canvas>

<div class="placeholder" id="placeholder">
<div>
<div class="icon"></div>
</div>
</div>
</div>

<div class="camera-info">
<span id="cameraMessage"> </span>
<span id="handStatus"> </span>
</div>

<div class="camera-options">
<div>
<label for="cameraSelect" data-ar=" " data-en="Camera device"> </label>
<select id="cameraSelect">
<option value=""> </option>
</select>
</div>

<div>
<label for="qualitySelect" data-ar=" " data-en="Camera resolution"> </label>
<select id="qualitySelect">
<option value="640x480">480p</option>
<option value="1280x720" selected>720p</option>
<option value="1920x1080">1080p</option>
</select>
</div>
</div>

<div class="camera-actions">
<button class="btn btn-primary" id="startBtn" type="button">
<span data-ar=" " data-en="Start Camera"> </span>
</button>

<button class="btn" id="stopBtn" type="button" disabled>
<span data-ar=" " data-en="Stop Camera"> </span>
</button>
</div>

<div class="ai-strip">
<div class="ai-metric">
<small data-ar=" " data-en="Detection confidence"> </small>
<strong id="confidence">--%</strong>
</div>

<div class="ai-metric">
<small data-ar=" " data-en="Processing FPS"> </small>
<strong id="fps">--</strong>
</div>

<div class="ai-metric">
<small data-ar=" " data-en="AI model"> </small>
<strong id="modelState">READY</strong>
</div>
</div>
</section>

<!-- DETECTED GESTURE -->

<section class="panel">
<div class="panel-head">
<h3 data-ar=" " data-en="AI Gesture Recognition"> </h3>
<span class="muted">LIVE AI</span>
</div>

<div class="gesture-display">
<div class="gesture-icon" id="gestureEmoji"></div>
<div>
<div class="gesture-name" id="gestureName"> </div>
<div class="gesture-description" id="gestureDesc"> .</div>
</div>
</div>

<div class="movement-track">
<div id="movementBar"></div>
</div>

<p class="muted" style="margin-top:8px;display:none" id="movementInfo"> .</p>
</section>

<!-- HISTORY -->

<section class="panel">
<div class="panel-head">
<h3 data-ar=" " data-en="Detected Movement History"> </h3>
<span class="muted">LAST 12</span>
</div>

<div class="history" id="history">
<div class="empty"> .</div>
</div>
</section>

</div>

<aside class="column">

<!-- SETTINGS -->

<section class="panel">
<div class="panel-head">
<h3 data-ar=" " data-en="Recognition Settings"> </h3>
</div>

<div class="settings">

<div class="setting">
<label for="sensitivity" data-ar=" " data-en="Free movement sensitivity"> </label>

<div class="setting-row">
<input type="range" id="sensitivity" min="10" max="45" value="22">
<output class="output" id="sensitivityOut">0.22</output>
</div>
</div>

<div class="setting">
<label for="smoothing" data-ar=" " data-en="Tracking smoothing"> </label>

<div class="setting-row">
<input type="range" id="smoothing" min="1" max="10" value="4">
<output class="output" id="smoothingOut">4</output>
</div>
</div>

<div class="setting">
<label for="confidenceLimit" data-ar=" " data-en="Minimum detection confidence"> </label>

<div class="setting-row">
<input type="range" id="confidenceLimit" min="50" max="90" value="65">
<output class="output" id="confidenceOut">65%</output>
</div>
</div>

</div>
</section>

<!-- STATISTICS -->

<section class="panel">
<div class="panel-head">
<h3 data-ar=" " data-en="System Statistics"> </h3>
</div>

<div class="stats">
<div class="stat">
<div class="stat-label" data-ar=" " data-en="Total gestures"> </div>
<div class="stat-value" id="total">0</div>
</div>

<div class="stat">
<div class="stat-label" data-ar=" " data-en="Last gesture"> </div>
<div class="stat-value" id="last"></div>
</div>
</div>
</section>

<!-- GESTURE TYPES -->

<section class="panel">
<div class="panel-head">
<h3 data-ar=" " data-en="Gesture Types"> </h3>
</div>

<div class="movement-list">

<div class="movement">
<span> <span data-ar="" data-en="Right"></span></span>
<strong id="right">0</strong>
</div>

<div class="movement">
<span> <span data-ar="" data-en="Left"></span></span>
<strong id="left">0</strong>
</div>

<div class="movement">
<span> <span data-ar="" data-en="Up"></span></span>
<strong id="up">0</strong>
</div>

<div class="movement">
<span> <span data-ar="" data-en="Down"></span></span>
<strong id="down">0</strong>
</div>

<div class="movement">
<span> <span data-ar=" " data-en="Open palm"> </span></span>
<strong id="palm">0</strong>
</div>

<div class="movement">
<span> <span data-ar="" data-en="Fist"></span></span>
<strong id="fist">0</strong>
</div>

<div class="movement">
<span> <span data-ar=" " data-en="Peace sign"> </span></span>
<strong id="peace">0</strong>
</div>

<div class="movement">
<span> <span data-ar="" data-en="Pointing"></span></span>
<strong id="point">0</strong>
</div>

<div class="movement">
<span> <span data-ar=" " data-en="Thumbs up"> </span></span>
<strong id="thumbsup">0</strong>
</div>

<div class="movement">
<span> <span data-ar=" " data-en="Thumbs down"> </span></span>
<strong id="thumbdown">0</strong>
</div>

</div>

<div class="actions">
<button class="btn btn-primary" id="saveBtn" type="button"> <span data-ar=" " data-en="Save report"> </span></button>
<button class="btn btn-danger" id="resetBtn" type="button"> <span data-ar="" data-en="Reset"></span></button>
</div>
</section>

</aside>
</main>

<footer>GESTURE AI REAL-TIME HAND TRACKING</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const $ = id => document.getElementById(id);

/* =========================
App state
========================= */

let language = 'ar';
let hands = null;
let cameraStream = null;
let running = false;
let processing = false;
let animationFrame = null;

let lastProcessAt = 0;
let lastFpsAt = 0;
let frameCount = 0;
let fpsValue = 0;

let threshold = 0.22;
let smoothValue = 4;
let minimumConfidence = 0.65;

let smoothedCenter = null;
let trajectory = [];

let lastMovementAt = 0;
let lastStaticGesture = '';
let staticFrames = 0;
let staticGestureFired = false;
let lastStaticAt = 0;
let lastConfidence = 0;

let total = 0;
let historyItems = [];

let audioContext = null;
let soundEnabled = false;
let thunderTimer = null;
let cameraDevices = [];

const counts = {
right:0,
left:0,
up:0,
down:0,
palm:0,
fist:0,
peace:0,
point:0,
thumbsup:0,
thumbdown:0
};

const gestures = {
right:{emoji:'',ar:'',en:'Right'},

/* =========================
Thunder sound (generated)
========================= */

async function enableSound() {

const AC = window.AudioContext || window.webkitAudioContext;

if(!AC) {
notify(
language === 'ar'
? ' .'
: 'Audio is not supported.'
);
return;
}

try {

if(!audioContext) {
audioContext = new AC();
}

if(audioContext.state === 'suspended') {
await audioContext.resume();
}

soundEnabled = true;

$('soundBtn').innerHTML = tr('soundOn');

scheduleThunder();

} catch(error) {

console.error(error);

notify(
language === 'ar'
? ' .'
: 'Could not enable sound.'
);

}

}

function disableSound() {

soundEnabled = false;

clearTimeout(thunderTimer);

$('soundBtn').innerHTML = tr('noSound');

}

function playThunder() {

if(!soundEnabled || !audioContext || audioContext.state !== 'running') {
return;
}

const now = audioContext.currentTime;
const duration = 2.3;

const buffer = audioContext.createBuffer(
1,
Math.floor(audioContext.sampleRate * duration),
audioContext.sampleRate
);

const data = buffer.getChannelData(0);

for(let i = 0; i < data.length; i++) {

const fade = 1 - i / data.length;

data[i] = (Math.random() * 2 - 1) * fade * fade;

}

const noise = audioContext.createBufferSource();

noise.buffer = buffer;

const low = audioContext.createBiquadFilter();

low.type = 'lowpass';

low.frequency.setValueAtTime(170,now);

low.frequency.exponentialRampToValueAtTime(48,now + 1.9);

const gain = audioContext.createGain();

gain.gain.setValueAtTime(.0001,now);

gain.gain.exponentialRampToValueAtTime(.22,now + .045);

gain.gain.exponentialRampToValueAtTime(.0001,now + duration);

noise.connect(low);
low.connect(gain);
gain.connect(audioContext.destination);

noise.start(now);
noise.stop(now + duration);

}

function flashLightning() {

const flash = $('lightningFlash');
const bolt = $('bolt');

const left = 8 + Math.random() * 77;

bolt.style.left = left + '%';

bolt.classList.remove('show');
flash.classList.remove('flash');

void bolt.offsetWidth;

bolt.classList.add('show');
flash.classList.add('flash');

if(soundEnabled) {
setTimeout(playThunder,180 + Math.random() * 350);
}

}

function scheduleThunder() {

clearTimeout(thunderTimer);

if(!soundEnabled) return;

thunderTimer = setTimeout(() => {

flashLightning();

scheduleThunder();

},7000 + Math.random() * 11000);

}

$('soundBtn').addEventListener('click',() => {
soundEnabled ? disableSound() : enableSound();
});

/* =========================
Geometry helpers
========================= */

function distance(a,b) {
return Math.hypot(a.x-b.x,a.y-b.y);
}

function averagePoint(points) {

return points.reduce((p,v) => ({
x:p.x + v.x / points.length,
y:p.y + v.y / points.length
}),{x:0,y:0});

}

function getHandScale(landmarks) {

const xs = landmarks.map(p => p.x);
const ys = landmarks.map(p => p.y);

const width = Math.max(...xs) - Math.min(...xs);
const height = Math.max(...ys) - Math.min(...ys);

return Math.max(width,height,.055);

}

function getPalmCenter(landmarks) {

return averagePoint([
landmarks[0],
landmarks[5],
landmarks[9],
landmarks[13],
landmarks[17]
]);

}

/* =========================
Hand skeleton drawing
========================= */

const connections = [
[0,1],[1,2],[2,3],[3,4],
[0,5],[5,6],[6,7],[7,8],
[5,9],[9,10],[10,11],[11,12],
[9,13],[13,14],[14,15],[15,16],
[13,17],[17,18],[18,19],[19,20],[0,17]
];

function drawHand(ctx,landmarks,width,height) {

ctx.save();

ctx.lineCap = 'round';
ctx.lineJoin = 'round';

ctx.strokeStyle = '#39ff88';
ctx.fillStyle = '#f4fff8';

ctx.lineWidth = Math.max(2,width / 330);

ctx.shadowColor = '#39ff88';
ctx.shadowBlur = 9;

connections.forEach(([a,b]) => {

ctx.beginPath();

ctx.moveTo(
landmarks[a].x * width,
landmarks[a].y * height
);

ctx.lineTo(
landmarks[b].x * width,
landmarks[b].y * height
);

ctx.stroke();

});

ctx.shadowBlur = 12;

landmarks.forEach((point,index) => {

ctx.beginPath();

ctx.arc(
point.x * width,
point.y * height,
index === 0 ? 5 : Math.max(2.3,width / 230),
0,
Math.PI * 2
);

ctx.fill();

});

ctx.restore();

}

function drawMotionTrail() {

if(trajectory.length < 2) return;

const ctx = $('outputCanvas').getContext('2d');

const w = $('outputCanvas').width;
const h = $('outputCanvas').height;

ctx.save();

ctx.beginPath();

ctx.lineWidth = Math.max(2,w / 250);

ctx.strokeStyle = 'rgba(122,247,255,.8)';

ctx.shadowColor = '#7af7ff';
ctx.shadowBlur = 12;

trajectory.forEach((point,index) => {

const x = point.x * w;
const y = point.y * h;

if(index === 0) {
ctx.moveTo(x,y);
} else {
ctx.lineTo(x,y);
}

});

ctx.stroke();

ctx.restore();

}

/* =========================
AI static gesture classifier
========================= */

function classifyStaticGesture(hand) {

const wrist = hand[0];

const fingerTips = [8,12,16,20];
const fingerPips = [6,10,14,18];

const extended = fingerTips.map((tip,index) =>
distance(hand[tip],wrist) >
distance(hand[fingerPips[index]],wrist) * 1.13
);

const thumbExtended =
distance(hand[4],hand[9]) >
distance(hand[3],hand[9]) * 1.12;

const count = extended.filter(Boolean).length;

const thumbUp =
thumbExtended && hand[4].y < hand[3].y - .025;

const thumbDown =
thumbExtended && hand[4].y > hand[3].y + .025;

if(count >= 4) return 'palm';

if(
extended[0] &&
extended[1] &&
!extended[2] &&
!extended[3]
) return 'peace';

if(
extended[0] &&
!extended[1] &&
!extended[2] &&
!extended[3]
) return 'point';

if(count === 0 && thumbUp) return 'thumbsup';

if(count === 0 && thumbDown) return 'thumbdown';

if(count === 0) return 'fist';

return null;

}

function handleStaticGesture(candidate) {

if(!candidate) {

lastStaticGesture = '';
staticFrames = 0;
staticGestureFired = false;

return;

}

if(candidate === lastStaticGesture) {

staticFrames++;

} else {

lastStaticGesture = candidate;
staticFrames = 1;
staticGestureFired = false;

}

const now = performance.now();

if(
staticFrames >= 7 &&
!staticGestureFired &&
now - lastStaticAt > 700
) {

registerGesture(candidate);

lastStaticAt = now;

staticGestureFired = true;

}

}

/* =========================
Free directional movement
========================= */

function detectFreeMovement(hand) {

const center = getPalmCenter(hand);
const handScale = getHandScale(hand);

const alpha = 1 / Math.max(1,smoothValue);

if(!smoothedCenter) {

smoothedCenter = {...center};

trajectory = [{
...center,
t:performance.now()
}];

return false;

}

smoothedCenter.x += (center.x - smoothedCenter.x) * alpha;
smoothedCenter.y += (center.y - smoothedCenter.y) * alpha;

const now = performance.now();

trajectory.push({
x:smoothedCenter.x,
y:smoothedCenter.y,
t:now,
scale:handScale
});

trajectory = trajectory.filter(point =>
now - point.t < 520
).slice(-18);

if(trajectory.length < 5) return false;

const old = trajectory.find(point =>
now - point.t >= 190
) || trajectory[0];

// Mirrored screen: invert camera X

const dx = -(smoothedCenter.x - old.x);
const dy = smoothedCenter.y - old.y;

const nx = dx / handScale;
const ny = dy / handScale;

const horizontal = Math.abs(nx);
const vertical = Math.abs(ny);

const magnitude = Math.hypot(nx,ny);

$('movementBar').style.width =
Math.min(100,Math.round(magnitude * 180)) + '%';

const cooldown = 650;

const movementActive = magnitude >= threshold * .48;

if(
magnitude < threshold ||
now - lastMovementAt < cooldown
) {
return movementActive;
}

let key = null;

if(horizontal > vertical * 1.18) {

key = nx > 0 ? 'right' : 'left';

} else if(vertical > horizontal * 1.18) {

key = ny > 0 ? 'down' : 'up';

} else if(
horizontal > threshold * .72 &&
vertical > threshold * .72
) {

key = horizontal >= vertical
? (nx > 0 ? 'right' : 'left')
: (ny > 0 ? 'down' : 'up');

}

if(key) {

registerGesture(key,{magnitude});

$('movementInfo').textContent = tr('detected');

lastMovementAt = now;

trajectory = [{
...smoothedCenter,
t:now,
scale:handScale
}];

return true;

}

return movementActive;

}

/* =========================
MediaPipe results
========================= */

function drawResults(results) {

const video = $('cameraVideo');
const canvas = $('outputCanvas');
const ctx = canvas.getContext('2d');

if(
canvas.width !== video.videoWidth ||
canvas.height !== video.videoHeight
) {

canvas.width = video.videoWidth || 640;
canvas.height = video.videoHeight || 480;

}

ctx.clearRect(0,0,canvas.width,canvas.height);

const hand = results.multiHandLandmarks?.[0];

if(!hand) {

$('handStatus').textContent = tr('noHand');
$('confidence').textContent = '--%';

$('movementInfo').textContent = tr('openHand');
$('movementBar').style.width = '0%';

resetTrackingState();

return;

}

const score = results.multiHandedness?.[0]?.score ?? .75;

lastConfidence = score;

$('confidence').textContent = Math.round(score * 100) + '%';

$('handStatus').textContent = tr('handFound');

drawHand(ctx,hand,canvas.width,canvas.height);

drawMotionTrail();

if(score < minimumConfidence) {

$('movementInfo').textContent = tr('confidenceLow');

resetTrackingState();

return;

}

const movementActive = detectFreeMovement(hand);

const staticCandidate = classifyStaticGesture(hand);

if(!movementActive) {

handleStaticGesture(staticCandidate);

} else {

handleStaticGesture(null);

}

}

/* =========================
Camera devices
========================= */

async function populateCameraList() {

try {

const devices = await navigator.mediaDevices.enumerateDevices();

cameraDevices = devices.filter(device =>
device.kind === 'videoinput'
);

const select = $('cameraSelect');

const selected = select.value;

select.replaceChildren();

const defaultOption = document.createElement('option');

defaultOption.value = '';

defaultOption.textContent = language === 'ar'
? ' '
: 'Default camera';

select.appendChild(defaultOption);

cameraDevices.forEach((device,index) => {

const option = document.createElement('option');

option.value = device.deviceId;

option.textContent = device.label ||
`${language === 'ar' ? '' : 'Camera'} ${index + 1}`;

select.appendChild(option);

});

if(cameraDevices.some(device =>
device.deviceId === selected
)) {

select.value = selected;

}

} catch(error) {

console.warn('Camera enumeration failed:',error);

}

}

function getCameraConstraints(strict = true) {

const [width,height] = $('qualitySelect').value
.split('x')
.map(Number);

const selectedDevice = $('cameraSelect').value;

const video = strict
? {
width:{ideal:width},
height:{ideal:height},
frameRate:{ideal:30,max:30}
}
: true;

if(strict && selectedDevice) {
video.deviceId = {exact:selectedDevice};
} else if(strict) {
video.facingMode = 'user';
}

return {audio:false,video};
}

/* =========================
Start AI camera
========================= */

async function startCamera() {

if(running) return;

if(!navigator.mediaDevices?.getUserMedia) {

notify(tr('secure'));

return;

}

if(typeof Hands === 'undefined') {

$('modelState').textContent = tr('aiError');

notify(tr('modelMissing'));

return;

}

$('startBtn').disabled = true;

$('modelState').textContent = tr('aiLoading');

$('cameraMessage').textContent = tr('cameraStarting');

try {

//
try {
cameraStream = await navigator.mediaDevices.getUserMedia(
getCameraConstraints(true)
);
} catch(firstError) {
cameraStream = await navigator.mediaDevices.getUserMedia(
getCameraConstraints(false)
);
}

const video = $('cameraVideo');

video.srcObject = cameraStream;

//
await new Promise((resolve,reject) => {
if(video.readyState >= 2) return resolve();
video.addEventListener('loadeddata',resolve,{once:true});
video.addEventListener('error',reject,{once:true});
setTimeout(resolve,4000);
});

await video.play();

hands = new Hands({
locateFile:file =>
`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
maxNumHands:1,
modelComplexity:1,
minDetectionConfidence:minimumConfidence,
minTrackingConfidence:.65
});

hands.onResults(drawResults);

//
if(hands.initialize) {
try { await hands.initialize(); } catch(error) {}
}

running = true;
processing = false;

lastProcessAt = 0;
frameCount = 0;
fpsValue = 0;
lastFpsAt = performance.now();

resetTrackingState();

$('placeholder').classList.add('hidden');

$('cameraMessage').textContent = tr('cameraRunning');

setStatus(tr('active'),'active');

$('stopBtn').disabled = false;

$('modelState').textContent = tr('aiLive');

await populateCameraList();

processFrames();

} catch(error) {

console.error(error);

stopCamera();

$('modelState').textContent = tr('aiError');

let msg = tr('startError');

if(
error.name === 'NotAllowedError' ||
error.name === 'PermissionDeniedError'
) {

msg = tr('permission');

} else if(
error.name === 'NotFoundError' ||
error.name === 'DevicesNotFoundError'
) {

msg = tr('noCamera');

} else if(error.name === 'NotReadableError') {

msg = language === 'ar'
? ' .'
: 'Camera is busy in another app.';

}

$('cameraMessage').textContent = msg;

notify(msg);

} finally {

$('startBtn').disabled = false;

}

}

/* =========================
Frame processing loop
========================= */

async function processFrames() {

if(!running) return;

const video = $('cameraVideo');

const now = performance.now();

const hidden = document.hidden;

if(
!hidden &&
video.readyState >= 2 &&
video.videoWidth > 0 &&
!processing &&
now - lastProcessAt >= 33
) {

processing = true;

lastProcessAt = now;

try {

await hands.send({image:video});

} catch(error) {

console.error('AI frame error:',error);

} finally {

processing = false;

}

frameCount++;

if(now - lastFpsAt >= 1000) {

fpsValue = Math.round(
frameCount * 1000 / (now - lastFpsAt)
);

$('fps').textContent = fpsValue;

frameCount = 0;

lastFpsAt = now;

}

}

if(running) {

animationFrame = requestAnimationFrame(processFrames);

}

}

/* =========================
Stop camera safely
========================= */

async function stopCamera() {

running = false;

if(animationFrame) {
cancelAnimationFrame(animationFrame);
}

animationFrame = null;

if(cameraStream) {

cameraStream.getTracks().forEach(track =>
track.stop()
);

cameraStream = null;

}

const video = $('cameraVideo');

video.pause();
video.srcObject = null;

const canvas = $('outputCanvas');

const ctx = canvas.getContext('2d');

ctx.clearRect(0,0,canvas.width,canvas.height);

$('placeholder').classList.remove('hidden');

$('cameraMessage').textContent = tr('cameraOff');

$('handStatus').textContent = tr('noHand');

$('confidence').textContent = '--%';

$('fps').textContent = '--';

$('modelState').textContent = tr('aiReady');

setStatus(tr('stopped'));

$('startBtn').disabled = false;

$('stopBtn').disabled = true;

resetTrackingState();

if(hands) {

const oldHands = hands;

hands = null;

try {

await oldHands.close();

} catch(error) {

console.warn(error);

}

}

}
