<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#03040a">
<title>VideoYTFX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#03040a;
  --panel:rgba(13,17,30,.9);
  --text:#f4f7ff;
  --muted:#8f9ab0;
  --blue:#2a7bff;
  --line:rgba(80,130,255,.22);
}

[data-theme="light"] {
  --bg:#eef2f9;
  --panel:rgba(255,255,255,.92);
  --text:#101830;
  --muted:#5c6880;
  --line:rgba(50,90,170,.18);
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  transition:background .3s,color .3s;
}

body::before {
  content:"";
  position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(ellipse at 12% 8%, rgba(42,123,255,.16), transparent 42%),
    radial-gradient(ellipse at 88% 90%, rgba(42,123,255,.18), transparent 42%);
}

body::after {
  content:"";
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:
    linear-gradient(rgba(110,140,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(110,140,255,.05) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom, black, transparent 85%);
}

a { color:inherit; text-decoration:none; }
button { font:inherit; cursor:pointer; }

/* ===== الانترو — ثانيتين فقط ===== */

.intro {
  position:fixed;
  inset:0;
  z-index:1000;
  display:grid;
  place-items:center;
  background:#03040a;
  overflow:hidden;
  transition:opacity .6s ease, visibility .6s ease;
}

.intro.done {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-stage {
  position:relative;
  width:200px;
  height:200px;
  display:grid;
  place-items:center;
}

/* حلقة تدور حول الشعار */
.intro-orbit {
  position:absolute;
  inset:0;
  border:1px solid rgba(120,150,255,.35);
  border-radius:50%;
  animation:spin 2s linear infinite;
}

.intro-orbit::before,
.intro-orbit::after {
  content:"";
  position:absolute;
  width:10px; height:10px;
  border-radius:50%;
  background:#2a7bff;
  box-shadow:0 0 18px #2a7bff;
}

.intro-orbit::before { top:16px; left:16px; }
.intro-orbit::after  { bottom:16px; right:16px; }

/* شعار التنزيل — سهم داخل مربع */
.intro-logo {
  width:110px;
  height:110px;
  display:grid;
  place-items:center;
  border-radius:26px;
  background:linear-gradient(145deg,#2a7bff,#174fff);
  box-shadow:0 0 40px rgba(42,123,255,.45), 0 0 70px rgba(42,123,255,.3);
  animation:logoIn .7s ease both, floaty 1.3s .7s ease-in-out infinite alternate;
}

.intro-logo svg {
  width:52px;
  height:52px;
}

/* شريط تقدم بسيط — يمتلئ خلال الثانيتين */
.intro-bar {
  position:absolute;
  bottom:12px;
  width:min(280px,60%);
  height:3px;
  border-radius:3px;
  background:rgba(110,140,255,.15);
  overflow:hidden;
}

.intro-bar::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,#174fff,#2a7bff);
  transform-origin:left;
  animation:barFill 2s linear forwards;
}

.intro-skip {
  position:absolute;
  bottom:30px;
  inset-inline-end:24px;
  padding:8px 14px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:11px;
  background:rgba(6,9,16,.55);
  color:#fff;
  font-size:13px;
  font-weight:700;
  backdrop-filter:blur(8px);
  transition:.2s;
}

.intro-skip:hover {
  background:rgba(42,123,255,.3);
  transform:translateY(-2px);
}

@keyframes logoIn {
  from { opacity:0; transform:scale(.5); filter:blur(8px); }
  to   { opacity:1; transform:scale(1); filter:blur(0); }
}

@keyframes barFill {
  from { transform:scaleX(0); }
  to   { transform:scaleX(1); }
}

@keyframes spin   { to { transform:rotate(360deg); } }
@keyframes floaty { from { transform:translateY(0); } to { transform:translateY(-8px); } }

/* ظهور الواجهة بعد الانترو */

.reveal {
  opacity:0;
  transform:translateY(20px);
}

body.intro-finished .reveal {
  animation:fadeUp .7s ease forwards;
}

body.intro-finished .navbar { animation-delay:.05s; }
body.intro-finished .hero   { animation-delay:.15s; }
body.intro-finished .box    { animation-delay:.25s; }

/* ===== الهيدر ===== */

.navbar {
  width:min(1160px,92%);
  margin:auto;
  padding:22px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
}

.logo {
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:clamp(19px,4vw,26px);
  letter-spacing:-1px;
}

.logo b {
  color:var(--blue);
  text-shadow:0 0 18px var(--blue);
}

.nav-btns { display:flex; gap:9px; }

.nav-btns button {
  min-width:46px;
  height:42px;
  padding:0 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
  transition:.25s;
  font-weight:700;
  font-size:13px;
}

.nav-btns button:hover {
  border-color:var(--blue);
  transform:translateY(-2px);
}

/* ===== الهيرو ===== */

.hero {
  width:min(950px,92%);
  margin:50px auto 30px;
  text-align:center;
}

.hero h1 {
  font-family:'Orbitron','Tajawal',sans-serif;
  font-size:clamp(34px,8vw,70px);
  font-weight:900;
  margin:0 0 12px;
  letter-spacing:-2px;
}

.hero h1 span {
  display:inline-block;
  background:linear-gradient(100deg,#fff 5%,#2a7bff 35%,#fff 100%);
  background-size:250% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:slideText 6s linear infinite;
}

.hero p {
  color:var(--muted);
  font-size:17px;
  margin:0;
}

/* ===== بطاقة التحميل ===== */

.wrap {
  width:min(560px,92%);
  margin:40px auto 65px;
}

.box {
  position:relative;
  overflow:hidden;
  padding:24px;
  border:1px solid var(--line);
  border-radius:24px;
  background:var(--panel);
  box-shadow:0 18px 55px rgba(0,0,0,.35);
  backdrop-filter:blur(18px);
  transition:transform .35s, border-color .35s;
}

.box:hover {
  transform:translateY(-6px);
  border-color:var(--blue);
}

.box-head {
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:20px;
}

.box-head .badge {
  min-width:60px;
  height:50px;
  display:grid;
  place-items:center;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.14);
  font-family:'Orbitron',sans-serif;
  font-size:11px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(135deg,#2a7bff,#174fff);
  transition:.3s;
}

.box:hover .badge { transform:scale(1.06); }

.box-head h2 { margin:0 0 3px; font-size:22px; }
.box-head small { color:var(--muted); font-size:13px; }

.dl-stage {
  height:200px;
  display:grid;
  place-items:center;
  position:relative;
  margin:14px 0 18px;
}

.dl-ring {
  position:absolute;
  width:165px; height:165px;
  border:1px solid rgba(120,140,255,.3);
  border-radius:50%;
  animation:spin 17s linear infinite;
}

.dl-ring::before,
.dl-ring::after {
  content:"";
  position:absolute;
  width:9px; height:9px;
  border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 16px var(--blue);
}

.dl-ring::before { top:16px; left:16px; }
.dl-ring::after  { bottom:16px; right:16px; }

.dl-core {
  width:120px; height:120px;
  display:grid;
  place-items:center;
  border-radius:28px;
  position:relative;
  background:linear-gradient(145deg,#2a7bff,#174fff);
  box-shadow:0 0 30px rgba(42,123,255,.3), 0 0 50px rgba(42,123,255,.28);
  animation:floaty 3.4s ease-in-out infinite alternate;
}

.dl-core svg { width:52px; height:52px; }

.dl-core::before {
  content:"";
  position:absolute;
  inset:-11px;
  border:1px solid rgba(42,123,255,.35);
  border-radius:35px;
  animation:pulse 2.6s infinite;
}

.meta-row {
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  margin:14px 0 18px;
}

.chip {
  padding:6px 11px;
  border-radius:30px;
  border:1px solid var(--line);
  background:rgba(100,120,255,.09);
  color:var(--muted);
  font-size:12px;
}

.btn-big {
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  padding:14px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  background:linear-gradient(100deg,#0759c9,#174fff);
  color:#fff;
  font-weight:800;
  transition:.3s;
}

.btn-big::before {
  content:"";
  position:absolute;
  width:65%; height:160%;
  top:-30%; left:-90%;
  background:radial-gradient(ellipse, rgba(255,255,255,.3), transparent 70%);
  filter:blur(14px);
  transition:left .7s;
}

.btn-big:hover::before { left:110%; }
.btn-big:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(42,123,255,.3); }

/* الفوتر */

.footer {
  width:min(1160px,92%);
  margin:0 auto;
  padding:20px 0 28px;
  border-top:1px solid var(--line);
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* حركات */

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

@keyframes slideText { to { background-position:250% center; } }
@keyframes pulse {
  0%,100% { transform:scale(.95); opacity:.3; }
  50%     { transform:scale(1.14); opacity:.8; }
}

/* جوال */

@media (max-width:430px) {
  .hero { margin-top:28px; }
  .hero p { font-size:15px; }
  .dl-stage { height:170px; }
  .box { padding:20px; }
}

@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .reveal { opacity:1; transform:none; }
  .intro { display:none; }
}
</style>
</head>

<body>

<!-- الانترو: شعار التنزيل لمدة ثانيتين -->
<div class="intro" id="intro">
  <div class="intro-stage">
    <div class="intro-orbit"></div>
    <div class="intro-logo">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3v11m0 0l-4.5-4.5M12 14l4.5-4.5"
              stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 17.5v1.2A2.3 2.3 0 006.8 21h10.4a2.3 2.3 0 002.3-2.3v-1.2"
              stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

<div class="intro-bar" aria-hidden="true"></div>

<button class="intro-skip" id="skipBtn" type="button">
    <span data-ar="تخطي" data-en="Skip">تخطي</span>
  </button>
</div>

<header class="navbar reveal">
  <a href="index.html" class="logo">Video<b>YTFX</b></a>

<nav class="nav-btns">
    <button id="langBtn" aria-label="تبديل اللغة">EN</button>
    <button id="themeBtn" aria-label="تبديل الثيم">LIGHT</button>
  </nav>
</header>

<section class="hero reveal">
  <h1><span>VideoYTFX</span></h1>

<p data-ar="حمّل البرنامج" data-en="Download the app">حمّل البرنامج</p>
</section>

<main class="wrap">
  <section class="box reveal">
    <div class="box-head">
      <div class="badge">APP</div>
      <div>
        <h2 data-ar="تحميل البرنامج" data-en="Download">تحميل البرنامج</h2>
        <small data-ar="نسخة الويندوز" data-en="Windows">نسخة الويندوز</small>
      </div>
    </div>

<div class="dl-stage">
      <div class="dl-ring"></div>
      <div class="dl-core">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v11m0 0l-4.5-4.5M12 14l4.5-4.5"
                stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.5 17.5v1.2A2.3 2.3 0 006.8 21h10.4a2.3 2.3 0 002.3-2.3v-1.2"
                stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

<div class="meta-row">
      <span class="chip">EXE</span>
      <span class="chip" data-ar="آخر إصدار" data-en="Latest release">آخر إصدار</span>
    </div>

<a class="btn-big"
       href="https://github.com/mohammed100ried-blip/VideoYTFX/releases/latest/download/VideoYTFX.exe"
       data-ar="نزّل VideoYTFX"
       data-en="Download VideoYTFX">
       نزّل VideoYTFX
    </a>
  </section>
</main>

<footer class="footer">
  © 2026 VideoYTFX
</footer>

<script>
"use strict";

const $ = id => document.getElementById(id);

function getSaved(k, d) {
  try { return localStorage.getItem(k) || d; } catch(e) { return d; }
}
function saveIt(k, v) {
  try { localStorage.setItem(k, v); } catch(e) {}
}

let lang  = getSaved("vytfx_lang", "ar");
let theme = getSaved("vytfx_theme", "dark");

/* ===== الانترو — ينتهي بعد ثانيتين ===== */

const intro = $("intro");
let introTimer = null;

function finishIntro() {
  if (!intro || intro.classList.contains("done")) return;

intro.classList.add("done");
  document.body.classList.add("intro-finished");

if (introTimer) {
    clearTimeout(introTimer);
    introTimer = null;
  }

setTimeout(() => intro.remove(), 650);
}

$("skipBtn").addEventListener("click", finishIntro);

introTimer = setTimeout(finishIntro, 2000);

/* ===== اللغة ===== */

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("langBtn").textContent = lang === "ar" ? "EN" : "AR";

document.querySelectorAll("[data-ar][data-en]").forEach(el => {
    el.textContent = el.dataset[lang];
  });
}

$("langBtn").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  saveIt("vytfx_lang", lang);
  applyLang();
});

/* ===== الثيم ===== */

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  $("themeBtn").textContent = theme === "dark" ? "LIGHT" : "DARK";
  document.querySelector('meta[name="theme-color"]').content =
    theme === "dark" ? "#03040a" : "#eef2f9";
}

$("themeBtn").addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark";
  saveIt("vytfx_theme", theme);
  applyTheme();
});

applyTheme();
applyLang();
</script>

</body>
</html>
