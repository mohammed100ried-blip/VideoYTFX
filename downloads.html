<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads - VideoYTFX</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #162447, #080b14 55%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #1877f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            box-shadow: 0 10px 35px rgba(24, 119, 242, 0.35);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aeb7c7;
            font-size: 17px;
            margin-bottom: 40px;
        }

        .download-card {
            background: rgba(20, 27, 43, 0.9);
            border: 1px solid #27334d;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .download-card h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .download-card p {
            color: #aeb7c7;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .download {
            display: inline-block;
            background: #1877f2;
            color: white;
            text-decoration: none;
            padding: 15px 28px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download:hover {
            transform: translateY(-2px);
            background: #2685ff;
            box-shadow: 0 10px 30px rgba(24, 119, 242, 0.3);
        }

        .version {
            margin-top: 18px;
            color: #7f8ba3;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            color: #8ea7d8;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }

            .download-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">V</div>

        <h1>VideoYTFX Downloads</h1>

        <p class="subtitle">
            Download the official VideoYTFX application for Windows.
        </p>

        <div class="download-card">

            <h2>VideoYTFX for Windows</h2>

            <p>
                A powerful video downloader for Windows with support
                for high-quality video and audio downloads.
            </p>

            <a
                class="download"
                href="https://github.com/mohammed100ried-blip/VideoYTFX/releases/latest/download/VideoYTFX.exe">
                Download VideoYTFX
            </a>

            <div class="version">
                Latest version • Windows
            </div>

        </div>

        <a class="back" href="index.html">
            ← Back to Home
        </a>
